 after the moment it would be overwritten","Not to be reached for as a speed-up"],"steps":["Five slots, each holding one doubling of 7 in turn (7, 14, 28, 56, 112); only the last of them is ever asked for","Each slot is crossed out the moment the next one exists: four of the five are dead, one is live, and they died in the order they were written","One slot holds 112; five slots collapse to one, with the same four doublings performed"]}],["DayOfWeekFormula","day-of-week-formula","Формула дня недели","Sakamoto's algorithm",6,2,"День недели — одна сумма нескольких слагаемых по модулю 7.","Нужен день недели для даты без перебора календаря.",["1 января 2000?","Сумма слагаемых: 2484","2484 mod 7 = 6: суббота"],"(y+y/4−y/100+y/400+t[m−1]+d) mod 7; январь и февраль — месяцы прошлого года.","1 января 2000 — суббота.",[31],[19],["Только григорианский календарь","Год сократить по модулю 400","Представитель — положительный"],{"name":"Sakamoto's algorithm","essence":"The day of the week is a single sum of a few pieces (a leap-year correction, a fixed per-month offset, the day itself), taken modulo 7 — no calendar simulation needed.","recognize":"You need the day of the week for a date, possibly a huge or far-future one, without stepping through the calendar day by day or month by month.","general":"Treating January and February as months 13 and 14 of the PREVIOUS year (so the leap-day correction only has to look at whole years)….","example":"1 January 2000 was a Saturday.","limits":["Not for dates before the Gregorian calendar's adoption (the formula assumes the modern leap-year rule throughout)"],"steps":["1 Jan 2000: which day of the week?","The adjusted year 1999, plus leap-year corrections (+499, −19, +4), plus January's month offset (0), plus the day (1): total 2484","2484 mod 7 = 6 → Saturday, counted off on the 7-day strip; 1 Jan 2000 really was a Saturday"]}],["LehmerCode","lehmer-code","Код Лемера","Lehmer code (factorial number system)",1,3,"N-я перестановка строится делением индекса на убывающие факториалы.","Нужна перестановка с заданным номером напрямую.",["15-я перестановка abcd","14 делится на 3!, 2!, 1!","Ответ: c b a d"],"Частное от деления на (k−1)! выбирает элемент, остаток идёт дальше.","15-я перестановка abcd — cbad.",[23],[24],["Номер перевести с нуля","Факториалы строго по убыванию"],{"name":"Lehmer code (factorial number system)","essence":"The Nth permutation in lexicographic order can be built directly, one element at a time, by repeatedly dividing the (0-based) index by a shrinking factorial.","recognize":"You need the Nth permutation of a sequence directly (by index, possibly a huge one), not all permutations up to it, and not just \"some\" permutation.","general":"With a pool of k remaining elements and a 0-based index, divide the index by (k−1)!.","example":"The 15th permutation of abcd is cbad.","limits":["Not with a 1-based index without first converting it to 0-based"],"steps":["The 15th permutation of \"abcd\"; listing all 24 to count to it doesn't scale (13 letters would mean 6,227,020,800 of them)","Index 14, divided by shrinking factorials (3!, 2!, 1!, 0!), picks one letter from the shrinking pool each round: c, then b, then a, then d","C b a d, built directly, without ever listing the 14 permutations that come before it"]}],["CycleDetectionViaRemainders","cycle-detection-remainders","Цикл через остатки","Cycle detection via remainder tracking",6,2,"Остатков конечно много, поэтому повтор неизбежен и находится точно.","Нужна длина периода процесса с малым числом состояний.",["1/7 = 0.?","Остатки 1,3,2,6,4,5,1","Период длины 6"],"Запоминать шаг каждого остатка; повтор — длина = текущий шаг − прежний.","1/7 = 0.(142857), период 6.",[31],[26],["Повтор не позже числа состояний","Хранить шаг каждого остатка"],{"name":"Cycle detection via remainder tracking","essence":"There are only finitely many possible remainders in a division.","recognize":"You need the length (or existence) of a repeating pattern produced by an iterated process with a fixed, small number of possible internal states.","general":"Run the process (here, long division: multiply the remainder by 10, divide by the denominator to get the next digit….","example":"1/7 = 0.(142857), period 6.","limits":["Not expecting a repeat to appear beyond (number of possible states) steps"],"steps":["1/7 = 0.? ; how long is the repeating block?","Step by step, the remainder after each digit: 1, 3, 2, 6, 4, 5, then 1 again","1/7 = 0.(142857); cycle length = 6 − 0 = 6"]}],["NextPermutation","next-permutation","Следующая перестановка","Next permutation (Narayana Pandita)",2,2,"Найди последний подъём, обменяй, разверни хвост.","Нужно перебрать все перестановки по порядку.",["1 3 5 4 2","Обмен 3 и 4","Разворот: 1 4 2 3 5"],"Опора a[i]<a[i+1] справа; обмен с последним большим; разворот хвоста.","После 13542 идёт 14235.",[39],[32,41,43],["Для N-й перестановки — долго","Хвост уже убывает — просто развернуть"],{"name":"Next permutation (Narayana Pandita)","essence":"To get from one permutation to the very next one in dictionary order, find the last place the sequence still climbs….","recognize":"You need to generate ALL permutations of a sequence, one at a time, in lexicographic order — not the Nth one directly, and not one arbitrary permutation.","general":"Scan from the right for the last index i with a[i] < a[i+1] (the \"pivot\".","example":"After 13542 comes 14235.","limits":["Not to jump directly to a specific far-away Nth permutation"],"steps":["1 3 5 4 2; what permutation comes right after it?","3 is the last climb (3<5); scanning from the right, 4 is the last value still bigger than 3; swap them, giving 1 4 5 3 2","Everything after the swapped-in 4 (5, 3, 2) was falling; reversing it gives 2 3 5, so the answer is 1 4 2 3 5"]}],["BruteForceSearch","brute-force-search","Полный перебор","Brute-force search",4,1,"Проверь всех кандидатов, но сначала посчитай, что их немного.","Число кандидатов, умноженное на цену проверки, влезает во время.",["Поле 6×6 «?»","36 ≤ 100: можно","Ответ на 23-й клетке"],"Оцени число кандидатов по ограничениям, сравни с бюджетом, перебирай.","700 000 проверок против 100 000 000 в секунду.",[],[8,11,27,30,32,33,34,36,38,43,44,45,46,47,49,51,52],["Без подсчёта — это догадка","Факториальный рост — только мелкий вход"],{"name":"Brute-force search","essence":"Check every candidate the problem allows — but only after counting, from the given limits alone, that there are few enough of them to get through in the time available.","recognize":"The constraints bound how many candidates exist, that count multiplied by the cost of checking one fits the time budget….","general":"Multiply out the candidate count implied by the constraints (ranges times queries times per-candidate work).","example":"700,000 checks against 100,000,000 per second.","limits":["Not to be chosen because no better idea came to mind","Not to be applied when the candidate count grows factorially or exponentially in the input size unless the input is tiny"],"steps":["A 6×6 field of \"?\" cells: one of them is the answer, and nothing distinguishes it from the outside","The cells are counted without being opened (6 × 6 = 36) and set against a countable capacity of 100 empty slots: 36 ≤ 100, so walking them all is affordable","The cells are opened in order, each getting a , until the answer (★) turns up at the 23rd; the rest are never touched"]}],["VariableElimination","variable-elimination","Исключение переменной","Elimination by substitution",4,1,"Одну неизвестную выражают через другие — перебор теряет измерение.","Перебор нескольких неизвестных, связанных уравнением.",["36 пар (a, b)","b = 7 − a","Осталось 6 пар"],"Выразить одну неизвестную и подставить; каждая исключённая — минус измерение.","a + b = 7: 6 пар вместо 36.",[],[9],["Подставленное значение всё равно проверять","Два корня — ветвление"],{"name":"Elimination by substitution","essence":"When the unknowns are tied together by an equation, one of them can be written in terms of the others and substituted away — the search then runs over one fewer unknown.","recognize":"You are searching over two or more unknowns that must satisfy given equations, and at least one of those equations can be solved for one unknown in terms of the rest.","general":"Solve one constraint for one unknown; substitute that expression into the remaining constraints; the search space loses a whole dimension per unknown eliminated.","example":"a + b = 7: 6 pairs instead of 36.","limits":["Not to be treated as removing the need to CHECK the substituted value"],"steps":["Two unknowns with 6 possible values each: 36 pairs to try","They are tied by a + b = 7, so b = 7 − a; b stops being free","6 pairs left instead of 36, one per value of a; the square of candidates has collapsed to a line through it"]}],["Canonicalization","canonicalization","Канонизация","Canonicalization",4,2,"Из каждой группы дубликатов обрабатывается только канонический представитель.","Результат одной стартовой точки входит в результат меньшей.",["Основания 2–10","4, 8, 9 — дубликаты","Обработаны 6 канонических"],"Задать эквивалентность, выбрать наименьшего представителя, остальных пропускать.","4 = 2², 8 = 2³, 9 = 3² пропущены.",[52],[29],["Эквивалентность нужно доказать","Узнавать дубликат до работы"],{"name":"Canonicalization","essence":"When several different starting points can produce overlapping results, pick exactly one canonical starting point per group that produces the same results, and only ever start from that one.","recognize":"Distinct outputs are generated from a set of starting points (bases, seeds), and one starting point's whole output is provably a subset of another, smaller starting point's output.","general":"Define which starting points are equivalent (one is expressible as a fixed transform of a smaller one).","example":"4 = 2², 8 = 2³, 9 = 3² are skipped.","limits":["Not to be applied unless the \"is-a-transform-of\" relation between starting points is actually provable ahead of time"],"steps":["9 candidate bases, 2 through 10, nothing known about them yet","3 of them are a smaller base raised to a power already in the row (4=2², 8=2³, 9=3²)","The 6 canonical bases (2, 3, 5, 6, 7, 10) get processed; the 3 duplicates are skipped, never touched again"]}],["SymmetryBreaking","symmetry-breaking","Разрыв симметрии","Symmetry breaking",4,2,"Задай порядок среди равноправных частей — перестановки не порождаются.","Кандидаты — перестановки друг друга с одинаковым вердиктом.",["Доска 4×4: 16 пар","Зеркальные пары: 6","Остаётся 10"],"Нестрогий порядок на равноправных частях; экономия — размер группы.","Пары с j ≥ i: 10 из 16.",[44,43],[4,9,11,23],["Различимые части не упорядочивать","Строгий порядок — только при различии","Границу выводить с ограничением"],{"name":"Symmetry breaking","essence":"When several candidates differ only by a relabelling the problem cannot tell apart, fix one order among the equal-standing parts and enumerate only in that order….","recognize":"The candidates the statement asks you to search come in groups that are one candidate rewritten.","general":"Name the relabellings the problem is blind to (an operation counts as a symmetry when its result satisfies every constraint exactly when the original does)….","example":"Pairs with j ≥ i: 10 out of 16.","limits":["Don't impose an order on parts the problem CAN tell apart"],"steps":["A 4×4 board of ordered pairs, all 16 of them live; nothing is known about any of them","The board read against its own diagonal: each of the 6 cells below the diagonal carries the same two numbers as its mirror above it (marked =), while each of the 4 cells on the diagonal is its own mirror and has no partner","The inner index starts at the outer one, so only the 10 cells with the second index at or above the first are ever reached; the 6 below the diagonal stay blank"]}],["LogarithmProductRule","logarithm-product-rule","Логарифм произведения","Product rule of logarithms",5,2,"Логарифм произведения равен сумме логарифмов.","Произведение слишком велико, нужен лишь размер или сравнение.",["ln(4 × 8) = ?","Отрезки ln 4 и ln 8","Сумма = ln 32"],"log(a·b) = log a + log b; log(a^k) = k·log a.","1.386 + 2.079 = 3.466 = ln 32.",[],[7],["Логарифм суммы не раскладывается","Одно основание везде"],{"name":"Product rule of logarithms","essence":"The logarithm of a product is the sum of the logarithms.","recognize":"A quantity is a product (or a power) too large or too awkward to multiply out, but only its size, digit count, or comparison against another product is needed.","general":"Log(a × b) = log a + log b, for any base; as a consequence log(a^k) = k · log a.","example":"1.386 + 2.079 = 3.466 = ln 32.","limits":["Not to be applied to a sum"],"steps":["Ln(4 × 8) = ?","A ruler whose ticks 1, 2, 4, 8, 16, 32 are evenly spaced (a logarithmic scale): a bar of length ln 4 = 1.386 reaches the tick 4; a bar of length ln 8 = 2.079 laid end to end after it reaches the tick 32","The two bars together are one bar of length 1.386 + 2.079 = 3.466, and 3.466 = ln 32; adding the lengths multiplied the numbers"]}],["FixedPointIteration","fixed-point-iteration","Итерация неподвижной точки","Fixed-point iteration",5,3,"Подставляй догадку в правую часть — ответ приближается к себе.","Величина определена через саму себя: x = f(x).",["√2: x = (x + 2/x)/2","1→1.5→1.4167→1.4142","Лесенка к пересечению"],"x_{n+1} = f(x_n); сходится при |f'| < 1 у точки.","√2 ≈ 1.4142 за три шага.",[],[7],["Сходимость не гарантирована","Указывать число проходов"],{"name":"Fixed-point iteration","essence":"When the unknown appears on both sides of its own equation, start from a rough guess, feed it into the right-hand side, and take what comes out as the next guess.","recognize":"The quantity you want is defined in terms of itself (x = f(x)), a direct formula for it is unavailable or clumsy, but evaluating the right-hand side at any given number is easy.","general":"Choose x0; set xn+1 = f(xn); stop when successive values agree to the precision needed, or after a fixed number of passes when only an estimate is wanted.","example":"√2 ≈ 1.4142 in three steps.","limits":["Not to be assumed to converge"],"steps":["√2 = ?, written as an equation that mentions its own answer: x = (x + 2/x) / 2","Start at 1; the right-hand side gives 1.5; feed 1.5 back in and get 1.4167; feed that back and get 1.4142","On a graph of y = (x + 2/x)/2 against the diagonal y = x, the passes are a staircase: up from 1 to the curve, across to the diagonal, up to the curve again"]}],["Composition","composition","Композиции числа","Composition (combinatorics)",2,2,"Упорядоченная сумма частей — выбор мест разрезов в ряду.","Нужны все разбиения целого на упорядоченные непустые куски.",["5 единиц, 3 части","Два разреза: 1, 3, 1","Все 6 вариантов"],"n на k частей: C(n−1, k−1) способов; всего 2^(n−1).","5 на 3 части: C(4, 2) = 6.",[36],[32],["Не путать с разбиением","Только счёт — лучше таблица"],{"name":"Composition (combinatorics)","essence":"Write a total as an ORDERED sum of a fixed number of positive parts.","recognize":"The statement (or the code) needs every way to break a fixed-length whole.","general":"A total of n split into exactly k ordered positive parts corresponds one-to-one with choosing k−1 of the n−1 gaps between n units to place a divider.","example":"5 into 3 parts: C(4, 2) = 6.","limits":["Not to be confused with a PARTITION of the same total","Not to be reached to COUNT how many compositions exist when only the count (not each one individually) is wanted and parts are restricted to an…"],"steps":["5 units in a row, to be split into 3 ordered parts; how many ways is unknown","2 of the 4 gaps between the units are chosen (one gap stays open), cutting the row into parts 1, 3, 1 (1+3+1=5)","All 6 divider choices listed as their part sequences; 6 = C(4,2), choosing 2 of the 4 gaps"]}],["Sorting","sorting","Сортировка","Sorting algorithm",7,1,"Переставить элементы по порядку сравнениями и обменами.","Следующему шагу решения нужен упорядоченный вход.",["Столбцы 3, 5, 1, 4, 2","Обмен 5 и 1","1, 2, 3, 4, 5"],"Результат — перестановка входа в монотонном порядке.","",[],[22],["Не бесплатно: n·log n","Назвать правило сравнения","Устойчивость не гарантирована"],{"name":"Sorting algorithm","essence":"Rearrange the elements of a sequence into a fixed order (usually non-decreasing) by repeatedly comparing two elements and exchanging them when they are out of that order.","recognize":"Something else in the solution needs the elements in order.","general":"Any output is a valid sort exactly when it satisfies two conditions at once: it is a PERMUTATION of the input (every original element present….","example":"5 columns are sorted with 10 neighbour comparisons.","limits":["Not to be assumed to be free","Not to be relied on for STABILITY (equal elements keeping their original relative order) unless the specific algorithm used is documented as stable"],"steps":["Five bars, heights 3, 5, 1, 4, 2, in that order; what order they belong in is unclear","5 sits immediately before 1; the two are out of order by height, so they are exchanged","Every later pair is compared and exchanged the same way, until none is left out of order: 1, 2, 3, 4, 5"]}],["PalindromeCheck","palindrome-check","Проверка палиндрома","Palindromic number",1,1,"Число переворачивается арифметически и сравнивается с исходным.","Нужны числа, не меняющиеся при развороте цифр.",["232 в трёх ячейках","rev: 2 → 23 → 232","232 = 232"],"rev = rev·10 + n%10; n /= 10; палиндром, если rev = исходному.","232 — палиндром.",[],[4],["Без перевода в строку","Длинное число — больше шагов"],{"name":"Palindromic number","essence":"A number reads the same when its digits are taken in reverse order as when read forward.","recognize":"The statement calls a number a palindrome, or asks to find/test numbers unchanged when their digits are reversed.","general":"Peel the least-significant digit off with n % 10, append it onto a running accumulator via rev = rev * 10 + digit, and divide the remaining number by 10 (n /= 10).","example":"232 is a palindrome.","limits":["Not to be read as string reversal"],"steps":["232 in three boxes [2][3][2]; rev is empty; the units digit (rightmost 2) is marked as the next to peel","The accumulator grows 0 → 2 → 23 → 232 as each digit is peeled from the right of what remains and appended to what's already built","Rev (232) placed beside the original (232); every digit lines up, so the number is a palindrome"]}],["HashGrouping","hash-grouping","Группировка по ключу","Hash grouping",4,2,"Ключ оставляет важное; сравниваются только кандидаты одной корзины.","Нужно проверять пары, но отношение возможно лишь при общем признаке.",["5 чисел, 10 пар","Ключ: цифры по порядку","3 корзины, 2 пары"],"Ключ-инвариант, хеш-таблица корзин; сравнения только внутри корзины.","21 и 12, 13 и 31 в общих корзинах.",[52],[33,49],["Ключ обязан сохранять отношение"],{"name":"Hash grouping","essence":"Compute a key for every candidate that keeps only what actually matters for a relation to be checked later and discards the rest.","recognize":"A further relation must be checked between PAIRS of candidates, checking every pair is too slow….","general":"Define a key function mapping every candidate to the feature the relation actually depends on (an invariant under whatever the relation is blind to).","example":"21 and 12, 13 and 31 share buckets.","limits":["Not to be applied when the relation being tested is not invariant under whatever the key discards"],"steps":["Five candidates, 21, 12, 13, 31, 11","Each candidate's digits sorted into its key: 21 and 12 both key to \"12\"; 13 and 31 both key to \"13\"; 11 keys to \"11\" alone","3 buckets; only the 2 within-bucket pairs (21 with 12, 13 with 31) are ever compared, instead of all 10"]}],["EquivalenceClass","","Классы эквивалентности","Equivalence class",4,2,"Каждому кандидату сопоставляется метка его класса.","Кандидаты делятся на группы отношением эквивалентности.",[],"Отношение разбивает множество; канонический представитель заменяет попарные проверки.","",[44,51],[52],["Нужны рефлексивность, симметричность, транзитивность"],{"name":"Equivalence class","essence":"When a relation splits a set of candidates into groups that agree on some feature, every candidate maps to a canonical marker for its group.","recognize":"Candidates fall into groups by a relation that is reflexive, symmetric and transitive (everything is in its own group.","general":"An equivalence relation on a set partitions it into disjoint classes.","example":"Numbers with the same remainder form one class.","limits":["Not to be applied unless the grouping relation is actually reflexive, symmetric and transitive"],"steps":[]}],["PandigitalCheck","pandigital-check","Проверка пандигитальности","Pandigital number check",1,1,"Каждая цифра отмечает свою ячейку — все по одному разу.","Требуется, чтобы цифры 1..k встречались ровно по разу.",["18365472 и 8 ячеек","Каждая цифра в свою ячейку","Все 8 отмечены"],"Массив отметок размера k; отказ при повторе, лишней цифре или длине.","18365472 — пандигитальное 1–8.",[4,5],[38],["Проверять длину","Построение перестановкой — проверка не нужна"],{"name":"Pandigital number check","essence":"Test whether a run of digits uses every value from 1 to k exactly once by marking each digit seen, one pass, in a presence array indexed by the digit's own value.","recognize":"The statement calls a number \"k-pandigital\", or requires that a decimal string/concatenation use each digit from 1 to k (or 0 to 9) exactly once, with no digit missing and none repeated.","general":"Allocate a presence array of size k (or k+1 to also allow the digit 0), all unmarked.","example":"18365472 is 1–8 pandigital.","limits":["Not when the candidate's length is not already known to equal k before or during the scan","Not to be confused with CONSTRUCTING a pandigital number by permuting the digits 1..k directly (as in Project Euler's pandigital-products family)"],"steps":["The digit string 18365472 above eight empty, dashed slots labelled 1 to 8; is it 1-8 pandigital?","Each of the eight digits is linked, by its own value, straight down to the slot bearing that number; the eight links land on eight different slots, each exactly once","All eight slots hit and checked, matching the eight digits scanned with no slot left empty and none hit twice"]}],["EuclidsFormula","euclids-formula","Формула Евклида","Euclid's formula",5,2,"Каждый целый прямоугольный треугольник — кратное примитивного из пары (m, n).","Задача о целочисленных прямоугольных треугольниках.",["m = 2, n = 1","3, 4, 5","Периметр 12","×2: 6, 8, 10"],"a = m²−n², b = 2mn, c = m²+n²; взаимно простые, разной чётности; плюс кратные.","m=2, n=1 дают 3-4-5, периметр 12.",[13],[39],["Фильтр: взаимная простота и чётность","Не забывать кратные"],{"name":"Euclid's formula","essence":"Every integer-sided right triangle is a whole-number multiple of one built from just two coprime integers of opposite parity.","recognize":"The statement is about right triangles with integer sides.","general":"For integers m > n > 0 with gcd(m,n)=1 and m, n of opposite parity, a = m²−n², b = 2mn, c = m²+n² is a PRIMITIVE Pythagorean triple (its three sides share no common factor)….","example":"m=2, n=1 give 3-4-5, perimeter 12.","limits":["Don't stop at the primitive triple's own perimeter when the goal is every right triangle up to a limit"],"steps":["M=2, n=1 given (coprime, opposite parity); what triangle do they build?","Each side read straight off m and n: a=2²−1²=3, b=2·2·1=4, c=2²+1²=5","The primitive triple 3-4-5 (3²+4²=5²), perimeter 3+4+5=12","Scaling every side by k=2 gives 6-8-10, perimeter 24=2×12: every multiple of a primitive perimeter is a right-triangle perimeter too"]}],["ChampernowneConstant","champernowne-digit","Цифра Чамперноуна","Champernowne constant",1,2,"Цифру на позиции находят вычитанием блоков, строку не строят.","Нужна цифра записи 0.123456789101112… на большой позиции.",["Позиция 12: «?»","12 − 9 = 3","Число 11, цифра 1"],"Вычитать блоки 9·10^(d−1)·d; деление даёт число и цифру.","12-я цифра — 1 (из числа 11).",[23],[40],["Не путать с цифрами одного числа","Сначала блоки, потом деление"],{"name":"Champernowne constant","essence":"Find the digit at any position of the decimal formed by concatenating every positive integer, WITHOUT ever building the string.","recognize":"The statement gives (or defines) the constant 0.123456789101112...","general":"For base 10, the number of digits contributed by every number of length shorter than d is δ10(d) = 9·Σℓ=1^d-1 10^ℓ-1·ℓ (closed form: (1 + 10^d-1((9)d−10))/9).","example":"The 12th digit is 1 (from the number 11).","limits":["Not to be confused with decomposing the digits of ONE already-known number"],"steps":["The sequence 1 2 3 4 5 6 7 8 9 1 0 1 ? 1 3 ...; position n=12 is a ?, and the d=1 block (9 one-digit numbers, 9 digits) is shown but not yet subtracted","12 > 9, so the d=1 block is subtracted: 12−9=3; since 3 fits inside the whole d=2 block (90×2=180 digits), the digit lands there","Which number: 10 + (3−1)/2 = 11; which digit of it: (3−1) mod 2 = 0 (leftmost); the leftmost digit of 11 is 1"]}],["DigitSumDivisibilityRule","digit-sum-div3","Признак делимости на 3","Digit-sum divisibility rule",1,1,"Число делится на 3 или 9 ровно тогда, когда сумма цифр делится.","Нужна делимость на 3 или 9 при известных цифрах.",["Длины n = 1..9","n(n+1)/2 mod 3","Остаются n = 4 и 7"],"N ≡ сумма цифр (mod 9); работает для делителей b−1.","Простые пандигитальные — только длины 4 и 7.",[],[41],["Только делители b−1","Новый набор цифр — пересчитать"],{"name":"Digit-sum divisibility rule","essence":"A number is divisible by 3 (or by 9) exactly when the sum of its digits is.","recognize":"The statement (or a design choice about which cases to even try) turns on whether some number is divisible by 3 or 9, and that number's digits are already known or fixed by construction.","general":"For base 10, N ≡ digitsum(N) (mod 9) (and therefore also mod 3, since 3 | 9).","example":"Pandigital primes exist only for lengths 4 and 7.","limits":["Not for a divisor that does not divide b−1"],"steps":["The lengths n=1..9; could an n-digit 1-to-n pandigital number ever be prime?","Each length's digit sum, 1+2+...+n = n(n+1)/2, checked mod 3: n=1,4,7 give remainder 1 (kept), every other n gives remainder 0 (excluded","Only n=4 and n=7 survive (n=1's only pandigital number, \"1\", is excluded separately for not being prime by definition)"]}],["QuadraticFormula","quadratic-formula","Квадратное уравнение","Quadratic formula",5,1,"ax² + bx + c = 0 решается формулой без перебора.","Неизвестная связана с известной величиной через свой квадрат.",["n²+n−42=0","D = 169, √ = 13","n = 6, −7 отброшен"],"x = (−b ± √(b²−4ac))/2a; для целых — точный корень и делимость.","21 — треугольное, n = 6.",[8],[42,44,45],["Большой дискриминант — целый корень","Лишний корень отбрасывать"],{"name":"Quadratic formula","essence":"Any equation of the form a·x²+b·x+c=0 is solved directly, without searching, by one formula built from its three coefficients.","recognize":"The statement (or a derived relationship inside the solution) ties one unknown to a known quantity through a square of itself.","general":"For a·x²+b·x+c=0 (a≠0), x = (-b ± sqrt(b²-4ac)) / (2a); the discriminant b²-4ac decides how many real roots exist (two distinct, one repeated, or none).","example":"21 is triangular, n = 6.","limits":["Don't trust a floating-point sqrt of the discriminant when it can exceed about 2^53 (the precision of a double)"],"steps":["N²+n-42=0 (from testing whether t=21 is a triangular number, n(n+1)/2=21); which n solves it?","Discriminant 1²-4·1·(-42)=169, sqrt(169)=13, n=(-1±13)/2 = 6 or -7","The parabola y=n²+n-42 plotted against n, crossing zero at both roots: n=-7 (discarded, not a valid count) and n=6 (kept)"]}],["MillerRabinPrimalityTest","miller-rabin","Тест Миллера–Рабина","Miller–Rabin primality test",0,3,"Свидетели проверяют поведение степеней, обязательное для простых.","Проверка простоты больших чисел до 64 бит, много раз.",["n = 25, a = 2","24 = 3·2³","8, 14, 21","25 составное"],"n−1 = d·2^r; 12 фиксированных оснований дают точный тест для 64 бит.","Свидетель 2 доказывает, что 25 составное.",[9],[50],["Вне доказанной границы — вероятностно","Малые числа — проще перебором","Пропускать свидетель, кратный n"],{"name":"Miller–Rabin primality test","essence":"Test a number for primality far faster than trial division by writing n-1 as an odd part times a power of two….","recognize":"The statement needs primality of numbers too large, or tested too many times, for trial division up to the square root to be affordable.","general":"Write n-1 = d·2^r with d odd; for a witness a (2≤a≤n-2), compute x=a^d mod n.","example":"Witness 2 proves that 25 is composite.","limits":["Not to be relied on as a deterministic proof for n outside the range the fixed witness set is proven to cover","Not to be reached for a single one-off small n where trial division up to the square root is already cheap"],"steps":["N=25, witness a=2; is 25 prime?","24 = 3 × 2³, so d=3, r=3","2³ mod 25 = 8, squared to 14, squared again to 21","None of 8, 14, 21 is 1 or n-1=24, so witness 2 proves 25 is composite (25=5×5)"]}],["BitmaskSubsetEnumeration","bitmask-subsets","Подмножества битмасками","Bitmask subset enumeration",2,2,"Каждое подмножество — N-битное число; перебор — счёт от 0.","Нужны все способы выбрать подмножество из малого N.",["3 позиции, K = 2","8 масок","3 маски с popcount 2"],"m от 0 до 2^N−1; бит i — позиция i; popcount = размер.","{p0,p1}, {p0,p2}, {p1,p2}.",[],[51],["Большое N — 2^N слишком много","Бит i означает позицию i"],{"name":"Bitmask subset enumeration","essence":"Represent every subset of N labeled positions as an N-bit integer (bit i set means position i belongs to the subset), then enumerate every subset at all just by counting from 0 to 2^N-1.","recognize":"The statement needs every WAY OF CHOOSING a subset of positions/items out of a small fixed N (which K digits to replace, which items to include).","general":"For N up to about 20-25 (so 2^N stays computationally small), loop m from 0 to 2^N-1; bit i of m (m & (1<<i)) says whether position i is in the subset m represents.","example":"{p0,p1}, {p0,p2}, {p1,p2}.","limits":["Not when N is large enough that 2^N is not cheap to sweep"],"steps":["3 positions p0,p1,p2; which subsets of size K=2?","All 8 masks listed with their bits, the set they name, and their popcount","The 3 masks with popcount=2 ({p0,p1}, {p0,p2}, {p1,p2}) are exactly the size-2 subsets"]}]],"mf":["Делимость и простые","Числа и цифры","Счёт и комбинаторика","Память и предрасчёт","Поиск и перебор","Геометрия и формулы","Модульная арифметика","Алгоритмы и структуры"],"mf_en":["Divisibility and primes","Numbers and digits","Counting and combinatorics","Memory and precomputation","Search and enumeration","Geometry and formulas","Modular arithmetic","Algorithms and data structures"],"props":{"SkipCounting":{"id":"SkipCounting","problem":"Чтобы узнать, какие числа кратны 2 или 3, каждое число приходится делить на 2 и на 3.","problemExample":"Числа от 1 до 19: отметить кратные 2, кратные 3 и кратные обоим (6, 12, 18).","naive":{"how":"разделить каждое из 19 чисел на 2 и на 3","cost":"38","unit":"делений","formula":"19 чисел × 2 деления (на 2 и на 3)"},"method":{"cost":"15","unit":"шагов","formula":"9 шагов по 2 + 6 шагов по 3"},"scale":{"n":"n = 10⁹ — числа от 1 до миллиарда (при ~10⁸ операций в секунду)","naive":"10⁹ чисел × 2 = 2·10⁹ проверок делением — ~20 секунд","method":"5·10⁸ + 3,3·10⁸ ≈ 8,3·10⁸ прыжков — ~8 секунд; количество кратных k — одним делением ⌊n/k⌋, мгновенно","plot":{"n":9,"naive":9.30103,"method":8.91908,"nc":"n","mc":"n","nName":"до какого числа ищем"}},"keyIdea":"Прыжок длины k попадает только на кратные k — делить ничего не нужно","how":["Нарисовать числовую прямую от 1 до 19","Прыгать от 0 по 2 и метить каждое приземление синим","Прыгать от 0 по 3 и метить каждое приземление красным","Числа с обеими метками (6, 12, 18) записать как кратные 6"],"props":{"time":"O(n/k)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["2–3 длины прыжка, иначе не хватает различимых цветов","диапазон до ~100 чисел, чтобы прямую можно было нарисовать"],"input":"предел и шаги прыжков","output":"метки кратных","gives":"каждое кратное 2 или 3 до n получает метку, ни одно не пропущено","timePlain":"прыжков столько, сколько кратных до n: n/2 + n/3","spacePlain":"по одной метке на каждое число прямой"},"gainText":"в 2,5 раза меньше операций (38 / 15)","story":{"ru":{"trick":"шагами по 2 и по 3","task":"Есть числа от 1 до 19. Нужно узнать, какие из них делятся на 2, какие на 3, а какие — и на 2, и на 3.","headOn":"В лоб: делим каждое число и на 2, и на 3 — это 19 × 2 = 38 делений, и больше половины из них впустую.","notice":"Числа, которые делятся на 2, идут ровно через одно: 2, 4, 6… Их не нужно искать делением — достаточно прибавлять по 2. С числами, которые делятся на 3, так же: прибавляем по 3.","steps":["Шагаем по 2 от 2 до 18 — 9 шагов, и каждый попадает на число, которое делится на 2.","Шагаем по 3 от 3 до 18 — 6 шагов, и каждый попадает на число, которое делится на 3.","Где отметки совпали — на 6, 12 и 18, — число делится и на 2, и на 3."],"gain":["15 шагов вместо 38 делений — работы в 2,5 раза меньше.","Если искать среди чисел до миллиарда, выигрыш тот же: около 830 миллионов шагов вместо 2 миллиардов делений."],"whenToUse":"Когда среди чисел, идущих подряд, нужно найти все, которые делятся на 2, на 3 или на другое заданное число.","needs":["числа идут подряд, без пропусков","заранее известно, на что делим — здесь на 2 и на 3"],"guarantees":"Найдены все такие числа, и ни одного лишнего.","work":"Один шаг на каждое найденное число — лишних делений нет."},"en":{"trick":"counting by 2s and 3s","task":"Take the numbers from 1 to 19. Which of them divide evenly by 2, which by 3, and which by both?","headOn":"Head-on: divide every number by 2 and by 3. That is 19 × 2 = 38 divisions, and more than half of them are wasted.","notice":"Numbers that divide by 2 come every other number: 2, 4, 6… There is no need to find them by dividing — just keep adding 2. The same goes for 3: keep adding 3.","steps":["Count by 2s from 2 to 18: 9 steps, and every one lands on a number that divides by 2.","Count by 3s from 3 to 18: 6 steps, and every one lands on a number that divides by 3.","Where the marks meet — at 6, 12 and 18 — the number divides by both 2 and 3."],"gain":["15 steps instead of 38 divisions — 2.5 times less work.","Among the numbers up to a billion the gain is the same: about 830 million steps instead of 2 billion divisions."],"whenToUse":"When you need every number in an unbroken run that divides by 2, by 3, or by some other given number.","needs":["the numbers come in a row, with no gaps","you know in advance what you divide by — here, 2 and 3"],"guarantees":"Every such number is found, and no extra ones.","work":"One step for each number found — no wasted divisions."}},"en":{"naive":{"how":"divide each of the 19 numbers by 2 and by 3","unit":"divisions","formula":"19 numbers × 2 divisions (by 2 and by 3)"},"method":{"unit":"steps","formula":"9 steps of 2 + 6 steps of 3"},"scale":{"n":"n = 10⁹ — the numbers from 1 to a billion (at ~10⁸ operations per second)","naive":"10⁹ numbers × 2 = 2·10⁹ divisions — about 20 seconds","method":"5·10⁸ + 3.3·10⁸ ≈ 8.3·10⁸ steps — about 8 seconds","plot":{"nName":"how far we search"}},"gainText":"2.5 times less work (38 / 15)"}},"InclusionExclusion":{"id":"InclusionExclusion","problem":"Если сложить размеры двух групп, общие элементы посчитаются дважды и ответ завысится.","problemExample":"Числа от 1 до 180: 90 кратны 2, 60 кратны 3, 30 кратны обоим (то есть 6). Сколько чисел кратны 2 или 3?","naive":{"how":"пройти оба списка (кратные 2 и кратные 3) и у каждого числа проверить, не встречалось ли оно раньше","cost":"150","unit":"проверок","formula":"90 чисел, делящихся на 2, + 60 чисел, делящихся на 3"},"method":{"cost":"5","unit":"действий","formula":"3 деления (180 ÷ 2, 180 ÷ 3, 180 ÷ 6) + 1 сложение + 1 вычитание"},"scale":{"n":"числа от 1 до миллиарда (при ~10⁸ действий в секунду)","naive":"5·10⁸ + 3,3·10⁸ ≈ 8,3·10⁸ проверок — около 8 секунд","method":"те же 5 действий — мгновенно","plot":{"n":9,"naive":8.91908,"method":0.69897,"nc":"n","mc":"1","nName":"до какого числа считаем"}},"keyIdea":"Общие элементы посчитаны дважды — их количество вычитается один раз","how":["Сосчитать каждую группу: 180 ÷ 2 = 90, 180 ÷ 3 = 60","Сосчитать общую часть — кратные 6: 180 ÷ 6 = 30","Сложить группы: 90 + 60 = 150","Вычесть общую часть один раз: 150 − 30 = 120"],"props":{"time":"O(2ᵏ)","space":"O(1)","timeRank":7,"spaceRank":1,"exact":"точный","needs":["размер общей части известен или считается формулой (здесь ⌊180/6⌋ = 30)","2–4 условия: при k условиях слагаемых 2ᵏ − 1, при 4 — уже 15"],"input":"размеры частей и пересечений","output":"размер объединения","gives":"каждое число учтено ровно один раз: 60 (только 2) + 30 (оба) + 30 (только 3) = 120","timePlain":"k — число условий (здесь 2): слагаемых 2ᵏ − 1, при 2 условиях — 3 слагаемых","spacePlain":"хранится только текущая сумма"},"gainText":"в 30 раз меньше работы (150 / 5)","story":{"ru":{"trick":"сложить и вычесть общие","task":"Сколько чисел от 1 до 180 делится на 2 или на 3 (хотя бы на одно из них)?","headOn":"В лоб: выписываем 90 чисел, которые делятся на 2, и 60 чисел, которые делятся на 3, и у каждого проверяем, не встречалось ли оно уже, — 90 + 60 = 150 проверок.","notice":"Числа, которые делятся и на 2, и на 3, — это числа, которые делятся на 6. Они попали в оба списка, значит, при сложении посчитаны дважды — их нужно один раз вычесть.","steps":["Считаем каждый список одним делением: 180 ÷ 2 = 90, 180 ÷ 3 = 60, 180 ÷ 6 = 30.","Складываем списки: 90 + 60 = 150 — но 30 чисел, которые делятся на 6, здесь посчитаны дважды.","Вычитаем их один раз: 150 − 30 = 120 чисел — за 5 действий вместо 150 проверок."],"gain":["5 действий вместо 150 проверок — в 30 раз меньше работы.","Для чисел до миллиарда — всё те же 5 действий, а проверок было бы около 830 миллионов."],"whenToUse":"Когда нужно посчитать, сколько предметов подходит хотя бы под одно из двух условий, а каждое условие по отдельности посчитать легко.","needs":["легко посчитать, сколько подходит под каждое условие отдельно","легко посчитать, сколько подходит сразу под оба"],"guarantees":"Каждое число посчитано ровно один раз — ответ точный.","work":"Несколько действий, сколько бы ни было чисел: 3 деления, сложение и вычитание."},"en":{"trick":"add, then subtract the overlap","task":"How many numbers from 1 to 180 divide evenly by 2 or by 3 (by at least one of them)?","headOn":"Head-on: list the 90 numbers that divide by 2 and the 60 that divide by 3, and check each one to see if it has already appeared — 90 + 60 = 150 checks.","notice":"Numbers that divide by both 2 and 3 are exactly the numbers that divide by 6. They are on both lists, so adding the lists counts them twice — subtract them once.","steps":["Count each list with one division: 180 ÷ 2 = 90, 180 ÷ 3 = 60, 180 ÷ 6 = 30.","Add the lists: 90 + 60 = 150 — but the 30 numbers that divide by 6 are counted twice here.","Subtract them once: 150 − 30 = 120 numbers — in 5 steps instead of 150 checks."],"gain":["5 steps instead of 150 checks — 30 times less work.","For the numbers up to a billion it is still the same 5 steps, while the checks would number about 830 million."],"whenToUse":"When you need to count how many things meet at least one of two conditions, and each condition on its own is easy to count.","needs":["it is easy to count how many meet each condition","it is easy to count how many meet both at once"],"guarantees":"Every number is counted exactly once — the answer is exact.","work":"A handful of steps however many numbers there are: 3 divisions, one addition and one subtraction."}},"en":{"naive":{"how":"list both groups and check every number for a repeat","unit":"checks","formula":"90 numbers that divide by 2 + 60 that divide by 3"},"method":{"unit":"arithmetic steps","formula":"3 divisions (180 ÷ 2, 180 ÷ 3, 180 ÷ 6) + 1 addition + 1 subtraction"},"scale":{"n":"the numbers from 1 to a billion (at ~10⁸ operations per second)","naive":"5·10⁸ + 3.3·10⁸ ≈ 8.3·10⁸ checks — about 8 seconds","method":"the same 5 steps — instant","plot":{"nName":"how far we count"}},"gainText":"30 times less work (150 / 5)"}},"VennDiagram":{"id":"VennDiagram","problem":"Когда два множества пересекаются, неясно, какие элементы попали в оба и посчитаны дважды.","problemExample":"90 учеников ходят на футбол, 63 — на шахматы, 36 — в обе секции: сколько всего разных учеников?","naive":{"how":"сложить размеры двух кругов целиком","cost":"153","unit":"учеников в ответе (36 посчитаны дважды)","formula":"90 на футболе + 63 на шахматах"},"method":{"cost":"117","unit":"учеников в ответе, каждый один раз","formula":"54 только футбол + 36 оба + 27 только шахматы"},"scale":{"n":"k = 3 множества вместо 2","naive":"сложить 3 круга целиком — элементы из пересечений учтены 2–3 раза, ответ завышен","method":"7 областей (2³ − 1), каждый элемент ровно в одной — ответ точный","plot":false},"keyIdea":"Каждая область кругов — своя комбинация условий; общая часть видна один раз","how":["Нарисовать по кругу на каждое множество: A и B","Сдвинуть круги, чтобы появилась общая область из 36 элементов","Вписать число в каждую область: 90 − 36 = 54, 36, 63 − 36 = 27","Сложить три области: 54 + 36 + 27 = 117"],"props":{"time":"O(2ᵏ)","space":"O(2ᵏ)","timeRank":7,"spaceRank":7,"exact":"точный","needs":["не больше 3 множеств: 4 круга уже не показывают все 15 пересечений","известен размер каждого множества и их общей части"],"input":"условия и их размеры","output":"числа по областям","gives":"каждая из 2ᵏ − 1 областей показана ровно один раз, ни одна не пропущена","timePlain":"областей 2ᵏ − 1 для k кругов: при 2 кругах — 3 области","spacePlain":"по одному числу на каждую из 2ᵏ − 1 областей"},"gainText":"4 действия вместо 1, зато ответ верный: 117, не 153","story":{"ru":{"trick":"по частям кругов","task":"90 учеников ходят на футбол, 63 — на шахматы, 36 из них ходят и туда, и туда. Сколько всего разных учеников?","headOn":"В лоб: складываем 90 + 63 = 153. Но так 36 учеников, которые ходят в обе секции, посчитаны дважды, и ответ неверный.","notice":"Нарисуем каждую секцию кругом и наложим круги: 36 учеников, которые ходят в обе секции, окажутся в общей части. Тогда каждого ученика можно посчитать ровно один раз.","steps":["Только футбол: 90 − 36 = 54 ученика. Только шахматы: 63 − 36 = 27 учеников.","Складываем три части: 54 + 36 + 27 = 117 разных учеников — каждый посчитан один раз."],"gain":["Верный ответ — 117 учеников, а не 153: действий чуть больше, зато никто не посчитан дважды."],"whenToUse":"Когда нужно узнать, сколько всего разных людей или предметов в нескольких группах, которые частично совпадают.","needs":["известно, сколько человек в каждой группе","известно, сколько человек сразу в обеих группах"],"guarantees":"Каждый ученик посчитан ровно один раз — ответ точный.","work":"Два вычитания и два сложения — сколько бы ни было учеников."},"en":{"trick":"by circle parts","task":"90 students play football, 63 play chess, and 36 of them do both. How many different students are there in total?","headOn":"Head-on: add 90 + 63 = 153. But that counts the 36 students who do both twice, so the answer is wrong.","notice":"Draw each club as a circle and let the circles overlap: the 36 students who do both land in the shared part. Now every student can be counted exactly once.","steps":["Football only: 90 − 36 = 54 students. Chess only: 63 − 36 = 27 students.","Add the three parts: 54 + 36 + 27 = 117 different students — each counted once."],"gain":["The right answer is 117 students, not 153: a few more steps, but nobody is counted twice."],"whenToUse":"When you need to know how many different people or things there are across several groups that partly overlap.","needs":["how many people are in each group","how many people are in both groups at once"],"guarantees":"Every student is counted exactly once — the answer is exact.","work":"Two subtractions and two additions, however many students there are."}},"en":{"naive":{"how":"add the sizes of both clubs","unit":"students in the answer (36 counted twice)","formula":"90 in football + 63 in chess"},"method":{"unit":"students in the answer, each once","formula":"54 football only + 36 both + 27 chess only"},"gainText":"4 steps instead of 1, but the answer is right: 117, not 153"}},"ArithmeticProgressionSum":{"id":"ArithmeticProgressionSum","problem":"Чтобы сложить ряд с равным шагом по одному, нужно на 1 сложение меньше, чем членов ряда.","problemExample":"Сумма 4 + 8 + 12 + 16 + 20: 5 членов с шагом 4, ответ 60.","naive":{"how":"складывать члены ряда по одному слева направо","cost":"4","unit":"сложений","formula":"5 чисел, по одному сложению между соседями"},"method":{"cost":"3","unit":"арифметических действий","formula":"4 + 20 = 24, потом × 5, потом ÷ 2"},"scale":{"n":"ряд 4, 8, 12, … из миллиарда чисел (при ~10⁸ сложений в секунду)","naive":"почти миллиард сложений — около 10 секунд","method":"3 действия: (первое + последнее) × количество ÷ 2 — мгновенно","plot":{"n":9,"naive":9,"method":0.47712,"nc":"n","mc":"1","nName":"сколько чисел в ряду"}},"keyIdea":"Пары с концов ряда дают одинаковую сумму — поштучно складывать не нужно","how":["Посчитать члены ряда: от 4 до 20 с шагом 4 — 5 членов","Сложить крайнюю пару: 4 + 20 = 24","Умножить сумму пары на число членов: 24 × 5 = 120","Разделить на 2, потому что каждая пара учтена дважды: 60"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["шаг между соседними членами одинаковый (здесь 4)","известны первый член, последний и число членов"],"input":"шаг и число членов","output":"сумма ряда","gives":"точная сумма ряда за 3 действия при любой длине","timePlain":"3 действия при любом числе членов","spacePlain":"хранятся 3 числа: первый член, последний и число членов"},"gainText":"3 действия вместо 4 сложений; при 10⁹ членах — 3 действия вместо 10⁹ − 1 сложений","story":{"ru":{"trick":"парами с двух концов","task":"Нужно сложить 4 + 8 + 12 + 16 + 20 — пять чисел, где каждое следующее на 4 больше предыдущего.","headOn":"В лоб: складываем по одному слева направо — 4 + 8 = 12, потом 24, 40 и 60. Это 4 сложения, и чем длиннее ряд, тем их больше.","notice":"Если брать числа парами с двух концов, каждая пара даёт одно и то же: 4 + 20 = 24 и 8 + 16 = 24. Значит, складывать все числа по одному не нужно.","steps":["Пара 4 + 20 даёт 24, пара 8 + 16 тоже 24, а 12 в середине — ровно половина от 24.","Каждые два числа вместе дают 24, а чисел 5 — значит, сумма равна 24 × 5 ÷ 2 = 60."],"gain":["60 за 3 действия (сложить, умножить, разделить) вместо 4 сложений.","Если в ряду миллиард чисел, в лоб нужно почти миллиард сложений — около 10 секунд, а парами — всё те же 3 действия."],"whenToUse":"Когда нужно сложить длинный ряд чисел, в котором каждое следующее больше предыдущего на одно и то же число.","needs":["шаг между соседними числами везде одинаковый","известны первое и последнее число и сколько всего чисел"],"guarantees":"Точная сумма — та же, что при сложении по одному.","work":"Всегда 3 действия, сколько бы чисел ни было в ряду."},"en":{"trick":"pairing from both ends","task":"Add up 4 + 8 + 12 + 16 + 20: five numbers, each one 4 more than the one before.","headOn":"Head-on: add them one by one from left to right — 4 + 8 = 12, then 24, 40 and 60. That is 4 additions, and a longer row needs more.","notice":"Pair the numbers from both ends and every pair gives the same total: 4 + 20 = 24 and 8 + 16 = 24. So there is no need to add them one at a time.","steps":["The pair 4 + 20 gives 24, the pair 8 + 16 gives 24 too, and the 12 in the middle is exactly half of 24.","Every two numbers together make 24, and there are 5 numbers, so the sum is 24 × 5 ÷ 2 = 60."],"gain":["60 in 3 steps (add, multiply, divide) instead of 4 additions.","With a billion numbers in the row, the head-on way needs almost a billion additions — about 10 seconds — while pairing still takes 3 steps."],"whenToUse":"When you need to add a long row of numbers where each one is bigger than the last by the same amount.","needs":["the gap between neighbours is the same everywhere","you know the first and last numbers and how many there are"],"guarantees":"The exact sum — the same as adding them one by one.","work":"Always 3 steps, however many numbers are in the row."}},"en":{"naive":{"how":"add the numbers one by one from left to right","unit":"additions","formula":"5 numbers, one addition between each neighbouring pair"},"method":{"unit":"arithmetic steps","formula":"4 + 20 = 24, then × 5, then ÷ 2"},"gainText":"3 steps instead of 4 additions; with a billion numbers, 3 steps instead of almost a billion additions","scale":{"n":"the row 4, 8, 12, … with a billion numbers (at ~10⁸ additions per second)","naive":"almost a billion additions — about 10 seconds","method":"3 steps: (first + last) × count ÷ 2 — instant","plot":{"nName":"how many numbers are in the row"}}}},"LookupTable":{"id":"LookupTable","problem":"Если искать ответ цепочкой сравнений ключа, сравнений столько, сколько вариантов до нужного.","problemExample":"Английское слово для числа 11: цепочка сравнивает с 0, 1, …, 11 и находит «eleven» на 12-м сравнении.","naive":{"how":"сравнивать ключ по очереди с 0, 1, 2, … до совпадения","cost":"12","unit":"сверок","formula":"подсказки 0, 1, …, 11 по очереди"},"method":{"cost":"21","unit":"действий вместе с раскладкой","formula":"20 записей в ячейки 0…19 (один раз) + 1 чтение ячейки 11"},"scale":{"n":"20 возможных чисел, 10⁴ вопросов (при ~10⁸ действий в секунду)","naive":"в среднем 10 сверок × 10⁴ = 10⁵ сверок — около миллисекунды","method":"20 записей + 10⁴ чтений ≈ 10⁴ действий — в 10 раз меньше","plot":{"n":4,"naive":5,"method":4,"nc":"n","mc":"n","nName":"сколько вопросов"}},"keyIdea":"Ключ сам служит номером ячейки — сравнивать с другими ключами не нужно","how":["Разложить 20 ответов в ряд ячеек с номерами 0…19","Положить слово для числа k в ячейку номер k","По запросу 11 прочитать ячейку номер 11: «eleven»"],"props":{"time":"O(1)","space":"O(K)","timeRank":1,"spaceRank":4,"exact":"точный","needs":["ключи — целые числа от 0 до K − 1","K ячеек помещаются в память (до ~10⁷)"],"input":"ключ","output":"готовое значение","gives":"любой ответ за 1 чтение ячейки","timePlain":"одно чтение ячейки на запрос при любом числе ключей (после K записей подготовки)","spacePlain":"по ячейке на каждый возможный ключ: 20 ячеек для ключей 0…19"},"gainText":"на 1 вопросе дороже (21 против 12); со 2-го выгоднее: 22 против 30","story":{"ru":{"trick":"по номеру ячейки","task":"Нужно назвать число 11 по-английски. Есть подсказки «число — слово» для всех чисел от 0 до 19.","headOn":"В лоб: сверяем 11 с подсказками по очереди — 0? нет, 1? нет… — и находим «eleven» только на 12-й проверке.","notice":"Разложим слова по пронумерованным ячейкам так, чтобы номер ячейки совпадал с числом. Тогда слово для 11 лежит в ячейке 11 — искать не нужно.","steps":["Один раз раскладываем 20 слов по ячейкам с номерами от 0 до 19 — 20 записей.","Вопрос «11»: открываем ячейку 11 и сразу читаем «eleven» — вместе с раскладкой 21 действие.","Второй вопрос «17»: ещё одно чтение. Итого 22 действия, а сверкой по очереди было бы 12 + 18 = 30."],"gain":["Уже со второго вопроса ячейки выгоднее: 22 действия против 30 сверок.","На 10 тысячах вопросов — около 10 тысяч чтений вместо примерно 100 тысяч сверок."],"whenToUse":"Когда ответ зависит от небольшого целого числа и вопросов будет много.","needs":["вопросы — целые числа из известного небольшого диапазона (здесь 0…19)","есть место под одну ячейку на каждое возможное число"],"guarantees":"Любой ответ находится за одно чтение, без поиска.","work":"Одна раскладка по ячейкам, потом одно чтение на каждый вопрос."},"en":{"trick":"by box number","task":"We need the English word for the number 11. We have a hint “number — word” for every number from 0 to 19.","headOn":"Head-on: compare 11 with the hints one by one — 0? no, 1? no… — and find “eleven” only on the 12th check.","notice":"Put the words into numbered boxes so that the box number matches the number. Then the word for 11 sits in box 11 — no searching needed.","steps":["Once, put the 20 words into boxes numbered 0 to 19 — 20 writes.","Question “11”: open box 11 and read “eleven” straight away — 21 steps including the setup.","Second question “17”: one more read. 22 steps in all, while checking one by one would take 12 + 18 = 30."],"gain":["From the second question on, the boxes win: 22 steps against 30 checks.","Over 10 thousand questions: about 10 thousand reads instead of roughly 100 thousand checks."],"whenToUse":"When the answer depends on a small whole number and there will be many questions.","needs":["the questions are whole numbers from a known small range (here 0…19)","there is room for one box per possible number"],"guarantees":"Any answer is found with a single read, no searching.","work":"One pass to fill the boxes, then one read per question."}},"en":{"naive":{"how":"compare the number with each hint in turn until it matches","unit":"checks","formula":"hints 0, 1, …, 11 in turn"},"method":{"unit":"steps including the setup","formula":"20 writes into boxes 0…19 (once) + 1 read of box 11"},"scale":{"n":"20 possible numbers, 10⁴ questions (at ~10⁸ operations per second)","naive":"about 10 checks × 10⁴ = 10⁵ checks — about a millisecond","method":"20 writes + 10⁴ reads ≈ 10⁴ steps — 10 times fewer","plot":{"nName":"how many questions"}},"gainText":"costlier on 1 question (21 vs 12); better from the 2nd: 22 vs 30"}},"Precomputation":{"id":"Precomputation","problem":"Если каждый запрос заново строит одну и ту же структуру, работа повторяется столько раз, сколько запросов.","problemExample":"3 запроса — 16, 25, 30: является ли число квадратом? Квадраты 1, 4, 9, 16, 25 нужны всем трём.","naive":{"how":"для каждого запроса возводить в квадрат 1, 2, 3, …, пока квадрат не дойдёт до запроса","cost":"15","unit":"умножений","formula":"4 для 16 + 5 для 25 + 6 для 30"},"method":{"cost":"8","unit":"действий вместе с подготовкой","formula":"5 умножений (один раз) + 3 сверки"},"scale":{"n":"10⁵ вопросов про числа до 10⁶ (при ~10⁸ действий в секунду)","naive":"до 10³ умножений × 10⁵ вопросов = 10⁸ — около секунды","method":"10³ умножений один раз + 10⁵ сверок — около миллисекунды","plot":{"n":5,"naive":8,"method":5.00432,"nc":"n","mc":"n","nName":"сколько вопросов"}},"keyIdea":"Квадраты не зависят от запроса — строим их один раз, потом только проверяем","how":["Найти часть, общую для всех запросов: квадраты до 30","Построить набор {1, 4, 9, 16, 25} один раз","Для каждого запроса проверить, есть ли число в наборе: 16 да, 25 да, 30 нет"],"props":{"time":"O(B + T)","space":"O(B)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["структура одна и та же для всех запросов","запросов 2 и больше: при 1 запросе выигрыша нет"],"input":"граница и запросы","output":"ответы на запросы","gives":"общая работа выполняется ровно один раз при любом числе запросов","timePlain":"B — размер общей структуры (здесь 5 квадратов), T — число запросов (здесь 3): одна постройка + по проверке на запрос","spacePlain":"хранится готовая структура из B элементов: здесь 5 квадратов"},"gainText":"в 1,9 раза меньше работы (15 / 8); с ростом числа вопросов разрыв растёт","story":{"ru":{"trick":"посчитать заранее один раз","task":"Про каждое из чисел 16, 25 и 30 нужно узнать: можно ли получить его, умножив какое-то целое число само на себя (как 4 × 4 = 16)?","headOn":"В лоб: для каждого числа заново перемножаем 1 × 1, 2 × 2, 3 × 3… пока не дойдём до него или не перескочим — 4 + 5 + 6 = 15 умножений.","notice":"Произведения 1, 4, 9, 16, 25 одни и те же для всех трёх вопросов. Их можно посчитать один раз заранее, а потом только сверяться.","steps":["Один раз считаем 1 × 1, 2 × 2, … 5 × 5: 1, 4, 9, 16, 25 — 5 умножений; 6 × 6 = 36 уже больше 30, дальше не нужно.","Каждый вопрос — одна сверка с готовым списком: 16 есть, 25 есть, 30 нет. Всего 5 + 3 = 8 действий вместо 15."],"gain":["8 действий вместо 15 — и чем больше вопросов, тем больше разрыв.","На 100 тысячах вопросов про числа до миллиона: около 100 тысяч сверок вместо примерно 100 миллионов умножений."],"whenToUse":"Когда много вопросов опираются на одни и те же промежуточные результаты.","needs":["промежуточные результаты одинаковы для всех вопросов","вопросов больше одного — на одном выигрыша нет"],"guarantees":"Общая часть работы делается ровно один раз, сколько бы ни было вопросов.","work":"Одна подготовка плюс одна сверка на каждый вопрос."},"en":{"trick":"work it out once in advance","task":"For each of the numbers 16, 25 and 30, find out: can it be made by multiplying some whole number by itself (like 4 × 4 = 16)?","headOn":"Head-on: for each number, multiply 1 × 1, 2 × 2, 3 × 3… again until we reach it or go past it — 4 + 5 + 6 = 15 multiplications.","notice":"The products 1, 4, 9, 16, 25 are the same for all three questions. They can be worked out once in advance, and then we only look them up.","steps":["Once, work out 1 × 1, 2 × 2, … 5 × 5: 1, 4, 9, 16, 25 — 5 multiplications; 6 × 6 = 36 is already past 30, so we stop.","Each question is one look-up in the ready list: 16 is there, 25 is there, 30 is not. 5 + 3 = 8 steps in all instead of 15."],"gain":["8 steps instead of 15 — and the more questions, the bigger the gap.","For 100 thousand questions about numbers up to a million: about 100 thousand look-ups instead of roughly 100 million multiplications."],"whenToUse":"When many questions rely on the same intermediate results.","needs":["the intermediate results are the same for every question","there is more than one question — with just one there is no gain"],"guarantees":"The shared work is done exactly once, however many questions there are.","work":"One round of preparation plus one look-up per question."}},"en":{"naive":{"how":"for every question, multiply 1 × 1, 2 × 2, … again until reaching the number","unit":"multiplications","formula":"4 for 16 + 5 for 25 + 6 for 30"},"method":{"unit":"steps including the preparation","formula":"5 multiplications (once) + 3 look-ups"},"scale":{"n":"10⁵ questions about numbers up to 10⁶ (at ~10⁸ operations per second)","naive":"up to 10³ multiplications × 10⁵ questions = 10⁸ — about a second","method":"10³ multiplications once + 10⁵ look-ups — about a millisecond","plot":{"nName":"how many questions"}},"gainText":"1.9 times less work (15 / 8); the gap grows with more questions"}},"OfflineAlgorithm":{"id":"OfflineAlgorithm","problem":"Если отвечать на запросы по одному, неизвестно, до какого предела строить таблицу, и её перестраивают.","problemExample":"Запрос k: сколько простых чисел от 1 до k? Для ответа нужна таблица 1…k. Запросы 12, 30, 7: вместо трёх таблиц (12 + 30 + 7 = 49 ячеек) хватает одной до 30.","naive":{"how":"строить таблицу заново под каждый запрос по мере поступления","cost":"49","unit":"клеток таблицы","formula":"12 + 30 + 7"},"method":{"cost":"30","unit":"клеток таблицы","formula":"одна таблица до самой большой границы, 30"},"scale":{"n":"10⁵ вопросов с границами до 10⁶ (при ~10⁸ действий в секунду)","naive":"до 10⁵ × 10⁶ = 10¹¹ клеток — около 17 минут","method":"10⁶ клеток один раз + 10⁵ ответов — около сотой доли секунды","plot":{"n":5,"naive":11,"method":6.04139,"nc":"n","mc":"n","nName":"сколько вопросов"}},"keyIdea":"Прочитав все запросы заранее, знаем максимум — таблица строится один раз","how":["Прочитать все 3 запроса: 12, 30, 7","Найти самую большую границу: 30","Построить одну таблицу до 30","Ответить на запросы в исходном порядке: 12, 30, 7"],"props":{"time":"O(max + T)","space":"O(max + T)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["все запросы известны до первого ответа","запрос не зависит от ответа на предыдущий"],"input":"пакет запросов","output":"ответы в исходном порядке","gives":"таблица строится ровно один раз, ответы выдаются в исходном порядке","timePlain":"одна постройка до максимальной границы + по чтению на каждый запрос","spacePlain":"таблица до максимальной границы + сохранённые T запросов"},"gainText":"в 1,6 раза меньше клеток (49 / 30)","story":{"ru":{"trick":"сначала прочитать все вопросы","task":"Приходят три вопроса: сколько простых чисел (делятся только на 1 и на себя) от 1 до 12, от 1 до 30 и от 1 до 7? Для ответа нужна таблица чисел от 1 до названной границы.","headOn":"В лоб: отвечаем на вопросы по мере прихода и каждый раз строим таблицу заново — 12 + 30 + 7 = 49 клеток.","notice":"Если сначала прочитать все три вопроса, видна самая большая граница — 30. Одной таблицы от 1 до 30 хватит на все три ответа.","steps":["Строим одну таблицу от 1 до 30 — 30 клеток.","Отвечаем в том порядке, в каком спрашивали: до 12 — 5 простых, до 30 — 10, до 7 — 4. Всего 30 клеток вместо 49."],"gain":["30 клеток вместо 49 — таблица строится один раз.","На 100 тысячах вопросов с границами до миллиона: одна таблица на миллион клеток вместо сотни миллиардов."],"whenToUse":"Когда все вопросы известны заранее и каждый требует одной и той же, только разной по размеру, подготовки.","needs":["все вопросы можно прочитать до первого ответа","вопрос не зависит от ответа на предыдущий"],"guarantees":"Таблица строится ровно один раз, а ответы выдаются в исходном порядке.","work":"Одна таблица до самой большой границы плюс одно чтение на вопрос."},"en":{"trick":"read every question first","task":"Three questions come in: how many prime numbers (divisible only by 1 and themselves) are there from 1 to 12, from 1 to 30 and from 1 to 7? Answering needs a table of the numbers from 1 up to the given limit.","headOn":"Head-on: answer each question as it arrives and build the table from scratch each time — 12 + 30 + 7 = 49 cells.","notice":"If we read all three questions first, the largest limit is visible — 30. One table from 1 to 30 is enough for all three answers.","steps":["Build one table from 1 to 30 — 30 cells.","Answer in the order the questions came: up to 12 — 5 primes, up to 30 — 10, up to 7 — 4. 30 cells in all instead of 49."],"gain":["30 cells instead of 49 — the table is built once.","For 100 thousand questions with limits up to a million: one table of a million cells instead of a hundred billion."],"whenToUse":"When all the questions are known in advance and each needs the same preparation, only of a different size.","needs":["every question can be read before the first answer","no question depends on the answer to an earlier one"],"guarantees":"The table is built exactly once, and the answers still come out in the original order.","work":"One table up to the largest limit plus one look-up per question."}},"en":{"naive":{"how":"build a new table for every question as it arrives","unit":"table cells","formula":"12 + 30 + 7"},"method":{"unit":"table cells","formula":"one table up to the largest limit, 30"},"scale":{"n":"10⁵ questions with limits up to 10⁶ (at ~10⁸ operations per second)","naive":"up to 10⁵ × 10⁶ = 10¹¹ cells — about 17 minutes","method":"10⁶ cells once + 10⁵ answers — about a hundredth of a second","plot":{"nName":"how many questions"}},"gainText":"1.6 times fewer cells (49 / 30)"}},"LazyInitialization":{"id":"LazyInitialization","problem":"Дорогая таблица строится при каждом запуске, даже если в этом запуске её ни разу не спросят.","problemExample":"2 запуска программы, таблица на 1000 ячеек нужна только первому. Строить её дважды (2000 ячеек) или один раз (1000)?","naive":{"how":"строить таблицу при старте каждого запуска","cost":"2000","unit":"клеток таблицы","formula":"2 запуска × 1000 клеток"},"method":{"cost":"1000","unit":"клеток таблицы","formula":"запуск с вопросом: 1000 + запуск без вопроса: 0"},"scale":null,"keyIdea":"Флаг «готово» перед таблицей: строить при первом вопросе, дальше только читать","how":["Завести флаг «таблица не готова»","При каждом вопросе к таблице проверить флаг","Флаг «не готова» — построить таблицу и поставить «готова»","Флаг «готова» — прочитать значение из таблицы"],"props":{"time":"O(1) + постройка","space":"O(B)","timeRank":1,"spaceRank":4,"exact":"точный","needs":["хотя бы в части запусков таблица не нужна ни разу","первый вопрос может подождать одну постройку таблицы"],"input":"запрос к таблице","output":"значение из таблицы","gives":"таблица строится не больше одного раза; при 0 вопросов — 0 построек","timePlain":"проверка флага на каждый вопрос + одна постройка при первом вопросе","spacePlain":"таблица из B ячеек занимает память только после первого вопроса"},"gainText":"в 2 раза меньше клеток (2000 / 1000); цена — проверка отметки на каждый вопрос","story":{"ru":{"trick":"строить при первом вопросе","task":"Программу запускают два раза. В первый раз ей понадобится таблица на 1000 клеток, во второй раз — нет. Сколько раз строить таблицу?","headOn":"В лоб: строим таблицу в начале каждого запуска — 2 × 1000 = 2000 клеток, причём во втором запуске впустую.","notice":"Поставим перед таблицей отметку «готово / не готово» и будем строить таблицу только тогда, когда её впервые спросили.","steps":["Вопрос к таблице смотрит на отметку: «не готово» — строим таблицу и ставим «готово»; «готово» — просто читаем.","Первый запуск строит таблицу один раз — 1000 клеток; второй не строит её вовсе. 1000 клеток вместо 2000."],"gain":["1000 клеток вместо 2000; запуск, которому таблица не нужна, ничего не строит.","Цена — одна проверка отметки на каждый вопрос к таблице."],"whenToUse":"Когда подготовка дорогая, а нужна она не при каждом запуске.","needs":["хотя бы часть запусков обходится без таблицы","первый вопрос может подождать, пока таблица строится"],"guarantees":"Таблица строится не больше одного раза, а если её не спрашивают — ни разу.","work":"Одна проверка отметки на вопрос плюс одна постройка при первом вопросе."},"en":{"trick":"build on the first question","task":"A program is run twice. The first run will need a table of 1000 cells, the second will not. How many times should the table be built?","headOn":"Head-on: build the table at the start of every run — 2 × 1000 = 2000 cells, and in the second run for nothing.","notice":"Put a “ready / not ready” flag in front of the table and build the table only when someone asks for it for the first time.","steps":["A question to the table looks at the flag: “not ready” — build the table and set “ready”; “ready” — just read.","The first run builds the table once — 1000 cells; the second never builds it. 1000 cells instead of 2000."],"gain":["1000 cells instead of 2000; a run that does not need the table builds nothing.","The price is one look at the flag for every question to the table."],"whenToUse":"When the preparation is expensive but is not needed on every run.","needs":["at least some runs never use the table","the first question can wait while the table is built"],"guarantees":"The table is built at most once — and never, if nobody asks for it.","work":"One look at the flag per question plus one build on the first question."}},"en":{"naive":{"how":"build the table at the start of every run","unit":"table cells","formula":"2 runs × 1000 cells"},"method":{"unit":"table cells","formula":"run that asks: 1000 + run that does not: 0"},"gainText":"half the cells (2000 / 1000); the price is one flag check per question","props":{"time":"O(1) + one build"}}},"BinarySearch":{"id":"BinarySearch","problem":"Если искать число в длинном списке по порядку, сравнений может понадобиться столько, сколько элементов.","problemExample":"Найти 52 в отсортированном списке из 7 чисел: 4, 9, 15, 23, 31, 40, 52.","naive":{"how":"сравнивать 52 с каждым элементом слева направо","cost":"7","unit":"сравнений","formula":"52 стоит 7-м, сравниваем с каждым"},"method":{"cost":"3","unit":"сравнений","formula":"с 23, с 40, с 52"},"scale":{"n":"список из 10⁶ отсортированных чисел (при ~10⁸ операций в секунду)","naive":"до 10⁶ сравнений на поиск — ~10 миллисекунд","method":"⌈log₂ 10⁶⌉ = 20 сравнений на поиск — мгновенно","plot":{"n":6,"naive":6,"method":1.30103,"nc":"n","mc":"log","nName":"сколько чисел в списке"}},"keyIdea":"Одно сравнение с серединой отсортированного списка отбрасывает половину кандидатов","how":["Сравнить 52 с серединой списка 23: 52 больше","Отбросить левую половину 4…23","Сравнить 52 с серединой остатка 40: 52 больше","Сравнить с последним оставшимся числом 52: найдено"],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["список отсортирован по возрастанию","к любому элементу можно обратиться по номеру за 1 шаг"],"input":"отсортированный список, цель","output":"позиция или граница","gives":"ответ не больше чем за ⌈log₂ n⌉ сравнений: для 7 чисел — 3","timePlain":"сравнений столько, сколько раз n делится пополам: ⌈log₂ n⌉","spacePlain":"хранятся 2 границы отрезка поиска"},"gainText":"в 2,3 раза меньше сравнений (7 / 3); список должен быть уже отсортирован","story":{"ru":{"trick":"делением пополам","task":"Есть 7 чисел, записанных по возрастанию: 4, 9, 15, 23, 31, 40, 52. Нужно найти, на каком месте стоит число 52.","headOn":"В лоб: сравниваем 52 с каждым числом слева направо. 52 стоит последним, поэтому понадобится 7 сравнений.","notice":"Числа стоят по возрастанию. Значит, если число в середине меньше 52, то и все числа левее него меньше 52 — на них можно больше не смотреть.","steps":["Смотрим на середину — число 23. Оно меньше 52, значит 52 правее: отбрасываем 23 и всё, что левее.","Из оставшихся 31, 40, 52 смотрим на середину — число 40. Оно меньше 52: отбрасываем 31 и 40.","Осталось одно число — 52. Это оно: 52 стоит на 7-м месте."],"gain":["3 сравнения вместо 7.","В списке из миллиона чисел — 20 сравнений вместо миллиона: каждое сравнение отбрасывает половину того, что осталось."],"whenToUse":"Когда нужно найти число в длинном списке, где числа уже записаны по возрастанию.","needs":["числа в списке записаны по возрастанию","можно сразу посмотреть на число в любом месте списка — например, сразу на 4-е"],"guarantees":"Если число есть в списке, найдём его место; если нет — узнаем, между какими двумя числами оно стояло бы.","work":"Каждое сравнение отбрасывает половину того, что осталось: для 7 чисел хватает 3 сравнений, для миллиона — 20."},"en":{"trick":"halving","task":"Seven numbers are written in increasing order: 4, 9, 15, 23, 31, 40, 52. Where in the list is 52?","headOn":"Head-on: compare 52 with each number from left to right. 52 is last, so that takes 7 comparisons.","notice":"The numbers go up in order. So if the number in the middle is smaller than 52, every number to its left is smaller too — we can stop looking at them.","steps":["Look at the middle: 23. It is smaller than 52, so 52 is further right. Drop 23 and everything to its left.","Of the remaining 31, 40 and 52, look at the middle: 40. It is smaller than 52, so drop 31 and 40.","One number is left — 52. That is it: 52 is in 7th place."],"gain":["3 comparisons instead of 7.","In a list of a million numbers it takes 20 comparisons instead of a million: each comparison throws away half of what is left."],"whenToUse":"When you need to find a number in a long list that is already in increasing order.","needs":["the list is in increasing order","you can jump straight to any place in the list — say, straight to the 4th number"],"guarantees":"If the number is in the list, you find its place; if not, you learn which two numbers it would sit between.","work":"Each comparison throws away half of what is left: 7 numbers need 3 comparisons, a million need 20."}},"en":{"naive":{"how":"compare 52 with each number from left to right","unit":"comparisons","formula":"52 is 7th, so we compare with every number"},"method":{"unit":"comparisons","formula":"with 23, with 40, with 52"},"scale":{"n":"a sorted list of 10⁶ numbers (at ~10⁸ operations per second)","naive":"up to 10⁶ comparisons per search — about 10 milliseconds","method":"⌈log₂ 10⁶⌉ = 20 comparisons per search — instant","plot":{"nName":"how many numbers are in the list"}},"gainText":"2.3 times fewer comparisons (7 / 3)"}},"TrialDivision":{"id":"TrialDivision","problem":"Чтобы разложить число на простые множители без готового списка простых, приходится пробовать делители.","problemExample":"Разложить 30 на простые множители 2 · 3 · 5 и найти наибольший — 5.","naive":{"how":"пробовать всех кандидатов d от 2 до 30, деля на каждого, пока делится","cost":"32","unit":"проб делением","formula":"29 чисел от 2 до 30 + 3 повторные пробы после удачных делений"},"method":{"cost":"4","unit":"проб делением","formula":"30 на 2, 15 на 2, 15 на 3, 5 на 3; на d = 4 уже 4 · 4 больше 5"},"scale":{"n":"одно число около 10¹² (при ~10⁸ операций в секунду)","naive":"до 10¹² проверок делением — ~3 часа","method":"до √10¹² = 10⁶ проверок — ~0,01 секунды","plot":{"n":12,"naive":12,"method":6,"nc":"n","mc":"sqrt"}},"keyIdea":"Если d·d больше оставшегося частного, оно уже простое — дальше кандидатов не пробовать","how":["Пробовать кандидатов d = 2, 3, 4, … по порядку","Пока частное делится на d — делить: 30 → 15 → 5","Остановиться, когда d·d больше частного: 4·4 = 16 > 5","Частное больше 1 записать последним простым множителем: 5"],"props":{"time":"O(√n)","space":"O(1)","timeRank":3,"spaceRank":1,"exact":"точный","needs":["одно число до ~10¹⁶, чтобы √n = 10⁸ проверок укладывались в ~1 секунду","делители пробуются по возрастанию, начиная с 2"],"input":"целое число","output":"простые множители","gives":"полное разложение на простые множители по возрастанию: 30 = 2 · 3 · 5","timePlain":"проверок не больше √n: для 10¹² — до 10⁶","spacePlain":"хранятся текущее частное и пробный делитель"},"gainText":"в 8 раз меньше проб (32 / 4)","story":{"ru":{"trick":"пробным делением до d · d","task":"Нужно разложить 30 на простые множители — узнать, из каких простых чисел оно получается умножением.","headOn":"В лоб: пробуем делить на каждое число от 2 до 30, а после удачного деления пробуем то же число ещё раз. Это 29 + 3 = 32 пробы.","notice":"Если оставшееся число можно разделить дальше, у него есть делитель d, у которого d · d не больше самого числа. Значит, как только d · d стало больше оставшегося числа, оно простое — дальше пробовать незачем.","steps":["Делим 30 на 2 — получаем 15. Пробуем 15 на 2 ещё раз — не делится. Это 2 пробы.","Делим 15 на 3 — получаем 5. Пробуем 5 на 3 — не делится. Уже 4 пробы.","Следующее d = 4, а 4 · 4 = 16 больше 5 — значит, 5 простое. Ответ: 30 = 2 · 3 · 5 за 4 пробы."],"gain":["4 пробы вместо 32.","Для числа около триллиона — не больше миллиона проб вместо триллиона: пробуем только d, у которых d · d не больше числа."],"whenToUse":"Когда нужно разложить на простые множители одно не очень большое число — примерно до триллиона.","needs":["число целое и больше 1","число не больше примерно 10¹², иначе проб слишком много"],"guarantees":"Находятся все простые множители, каждый столько раз, сколько он входит в число.","work":"Не больше проб, чем чисел d, у которых d · d не больше исходного числа: для триллиона — около миллиона."},"en":{"trick":"trial division up to d · d","task":"Break 30 into prime factors: find the prime numbers that multiply together to give 30.","headOn":"Head-on: try dividing by every number from 2 to 30, and after a division works, try the same number once more. That is 29 + 3 = 32 tries.","notice":"If what is left can still be split, it has a divisor d with d · d no bigger than itself. So once d · d is bigger than what is left, what is left is prime — there is no point trying further.","steps":["Divide 30 by 2: 15. Try 2 again on 15: it does not go. That is 2 tries.","Divide 15 by 3: 5. Try 3 again on 5: it does not go. 4 tries so far.","Next is d = 4, and 4 · 4 = 16 is more than 5, so 5 is prime. Answer: 30 = 2 · 3 · 5, in 4 tries."],"gain":["4 tries instead of 32.","For a number around a trillion: at most a million tries instead of a trillion, because we only try d with d · d no bigger than the number."],"whenToUse":"When you need the prime factors of a single number that is not huge — up to about a trillion.","needs":["a whole number bigger than 1","no bigger than about 10¹², or there are too many tries"],"guarantees":"Every prime factor is found, as many times as it goes into the number.","work":"No more tries than there are numbers d with d · d up to the number: about a million for a trillion."}},"en":{"naive":{"how":"try dividing 30 by every number from 2 to 30, and once more after each division that works","unit":"tries","formula":"29 numbers from 2 to 30 + 3 repeat tries after a division works"},"method":{"unit":"tries","formula":"30 by 2, 15 by 2, 15 by 3, 5 by 3; at d = 4, 4 · 4 is already more than 5"},"scale":{"n":"one number around 10¹² (at ~10⁸ operations per second)","naive":"up to 10¹² trial divisions — about 3 hours","method":"up to 10⁶ tries (only d with d · d ≤ 10¹²) — about 0.01 seconds"},"gainText":"8 times fewer tries (32 / 4)"}},"SumOfSquares":{"id":"SumOfSquares","problem":"Чтобы сложить квадраты от 1² до n² по одному, нужно n возведений и n − 1 сложений.","problemExample":"Сумма 1² + 2² + 3² + 4² = 1 + 4 + 9 + 16 = 30.","naive":{"how":"возвести каждое число в квадрат и сложить результаты","cost":"7","unit":"арифметических действий","formula":"4 возведения в квадрат + 3 сложения"},"method":{"cost":"6","unit":"арифметических действий","formula":"брусок 4 × 5 × 9, делённый на 6"},"scale":{"n":"сумму 1² + … + n² нужно посчитать 10 тысяч раз, n до 10 тысяч (при ~10⁸ действий в секунду)","naive":"до 20 тысяч действий на раз, всего 2·10⁸ — около 2 секунд","method":"6 действий на раз, всего 60 тысяч — около 1 миллисекунды","plot":{"n":4,"naive":8.30103,"method":4.77815,"nc":"n","mc":"1","nName":"сколько слоёв в пирамиде"}},"keyIdea":"Квадрат k² раскладывается на две треугольные лесенки — сумма сводится к формуле","how":["Разбить квадрат k² на две лесенки: 1+…+k и 1+…+(k−1)","Сложить лесенки слоями для k = 1…4: 20 + 10 = 30","Подставить n = 4 в формулу n(n+1)(2n+1)/6 и получить 30"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["квадраты идут подряд с 1² до n²","результат помещается в обычное целое число компьютера при n до 1,6 млн"],"input":"число n","output":"сумма квадратов","gives":"точная сумма квадратов за 6 действий при любом n","timePlain":"6 действий при любом n","spacePlain":"хранятся n и 2–3 промежуточных числа"},"gainText":"при n = 4 почти поровну (7 и 6 действий); при n = 100 — 6 действий вместо 199 (100 квадратов + 99 сложений)","story":{"ru":{"trick":"брусок из шести пирамид","task":"Пирамида сложена из квадратных слоёв кубиков: 1 × 1, 2 × 2, 3 × 3 и 4 × 4. Сколько в ней всего кубиков, то есть чему равно 1² + 2² + 3² + 4²?","headOn":"В лоб: считаем кубики каждого слоя — 1, 4, 9, 16 — и складываем. Это 4 умножения и 3 сложения, всего 7 действий, а для пирамиды из 100 слоёв — уже 199.","notice":"Каждый квадратный слой делится по диагонали на две лесенки, и из таких лесенок складывается ровный брусок: шесть одинаковых пирамид укладываются в брусок 4 × 5 × 9.","steps":["Нижний слой 4 × 4 делится на синюю лесенку из 1 + 2 + 3 + 4 = 10 кубиков и красную из 1 + 2 + 3 = 6: вместе 16.","Так делится каждый слой: синих кубиков 1 + 3 + 6 + 10 = 20, красных 0 + 1 + 3 + 6 = 10, всего 30.","Шесть таких пирамид складываются в брусок 4 × 5 × 9 = 180 кубиков, значит, одна пирамида — это 180 ÷ 6 = 30."],"gain":["30 кубиков за 6 действий (4 + 1, 2 × 4, 8 + 1, 4 × 5, 20 × 9, 180 ÷ 6) вместо 7 — на четырёх слоях выигрыш маленький.","Для пирамиды из 100 слоёв в лоб нужно 199 действий, а брусок по-прежнему даёт ответ за 6."],"whenToUse":"Когда нужно сложить квадраты чисел подряд: 1² + 2² + 3² и так далее до какого-то числа.","needs":["складывают
