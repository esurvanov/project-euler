  if(i>=0){var c=LAB.current();if(!c||LAB.chapterOf(c.step)!==t[4])LAB.go(i);}
}
function onStep(i){
  var ch=LAB.chapterOf?LAB.chapterOf(i):null;
  Array.prototype.forEach.call($('mtbody').querySelectorAll('.sti'),function(b){b.setAttribute('aria-current',+b.dataset.step===i?'step':'false');});
  if(!ch)return;
  if(ch!==lastCh||tabCur!=='card'){var k=CHTAB[ch];if(tabAvail[k])showTab(k);}
  lastCh=ch;
}
function placeholder(){
  var m=M[cur];
  var fr=EN()&&m[14]&&m[14].steps&&m[14].steps.length?m[14].steps:m[8];
  $('ph').innerHTML='<b>'+(gl?tx('phWork'):tx('noGL'))+'</b><span class="lab">'+tx('asText')+'</span><ol>'+(fr.length?fr:['—']).map(function(s,k){return '<li><span>'+(k+1)+'</span>'+esc(s)+'</li>';}).join('')+'</ol>';
}
function setMode(){
  var id=M[cur][0],can=gl&&has(id);
  $('stage').hidden=!can;$('player').hidden=!can;$('ph').hidden=can;
  var cu=gl&&LAB.current&&LAB.current(),ns=(cu&&cu.id===id)?cu.steps:(has(id)?LAB.scenes[id].steps.length:0);$('scStat').textContent=has(id)?(gl?tx('ready')+ns+' '+(EN()?plural(ns,'step','steps'):plural(ns,'шаг','шага','шагов')):tx('noGL')):tx('wip');
  if(can)window.dispatchEvent(new Event('resize'));
}
function open(i,keepHash){
  cur=Math.max(0,Math.min(M.length-1,i));var id=M[cur][0];
  Array.prototype.forEach.call(document.querySelectorAll('#list .mrow'),function(b){b.setAttribute('aria-pressed',String(+b.dataset.i===cur));});
  header();placeholder();
  var okOpen=false;if(gl&&has(id))okOpen=LAB.open(id);
  if(!okOpen&&gl&&LAB.open)LAB.open(null);
  tabs();
  setMode();
  if(!keepHash&&history.replaceState)history.replaceState(null,'','#'+id);
  var row=document.querySelector('#list .mrow[data-i="'+cur+'"]');if(row){var L=$('list');var t=row.offsetTop-L.offsetTop;if(t<L.scrollTop||t>L.scrollTop+L.clientHeight-30)L.scrollTop=t-40;}
}
function move(d){var ii=idx();if(ii.indexOf(cur)<0)ii=M.map(function(_,i){return i;});var p=ii.indexOf(cur);open(ii[(p+d+ii.length)%ii.length]);}
$('fFam').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;fam=b.dataset.f===''?null:+b.dataset.f;filters();list();});
$('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();list();});
$('list').addEventListener('click',function(e){var b=e.target.closest('.mrow');if(b)open(+b.dataset.i);});
$('mh').addEventListener('click',function(e){var b=e.target.closest('[data-mv]');if(b)move(+b.dataset.mv);});
$('mtbody').addEventListener('click',function(e){var b=e.target.closest('[data-open]');if(b)open(+b.dataset.open);});
$('mtl').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)pickTab(b.dataset.tab);});
$('mtbody').addEventListener('click',function(e){var b=e.target.closest('.sti');if(!b)return;LAB.go(+b.dataset.step);});
$('mtl').addEventListener('keydown',function(e){
  var vis=TABS.map(function(t){return t[0];}).filter(function(k){return tabAvail[k];}),p=vis.indexOf(tabCur),n=null;
  if(e.key==='ArrowRight')n=vis[(p+1)%vis.length];else if(e.key==='ArrowLeft')n=vis[(p-1+vis.length)%vis.length];else if(e.key==='Home')n=vis[0];else if(e.key==='End')n=vis[vis.length-1];
  if(n){e.preventDefault();e.stopPropagation();pickTab(n,true);}
});
$('themeBtn').addEventListener('click',function(){var c=document.documentElement.getAttribute('data-theme');var dark=c?c==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',dark?'light':'dark');});
var th=$('theater');
function fsOn(){return document.fullscreenElement===th||th.classList.contains('fs');}
function fsUpd(){var on=fsOn();$('bFull').setAttribute('aria-pressed',String(on));$('bFull').setAttribute('aria-label',on?tx('fullExit'):tx('full'));$('bFull').title=on?tx('fullExitT'):tx('full');window.dispatchEvent(new Event('resize'));}
function fsFallback(){th.classList.add('fs');document.body.style.overflow='hidden';fsUpd();}
function fsExit(){if(document.fullscreenElement&&document.exitFullscreen){var r=document.exitFullscreen();if(r&&r.catch)r.catch(function(){});}th.classList.remove('fs');document.body.style.overflow='';fsUpd();}
$('bFull').addEventListener('click',function(){
  if(fsOn()){fsExit();return;}
  if(th.requestFullscreen){var done=false;try{var r=th.requestFullscreen();if(r&&r.then)r.then(function(){done=true;},function(){if(!done){done=true;fsFallback();}});}catch(e){done=true;fsFallback();}
    setTimeout(function(){if(!done&&!document.fullscreenElement&&!th.classList.contains('fs')){done=true;fsFallback();}},400);}
  else fsFallback();
});
document.addEventListener('fullscreenchange',fsUpd);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&th.classList.contains('fs'))fsExit();});
function fromHash(){var h=decodeURIComponent((location.hash||'').slice(1));if(!h)return false;for(var i=0;i<M.length;i++)if(M[i][0]===h){open(i,true);return true;}return false;}
window.addEventListener('hashchange',fromHash);
/* language switch: UI, the current scene (rebuilt on the same step) and the tabs, no reload */
function setLang(l){
  if(l!=='ru'&&l!=='en')return;LS('lab.lang',l);if(l===lang)return;
  lang=l;document.documentElement.lang=l;
  if(LAB.setLang)LAB.setLang(l);
  applyStatic();filters();list();header();placeholder();tabs();setMode();
}
LAB.pageLang=function(l){if(l)setLang(l);return lang;};
Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);});});
applyStatic();
filters();progress();list();
if(!fromHash()){var first=0;for(var k=0;k<M.length;k++)if(has(M[k][0])){first=k;break;}open(first,true);}
})();
</script>
</body></html>
