ся квадраты всех чисел подряд, начиная с 1","известно последнее число — сколько слоёв в пирамиде"],"guarantees":"Точное число кубиков — столько же, сколько при счёте по слоям.","work":"Всегда 6 действий, сколько бы слоёв ни было."},"en":{"trick":"a block of six pyramids","task":"A pyramid is built from square layers of cubes: 1 × 1, 2 × 2, 3 × 3 and 4 × 4. How many cubes does it have — what is 1² + 2² + 3² + 4²?","headOn":"Head-on: count the cubes in each layer — 1, 4, 9, 16 — and add them up. That is 4 multiplications and 3 additions, 7 steps in all, and a pyramid of 100 layers needs 199.","notice":"Each square layer splits along its diagonal into two staircases, and such staircases fit together into a neat box: six identical pyramids fill a 4 × 5 × 9 block.","steps":["The bottom 4 × 4 layer splits into a blue staircase of 1 + 2 + 3 + 4 = 10 cubes and a red one of 1 + 2 + 3 = 6: 16 together.","Every layer splits the same way: 1 + 3 + 6 + 10 = 20 blue cubes and 0 + 1 + 3 + 6 = 10 red ones, 30 in all.","Six such pyramids fill a block of 4 × 5 × 9 = 180 cubes, so one pyramid holds 180 ÷ 6 = 30."],"gain":["30 cubes in 6 steps (4 + 1, 2 × 4, 8 + 1, 4 × 5, 20 × 9, 180 ÷ 6) instead of 7 — with four layers the gain is small.","A pyramid of 100 layers takes 199 steps head-on, while the block still gives the answer in 6."],"whenToUse":"When you need to add up the squares of consecutive numbers: 1² + 2² + 3² and so on up to some number.","needs":["the squares of all numbers in a row are added, starting from 1","you know the last number — how many layers the pyramid has"],"guarantees":"The exact number of cubes — the same as counting layer by layer.","work":"Always 6 steps, however many layers there are."}},"en":{"naive":{"how":"square each number and add the results","unit":"arithmetic steps","formula":"4 squarings + 3 additions"},"method":{"unit":"arithmetic steps","formula":"block 4 × 5 × 9, divided by 6"},"gainText":"almost even with 4 layers (7 and 6 steps); with 100 layers, 6 steps instead of 199","scale":{"n":"the sum 1² + … + n² is needed 10 thousand times, n up to 10 thousand (at ~10⁸ steps per second)","naive":"up to 20 thousand steps each time, 2·10⁸ in all — about 2 seconds","method":"6 steps each time, 60 thousand in all — about 1 millisecond","plot":{"nName":"how many layers the pyramid has"}}}},"EuclideanAlgorithm":{"id":"EuclideanAlgorithm","problem":"Если искать наибольший общий делитель перебором, кандидатов проверяют по одному.","problemExample":"НОД(35, 15) = 5 (НОД — наибольшее число, делящее оба): перебор идёт от 15 вниз и проверяет 11 кандидатов.","naive":{"how":"проверять кандидатов d от 15 вниз: делит ли d число 35, а затем 15","cost":"13","unit":"проверок делением","formula":"11 проверок 35 на числа от 15 до 5 + 2 проверки 15 (на 7 и на 5)"},"method":{"cost":"2","unit":"делений с остатком","formula":"35 на 15 (остаток 5), затем 15 на 5 (остаток 0)"},"scale":{"n":"два числа до 10¹⁸ (при ~10⁸ операций в секунду)","naive":"до 10¹⁸ проверок — ~300 лет","method":"не больше ~90 делений (теорема Ламе: делений ≤ 5 × число цифр) — мгновенно","plot":{"n":18,"naive":18,"method":1.95424,"nc":"n","mc":"log"}},"keyIdea":"НОД не меняется, если большее число заменить остатком — числа быстро уменьшаются","how":["Разделить большее на меньшее: 35 ÷ 15, остаток 5","Заменить большее число остатком: пара (15, 5)","Повторять деление, пока остаток не станет 0: 15 ÷ 5, остаток 0","Последний ненулевой остаток — НОД: 5"],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["оба числа целые и неотрицательные","хотя бы одно из чисел больше 0"],"input":"два целых числа","output":"НОД","gives":"НОД за число делений, пропорциональное числу цифр","timePlain":"по теореме Ламе делений не больше 5 × число цифр меньшего числа: для 18-значных — не больше 90","spacePlain":"хранятся 2 числа текущей пары"},"gainText":"в 6,5 раза меньше делений (13 / 2)","story":{"ru":{"trick":"делением с остатком (способ Евклида)","task":"Нужно найти наибольший общий делитель чисел 35 и 15 — самое большое число, на которое делятся оба.","headOn":"В лоб: пробуем числа от 15 вниз — 15, 14, 13… — и каждое проверяем делением. Первым подойдёт 5, и на это уйдёт 13 проверок.","notice":"Всё, что делит и 35, и 15, делит и то, что остаётся от 35 после того, как дважды убрать 15: 35 − 15 − 15 = 5. Значит, вместо 35 и 15 можно искать общий делитель 15 и 5 — числа меньше, ответ тот же.","steps":["Делим 35 на 15: помещается 2 раза, в остатке 5. Теперь ищем общий делитель 15 и 5.","Делим 15 на 5: ровно 3 раза, остатка нет. Значит, ответ — 5, и хватило 2 делений."],"gain":["2 деления вместо 13 проверок.","Для двух чисел длиной в 18 цифр — не больше 90 делений вместо миллиардов миллиардов проверок."],"whenToUse":"Когда нужен наибольший общий делитель двух чисел, особенно больших.","needs":["оба числа целые и больше 0"],"guarantees":"Ответ точный: это самое большое число, которое делит оба.","work":"Делений мало: не больше пяти на каждую цифру меньшего числа."},"en":{"trick":"division with remainder (Euclid’s way)","task":"Find the greatest common divisor of 35 and 15: the largest number that divides both evenly.","headOn":"Head-on: try 15, 14, 13 and so on downward, checking each one by dividing. The first that fits is 5, and it takes 13 checks to get there.","notice":"Anything that divides both 35 and 15 also divides what is left of 35 after taking away 15 twice: 35 − 15 − 15 = 5. So instead of 35 and 15 we can look for the common divisor of 15 and 5 — smaller numbers, same answer.","steps":["Divide 35 by 15: it goes 2 times with 5 left over. Now look for the common divisor of 15 and 5.","Divide 15 by 5: exactly 3 times, nothing left over. So the answer is 5, found with 2 divisions."],"gain":["2 divisions instead of 13 checks.","For two numbers 18 digits long: at most 90 divisions instead of a billion billion checks."],"whenToUse":"When you need the greatest common divisor of two numbers, especially large ones.","needs":["both numbers are whole and bigger than 0"],"guarantees":"The answer is exact: the largest number that divides both.","work":"Few divisions: no more than five for each digit of the smaller number."}},"en":{"naive":{"how":"try 15, 14, 13, … downward and check each by dividing","unit":"checks","formula":"11 checks of 35 by 15 down to 5 + 2 checks of 15 (by 7 and by 5)"},"method":{"unit":"divisions","formula":"35 by 15 (5 left over), then 15 by 5 (nothing left over)"},"scale":{"n":"two numbers up to 10¹⁸ (at ~10⁸ operations per second)","naive":"up to 10¹⁸ checks — about 300 years","method":"at most ~90 divisions (no more than 5 per digit) — instant"},"gainText":"6.5 times fewer divisions (13 / 2)"}},"LCMViaGCD":{"id":"LCMViaGCD","problem":"Произведение двух чисел завышает общее кратное, а перебор чисел подряд долгий.","problemExample":"НОК(35, 15) = 105 (НОК — наименьшее число, кратное обоим); произведение 35 · 15 = 525 в 5 раз больше.","naive":{"how":"проверять числа подряд от 35, делятся ли они и на 35, и на 15","cost":"71","unit":"проверенных чисел","formula":"числа от 35 до 105 подряд"},"method":{"cost":"4","unit":"арифметических действия","formula":"2 деления на поиск общей части 5; 35 на 5 даёт 7; 7 умножить на 15"},"scale":{"n":"НОК всех чисел 1…40 (≈ 5,3·10¹⁵) (при ~10⁸ операций в секунду)","naive":"перебор чисел до ~5,3·10¹⁵ — ~2 года","method":"39 попарных шагов, каждый — НОД, деление и умножение — мгновенно","plot":{"n":1.60206,"naive":15.72428,"method":1.59106,"nc":"2n","mc":"n","est":"naive"}},"keyIdea":"Общая часть двух чисел — их НОД; деление на него убирает повтор","how":["Найти НОД(35, 15) = 5 алгоритмом Евклида","Разделить одно число на НОД: 35 ÷ 5 = 7","Умножить результат на другое число: 7 · 15 = 105","НОК трёх и более чисел: сначала НОК первых двух, потом НОК результата с третьим, и так далее"],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["числа целые и больше 0","итоговый НОК помещается в 64-битное целое (максимум ≈ 9,2·10¹⁸): для 1…40 это ~5,3·10¹⁵"],"input":"два или список чисел","output":"НОК","gives":"наименьшее общее кратное без завышения: 105 для 35 и 15","timePlain":"одно вычисление НОД (делений порядка числа цифр) + 2 действия на пару","spacePlain":"хранятся текущий НОК и одно очередное число"},"gainText":"в ~18 раз меньше действий (71 / 4)","story":{"ru":{"trick":"через общий делитель","task":"Нужно найти наименьшее общее кратное чисел 35 и 15 — самое маленькое число, которое делится и на 35, и на 15.","headOn":"В лоб: проверяем подряд 35, 36, 37… пока не встретим число, которое делится на оба. Это 105, и до него придётся проверить 71 число.","notice":"35 = 7 × 5, а 15 = 3 × 5: у них общая часть 5. В ответе должны быть и 7, и 3, и 5, но пятёрку достаточно взять один раз: 7 × 3 × 5.","steps":["Находим общую часть — наибольший общий делитель 35 и 15. Двумя делениями получаем 5.","Делим 35 на 5 — получаем 7: столько раз нужно взять 15.","Умножаем 7 на 15 — получаем 105. Это ответ: 105 делится и на 35, и на 15. Всего 4 действия."],"gain":["4 действия вместо 71 проверки.","Для всех чисел от 1 до 40 ответ около 5 тысяч триллионов: перебор занял бы годы, а так — по нескольку действий на каждое число, мгновенно."],"whenToUse":"Когда нужно самое маленькое число, которое делится на каждое из нескольких данных чисел.","needs":["числа целые и больше 0","ответ не слишком велик для компьютера: для чисел от 1 до 40 он около 5 · 10¹⁵"],"guarantees":"Ответ точный: самое маленькое общее кратное.","work":"На каждую пару чисел — несколько делений на поиск общего делителя, одно деление и одно умножение."},"en":{"trick":"through the common divisor","task":"Find the least common multiple of 35 and 15: the smallest number that divides evenly by both 35 and 15.","headOn":"Head-on: check 35, 36, 37 and so on until one divides by both. That is 105, and it takes 71 checks to reach it.","notice":"35 = 7 × 5 and 15 = 3 × 5: they share the part 5. The answer must contain 7, 3 and 5, but the 5 only needs to be taken once: 7 × 3 × 5.","steps":["Find the shared part — the greatest common divisor of 35 and 15. Two divisions give 5.","Divide 35 by 5: 7. That is how many times we need to take 15.","Multiply 7 by 15: 105. That is the answer — 105 divides by both 35 and 15. 4 operations in all."],"gain":["4 operations instead of 71 checks.","For all the numbers from 1 to 40 the answer is about 5 thousand trillion: checking one by one would take years, this way it is a few operations per number — instant."],"whenToUse":"When you need the smallest number that divides evenly by each of several given numbers.","needs":["the numbers are whole and bigger than 0","the answer is not too big for the computer: for 1 to 40 it is about 5 · 10¹⁵"],"guarantees":"The answer is exact: the smallest common multiple.","work":"For each pair of numbers: a few divisions to find the common divisor, one division and one multiplication."}},"en":{"naive":{"how":"check 35, 36, 37, … until one divides by both 35 and 15","unit":"numbers checked","formula":"the numbers from 35 to 105 in a row"},"method":{"unit":"operations","formula":"2 divisions to find the shared part 5; 35 by 5 gives 7; 7 times 15"},"scale":{"n":"the least common multiple of all numbers 1…40 (≈ 5.3·10¹⁵) (at ~10⁸ operations per second)","naive":"checking numbers up to ~5.3·10¹⁵ — about 2 years","method":"39 pair steps, each a few divisions and one multiplication — instant"},"gainText":"about 18 times fewer operations (71 / 4)"}},"SievingOverMultiples":{"id":"SievingOverMultiples","problem":"Если считать делители каждого числа до N отдельно, каждое число делят на все меньшие.","problemExample":"Число делителей для всех чисел от 1 до 20 сразу: например, у 12 их 6.","naive":{"how":"для каждого n от 1 до 20 проверять делители d = 1…n","cost":"210","unit":"проверок делением","formula":"1 + 2 + … + 20: число n проверяется n раз"},"method":{"cost":"66","unit":"шагов по кратным","formula":"20 + 10 + 6 + (5 + 4 + 3 + 2 + 2 + 2 + 2) + 10 × 1"},"scale":{"n":"N = 10⁶ — все числа до миллиона (при ~10⁸ операций в секунду)","naive":"1 + 2 + … + N ≈ N²/2 ≈ 5·10¹¹ проверок делением — ~1,5 часа","method":"N · ln N записей; ln N ≈ 14 при N = 10⁶, записей примерно в 14 раз больше, чем чисел: ~1,4·10⁷ — ~0,1 секунды","plot":{"n":6,"naive":11.69897,"method":7.14613,"nc":"n2","mc":"nlogn"}},"keyIdea":"Идти от делителя по его кратным и записывать вклад — делить не нужно","how":["Завести 20 ячеек-счётчиков для чисел 1…20","Взять делитель d и шагать d, 2d, 3d, … до 20","В каждую ячейку на пути прибавить 1","Повторить для всех d от 1 до 20"],"props":{"time":"O(N log N)","space":"O(N)","timeRank":5,"spaceRank":4,"exact":"точный","needs":["нужен ответ для всех чисел от 1 до N сразу","N ячеек помещаются в память (до ~10⁷)"],"input":"граница N","output":"таблица: у каждого числа до N — число его делителей","gives":"каждая пара «делитель — кратное» записана ровно один раз, таблица верна для всех чисел до N","timePlain":"записей ⌊N/1⌋ + ⌊N/2⌋ + … + ⌊N/N⌋ (⌊N/d⌋ — сколько кратных d до N) ≈ N · ln N, ln — натуральный логарифм","spacePlain":"по ячейке на каждое число до N"},"gainText":"в 3,2 раза меньше операций (210 / 66)","story":{"ru":{"trick":"шагами по кратным","task":"Для каждого числа от 1 до 20 нужно узнать, сколько у него делителей — чисел, на которые оно делится без остатка.","headOn":"В лоб: каждое число n проверяем делением на 1, 2, … n. Для всех чисел это 1 + 2 + … + 20 = 210 проверок.","notice":"Посмотрим с другой стороны: 3 — делитель у 3, 6, 9, 12, 15 и 18. Эти числа не нужно искать делением: проходим по ним шагами по 3 и каждому добавляем 1 в счётчик.","steps":["Шагаем по 1: каждое из 20 чисел получает +1 — 20 шагов.","Шагаем по 2 и по 3: +1 получают ещё 10 и 6 чисел — уже 36 шагов.","Шаги по 4, 5, … 10 дают ещё 5 + 4 + 3 + 2 + 2 + 2 + 2 = 20 — уже 56 шагов.","Числа от 11 до 20 попадают шагом только сами в себя — ещё 10 шагов. Все счётчики готовы за 66 шагов: например, у 12 делителей 6."],"gain":["66 шагов вместо 210 проверок.","Для всех чисел до миллиона — около 14 миллионов шагов вместо 500 миллиардов проверок."],"whenToUse":"Когда число делителей нужно знать сразу для всех чисел подряд до какого-то предела.","needs":["нужен ответ для всех чисел до предела сразу","хватает памяти на счётчик для каждого числа — примерно до 10 миллионов чисел"],"guarantees":"Каждый счётчик точный: каждый делитель посчитан ровно один раз.","work":"Для чисел до миллиона — примерно по 14 шагов на число."},"en":{"trick":"stepping through multiples","task":"For every number from 1 to 20, find how many divisors it has — the numbers it divides by evenly.","headOn":"Head-on: check each number n by dividing it by 1, 2, … up to n. For all of them that is 1 + 2 + … + 20 = 210 checks.","notice":"Look at it the other way round: 3 is a divisor of 3, 6, 9, 12, 15 and 18. We do not have to find those numbers by dividing — just step through them by 3s and add 1 to each one’s counter.","steps":["Step by 1s: each of the 20 numbers gets +1 — 20 steps.","Step by 2s and by 3s: 10 more numbers and then 6 more get +1 — 36 steps so far.","Steps of 4, 5, … 10 add 5 + 4 + 3 + 2 + 2 + 2 + 2 = 20 more — 56 steps so far.","Each number from 11 to 20 only lands on itself — 10 more steps. All counters are ready after 66 steps: for example, 12 has 6 divisors."],"gain":["66 steps instead of 210 checks.","For all numbers up to a million: about 14 million steps instead of 500 billion checks."],"whenToUse":"When you need the number of divisors of every number in a row up to some limit.","needs":["you need the answer for all numbers up to the limit at once","there is memory for one counter per number — up to about 10 million numbers"],"guarantees":"Every counter is exact: each divisor is counted exactly once.","work":"For numbers up to a million: about 14 steps per number."}},"en":{"naive":{"how":"for each n from 1 to 20, check the divisors 1…n","unit":"checks","formula":"1 + 2 + … + 20: number n is checked n times"},"method":{"unit":"steps","formula":"20 + 10 + 6 + (5 + 4 + 3 + 2 + 2 + 2 + 2) + 10 × 1"},"scale":{"n":"all numbers up to 10⁶ (at ~10⁸ operations per second)","naive":"1 + 2 + … + N ≈ N²/2 ≈ 5·10¹¹ checks — about 1.5 hours","method":"about 14 steps per number: ~1.4·10⁷ — about 0.1 seconds"},"gainText":"3.2 times fewer operations (210 / 66)"}},"SieveOfEratosthenes":{"id":"SieveOfEratosthenes","problem":"Если проверять каждое число на простоту отдельно, одни и те же делители пробуются снова и снова.","problemExample":"Найти все простые до 19: 2, 3, 5, 7, 11, 13, 17, 19.","naive":{"how":"делить каждое число от 2 до 19 на 2, 3, … до первого делителя","cost":"73","unit":"делений","formula":"каждое n от 2 до 19 делим на 2…n−1 до первого делителя; сумма по 18 числам"},"method":{"cost":"12","unit":"вычёркиваний","formula":"кратные 2 от 4 до 18: 8 + кратные 3 от 9 до 18: 4"},"scale":{"n":"N = 2·10⁶ — все простые до двух миллионов (при ~10⁸ операций в секунду)","naive":"~1,4·10¹¹ проверок делением — ~25 минут","method":"N · ln ln N ≈ 5·10⁶ вычёркиваний — ~0,05 секунды","plot":{"n":6.30103,"naive":11.14613,"method":6.69897,"nc":"n2","mc":"n","est":"naive","nName":"до какого числа ищем"}},"keyIdea":"Число, не вычеркнутое как кратное меньшего простого, — простое; делить не нужно","how":["Выписать числа от 2 до 19","Взять первое невычеркнутое число p: сначала 2","Вычеркнуть кратные p, начиная с p²: 4, 6, …, 18","Остановиться, когда p² больше 19: 5·5 = 25"],"props":{"time":"O(N log log N)","space":"O(N)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["верхняя граница N известна заранее","N ячеек помещаются в память (до ~10⁸)"],"input":"граница N","output":"все простые до N","gives":"найдены все простые до N, ни одно не пропущено","timePlain":"вычёркиваний N/2 + N/3 + N/5 + … ≈ N · ln ln N — почти N","spacePlain":"по ячейке-отметке на каждое число до N"},"gainText":"в 6 раз меньше операций (73 / 12)","story":{"ru":{"trick":"вычёркиванием кратных","task":"Есть числа от 2 до 19. Нужно найти среди них все простые — те, что делятся только на 1 и на себя.","headOn":"В лоб: каждое число делим на 2, 3, 4… пока не найдём делитель. Простое приходится делить на все меньшие числа — всего выходит 73 деления.","notice":"Числа, кратные 2, — это 4, 6, 8…: их можно найти шагами по 2, без деления. Если так вычеркнуть кратные каждого простого, оставшиеся числа и будут простыми.","steps":["2 — простое. Шагаем по 2 от 4 до 18 и вычёркиваем 8 чисел: все они делятся на 2.","Следующее невычеркнутое — 3, оно простое. Его кратные начинаем с 9 = 3 × 3 (6 уже вычеркнуто) и вычёркиваем 9, 12, 15, 18 — ещё 4 раза.","Следующее простое — 5, но 5 × 5 = 25 больше 19, значит, все составные уже вычеркнуты. Остались 8 простых: 2, 3, 5, 7, 11, 13, 17, 19."],"gain":["12 вычёркиваний вместо 73 делений — работы в 6 раз меньше.","Чтобы найти все простые до двух миллионов, в лоб нужно около 1,4·10¹¹ делений — примерно 25 минут, а вычёркиванием — около 5 миллионов шагов, доли секунды."],"whenToUse":"Когда нужны сразу все простые числа до какого-то предела, а не проверка одного числа.","needs":["заранее известно, до какого числа искать","можно завести отметку для каждого числа до этого предела"],"guarantees":"Найдены все простые до предела, и ни одного составного не осталось.","work":"Каждое составное вычёркивается всего несколько раз, поэтому работы почти столько же, сколько чисел."},"en":{"trick":"crossing out multiples","task":"Take the numbers from 2 to 19. Find all the primes among them — the numbers that divide only by 1 and by themselves.","headOn":"Head-on: divide each number by 2, 3, 4… until something divides it. A prime has to be divided by every smaller number — 73 divisions in all.","notice":"The multiples of 2 are 4, 6, 8…: you can reach them by counting in 2s, with no dividing. Cross out the multiples of each prime this way, and whatever is left is prime.","steps":["2 is prime. Count by 2s from 4 to 18 and cross out 8 numbers: all of them divide by 2.","The next number not crossed out is 3, so it is prime. Start its multiples at 9 = 3 × 3 (6 is already gone) and cross out 9, 12, 15, 18 — 4 more.","The next prime is 5, but 5 × 5 = 25 is more than 19, so every non-prime is already crossed out. 8 primes are left: 2, 3, 5, 7, 11, 13, 17, 19."],"gain":["12 cross-outs instead of 73 divisions — 6 times less work.","To find every prime below two million, the head-on way needs about 1.4·10¹¹ divisions — around 25 minutes — while crossing out takes about 5 million steps, a fraction of a second."],"whenToUse":"When you need all the primes up to some limit at once, rather than a check of a single number.","needs":["you know in advance how far to search","you can keep a mark for every number up to that limit"],"guarantees":"Every prime up to the limit is found, and no non-prime is left.","work":"Each non-prime is crossed out only a few times, so the work is close to the count of numbers."}},"en":{"naive":{"how":"divide each number from 2 to 19 by 2, 3, … until something divides it","unit":"divisions","formula":"each n from 2 to 19 divided by 2…n−1 until the first divisor; over 18 numbers"},"method":{"unit":"cross-outs","formula":"multiples of 2 from 4 to 18: 8 + multiples of 3 from 9 to 18: 4"},"scale":{"n":"N = 2·10⁶ — all primes below two million (at ~10⁸ operations per second)","naive":"~1.4·10¹¹ divisions — about 25 minutes","method":"N · ln ln N ≈ 5·10⁶ cross-outs — about 0.05 seconds","plot":{"nName":"how far we search"}},"gainText":"6 times less work (73 / 12)"}},"LinearSieve":{"id":"LinearSieve","problem":"Если раскладывать много чисел пробным делением, одни и те же делители пробуются для каждого числа заново.","problemExample":"Записать наименьший простой делитель для чисел 2…20 и по нему разложить 20 = 2 · 2 · 5.","naive":{"how":"вычёркивать кратные каждого простого, записывая это простое в ячейку","cost":"18","unit":"записей в ячейки","formula":"кратные 2: 9, кратные 3: 5, кратные 5: 3, кратные 7: 1"},"method":{"cost":"11","unit":"записей в ячейки","formula":"по одной записи на каждое составное от 4 до 20 (простые записывают себя сами и не считаются)"},"scale":{"n":"N = 10⁷ — все числа до 10 миллионов (при ~10⁸ операций в секунду)","naive":"чуть больше N записей: N · ln ln N, где ln ln N ≈ 2,8 при N = 10⁷ — около 2,8·10⁷ записей, ~0,3 секунды","method":"10⁷ записей — ~0,1 секунды; разложение любого числа — до 23 делений","plot":{"n":7,"naive":7.44716,"method":7,"nc":"n","mc":"n"}},"keyIdea":"Каждое составное записывается один раз — своим наименьшим простым делителем","how":["Идти по числам i от 2 до 20","Пустая ячейка i означает, что i простое: записать в неё i","Для простых p, не больших наименьшего делителя i, записать p в ячейку i·p","Разложить 20 по ячейкам: 20 ÷ 2 → 10 ÷ 2 → 5 ÷ 5 → 1"],"props":{"time":"O(N)","space":"O(N)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["верхняя граница N известна заранее","N целых чисел помещаются в память (до ~10⁷)"],"input":"граница N","output":"наименьшие простые делители","gives":"разложение любого числа до N: каждое деление хотя бы вдвое уменьшает число, поэтому для N = 10⁷ (2²³ ≈ 8·10⁶) — до 23 делений; 20 — за 3","timePlain":"по одной записи на каждое число до N","spacePlain":"по целому числу (наименьший делитель) на каждую ячейку до N"},"gainText":"в 1,6 раза меньше записей (18 / 11); каждое составное записано ровно один раз","story":{"ru":{"trick":"одной записью на каждое число","task":"Для каждого числа от 2 до 20 нужно записать его наименьший простой делитель — самое маленькое простое число, на которое оно делится. По такой таблице потом легко разложить любое число.","headOn":"В лоб: для 2, 3, 5 и 7 проходим по их кратным и пишем делитель в ячейку. Выходит 18 записей, и 7 ячеек (6, 10, 12, 14, 15, 18, 20) переписываются дважды.","notice":"Каждое составное число — это меньшее число i, умноженное на простое p, которое не больше наименьшего делителя i. Например, 12 = 6 · 2, но не 4 · 3: у 4 делитель 2 меньше 3. Так каждое число получается ровно одним способом.","steps":["Идём по числам i от 2 до 10 и умножаем на подходящие простые: 2 · 2, 3 · 2, 3 · 3, 4 · 2… — 11 записей, по одной на каждое составное.","Пустыми остались 8 ячеек — это простые числа: у них наименьший делитель — они сами, в счёт они не входят.","Разложение читается по таблице: у 20 делитель 2, у 10 — 2, у 5 — 5. Значит, 20 = 2 · 2 · 5."],"gain":["11 записей вместо 18: ни одна ячейка не переписана.","Для чисел до 10 миллионов — 10 миллионов записей вместо 28 миллионов, а потом любое число раскладывается за 23 деления или меньше."],"whenToUse":"Когда нужно много раз раскладывать разные числа до одного известного предела.","needs":["предел известен заранее","хватает памяти на ячейку для каждого числа — примерно до 10 миллионов"],"guarantees":"В каждой ячейке — наименьший простой делитель, записанный ровно один раз.","work":"Одна запись на каждое число до предела."},"en":{"trick":"one write per number","task":"For every number from 2 to 20, write down its smallest prime divisor — the smallest prime it divides by. With such a table, any number is easy to break into factors later.","headOn":"Head-on: for 2, 3, 5 and 7, walk through their multiples and write the divisor into each cell. That is 18 writes, and 7 cells (6, 10, 12, 14, 15, 18, 20) get written twice.","notice":"Every composite number is a smaller number i times a prime p that is no bigger than the smallest divisor of i. For example 12 = 6 · 2, but not 4 · 3: 4 already has the smaller divisor 2. So each number is made in exactly one way.","steps":["Go through i from 2 to 10 and multiply by the allowed primes: 2 · 2, 3 · 2, 3 · 3, 4 · 2… — 11 writes, one for each composite number.","Eight cells are still empty — those are the primes: their smallest divisor is themselves, and they are not counted.","The table gives the factors directly: 20 has divisor 2, 10 has 2, 5 has 5. So 20 = 2 · 2 · 5."],"gain":["11 writes instead of 18: no cell is written twice.","For numbers up to 10 million: 10 million writes instead of 28 million, and afterwards any number splits into factors in 23 divisions or fewer."],"whenToUse":"When you need to break many different numbers into factors, all below one known limit.","needs":["the limit is known in advance","there is memory for one cell per number — up to about 10 million"],"guarantees":"Each cell holds the smallest prime divisor, written exactly once.","work":"One write per number up to the limit."}},"en":{"naive":{"how":"cross out the multiples of each prime, writing that prime into the cell","unit":"writes","formula":"multiples of 2: 9, of 3: 5, of 5: 3, of 7: 1"},"method":{"unit":"writes","formula":"one write per composite number from 4 to 20 (primes write themselves and are not counted)"},"scale":{"n":"all numbers up to 10⁷ (at ~10⁸ operations per second)","naive":"about 2.8·10⁷ writes — about 0.3 seconds","method":"10⁷ writes — about 0.1 seconds; any number then splits in 23 divisions or fewer"},"gainText":"1.6 times fewer writes (18 / 11); every composite is written exactly once"}},"WheelFactorization":{"id":"WheelFactorization","problem":"Пробное деление тратит время на кандидатов, которые заведомо делятся на 2, 3 или 5.","problemExample":"Среди чисел 1…30 оставить кандидатов в делители, не делящихся ни на 2, ни на 3, ни на 5.","naive":{"how":"проверять делением каждое число подряд","cost":"30","unit":"кандидатов в делители","formula":"все числа от 1 до 30"},"method":{"cost":"8","unit":"кандидатов в делители","formula":"30 − 15 чётных − 5 нечётных кратных 3 − 5 и 25; остаются 1, 7, 11, 13, 17, 19, 23, 29"},"scale":{"n":"делители числа 10¹² — кандидаты до √10¹² = 10⁶ (при ~10⁸ операций в секунду)","naive":"10⁶ кандидатов — ~10 миллисекунд","method":"8/30 · 10⁶ ≈ 2,7·10⁵ кандидатов — ~3 миллисекунды","plot":{"n":6,"naive":6,"method":5.43136,"nc":"n","mc":"n"}},"keyIdea":"После 2, 3 и 5 остаются 8 чисел из каждых 30 — остальные пропускаются","how":["Выбрать малые простые 2, 3, 5: узор подходящих кандидатов повторяется каждые 30 чисел","Оставить числа 1…30, не делящиеся на 2, 3, 5: 1, 7, 11, 13, 17, 19, 23, 29 — 8 чисел из каждых 30","Прибавлять к ним 30, 60, …: 31, 37, 41, … — снова 8 чисел из каждых 30","Проверять делением только эти числа; 2, 3, 5 проверить отдельно заранее"],"props":{"time":"O(√n)","space":"O(1)","timeRank":3,"spaceRank":1,"exact":"точный","needs":["набор малых простых: 2, 3 (колесо на 6) или 2, 3, 5 (колесо на 30)","используется вместе с пробным делением"],"input":"число или диапазон","output":"кандидаты в делители","gives":"ни один простой кандидат больше 5 не пропущен; проверяются 8 чисел из каждых 30","timePlain":"кандидатов 8/30 от √n — в 3,75 раза меньше, порядок √n тот же","spacePlain":"хранятся 8 остатков: 8 чисел из каждых 30"},"gainText":"в 3,75 раза меньше кандидатов (30 / 8)","story":{"ru":{"trick":"колесом","task":"Мы ищем делители большого числа и пробуем делить его на числа по очереди. Какие из чисел от 1 до 30 вообще стоит пробовать?","headOn":"В лоб: пробуем все 30. Но если число не делится на 2, оно не делится и на 4, 6, 8…; так 22 пробы из 30 уходят впустую — на числа, кратные 2, 3 или 5.","notice":"Разложим числа 1–30 по кругу на 6 лучей — по остатку от деления на 6. Всё, что делится на 2 или на 3, попадает на 4 луча. Кандидаты остаются только на двух: 1, 7, 13… и 5, 11, 17…","steps":["Убираем лучи с чётными числами — остаётся 15 кандидатов.","Убираем луч с числами, которые делятся на 3, — остаётся 10.","Из них убираем 5 и 25 — они делятся на 5. Остаётся 8 чисел: 1, 7, 11, 13, 17, 19, 23, 29, и дальше этот узор повторяется каждые 30 чисел."],"gain":["8 кандидатов вместо 30.","Для числа около триллиона — около 270 тысяч проб вместо миллиона."],"whenToUse":"Когда ищем делители большого числа пробами и не хотим тратить пробы на заведомо лишние числа.","needs":["применяется вместе с пробами делением","числа 2, 3 и 5 проверяются отдельно в самом начале"],"guarantees":"Ни один нужный делитель больше 5 не пропущен.","work":"Проб в 3,75 раза меньше: 8 из каждых 30 чисел."},"en":{"trick":"a wheel","task":"We are looking for divisors of a big number by trying numbers one after another. Which of the numbers from 1 to 30 are worth trying at all?","headOn":"Head-on: try all 30. But if the number does not divide by 2, it does not divide by 4, 6, 8… either, so 22 tries out of 30 are wasted on multiples of 2, 3 or 5.","notice":"Lay the numbers 1–30 around a circle on 6 spokes, by their remainder when divided by 6. Everything that divides by 2 or 3 lands on 4 of the spokes. Candidates remain on just two: 1, 7, 13… and 5, 11, 17…","steps":["Remove the spokes with even numbers: 15 candidates are left.","Remove the spoke with numbers that divide by 3: 10 are left.","Of those, remove 5 and 25 — they divide by 5. That leaves 8 numbers: 1, 7, 11, 13, 17, 19, 23, 29, and the pattern repeats every 30 numbers."],"gain":["8 candidates instead of 30.","For a number around a trillion: about 270 thousand tries instead of a million."],"whenToUse":"When you look for divisors of a big number by trying, and do not want to waste tries on numbers that cannot work.","needs":["used together with trial division","2, 3 and 5 are checked separately at the very start"],"guarantees":"No needed divisor above 5 is skipped.","work":"3.75 times fewer tries: 8 out of every 30 numbers."}},"en":{"naive":{"how":"try every number in a row","unit":"candidates","formula":"all numbers from 1 to 30"},"method":{"unit":"candidates","formula":"30 − 15 even − 5 odd multiples of 3 − 5 and 25; left: 1, 7, 11, 13, 17, 19, 23, 29"},"scale":{"n":"divisors of a number near 10¹² — candidates up to 10⁶ (at ~10⁸ operations per second)","naive":"10⁶ candidates — about 10 milliseconds","method":"8/30 · 10⁶ ≈ 2.7·10⁵ candidates — about 3 milliseconds"},"gainText":"3.75 times fewer candidates (30 / 8)"}},"NthPrimeBound":{"id":"NthPrimeBound","problem":"Для поиска n-го простого решетом нужен предел, а заранее он неизвестен.","problemExample":"6-е простое — 13: решето какой длины гарантированно его содержит?","naive":{"how":"строить решето, удваивая предел, пока не наберётся 6 простых","cost":"24","unit":"чисел в решётах","formula":"решето до 8 + решето до 16"},"method":{"cost":"15","unit":"чисел в решете","formula":"6 · (1,79 + 0,58) = 14,25, округлено вверх до 15"},"scale":{"n":"10 000-е простое (104 729) (при ~10⁸ операций в секунду)","naive":"удвоения 8, 16, …, 131 072: всего 262 136 ячеек — ~3 миллисекунды","method":"одно решето до 114 307 — в 2,3 раза меньше ячеек","plot":{"n":4,"naive":5.41853,"method":5.05807,"nc":"nlogn","mc":"nlogn"}},"keyIdea":"Доказанный потолок n(ln n + ln ln n) задаёт длину решета до поиска","how":["Проверить, что n ≥ 6 — иначе формула может занизить: n = 6","Посчитать 6 · (ln 6 + ln ln 6) = 14,25","Округлить вверх: 15","Построить решето до 15 и взять 6-е простое: 13"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"оценка-граница","needs":["n ≥ 6: для меньших n формула может дать потолок ниже ответа","потолок округляется вверх до целого"],"input":"номер простого n","output":"верхняя граница p_n — n-го простого числа","gives":"n-е простое гарантированно не больше потолка: 13 ≤ 15","timePlain":"потолок считается за 4 действия при любом n","spacePlain":"хранится одно число — потолок"},"gainText":"в 1,6 раза меньше ячеек (24 / 15) и одна постройка решета вместо двух","story":{"ru":{"trick":"заранее известной границей","task":"Нужно найти 6-е по счёту простое число с помощью решета — ряда чисел, из которого вычёркивают составные. Длину ряда нужно выбрать заранее.","headOn":"В лоб: берём ряд до 8 — там только 4 простых, мало. Удваиваем до 16 — теперь 6-е простое, 13, нашлось. Всего пройдено 8 + 16 = 24 числа.","notice":"Простые встречаются всё реже, и насколько — известно заранее: доказано, что n-е простое не больше n · (ln n + ln ln n), где ln — натуральный логарифм. Около 6 простые идут примерно через ln 6 ≈ 1,79 числа.","steps":["Шесть шагов по 1,79 дают 10,75 — это меньше 13: одной средней длины шага не хватает, дальше шаги длиннее.","Добавка ln ln 6 ≈ 0,58 учитывает, что шаги растут: 6 · (1,79 + 0,58) = 14,25, округляем вверх до 15.","Строим одно решето до 15 — 6-е простое 13 в него попало."],"gain":["15 чисел вместо 24 и одно решето вместо двух.","Для 10 000-го простого — одно решето до 114 307 вместо удвоений до 131 072: чисел в 2,3 раза меньше."],"whenToUse":"Когда нужно n-е по счёту простое число и решето хочется построить один раз нужной длины.","needs":["n не меньше 6: для меньших n граница не доказана"],"guarantees":"n-е простое точно попадает в ряд — граница доказана.","work":"Одно решето длиной чуть больше n · ln n."},"en":{"trick":"a bound known in advance","task":"Find the 6th prime number with a sieve — a row of numbers from which the composite ones are crossed out. The length of the row has to be chosen in advance.","headOn":"Head-on: take a row up to 8 — only 4 primes there, not enough. Double it to 16 — now the 6th prime, 13, turns up. That is 8 + 16 = 24 numbers gone through.","notice":"Primes get rarer, and by how much is known in advance: it is proved that the n-th prime is at most n · (ln n + ln ln n), where ln is the natural logarithm. Around 6, primes come about every ln 6 ≈ 1.79 numbers.","steps":["Six steps of 1.79 reach 10.75 — less than 13: one average step length is not enough, the steps get longer further on.","The extra ln ln 6 ≈ 0.58 allows for the growing steps: 6 · (1.79 + 0.58) = 14.25, rounded up to 15.","Build a single sieve up to 15 — the 6th prime, 13, is inside it."],"gain":["15 numbers instead of 24, and one sieve instead of two.","For the 10,000th prime: one sieve up to 114,307 instead of doubling up to 131,072 — 2.3 times fewer numbers."],"whenToUse":"When you need the n-th prime and want to build the sieve once, at the right length.","needs":["n is at least 6: for smaller n the bound is not proved"],"guarantees":"The n-th prime is certain to be in the row — the bound is proved.","work":"One sieve a little longer than n · ln n."}},"en":{"naive":{"how":"guess a sieve length and double it until the n-th prime appears","unit":"numbers sieved","formula":"sieve up to 8 + sieve up to 16"},"method":{"unit":"numbers sieved","formula":"6 · (1.79 + 0.58) = 14.25, rounded up to 15"},"scale":{"n":"the 10,000th prime (104,729) (at ~10⁸ operations per second)","naive":"doublings 8, 16, …, 131,072: 262,136 numbers in all — about 3 milliseconds","method":"one sieve up to 114,307 — 2.3 times fewer numbers"},"gainText":"1.6 times fewer numbers (24 / 15) and one sieve instead of two","props":{"exact":"an upper bound"}}},"DigitalInvariantBound":{"id":"DigitalInvariantBound","problem":"Поиск чисел, равных сумме степеней своих цифр, без границы не заканчивается.","problemExample":"370 = 3³ + 7³ + 0³: до какого числа искать такие числа для кубов цифр?","naive":{"how":"проверять числа 1, 2, 3, … без предела","cost":"∞","unit":"проверенных чисел","formula":"граница не задана — перебор не кончается"},"method":{"cost":"10000","unit":"проверенных чисел","formula":"числа 0…9999: у пяти цифр сумма кубов не больше 5 · 729 = 3645 < 10 000"},"scale":{"n":"шестые степени цифр (p = 6), ~10⁸ простых операций в секунду","naive":"бесконечный перебор","method":"больше 7 цифр не бывает (8·9⁶ < 10⁷), граница 7·9⁶ = 3 720 087 чисел × ~7 цифр ≈ 2,6·10⁷ операций — ~0,3 секунды","plot":{"n":0.77815,"naive":"inf","method":7.41497,"nc":"n","mc":"2n","est":"method"}},"keyIdea":"Сумма степеней цифр растёт на 9³ за цифру, само число — в 10 раз","how":["Посчитать потолок суммы для k цифр: k · 9³ (729, 1458, …)","Сравнить потолок с наименьшим k-значным числом 10ᵏ⁻¹","Найти первое k, где потолок меньше: 5 · 729 = 3645 < 10 000","Проверять только числа меньше 10 000"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["p — степень (на сцене кубы, p = 3); вклад одной цифры не больше 9ᵖ","k — число цифр; степень p фиксирована заранее"],"input":"степень p","output":"граница поиска","gives":"за найденной границей решений нет: для кубов все решения меньше 10 000","timePlain":"граница находится за несколько сравнений k · 9ᵖ с 10ᵏ⁻¹ (k — число цифр, p — степень)","spacePlain":"хранятся k и потолок"},"gainText":"перебор становится конечным: 10 000 чисел вместо бесконечного поиска","story":{"ru":{"trick":"границей по числу цифр","task":"370 = 3³ + 7³ + 0³ = 27 + 343 + 0: число равно сумме кубов своих цифр. Нужно найти все такие числа — но до какого числа искать?","headOn":"В лоб: проверяем числа 1, 2, 3, … подряд. Где остановиться, непонятно — перебор никогда не кончается.","notice":"Самый большой куб одной цифры — 9³ = 729. Поэтому у числа из k цифр сумма кубов не больше k × 729: с каждой новой цифрой она растёт всего на 729, а само число — в 10 раз.","steps":["Потолок суммы кубов: у 1 цифры — 729, у 2 — 1458, у 3 — 2187, у 4 — 2916, у 5 — 3645.","Самое маленькое число из k цифр: 1, 10, 100, 1000, 10 000.","У пяти цифр самое маленькое число 10 000 уже больше потолка 3645 — такие числа не подходят. Искать нужно только среди чисел меньше 10 000."],"gain":["10 000 проверок вместо перебора без конца.","Для шестых степеней цифр то же рассуждение даёт границу 7 × 9⁶ = 3 720 087 — около 0,3 секунды работы."],"whenToUse":"Когда ищем числа, равные сумме степеней своих цифр, и нужно понять, где остановить поиск.","needs":["степень известна заранее — здесь кубы","вклад одной цифры ограничен: самое большое — 9 в этой степени"],"guarantees":"За найденной границей таких чисел точно нет — ничего не пропустим.","work":"Граница находится за несколько сравнений; потом проверяем каждое число ниже неё."},"en":{"trick":"a bound on the number of digits","task":"370 = 3³ + 7³ + 0³ = 27 + 343 + 0: the number equals the sum of the cubes of its digits. We want all such numbers — but how far do we have to search?","headOn":"Head-on: check 1, 2, 3, … one after another. There is no obvious place to stop, so the search never ends.","notice":"The biggest cube of a single digit is 9³ = 729. So for a number with k digits the sum of cubes is at most k × 729: each extra digit adds only 729 to it, while the number itself grows tenfold.","steps":["Ceiling of the sum of cubes: 1 digit — 729, 2 digits — 1458, 3 — 2187, 4 — 2916, 5 — 3645.","The smallest number with k digits: 1, 10, 100, 1000, 10,000.","With five digits even the smallest number, 10,000, is already above the ceiling of 3645 — none of them can work. We only need to search below 10,000."],"gain":["10,000 checks instead of a search that never ends.","For sixth powers of digits the same argument gives the bound 7 × 9⁶ = 3,720,087 — about 0.3 seconds of work."],"whenToUse":"When you look for numbers equal to the sum of powers of their digits and need to know where to stop.","needs":["the power is fixed in advance — here, cubes","one digit adds a limited amount: at most 9 to that power"],"guarantees":"Above the bound there are definitely no such numbers — nothing is missed.","work":"A few comparisons find the bound; then each number below it is checked."}},"en":{"naive":{"how":"check the numbers 1, 2, 3, … with no limit","unit":"checked numbers","formula":"no bound — the search never ends"},"method":{"unit":"checked numbers","formula":"the numbers 0…9999: five digits give at most 5 · 729 = 3645 < 10,000"},"scale":{"n":"sixth powers of digits, ~10⁸ simple operations per second","naive":"a search that never ends","method":"no more than 7 digits (8·9⁶ < 10⁷), bound 7·9⁶ = 3,720,087 numbers × ~7 digits ≈ 2.6·10⁷ operations — about 0.3 seconds"},"gainText":"the search becomes finite: 10,000 numbers instead of an endless search"}},"PrimeNumberTheorem":{"id":"PrimeNumberTheorem","problem":"Чтобы узнать, сколько простых до x, их приходится находить все.","problemExample":"Сколько простых до 100? Точно — 25; оценка x / ln x даёт 21,7 (ln — натуральный логарифм).","naive":{"how":"построить решето до 100 и пересчитать простые","cost":"203","unit":"действий решета","formula":"104 вычёркивания (кратные 2: 49, 3: 31, 5: 16, 7: 8) + 99 просмотров чисел 2…100"},"method":{"cost":"2","unit":"арифметических действия","formula":"ln 100 ≈ 4,61, затем 100 ÷ 4,61 ≈ 21,7"},"scale":{"n":"x = 10⁶ (при ~10⁸ операций в секунду)","naive":"решето: ~2,1·10⁶ вычёркиваний + 10⁶ просмотров — ~0,03 секунды, точно 78 498","method":"2 действия — мгновенно: оценка 72 382, ошибка 8%","plot":{"n":6,"naive":6.49136,"method":0.30103,"nc":"n","mc":"1"}},"keyIdea":"Около x простые встречаются примерно раз в ln x чисел","how":["Взять границу x = 100","Посчитать ln 100 ≈ 4,61","Разделить: 100 / 4,61 ≈ 21,7","Учесть, что оценка занижена: точный ответ 25"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"приближённый","needs":["достаточно приближённого ответа: ошибка от точного счёта 13% при x = 100, 8% при x = 10⁶","x от 100: при x = 30 точно 10 простых, а оценка 30 ÷ ln 30 ≈ 8,8 — недобор 12%"],"input":"граница x","output":"примерное число простых","gives":"относительная ошибка (от точного счёта) убывает с ростом x: 13% при 100, 8% при 10⁶","timePlain":"2 действия при любом x","spacePlain":"хранится одно число"},"gainText":"в ~100 раз меньше операций (203 / 2); цена — оценка 21,7 вместо точных 25 (недобор 13% от точного счёта)","story":{"ru":{"trick":"формулой x ÷ ln x","task":"Нужно узнать, сколько простых чисел среди чисел от 1 до 100. Точный ответ не обязателен — хватит примерного.","headOn":"В лоб: строим решето до 100 — вычёркиваем кратные 2, 3, 5 и 7 (104 вычёркивания) и пересчитываем 99 чисел. Это 203 действия и точный ответ 25.","notice":"Около числа x простые идут в среднем через ln x чисел (ln — натуральный логарифм). До 100 это примерно через каждые 4,61 — значит, простых около 100 ÷ 4,61.","steps":["Два действия: ln 100 ≈ 4,61, затем 100 ÷ 4,61 ≈ 21,7. Точный ответ 25 — оценка меньше на 13%.","Для 10 000 и для миллиона те же два действия дают 1086 и 72 382, а точные ответы — 1229 и 78 498. Ошибка падает: 13%, 12%, 8%."],"gain":["2 действия вместо 203 — ценой ответа 21,7 вместо точных 25.","Для миллиона — 2 действия вместо 3 миллионов, и ошибка всего 8%."],"whenToUse":"Когда нужно быстро прикинуть, сколько простых чисел до x, и ошибка в несколько процентов не страшна.","needs":["примерного ответа достаточно","x не слишком мал — от 100 и больше"],"guarantees":"Оценка чуть меньше точного числа, и ошибка уменьшается с ростом x.","work":"Два действия при любом x."},"en":{"trick":"the formula x ÷ ln x","task":"How many prime numbers are there among the numbers from 1 to 100? An exact answer is not needed — a rough one will do.","headOn":"Head-on: build a sieve up to 100 — cross out the multiples of 2, 3, 5 and 7 (104 cross-outs), then count through 99 numbers. That is 203 operations and the exact answer, 25.","notice":"Around a number x, primes come on average every ln x numbers (ln is the natural logarithm). Up to 100 that is about every 4.61 — so there are about 100 ÷ 4.61 primes.","steps":["Two operations: ln 100 ≈ 4.61, then 100 ÷ 4.61 ≈ 21.7. The exact answer is 25 — the estimate is 13% short.","For 10,000 and for a million the same two operations give 1,086 and 72,382, while the exact answers are 1,229 and 78,498. The error shrinks: 13%, 12%, 8%."],"gain":["2 operations instead of 203 — at the price of 21.7 instead of the exact 25.","For a million: 2 operations instead of 3 million, and the error is only 8%."],"whenToUse":"When you want a quick idea of how many primes there are up to x, and an error of a few percent is fine.","needs":["a rough answer is enough","x is not too small — 100 or more"],"guarantees":"The estimate is a little below the exact count, and the error shrinks as x grows.","work":"Two operations for any x."}},"en":{"naive":{"how":"build a sieve up to 100 and count the primes","unit":"operations","formula":"104 cross-outs (multiples of 2: 49, 3: 31, 5: 16, 7: 8) + 99 looks at the numbers 2…100"},"method":{"unit":"operations","formula":"ln 100 ≈ 4.61, then 100 ÷ 4.61 ≈ 21.7"},"scale":{"n":"x = 10⁶ (at ~10⁸ operations per second)","naive":"sieve: ~2.1·10⁶ cross-outs + 10⁶ looks — about 0.03 seconds, exactly 78,498","method":"2 operations — instant: estimate 72,382, 8% short"},"gainText":"about 100 times fewer operations (203 / 2); the price: 21.7 instead of the exact 25 (13% short)","props":{"exact":"approximate"}}},"PrefixSum":{"id":"PrefixSum","problem":"Если сумму каждого отрезка считать заново, на отрезок из L чисел уходит L − 1 сложений на каждый запрос.","problemExample":"Ряд 3, 1, 4, 5, 9, 2, 6, 8: сумма позиций с 3-й по 6-ю равна 4 + 5 + 9 + 2 = 20.","naive":{"how":"сложить элементы отрезка с 3-го по 6-й","cost":"3","unit":"сложений на вопрос","formula":"4 числа участка → 3 сложения"},"method":{"cost":"8","unit":"действий вместе с подготовкой","formula":"7 сложений для сумм от начала (один раз) + 1 вычитание"},"scale":{"n":"ряд из 10⁶ чисел, 10⁵ вопросов (при ~10⁸ действий в секунду)","naive":"до 10⁶ сложений × 10⁵ = 10¹¹ — около 17 минут","method":"10⁶ сложений один раз + 10⁵ вычитаний — около сотой доли секунды","plot":{"n":5,"naive":11,"method":6.04139,"nc":"n","mc":"n","nName":"сколько вопросов"}},"keyIdea":"Сумма отрезка — разность двух накопленных сумм; элементы отрезка складывать не нужно","how":["Посчитать накопленные суммы P: 3, 4, 8, 13, 22, 24, 30, 38 (P[i] — сумма первых i чисел)","Взять накопленную сумму до правого конца: P[6] = 24","Взять накопленную сумму до позиции перед левым концом: P[2] = 4","Вычесть: 24 − 4 = 20"],"props":{"time":"O(1)","space":"O(n)","timeRank":1,"spaceRank":4,"exact":"точный","needs":["ряд не меняется между запросами","у операции есть обратная: у сложения — вычитание"],"input":"массив и границы отрезка","output":"сумма отрезка","gives":"сумма любого отрезка за 1 вычитание","timePlain":"1 вычитание на запрос после n − 1 сложений подготовки","spacePlain":"по накопленной сумме на каждый из n элементов"},"gainText":"на 1 вопросе дороже (8 против 3); с 4-го выгоднее: 11 против 12","story":{"ru":{"trick":"через суммы от начала","task":"Дан ряд чисел 3, 1, 4, 5, 9, 2, 6, 8. Нас будут много раз спрашивать сумму чисел на участке ряда — например, с 3-го по 6-е место.","headOn":"В лоб: складываем числа участка 4 + 5 + 9 + 2 = 20 — 3 сложения, и на каждый новый вопрос всё заново.","notice":"Сумма с 3-го по 6-е место — это сумма первых шести чисел минус сумма первых двух. Если заранее знать суммы от начала ряда до каждого места, хватит одного вычитания.","steps":["Один раз записываем суммы от начала до каждого места: 3, 4, 8, 13, 22, 24, 30, 38 — 7 сложений.","Вопрос «места 3–6»: сумма до 6-го места 24 минус сумма до 2-го места 4 — 24 − 4 = 20, одно вычитание.","На четырёх вопросах: 7 сложений + 4 вычитания = 11 действий против 4 × 3 = 12 — подготовка окупилась."],"gain":["С четвёртого вопроса выгоднее, а дальше каждый вопрос — одно вычитание вместо сложения всего участка.","Ряд из миллиона чисел и 100 тысяч вопросов: около миллиона сложений один раз вместо сотни миллиардов."],"whenToUse":"Когда про один и тот же ряд много раз спрашивают сумму участка.","needs":["ряд не меняется между вопросами","сложение можно «отменить» вычитанием"],"guarantees":"Сумма любого участка — за одно вычитание.","work":"Одна подготовка (сложение на каждое место ряда) плюс одно вычитание на вопрос."},"en":{"trick":"with running totals","task":"We have the numbers 3, 1, 4, 5, 9, 2, 6, 8 in a row. We will be asked many times for the sum of a stretch of the row — for example, from the 3rd to the 6th place.","headOn":"Head-on: add up the stretch 4 + 5 + 9 + 2 = 20 — 3 additions, and for every new question all over again.","notice":"The sum from the 3rd to the 6th place is the sum of the first six numbers minus the sum of the first two. If we know in advance the total from the start up to every place, one subtraction is enough.","steps":["Once, write down the running total up to each place: 3, 4, 8, 13, 22, 24, 30, 38 — 7 additions.","Question “places 3–6”: the total up to place 6, 24, minus the total up to place 2, 4 — 24 − 4 = 20, one subtraction.","Over four questions: 7 additions + 4 subtractions = 11 steps against 4 × 3 = 12 — the preparation has paid off."],"gain":["From the fourth question on it is cheaper, and after that each question is one subtraction instead of adding up the whole stretch.","A row of a million numbers and 100 thousand questions: about a million additions once instead of a hundred billion."],"whenToUse":"When the same row is asked again and again for the sum of a stretch.","needs":["the row does not change between questions","an addition can be “undone” by a subtraction"],"guarantees":"The sum of any stretch in a single subtraction.","work":"One preparation (an addition per place in the row) plus one subtraction per question."}},"en":{"naive":{"how":"add up the numbers of the stretch","unit":"additions per question","formula":"4 numbers in the stretch → 3 additions"},"method":{"unit":"steps including the preparation","formula":"7 additions for the running totals (once) + 1 subtraction"},"scale":{"n":"a row of 10⁶ numbers, 10⁵ questions (at ~10⁸ operations per second)","naive":"up to 10⁶ additions × 10⁵ = 10¹¹ — about 17 minutes","method":"10⁶ additions once + 10⁵ subtractions — about a hundredth of a second","plot":{"nName":"how many questions"}},"gainText":"costlier on 1 question (8 vs 3); better from the 4th: 11 vs 12"}},"DivisorCountFormula":{"id":"DivisorCountFormula","problem":"Если считать делители перебором, проверяются все числа от 1 до n.","problemExample":"Сколько делителей у 36? Их 9: 1, 2, 3, 4, 6, 9, 12, 18, 36.","naive":{"how":"проверить, делит ли каждое число от 1 до 36 число 36","cost":"36","unit":"проверок делением","formula":"каждое число от 1 до 36"},"method":{"cost":"8","unit":"действий","formula":"5 делений на разложение, 2 сложения (2 + 1 и 2 + 1), 1 умножение 3 × 3; делителей получается 9"},"scale":{"n":"одно число около 10⁸ (при ~10⁸ операций в секунду)","naive":"10⁸ проверок делением — ~1 секунда","method":"~10⁴ проверок (до √n) — ~0,1 миллисекунды","plot":{"n":8,"naive":8,"method":4,"nc":"n","mc":"sqrt"}},"keyIdea":"Число делителей зависит только от показателей степеней простых множителей: 36 = 2²·3² → показатели 2 и 2","how":["Разложить на простые множители: 36 = 2² · 3²","Прибавить 1 к каждому показателю: 2 + 1 = 3, 2 + 1 = 3","Перемножить результаты: 3 × 3 = 9 делителей"],"props":{"time":"O(√n)","space":"O(1)","timeRank":3,"spaceRank":1,"exact":"точный","needs":["число разложено на простые множители или раскладывается за √n проверок","разложение единственно — это верно для любого целого числа больше 1"],"input":"разложение числа","output":"число делителей","gives":"точное число делителей без их перечисления","timePlain":"до √n проверок на разложение + по действию на каждый простой множитель","spacePlain":"хранятся показатели степеней: у 36 их 2"},"gainText":"в 4,5 раза меньше операций (36 / 8)","story":{"ru":{"trick":"по степеням множителей","task":"Нужно узнать, сколько делителей у числа 36 — чисел, на которые оно делится без остатка.","headOn":"В лоб: проверяем делением все числа от 1 до 36 — это 36 проверок, из них 27 впустую.","notice":"36 = 2 · 2 · 3 · 3. Любой делитель 36 — это двойка, взятая 0, 1 или 2 раза, умноженная на тройку, взятую 0, 1 или 2 раза. Значит, делителей 3 × 3.","steps":["Раскладываем: 36 на 2 — 18, 18 на 2 — 9, 9 на 2 не делится, 9 на 3 — 3, 3 на 3 — 1. Это 5 делений: 36 = 2² · 3².","Двойку можно взять 0, 1 или 2 раза — 3 варианта; тройку тоже — 3 варианта. Это 2 сложения: 2 + 1 и 2 + 1.","Умножаем: 3 × 3 = 9 делителей — сетка 3 на 3 показывает их все. Всего 8 действий."],"gain":["8 действий вместо 36 проверок.","Для числа около 100 миллионов — около 10 тысяч проб на разложение вместо 100 миллионов проверок."],"whenToUse":"Когда нужно узнать, сколько делителей у числа, а сами делители не нужны.","needs":["число можно разложить на простые множители"],"guarantees":"Ответ точный.","work":"Почти вся работа — разложение: не больше проб, чем чисел d, у которых d · d не больше самого числа."},"en":{"trick":"counting through the prime powers","task":"How many divisors does 36 have — how many numbers does it divide by evenly?","headOn":"Head-on: check every number from 1 to 36 by dividing — 36 checks, 27 of them wasted.","notice":"36 = 2 · 2 · 3 · 3. Every divisor of 36 is 2 taken 0, 1 or 2 times, multiplied by 3 taken 0, 1 or 2 times. So there are 3 × 3 divisors.","steps":["Split it: 36 by 2 is 18, 18 by 2 is 9, 9 does not divide by 2, 9 by 3 is 3, 3 by 3 is 1. That is 5 divisions: 36 = 2² · 3².","The 2 can be taken 0, 1 or 2 times — 3 choices; the same for the 3 — 3 choices. That is 2 additions: 2 + 1 and 2 + 1.","Multiply: 3 × 3 = 9 divisors, and the 3-by-3 grid shows them all. 8 operations in all."],"gain":["8 operations instead of 36 checks.","For a number around 100 million: about 10 thousand tries to split it instead of 100 million checks."],"whenToUse":"When you need to know how many divisors a number has, but not the divisors themselves.","needs":["the number can be split into prime factors"],"guarantees":"The answer is exact.","work":"Almost all the work is the splitting: no more tries than numbers d with d · d up to the number."}},"en":{"naive":{"how":"check whether each number from 1 to 36 divides 36","unit":"checks","formula":"every number from 1 to 36"},"method":{"unit":"operations","formula":"5 divisions to split it, 2 additions (2 + 1 and 2 + 1), 1 multiplication 3 × 3; the result is 9 divisors"},"scale":{"n":"one number around 10⁸ (at ~10⁸ operations per second)","naive":"10⁸ checks — about 1 second","method":"~10⁴ tries to split it — about 0.1 milliseconds"},"gainText":"4.5 times fewer operations (36 / 8)"}},"MultiplicativeFunction":{"id":"MultiplicativeFunction","problem":"Для большого числа считать функцию целиком долго, а по частям неясно, как собрать ответ.","problemExample":"Число делителей 20 (обозначается τ(20)) через части 4 и 5: τ(4) = 3, τ(5) = 2, τ(20) = 3 · 2 = 6.","naive":{"how":"проверить, делит ли каждое число от 1 до 20 число 20","cost":"20","unit":"проверок делением","formula":"каждое число от 1 до 20"},"method":{"cost":"10","unit":"действий","formula":"4 проверки для 4 + 5 проверок для 5 + 1 умножение 3 × 2"},"scale":{"n":"треугольные числа n(n+1)/2 = 1 + 2 + … + n порядка 10⁸ (при ~10⁸ операций в секунду)","naive":"~10⁸ проверок на одно число — ~1 секунда","method":"для чётного n части n/2 и n + 1 не имеют общих простых (для нечётного — n и (n + 1)/2): τ(n/2) · τ(n + 1), каждая часть проверяется до √ ~10⁴ — ~2·10⁴ проверок, ~0,2 миллисекунды","plot":{"n":8,"naive":8,"method":4.30103,"nc":"n","mc":"sqrt"}},"keyIdea":"Для взаимно простых частей ответ равен произведению ответов частей","how":["Разбить 20 на взаимно простые части: 4 и 5","Проверить, что общих простых нет: 4 = 2², 5 = 5","Посчитать функцию для каждой части: τ(4) = 3, τ(5) = 2","Перемножить: 3 × 2 = 6"],"props":{"time":"O(√n)","space":"O(1)","timeRank":3,"spaceRank":1,"exact":"точный","needs":["НОД частей (наибольший общий делитель) равен 1: у 4 и 5 общих простых нет","функция мультипликативна — так ведут себя τ (число делителей), σ (сумма делителей) и φ (сколько чисел до n без общих делителей с n)"],"input":"взаимно простые части","output":"значение функции для целого","gives":"f(m·n) = f(m)·f(n) при НОД(m, n) = 1: τ(20) = 6","timePlain":"сумма работ по частям; каждая часть меньше целого","spacePlain":"хранятся ответы для частей"},"gainText":"в 2 раза меньше операций (20 / 10); для больших чисел разрыв растёт","story":{"ru":{"trick":"по частям без общих множителей","task":"Нужно узнать, сколько делителей у 20, если известно, что 20 = 4 × 5.","headOn":"В лоб: проверяем делением все числа от 1 до 20 — это 20 проверок.","notice":"У 4 и у 5 нет общих простых множителей: 4 = 2 · 2, а 5 — простое. Тогда каждый делитель 20 — это делитель 4, умноженный на делитель 5, и ответы для частей можно просто перемножить.","steps":["Делители 4: проверяем 1, 2, 3, 4 — подходят 3 числа (1, 2, 4). Это 4 проверки.","Делители 5: проверяем 1, 2, 3, 4, 5 — подходят 2 (1 и 5). Всего уже 9 проверок.","Перемножаем: 3 × 2 = 6 делителей у 20 — это 1, 2, 4, 5, 10, 20. Вместе с умножением вышло 10 действий."],"gain":["10 действий вместо 20 проверок.","Для чисел около 100 миллионов, которые распадаются на две части без общих множителей, — около 20 тысяч проверок вместо 100 миллионов."],"whenToUse":"Когда число удобно разбить на части без общих простых множителей, а для частей ответ найти легче.","needs":["у частей нет общих простых множителей","считаемая величина так себя ведёт — например, число делителей или их сумма"],"guarantees":"Ответ точный.","work":"Работа по частям складывается, а каждая часть меньше целого."},"en":{"trick":"splitting into parts with no common factors","task":"How many divisors does 20 have, if we know that 20 = 4 × 5?","headOn":"Head-on: check every number from 1 to 20 by dividing — 20 checks.","notice":"4 and 5 share no prime factors: 4 = 2 · 2, and 5 is prime. Then every divisor of 20 is a divisor of 4 times a divisor of 5, and the answers for the parts can simply be multiplied.","steps":["Divisors of 4: check 1, 2, 3, 4 — 3 of them fit (1, 2, 4). That is 4 checks.","Divisors of 5: check 1, 2, 3, 4, 5 — 2 fit (1 and 5). 9 checks so far.","Multiply: 3 × 2 = 6 divisors of 20 — they are 1, 2, 4, 5, 10, 20. With the multiplication that makes 10 operations."],"gain":["10 operations instead of 20 checks.","For numbers around 100 million that split into two parts with no common factors: about 20 thousand checks instead of 100 million."],"whenToUse":"When a number splits neatly into parts with no common prime factors, and the answer for each part is easier to find.","needs":["the parts share no prime factors","the quantity behaves this way — for example, the number of divisors or their sum"],"guarantees":"The answer is exact.","work":"The work for the parts adds up, and each part is smaller than the whole."}},"en":{"naive":{"how":"check whether each number from 1 to 20 divides 20","unit":"checks","formula":"every number from 1 to 20"},"method":{"unit":"operations","formula":"4 checks for 4 + 5 checks for 5 + 1 multiplication 3 × 2"},"scale":{"n":"numbers 1 + 2 + … + n around 10⁸ (at ~10⁸ operations per second)","naive":"~10⁸ checks per number — about 1 second","method":"two parts with no common factors, each checked up to its square root: ~2·10⁴ checks — about 0.2 milliseconds"},"gainText":"2 times fewer operations (20 / 10); the gap grows for bigger numbers"}},"PositionalNotation":{"id":"PositionalNotation","problem":"Число, записанное палочками, занимает столько символов, сколько в нём единиц.","problemExample":"29 фишек записать цифрами: 29 в десятичной, 11101 в двоичной, 1021 в факториальной (смешанной) системе.","naive":{"how":"записать число палочками, по одной на каждую единицу","cost":"29","unit":"знаков записи","formula":"29 фишек — 29 палочек"},"method":{"cost":"5","unit":"знаков записи","formula":"группы 16 + 8 + 4 + 1 → запись 11101 (обычными цифрами — 29, два знака)"},"scale":{"n":"число 10¹²","naive":"10¹² палочек","method":"40 двоичных цифр или 13 десятичных","plot":{"n":12,"naive":12,"method":1.11394,"nc":"n","mc":"log","y":"знаков в записи","budget":null}},"keyIdea":"Каждая позиция весит в основание раз больше соседней справа","how":["Выбрать основание: 2 — веса мест 16, 8, 4, 2, 1.","Отложить самую большую группу, что помещается: 16 из 29, остаётся 13.","Дальше так же: 8 (остаётся 5), 4 (остаётся 1), 2 не помещается, 1.","Записать 1 за каждую взятую группу и 0 за пропущенную: 11101."],"props":{"time":"O(log n)","space":"O(log n)","timeRank":2,"spaceRank":2,"exact":"точный","needs":["основание названо заранее: 2, 10 или смешанное","каждая цифра меньше основания своей позиции"],"input":"число и основание","output":"последовательность цифр","gives":"у каждого числа ровно одна запись в выбранном основании","timePlain":"цифр столько, сколько раз n делится на основание до нуля (n — само число, здесь 29)","spacePlain":"по ячейке на цифру: 5 для числа 29 в двоичной записи"},"gainText":"29 палочек → 5 двоичных цифр → 2 десятичные","story":{"ru":{"trick":"записью цифрами по местам","task":"Есть 29 фишек. Нужно записать это количество как можно короче.","headOn":"В лоб: рисуем по палочке на каждую фишку — 29 палочек. Чем больше фишек, тем длиннее запись.","notice":"Фишки можно собирать в группы: 10 фишек заменить одним знаком на месте левее. Каждое место левее весит в 10 раз больше — так устроены обычные цифры.","steps":["Группами по 10: две полные десятки и ещё 9 фишек — пишем 29, всего 2 знака.","Группами по 16, 8, 4, 2, 1 (каждая вдвое меньше): 29 = 16 + 8 + 4 + 1, группы 2 нет — пишем 11101, 5 знаков.","Веса мест могут расти и по-разному, например 24, 6, 2, 1: 29 = 1 · 24 + 0 · 6 + 2 · 2 + 1 · 1 — запись 1021."],"gain":["5 знаков (или всего 2 обычные цифры) вместо 29 палочек.","Триллион палочками — это триллион палочек, а цифрами — 13 знаков (или 40, если группы по 2)."],"whenToUse":"Когда количество нужно записать коротко или разложить на группы заданного размера.","needs":["заранее выбрано, во сколько раз соседнее место весит больше: 10, 2 или свои веса","в каждом месте цифра меньше этого числа"],"guarantees":"У каждого числа ровно одна такая запись.","work":"Знаков столько, сколько раз число можно разделить на 10 (или на 2), пока не останется 0."},"en":{"trick":"writing digits by place","task":"There are 29 counters. Write down how many there are as briefly as possible.","headOn":"Head-on: draw one stick for each counter — 29 sticks. The more counters, the longer the record.","notice":"Counters can be grouped: 10 counters are replaced by one sign in the place to the left. Each place to the left is worth 10 times more — that is how ordinary digits work.","steps":["In groups of 10: two full tens and 9 more counters — we write 29, just 2 signs.","In groups of 16, 8, 4, 2, 1 (each half the one before): 29 = 16 + 8 + 4 + 1, there is no group of 2 — we write 11101, 5 signs.","Place weights can also grow unevenly, say 24, 6, 2, 1: 29 = 1 · 24 + 0 · 6 + 2 · 2 + 1 · 1 — written 1021."],"gain":["5 signs (or just 2 ordinary digits) instead of 29 sticks.","A trillion in sticks is a trillion sticks; in digits it is 13 signs (or 40 with groups of 2)."],"whenToUse":"When an amount has to be written briefly or split into groups of given sizes.","needs":["you choose in advance how many times heavier the next place is: 10, 2 or your own weights","the digit in each place is smaller than that number"],"guarantees":"Every number has exactly one such record.","work":"As many signs as the number of times you can divide by 10 (or by 2) before reaching 0."}},"en":{"naive":{"how":"draw one stick for each counter","unit":"signs","formula":"29 counters — 29 sticks"},"method":{"unit":"signs","formula":"groups 16 + 8 + 4 + 1 → written 11101 (in ordinary digits — 29, two signs)"},"scale":{"n":"the number 10¹²","naive":"10¹² sticks","method":"40 signs in groups of 2, or 13 ordinary digits","plot":{"y":"signs in the record"}},"gainText":"29 sticks → 5 signs in groups of 2 → 2 ordinary digits"}},"BigIntegerArithmetic":{"id":"BigIntegerArithmetic","problem":"Машинная ячейка (64 бита) хранит числа до 2⁶⁴ ≈ 1,8·10¹⁹ — надёжно 19 цифр; у более длинных чисел старшие цифры теряются.","problemExample":"Сложить два 25-значных числа: 4839201746582930174658293 + 5270918364529173820465718.","naive":{"how":"положить каждое 25-значное число в одну машинную ячейку на 19 цифр","cost":"6","unit":"потерянных цифр","formula":"25 цифр, а в ячейке 19 мест — 6 старших цифр за краем"},"method":{"cost":"0","unit":"потерянных цифр","formula":"по цифре в ячейке: 25 сложений столбцов с переносом, сумма из 26 цифр"},"scale":{"n":"100 чисел по 50 цифр (при ~10⁸ операций в секунду)","naive":"в 64-битный тип не помещаются — ответ неверный","method":"100 × 50 = 5000 сложений цифр — мгновенно","plot":false},"keyIdea":"Число хранится массивом цифр, перенос идёт в следующий столбец","how":["Хранить цифры числа в массиве, по одной в ячейке.","Сложить младший столбец: 3 + 8 = 11 — пишем 1, перенос 1.","Следующий столбец с переносом: 9 + 1 + 1 = 11, затем 2 + 7 + 1 = 10, и так все 25 столбцов.","Перенос после старшего столбца записать новой цифрой: сумма из 26 цифр."],"props":{"time":"O(n)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["числа больше 2⁶⁴ ≈ 1,8·10¹⁹, иначе хватает машинного типа","цифры хранятся от младшей к старшей"],"input":"массивы цифр","output":"массив цифр результата","gives":"точный результат любой длины без переполнения","timePlain":"O(n), n — число цифр длинного числа: одно сложение на столбец (здесь 25)","spacePlain":"O(n) — по ячейке на каждую цифру"},"gainText":"точная сумма чисел любой длины: 0 потерянных цифр вместо 6; сложений столько, сколько столбцов (25)","story":{"ru":{"trick":"сложением столбиком","task":"Нужно сложить два 25-значных числа: 4839201746582930174658293 и 5270918364529173820465718.","headOn":"В лоб: кладём каждое число в одну ячейку памяти компьютера. Но ячейка вмещает только 19 цифр — 6 старших цифр не помещаются, и ответ выйдет неверным.","notice":"Число можно хранить по одной цифре в ячейке и складывать, как учат в школе: столбиком, справа налево, перенося лишний десяток в соседний столбец.","steps":["Справа налево: 3 + 8 = 11 — пишем 1, 1 переносим; 9 + 1 + 1 = 11; 2 + 7 + 1 = 10 — пишем 0, 1 переносим.","Так проходим все 25 столбцов: получается сумма из 26 цифр, и ни одна цифра не потеряна."],"gain":["25 сложений столбцов — и точный ответ вместо 6 потерянных цифр.","Сложить 100 чисел по 50 цифр — 5000 сложений цифр, мгновенно; в одну ячейку такие числа не помещаются вовсе."],"whenToUse":"Когда числа длиннее 19 цифр и в одну ячейку памяти не помещаются.","needs":["число хранится по одной цифре в ячейке","цифры идут от младшей к старшей"],"guarantees":"Сумма точная, какой бы длины ни были числа.","work":"Одно сложение на каждый столбец: сколько цифр, столько сложений."},"en":{"trick":"column addition","task":"Add two 25-digit numbers: 4839201746582930174658293 and 5270918364529173820465718.","headOn":"Head-on: put each number into one memory cell of the computer. But a cell holds only 19 digits — the 6 leading digits do not fit, and the answer comes out wrong.","notice":"A number can be stored one digit per cell and added the way we learn at school: in columns, right to left, carrying the extra ten into the next column.","steps":["Right to left: 3 + 8 = 11 — write 1, carry 1; 9 + 1 + 1 = 11; 2 + 7 + 1 = 10 — write 0, carry 1.","Go through all 25 columns like this: the sum has 26 digits, and not one digit is lost."],"gain":["25 column additions — and an exact answer instead of 6 lost digits.","Adding 100 numbers of 50 digits each takes 5000 digit additions, instantly; such numbers do not fit into one cell at all."],"whenToUse":"When numbers are longer than 19 digits and do not fit into one memory cell.","needs":["the number is stored one digit per cell","digits go from the last one to the first"],"guarantees":"The sum is exact, however long the numbers are.","work":"One addition per column: as many additions as there are digits."}},"en":{"naive":{"how":"put each 25-digit number into one 19-digit memory cell","unit":"lost digits","formula":"25 digits, but the cell has 19 places — 6 leading digits fall off"},"method":{"unit":"lost digits","formula":"one digit per cell: 25 column additions with carry, a 26-digit sum"},"scale":{"n":"100 numbers of 50 digits (at ~10⁸ operations per second)","naive":"they do not fit into a 64-bit cell — the answer is wrong","method":"100 × 50 = 5000 digit additions — instant"},"gainText":"an exact sum of any length: 0 lost digits instead of 6; one addition per column (25)"}},"IntegerOverflowAvoidance":{"id":"IntegerOverflowAvoidance","problem":"Промежуточное значение не помещается в ячейку заданного размера (тип) и незаметно портит ответ.","problemExample":"Посчитать 120 × 45 ÷ 15 = 360 в ячейке на 3 цифры (до 999).","naive":{"how":"сначала умножить 120 × 45 = 5400, потом разделить на 15","cost":"4","unit":"цифр в самом большом промежуточном числе","formula":"120 × 45 = 5400 — 4 цифры; в ячейке на 3 цифры остаётся 400, и ответ выходит неверным"},"method":{"cost":"3","unit":"цифр в самом большом промежуточном числе","formula":"120 ÷ 15 = 8, затем 8 × 45 = 360 — не больше 3 цифр"},"scale":{"n":"числа до 10¹⁸ в 64-битной ячейке (вмещает до 9,2·10¹⁸) (при ~10⁸ операций в секунду)","naive":"произведение до 10³⁶ — переполнение: ответ неверный, и программа об этом не предупреждает","method":"деление первым держит каждый шаг не выше 10¹⁸","plot":{"n":18,"naive":36,"method":18,"nc":"n2","mc":"n","y":"величина промежуточного числа","budget":{"lg":18.963787827345556,"text":"предел 64-битной ячейки ≈ 9,2·10¹⁸"}}},"keyIdea":"Переставить действия так, чтобы самое большое промежуточное значение влезло в тип","how":["Оценить самое большое промежуточное: 120 × 45 = 5400 не влезает в 999","Сначала разделить: 120 ÷ 15 = 8","Потом умножить: 8 × 45 = 360","Проверить: 360 ≤ 999 — влезает"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["делитель делит один из множителей нацело: 120 ÷ 15 = 8","самое большое промежуточное оценено заранее и не больше того, что вмещает ячейка (тип — сколько цифр вмещает ячейка)"],"input":"выражение и тип","output":"то же выражение без переполнения","gives":"каждое промежуточное значение помещается в тип, ответ точный","timePlain":"столько же действий, только в другом порядке","spacePlain":"хранится одно промежуточное число"},"gainText":"действий столько же (2); выигрыш — верный ответ 360 без переполнения","story":{"ru":{"trick":"делением раньше умножения","task":"Нужно вычислить 120 × 45 ÷ 15, но в ячейку помещаются только числа из 3 цифр — до 999.","headOn":"В лоб: сначала 120 × 45 = 5400 — это 4 цифры, и в ячейке остаётся только 400. Дальше 400 ÷ 15 даёт 26,7 вместо 360: ответ испорчен.","notice":"15 делит 120 без остатка: 120 = 15 × 8. Если сначала разделить, промежуточное число станет маленьким.","steps":["Сначала 120 ÷ 15 = 8 — одна цифра.","Потом 8 × 45 = 360 — три цифры, помещается. Ответ верный: 360."],"gain":["Самое большое промежуточное число — 3 цифры вместо 4, и ответ верный.","В компьютере то же самое с числами до 10¹⁸: произведение двух таких чисел не помещается в ячейку, а деление первым держит каждый шаг в пределах."],"whenToUse":"Когда в выражении есть умножение и деление, а промежуточное произведение может не поместиться.","needs":["делитель делит один из множителей без остатка","заранее видно, каким будет самое большое промежуточное число"],"guarantees":"Каждое промежуточное число помещается, ответ точный.","work":"Столько же действий, только в другом порядке."},"en":{"trick":"dividing before multiplying","task":"Work out 120 × 45 ÷ 15, when a cell can only hold numbers of 3 digits — up to 999.","headOn":"Head-on: first 120 × 45 = 5400 — 4 digits, and only 400 stays in the cell. Then 400 ÷ 15 gives 26.7 instead of 360: the answer is ruined.","notice":"15 divides 120 evenly: 120 = 15 × 8. If we divide first, the number in between stays small.","steps":["First 120 ÷ 15 = 8 — one digit.","Then 8 × 45 = 360 — three digits, it fits. The answer is right: 360."],"gain":["The biggest number in between has 3 digits instead of 4, and the answer is right.","In a computer it is the same with numbers up to 10¹⁸: the product of two such numbers does not fit in a cell, while dividing first keeps every step within limits."],"whenToUse":"When an expression has multiplication and division, and the product along the way might not fit.","needs":["the divisor divides one of the factors evenly","you can see in advance how big the largest number along the way will be"],"guarantees":"Every number along the way fits, and the answer is exact.","work":"The same number of operations, just in a different order."}},"en":{"naive":{"how":"multiply first: 120 × 45 = 5400, then divide by 15","unit":"digits in the biggest number along the way","formula":"120 × 45 = 5400 — 4 digits; a 3-digit cell keeps only 400, and the answer comes out wrong"},"method":{"unit":"digits in the biggest number along the way","formula":"120 ÷ 15 = 8, then 8 × 45 = 360 — no more than 3 digits"},"scale":{"n":"numbers up to 10¹⁸ in a 64-bit cell (holds up to 9.2·10¹⁸) (at ~10⁸ operations per second)","naive":"a product up to 10³⁶ does not fit: the answer is wrong, and the program gives no warning","method":"dividing first keeps every step at or below 10¹⁸","plot":{"y":"size of the number along the way","budget":{"text":"limit of a 64-bit cell ≈ 9.2·10¹⁸"}}},"gainText":"the same 2 operations; the gain is the right answer 360, with nothing lost"}},"CrossMultiplication":{"id":"CrossMultiplication","problem":"Деление даёт бесконечные десятичные хвосты, и после округления сравнение дробей может ошибиться.","problemExample":"Что больше: 3/7 или 4/9? В десятичной записи 0,428571… и 0,444…","naive":{"how":"разделить числители на знаменатели и сравнить десятичные дроби","cost":"2","unit":"делений с округлением","formula":"3 ÷ 7 = 0,4285… и 4 ÷ 9 = 0,4444… — после округления «равны»"},"method":{"cost":"2","unit":"умножений целых чисел","formula":"3 · 9 = 27 и 4 · 7 = 28, 27 < 28"},"scale":{"n":"числители и знаменатели до 10⁹","naive":"деление в дробях с плавающей точкой теряет точность после ~15 знаков — близкие дроби могут оказаться «равны»","method":"крест точен, пока произведение меньше 9·10¹⁸","plot":false},"keyIdea":"Сравнивать 3·9 и 4·7: числитель на чужой знаменатель, в целых числах — округлению неоткуда взяться","how":["Сделать знаменатели положительными: 7 и 9 уже положительные","Умножить крест-накрест: 3 × 9 = 27, 4 × 7 = 28","Сравнить целые произведения: 27 < 28, значит 3/7 < 4/9"],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["оба знаменателя больше 0","произведение должно влезать в целое число: числители и знаменатели до ~3 миллиардов"],"input":"две дроби","output":"знак сравнения","gives":"точный знак сравнения без округления","timePlain":"2 умножения при любых дробях","spacePlain":"хранятся 2 произведения"},"gainText":"операций столько же (2 деления и 2 умножения); выигрыш — точность: целые 27 < 28 сравниваются без округления десятичных хвостов","story":{"ru":{"trick":"сравнением крест-накрест","task":"Какая дробь больше: 3/7 или 4/9?","headOn":"В лоб: делим. 3 ÷ 7 = 0,428571…, 4 ÷ 9 = 0,4444… — дроби бесконечные. Если округлить до одного знака, обе станут 0,4, и покажется, что они равны.","notice":"3/7 < 4/9 ровно тогда, когда 3 · 9 < 4 · 7: умножим обе дроби на 7 · 9, и знаменатели исчезнут. Останутся целые числа — их можно сравнить точно.","steps":["Каждый числитель умножаем на знаменатель другой дроби: 3 · 9 = 27 и 4 · 7 = 28.","27 < 28, значит 3/7 < 4/9 — точно, без всякого округления."],"gain":["2 умножения вместо 2 делений — работы столько же, но ответ точный.","Для дробей с числами до миллиарда деление теряет точность примерно после 15-го знака, а сравнение крест-накрест остаётся точным."],"whenToUse":"Когда нужно сравнить две дроби и важно не ошибиться из-за округления.","needs":["оба знаменателя больше нуля","произведения помещаются в целое число: числители и знаменатели до ~3 миллиардов"],"guarantees":"Ответ «больше», «меньше» или «равны» всегда точный.","work":"Всего 2 умножения, какие бы ни были дроби."},"en":{"trick":"cross-multiplying","task":"Which fraction is bigger: 3/7 or 4/9?","headOn":"Head-on: divide. 3 ÷ 7 = 0.428571…, 4 ÷ 9 = 0.4444… — the decimals never end. Rounded to one place, both become 0.4, and they look equal.","notice":"3/7 < 4/9 exactly when 3 · 9 < 4 · 7: multiply both fractions by 7 · 9 and the bottoms disappear. What is left are whole numbers, and those compare exactly.","steps":["Multiply each top number by the bottom of the other fraction: 3 · 9 = 27 and 4 · 7 = 28.","27 < 28, so 3/7 < 4/9 — exactly, with no rounding at all."],"gain":["2 multiplications instead of 2 divisions — the same amount of work, but the answer is exact.","For fractions with numbers up to a billion, division loses precision after about 15 digits, while cross-multiplying stays exact."],"whenToUse":"When you compare two fractions and must not be fooled by rounding.","needs":["both bottoms are greater than zero","the products fit in a whole number: tops and bottoms up to ~3 billion"],"guarantees":"The answer \"bigger\", \"smaller\" or \"equal\" is always exact.","work":"Just 2 multiplications, whatever the fractions."}},"en":{"naive":{"how":"divide the tops by the bottoms and compare the decimals","unit":"rounded divisions","formula":"3 ÷ 7 = 0.4285… and 4 ÷ 9 = 0.4444… — \"equal\" after rounding"},"method":{"unit":"whole-number multiplications","formula":"3 · 9 = 27 and 4 · 7 = 28, 27 < 28"},"scale":{"n":"tops and bottoms up to 10⁹","naive":"floating-point division loses precision after ~15 digits — close fractions may come out \"equal\"","method":"cross-multiplying is exact while the product stays below 9·10¹⁸"},"gainText":"the same number of operations (2 divisions, 2 multiplications); the gain is exactness: 27 < 28 needs no rounding"}},"Memoization":{"id":"Memoization","problem":"Рекурсия вычисляет одни и те же вызовы много раз.","problemExample":"fib(4) = 3 при fib(0) = 0, fib(1) = 1: без памяти fib(2) считается дважды, fib(1) — трижды.","naive":{"how":"вызывать рекурсию без запоминания ответов","cost":"9","unit":"расчётов","formula":"по уровням: 1 + 2 + 4 + 2"},"method":{"cost":"7","unit":"расчётов и чтений из тетрадки","formula":"5 расчётов (от fib(0) до fib(4)) + 2 чтения"},"scale":{"n":"fib(30) (при ~10⁸ действий в секунду)","naive":"2 692 537 расчётов — около 0,03 секунды, но их число растёт в 1,6 раза с каждым шагом","method":"31 расчёт + 28 чтений из тетрадки = 59 — мгновенно","plot":{"n":1.47712,"naive":6.43016,"method":1.77085,"nc":"2n","mc":"n","nName":"какое число ряда"}},"keyIdea":"Ответ вызова сохран
