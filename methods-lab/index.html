h from 1 to 1000 (~10⁸ operations per second)","naive":"all triples: 1000³ = 10⁹ — about 10 seconds","method":"the third is computed: 1000² = 10⁶ pairs — about 0.01 seconds","plot":{"nName":"how far each number goes"}}}},"Canonicalization":{"id":"Canonicalization","problem":"Разные стартовые числа приводят к одним и тем же результатам, и работа повторяется.","problemExample":"Среди оснований 2–10 найти те, чьи степени уже получены из меньших: 4 = 2², 8 = 2³, 9 = 3².","naive":{"how":"обрабатывать каждое основание от 2 до 10","cost":"9","unit":"обработанных чисел","formula":"числа от 2 до 10"},"method":{"cost":"6","unit":"обработанных чисел","formula":"9 чисел минус 3 повтора (4, 8, 9)","how":"обрабатывать только канонические основания"},"gainText":"в 1,5 раза меньше обработанных оснований (9 / 6)","keyIdea":"Основание-степень узнаётся до работы; обрабатываем только исходное основание группы.","how":["Решить, что считается дубликатом: основание вида bᵏ.","Для каждой группы выбрать наименьшего представителя: 2 для 4 и 8, 3 для 9.","Дубликаты пропускать до вычислений.","Обработать 6 оснований: 2, 3, 5, 6, 7, 10."],"props":{"time":"O(n)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["доказано, что дубликат даёт тот же результат, что и представитель","дубликат узнаётся до основной работы"],"input":"стартовые точки","output":"канонические представители","gives":"каждая группа обработана ровно один раз","timePlain":"O(n) — одна проверка «дубликат ли» на каждый старт","spacePlain":"O(n) — список уже встреченных представителей"},"scale":{"n":"числа от 2 до 100, степени от 2 до 100","naive":"99 чисел × 99 степеней = 9801 огромное число (сотни цифр каждое)","method":"87 чисел (12 из 99 — степени меньших), степени сравниваются без огромных чисел","plot":false},"story":{"ru":{"trick":"пропуском повторов","task":"Для каждого числа от 2 до 10 нужно выписать его степени — квадрат, куб и так далее. Какие числа можно пропустить, потому что все их степени уже выписаны у меньшего числа?","headOn":"В лоб: выписываем степени всех 9 чисел. Но степени 4, 8 и 9 повторяют уже выписанные: 4² = 16 = 2⁴ и 4³ = 64 = 2⁶ — работа сделана второй раз.","notice":"Число 4 само является степенью двойки: 4 = 2². Значит, любая степень четвёрки — это тоже степень двойки. Такие числа видно сразу, ещё до всякого счёта.","steps":["Находим числа, которые сами являются степенью меньшего: 4 = 2², 8 = 2³, 9 = 3².","Пропускаем 4, 8 и 9 и выписываем степени только у 2, 3, 5, 6, 7 и 10 — 6 чисел вместо 9."],"gain":["6 чисел вместо 9 — работы в 1,5 раза меньше.","Для чисел от 2 до 100 так пропускаются 12 из 99 — и не нужно сравнивать огромные числа из сотен цифр."],"whenToUse":"Когда разные исходные числа дают одинаковые результаты и повтор можно узнать заранее.","needs":["заранее известно, какое число повторяет какое (здесь — число является степенью меньшего)","повтор узнаётся до работы, а не после"],"guarantees":"Каждый повтор обработан ровно один раз — ничего не пропущено и не посчитано дважды.","work":"Одна проверка на число, а повторы вообще не обрабатываются."},"en":{"trick":"skipping repeats","task":"For each number from 2 to 10 we write down its powers — square, cube and so on. Which numbers can be skipped because all their powers already appear under a smaller number?","headOn":"Head-on: write out the powers of all 9 numbers. But the powers of 4, 8 and 9 repeat ones already written: 4² = 16 = 2⁴ and 4³ = 64 = 2⁶ — the same work done twice.","notice":"4 is itself a power of 2: 4 = 2². So every power of 4 is also a power of 2. Numbers like that can be spotted at once, before any counting.","steps":["Find the numbers that are themselves a power of a smaller one: 4 = 2², 8 = 2³, 9 = 3².","Skip 4, 8 and 9 and write out powers only for 2, 3, 5, 6, 7 and 10 — 6 numbers instead of 9."],"gain":["6 numbers instead of 9 — 1.5 times less work.","For the numbers 2 to 100, this skips 12 of 99 — and there is no need to compare huge numbers hundreds of digits long."],"whenToUse":"When different starting numbers produce the same results and the repeats can be spotted in advance.","needs":["you know in advance which number repeats which (here: a number is a power of a smaller one)","a repeat is spotted before the work, not after"],"guarantees":"Every repeat is handled exactly once — nothing is missed or counted twice.","work":"One check per number, and the repeats are never processed at all."}},"en":{"naive":{"how":"write out the powers of every number from 2 to 10","unit":"numbers processed","formula":"the numbers from 2 to 10"},"method":{"unit":"numbers processed","formula":"9 numbers minus 3 repeats (4, 8, 9)"},"gainText":"1.5 times fewer numbers processed (9 / 6)","scale":{"n":"numbers from 2 to 100, powers from 2 to 100","naive":"99 numbers × 99 powers = 9801 huge numbers (hundreds of digits each)","method":"87 numbers (12 of the 99 are powers of smaller ones), powers compared without huge numbers"}}},"SymmetryBreaking":{"id":"SymmetryBreaking","problem":"Пары (i, j) и (j, i) дают одно и то же, но перебираются дважды.","problemExample":"Сосчитать различные пары клеток (i, j) на доске 4 × 4, где (1, 2) и (2, 1) — одна пара.","naive":{"how":"перебрать все упорядоченные пары i и j от 1 до 4","cost":"16","unit":"проверенных пар","formula":"4 значения i × 4 значения j"},"method":{"cost":"10","unit":"проверенных пар","formula":"пары с j не меньше i: 4 + 3 + 2 + 1","how":"для каждого i брать j от i до конца"},"gainText":"в 1,6 раза меньше проверок (16 / 10)","keyIdea":"Условие j ≥ i не даёт появиться зеркальной копии (2, 1) после (1, 2).","how":["Найти равноправные переменные: i и j.","Ввести порядок j ≥ i (равенство оставить: пара (2, 2) допустима).","Для каждого i брать j от i до конца."],"props":{"time":"O(N²/2)","space":"O(1)","timeRank":6,"spaceRank":1,"exact":"точный","needs":["перестановка i и j не меняет результат","порядок нестрогий j ≥ i, если равные значения допустимы"],"input":"равноправные переменные","output":"кандидаты без зеркал","gives":"каждая пара встречается ровно один раз","timePlain":"O(N²/2) — вдвое меньше пар, чем при полном переборе","spacePlain":"O(1) — хранятся текущие i и j"},"scale":{"n":"множители от 100 до 999 — 900 значений","naive":"все пары: 900 × 900 = 810 000","method":"пары с j не меньше i: 900 × 901 ÷ 2 = 405 450","plot":{"n":2.95424,"naive":5.90849,"method":5.60794,"nc":"n2","mc":"n2","nName":"сколько значений у множителя"}},"story":{"ru":{"trick":"условием «j не меньше i»","task":"Номера i и j берутся от 1 до 4. Сколько получается разных пар, если (1, 2) и (2, 1) считать одной и той же парой?","headOn":"В лоб: перебираем все 4 × 4 = 16 клеток доски, но клетки вроде (2, 1) и (1, 2) — одна и та же пара, посчитанная дважды.","notice":"Каждая клетка под диагональю доски — зеркальная копия клетки над ней. Если всегда брать j не меньше i, копии просто не появятся.","steps":["Под диагональю 6 клеток, и каждая повторяет клетку над диагональю: (2, 1) = (1, 2), (3, 1) = (1, 3) и так далее.","Для каждого i берём j от i до 4: 4 + 3 + 2 + 1 = 10 пар, а копии не появляются вовсе."],"gain":["10 проверок вместо 16.","Для множителей от 100 до 999 — 405 450 пар вместо 810 000, почти вдвое меньше."],"whenToUse":"Когда перебираешь пары или наборы, в которых порядок не важен.","needs":["части пары равноправны: (a, b) и (b, a) дают одно и то же","пары вроде (2, 2) тоже нужны — поэтому j не меньше i, а не строго больше"],"guarantees":"Каждая пара встречается ровно один раз.","work":"Примерно вдвое меньше проверок: для 4 номеров — 10 вместо 16."},"en":{"trick":"the rule \"j is at least i\"","task":"The numbers i and j run from 1 to 4. How many different pairs are there if (1, 2) and (2, 1) count as the same pair?","headOn":"Head-on: go through all 4 × 4 = 16 squares of the board, but squares like (2, 1) and (1, 2) are the same pair counted twice.","notice":"Every square below the diagonal is a mirror copy of a square above it. If j is always at least i, the copies never appear.","steps":["Below the diagonal there are 6 squares, and each repeats one above it: (2, 1) = (1, 2), (3, 1) = (1, 3) and so on.","For each i, take j from i to 4: 4 + 3 + 2 + 1 = 10 pairs, and the copies never appear at all."],"gain":["10 checks instead of 16.","For factors from 100 to 999: 405,450 pairs instead of 810,000, almost half as many."],"whenToUse":"When you go through pairs or groups where the order does not matter.","needs":["both parts of a pair are interchangeable: (a, b) and (b, a) mean the same","pairs like (2, 2) are needed too — so j is at least i, not strictly bigger"],"guarantees":"Every pair appears exactly once.","work":"About half as many checks: for 4 numbers, 10 instead of 16."}},"en":{"naive":{"how":"go through every ordered pair of i and j from 1 to 4","unit":"pairs checked","formula":"4 values of i × 4 values of j"},"method":{"unit":"pairs checked","formula":"pairs with j at least i: 4 + 3 + 2 + 1"},"gainText":"1.6 times fewer checks (16 / 10)","scale":{"n":"factors from 100 to 999 — 900 values","naive":"all pairs: 900 × 900 = 810,000","method":"pairs with j at least i: 900 × 901 ÷ 2 = 405,450","plot":{"nName":"how many values a factor has"}}}},"LogarithmProductRule":{"id":"LogarithmProductRule","problem":"Произведение многих чисел так огромно, что его нельзя хранить в обычной переменной.","problemExample":"Найти ln(4 × 8), не вычисляя само произведение 32 (ln — натуральный логарифм).","naive":{"how":"перемножить 4 × 8 = 32 и взять ln 32","cost":"32","unit":"самое большое хранимое число","formula":"4 × 8, его приходится хранить"},"method":{"cost":"3,466","unit":"самое большое хранимое число","formula":"ln 4 + ln 8 = 1,386 + 2,079","how":"сложить логарифмы множителей"},"gainText":"операций столько же (1 умножение против 1 сложения); выигрыш — промежуточное число 3,466 вместо 32, для 1000! — 5912 вместо числа из 2568 цифр","keyIdea":"Логарифм произведения равен сумме логарифмов: умножение огромных чисел заменяется сложением.","how":["Взять логарифм каждого множителя: ln 4 = 1,386, ln 8 = 2,079.","Сложить логарифмы: 3,466.","Если нужно само число — обратно: e в степени 3,466 ≈ 32 (e ≈ 2,718)."],"props":{"time":"O(n)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"приближённый","needs":["все множители больше 0","все логарифмы по одному основанию"],"input":"множители","output":"логарифм произведения","gives":"сумма равна логарифму произведения с точностью около 15 значащих цифр","timePlain":"O(n) — один логарифм и одно сложение на множитель","spacePlain":"O(1) — хранится одна сумма"},"scale":{"n":"произведение всех чисел от 1 до 1000","naive":"число из 2568 цифр — в обычную ячейку памяти (до 19 цифр) не помещается","method":"сумма логарифмов ≈ 5912,1 — обычное дробное число","plot":false},"story":{"ru":{"trick":"сложением логарифмов","task":"Нужно найти ln(4 × 8) — логарифм произведения. (ln числа — это степень, в которую надо возвести число e ≈ 2,718, чтобы получить это число.) Само произведение хранить не хочется: в больших задачах оно огромное.","headOn":"В лоб: сначала перемножаем 4 × 8 = 32 и берём ln 32. Пока 32 маленькое, это не страшно, но произведение всех чисел от 1 до 1000 состоит из 2568 цифр и в обычную ячейку памяти не помещается.","notice":"Логарифм превращает умножение в сложение: ln(4 × 8) = ln 4 + ln 8. На линейке, где каждое деление — это умножение на 2, длины отрезков просто складываются.","steps":["Отрезок длиной ln 4 = 1,386 доходит до метки 4, а за ним отрезок ln 8 = 2,079 доходит до метки 32.","Вместе они дают 1,386 + 2,079 = 3,466 — это и есть ln 32, а само число 32 мы так и не хранили."],"gain":["Самое большое число по дороге — 3,466 вместо 32.","Для произведения чисел от 1 до 1000 — сумма логарифмов около 5912 вместо числа из 2568 цифр."],"whenToUse":"Когда нужно перемножить много чисел, а само произведение слишком велико, чтобы его хранить.","needs":["все множители больше нуля","ответ с небольшой погрешностью годится"],"guarantees":"Ответ приблизительный, но все числа по дороге остаются маленькими.","work":"По одному сложению на каждый множитель — столько же действий, сколько умножений."},"en":{"trick":"adding logarithms","task":"Find ln(4 × 8), the logarithm of a product. (The ln of a number is the power you raise e ≈ 2.718 to in order to get that number.) We would rather not store the product itself: in big problems it is huge.","headOn":"Head-on: first multiply 4 × 8 = 32, then take ln 32. While 32 is small that is fine, but the product of all numbers from 1 to 1000 has 2,568 digits and does not fit into an ordinary memory cell.","notice":"A logarithm turns multiplying into adding: ln(4 × 8) = ln 4 + ln 8. On a ruler where each mark means \"times 2\", lengths simply add up.","steps":["A bar of length ln 4 = 1.386 reaches the mark 4, and after it a bar of length ln 8 = 2.079 reaches the mark 32.","Together they make 1.386 + 2.079 = 3.466 — which is ln 32, and the number 32 was never stored."],"gain":["The biggest number along the way is 3.466 instead of 32.","For the product of the numbers from 1 to 1000, the sum of logarithms is about 5912 instead of a number 2,568 digits long."],"whenToUse":"When you need to multiply many numbers and the product itself is too big to store.","needs":["every factor is greater than zero","an answer with a small error is good enough"],"guarantees":"The answer is approximate, but every number along the way stays small.","work":"One addition per factor — as many steps as multiplications."}},"en":{"naive":{"how":"multiply 4 × 8 = 32, then take ln 32","unit":"biggest number stored","formula":"4 × 8, which has to be stored"},"method":{"unit":"biggest number stored","formula":"ln 4 + ln 8 = 1.386 + 2.079"},"gainText":"the same number of steps (1 multiplication vs 1 addition); the gain is size: 3.466 instead of 32, and about 5912 instead of a 2,568-digit number for 1 × 2 × … × 1000","scale":{"n":"the product of all numbers from 1 to 1000","naive":"a number 2,568 digits long — it does not fit into an ordinary memory cell (up to 19 digits)","method":"the sum of logarithms ≈ 5912.1 — an ordinary decimal number"},"props":{"exact":"approximate"}}},"FixedPointIteration":{"id":"FixedPointIteration","problem":"Корень уравнения без готовой формулы нужен с высокой точностью.","problemExample":"Найти √2 с 4 знаками после запятой из уравнения x = (x + 2/x) / 2.","naive":{"how":"перебирать x от 1 с шагом 0,0001, пока x² < 2","cost":"4142","unit":"проверенных значений x","formula":"от 1 до 1,4142 шагами по 0,0001"},"method":{"cost":"3","unit":"подстановок в формулу","formula":"1 → 1,5 → 1,4167 → 1,4142","how":"подставлять ответ обратно в правую часть"},"gainText":"примерно в 1400 раз меньше операций (4142 / 3)","keyIdea":"Каждая подстановка примерно удваивает число верных знаков; мелкий шаг не нужен.","how":["Записать уравнение в виде x = f(x): x = (x + 2/x) / 2.","Взять начальную догадку x = 1.","Подставить x в правую часть и получить новое x.","Остановиться, когда x меняется меньше нужной точности."],"props":{"time":"O(log(1/ε))","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"приближённый","needs":["около корня правая часть меняется медленнее, чем x (наклон графика меньше 1)","начальная догадка лежит рядом с корнем (для √2 годится x = 1)"],"input":"функция и догадка","output":"приближённый корень","gives":"погрешность уменьшается с каждой подстановкой; для √2: 0,09 → 0,002 → 0,000002","timePlain":"O(log(1/ε)) — ε = нужная точность; число верных знаков удваивается за подстановку","spacePlain":"O(1) — хранится одно текущее x"},"scale":{"n":"точность 10⁻¹⁵ (15 знаков после запятой), ~10⁸ проверок в секунду","naive":"0,4142 ÷ 10⁻¹⁵ ≈ 4·10¹⁴ проверок x — около 46 дней","method":"5 подстановок: верных знаков 1 → 2 → 4 → 8 → 16","plot":{"n":"знаков точности","naive":14.60206,"method":0.69897,"nc":"2n","mc":"log","est":"naive","nName":"сколько знаков после запятой нужно"}},"story":{"ru":{"trick":"подстановкой ответа обратно","task":"Нужно найти √2 с четырьмя знаками после запятой. Известно, что √2 — это такое число x, для которого (x + 2/x) ÷ 2 снова даёт x.","headOn":"В лоб: перебираем x от 1 с шагом 0,0001 и проверяем, не стало ли x × x больше 2. До 1,4142 это 4142 проверки.","notice":"Если подставить в (x + 2/x) ÷ 2 грубую догадку, получится догадка точнее. Подставляем ответ снова и снова — и каждый раз верных знаков становится примерно вдвое больше.","steps":["Начинаем с 1: (1 + 2/1) ÷ 2 = 1,5. Подставляем 1,5 — получаем 1,4167, подставляем 1,4167 — получаем 1,4142.","Последняя подстановка сдвинула ответ на 0,0025, а следующая сдвинет меньше чем на 0,0001 — останавливаемся: √2 ≈ 1,4142.","На графике подстановки выглядят как лесенка: каждая ступенька ближе к точке, где ответ перестаёт меняться, — это и есть √2."],"gain":["3 подстановки вместо 4142 проверок — примерно в 1400 раз меньше.","Для 15 знаков после запятой перебор занял бы около 4·10¹⁴ проверок (примерно 46 дней), а подстановок хватит пяти."],"whenToUse":"Когда нужное число задано равенством вида «x равен какому-то выражению от x» и готовой формулы для него нет.","needs":["около ответа выражение меняется медленнее, чем сам x, — тогда подстановки сходятся","есть разумная первая догадка (для √2 годится 1)"],"guarantees":"С каждой подстановкой ответ ближе к точному; останавливаемся, когда он почти не меняется.","work":"Для этого выражения каждая подстановка примерно удваивает число верных знаков."},"en":{"trick":"feeding the answer back in","task":"Find √2 to four decimal places. We know √2 is the number x for which (x + 2/x) ÷ 2 gives x back again.","headOn":"Head-on: step x up from 1 by 0.0001 and check whether x × x has passed 2. Reaching 1.4142 takes 4,142 checks.","notice":"Put a rough guess into (x + 2/x) ÷ 2 and a better guess comes out. Feed the answer back in again and again — each time the number of correct digits roughly doubles.","steps":["Start with 1: (1 + 2/1) ÷ 2 = 1.5. Put in 1.5 to get 1.4167, put in 1.4167 to get 1.4142.","The last round moved the answer by 0.0025, and the next would move it by less than 0.0001 — so stop: √2 ≈ 1.4142.","On a graph the rounds form a staircase: each step lands closer to the point where the answer stops changing — that point is √2."],"gain":["3 rounds instead of 4,142 checks — about 1,400 times fewer.","For 15 decimal places, stepping would take about 4·10¹⁴ checks (roughly 46 days), while five rounds are enough."],"whenToUse":"When the number you want is given by an equation of the form \"x equals some expression in x\" and there is no ready formula for it.","needs":["near the answer the expression changes more slowly than x itself — then the rounds settle down","a sensible first guess (1 works for √2)"],"guarantees":"Every round brings the answer closer; stop when it hardly changes.","work":"For this expression every round roughly doubles the number of correct digits."}},"en":{"naive":{"how":"step x up from 1 by 0.0001 while x × x is below 2","unit":"values of x checked","formula":"from 1 to 1.4142 in steps of 0.0001"},"method":{"unit":"rounds of the formula","formula":"1 → 1.5 → 1.4167 → 1.4142"},"gainText":"about 1,400 times fewer operations (4,142 / 3)","scale":{"n":"accuracy 10⁻¹⁵ (15 decimal places), ~10⁸ checks per second","naive":"0.4142 ÷ 10⁻¹⁵ ≈ 4·10¹⁴ checks of x — about 46 days","method":"5 rounds: correct digits 1 → 2 → 4 → 8 → 16","plot":{"nName":"how many decimal places are needed"}},"props":{"exact":"approximate"}}},"Composition":{"id":"Composition","problem":"Упорядоченных разложений числа на части много, а перебор всех наборов ещё больше.","problemExample":"Сосчитать способы разложить 5 на 3 положительные части с учётом порядка (1 + 3 + 1 и 3 + 1 + 1 — разные).","naive":{"how":"перебрать все тройки чисел от 1 до 5 и проверить сумму","cost":"125","unit":"проверенных троек","formula":"5 × 5 × 5"},"method":{"cost":"4","unit":"действия","formula":"(4 × 3) ÷ (2 × 1): 2 умножения + 2 деления","how":"посчитать число способов поставить 2 разреза"},"gainText":"примерно в 31 раз меньше работы (125 / 4)","keyIdea":"Разложение — это 2 разреза в 4 промежутках между 5 единицами.","how":["Выложить 5 единиц в ряд.","Отметить 4 промежутка между соседними единицами.","Сосчитать способы выбрать 2 разреза из 4: C(4, 2) = 6."],"props":{"time":"O(k)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["все части не меньше 1","порядок частей важен (для наборов без порядка — другой метод)"],"input":"n и число частей k","output":"число композиций","gives":"точное число разложений формулой C(n − 1, k − 1)","timePlain":"по умножению и делению на каждый разрез","spacePlain":"хранится одно значение дроби"},"scale":{"n":"100 на 10 частей (при ~10⁸ действий в секунду)","naive":"100¹⁰ = 10²⁰ наборов — тысячи лет","method":"9 умножений + 9 делений = 18 действий","plot":{"n":2,"naive":20,"method":1.25527,"nc":"n3","mc":"1","est":"naive","nName":"какое число раскладываем"}},"story":{"ru":{"trick":"палочки и перегородки","task":"Число 5 нужно разложить на 3 части, каждая больше нуля, и порядок важен: 1 + 3 + 1 и 3 + 1 + 1 — разные разложения. Сколько их?","headOn":"В лоб: перебираем все тройки чисел от 1 до 5 — 5 × 5 × 5 = 125 троек — и проверяем сумму; подходят 6.","notice":"Выложим 5 палочек в ряд: между ними 4 промежутка. Поставив 2 перегородки в 2 промежутка из 4, получаем ровно разложение на 3 части.","steps":["Перегородки в 1-м и 4-м промежутке дают части 1, 3, 1.","Выбрать 2 промежутка из 4 можно (4 × 3) ÷ (2 × 1) = 6 способами; по шагам: × 3, ÷ 1, × 4, ÷ 2 — 4 действия вместо 125 троек."],"gain":["4 действия вместо 125 проверенных троек.","Разложить 100 на 10 частей: 18 действий вместо 10²⁰ наборов, которые перебирались бы тысячи лет."],"whenToUse":"Когда нужно посчитать, сколькими способами число раскладывается на заданное количество частей с учётом порядка.","needs":["каждая часть не меньше 1","порядок частей важен"],"guarantees":"Точное число разложений, без их перебора.","work":"По умножению и делению на каждую перегородку."},"en":{"trick":"sticks and dividers","task":"The number 5 has to be split into 3 parts, each above zero, and order matters: 1 + 3 + 1 and 3 + 1 + 1 are different splits. How many are there?","headOn":"Head-on: try every triple of numbers from 1 to 5 — 5 × 5 × 5 = 125 triples — and check the sum; 6 of them fit.","notice":"Lay 5 sticks in a row: there are 4 gaps between them. Putting 2 dividers into 2 of the 4 gaps gives exactly a split into 3 parts.","steps":["Dividers in the 1st and 4th gaps give the parts 1, 3, 1.","Picking 2 gaps out of 4 can be done in (4 × 3) ÷ (2 × 1) = 6 ways; step by step: × 3, ÷ 1, × 4, ÷ 2 — 4 steps instead of 125 triples."],"gain":["4 steps instead of 125 checked triples.","Splitting 100 into 10 parts: 18 steps instead of trying 10²⁰ options, which would take thousands of years."],"whenToUse":"When you need to count how many ways a number splits into a given number of parts, order counting.","needs":["every part is at least 1","the order of the parts matters"],"guarantees":"The exact number of splits, without trying them out.","work":"One multiplication and one division per divider."}},"en":{"naive":{"how":"try every triple of numbers from 1 to 5 and check the sum","unit":"checked triples","formula":"5 × 5 × 5"},"method":{"unit":"arithmetic steps","formula":"(4 × 3) ÷ (2 × 1): 2 multiplications + 2 divisions"},"scale":{"n":"100 split into 10 parts (at ~10⁸ operations per second)","naive":"100¹⁰ = 10²⁰ options — thousands of years","method":"9 multiplications + 9 divisions = 18 steps","plot":{"nName":"the number to split"}},"gainText":"about 31 times less work (125 / 4)"}},"Sorting":{"id":"Sorting","problem":"Для поиска, рангов и группировки элементы нужно выстроить по порядку.","problemExample":"Выстроить столбцы 3, 5, 1, 4, 2 по возрастанию.","naive":{"how":"перебирать расстановки 5 столбцов и проверять, упорядочена ли каждая","cost":"480","unit":"сравнений соседей в худшем случае","formula":"120 расстановок × 4 сравнения соседей"},"method":{"cost":"10","unit":"сравнений соседей","formula":"проходы по 4, 3, 2 и 1 паре соседей","how":"сравнивать соседей и менять местами неупорядоченных"},"gainText":"в 48 раз меньше сравнений (480 / 10)","keyIdea":"Каждый обмен неупорядоченных соседей исправляет ровно один беспорядок; перебирать расстановки не нужно.","how":["Выбрать правило сравнения: меньше — левее.","Сравнить соседей слева направо: 5 перед 1 — обменять.","Каждый проход уводит самое большое число в конец: после первого прохода 5 последняя.","Повторять проходы, пока за проход не случится ни одного обмена: 1, 2, 3, 4, 5."],"props":{"time":"O(n²)","space":"O(1)","timeRank":6,"spaceRank":1,"exact":"точный","needs":["для любых двух элементов правило говорит, какой левее","правило последовательное: если a ≤ b и b ≤ c, то a ≤ c"],"input":"список элементов","output":"упорядоченный список","gives":"после прохода без обменов каждый следующий элемент не меньше предыдущего","timePlain":"O(n²) — до n проходов по n соседям","spacePlain":"O(1) — столбцы меняются местами на месте"},"scale":{"n":"5000 имён, ~10⁸ сравнений в секунду","naive":"5000! расстановок — не переберёшь никогда","method":"обменом соседей: до 5000 × 5000 ÷ 2 ≈ 12,5 миллиона сравнений — около 0,1 секунды","plot":{"n":3.69897,"naive":16325.62619,"method":7.09691,"nc":"nf","mc":"n2","nName":"сколько предметов"}},"story":{"ru":{"trick":"обменом соседей","task":"Пять столбиков высотой 3, 5, 1, 4, 2. Нужно расставить их по возрастанию.","headOn":"В лоб: перебираем все расстановки — их 5 × 4 × 3 × 2 × 1 = 120 — и каждую проверяем четырьмя сравнениями соседей: до 480 сравнений.","notice":"Если два соседа стоят не по порядку, достаточно поменять их местами — это исправляет один беспорядок, и перебирать расстановки не нужно.","steps":["Идём слева направо и сравниваем соседей: 4 сравнения, 3 обмена — самый высокий столбик 5 уезжает в конец.","Второй проход: 3 сравнения, 2 обмена — на своё место встаёт 4.","Третий проход: 2 сравнения, 1 обмен — на своё место встаёт 3.","Четвёртый проход: 1 сравнение без обмена — всё по порядку: 1, 2, 3, 4, 5."],"gain":["10 сравнений вместо 480 — в 48 раз меньше.","Для 5000 имён перебрать расстановки невозможно, а обменом соседей нужно около 12,5 миллиона сравнений — примерно 0,1 секунды."],"whenToUse":"Когда нужно расставить предметы по порядку — по росту, по алфавиту, по величине.","needs":["любые два предмета можно сравнить: какой из них раньше","предметы можно менять местами"],"guarantees":"В конце каждый следующий предмет не меньше предыдущего.","work":"Для 5 столбиков — не больше 10 сравнений; для n предметов — около n × n ÷ 2."},"en":{"trick":"swapping neighbours","task":"Five bars have heights 3, 5, 1, 4, 2. Put them in increasing order.","headOn":"Head-on: try every arrangement — there are 5 × 4 × 3 × 2 × 1 = 120 — and check each with four comparisons of neighbours: up to 480 comparisons.","notice":"If two neighbours are out of order, just swap them — that fixes one piece of disorder, and there is no need to try arrangements.","steps":["Go from left to right comparing neighbours: 4 comparisons, 3 swaps — the tallest bar, 5, travels to the end.","Second pass: 3 comparisons, 2 swaps — 4 reaches its place.","Third pass: 2 comparisons, 1 swap — 3 reaches its place.","Fourth pass: 1 comparison and no swap — everything is in order: 1, 2, 3, 4, 5."],"gain":["10 comparisons instead of 480 — 48 times fewer.","For 5,000 names, trying arrangements is impossible, while swapping neighbours takes about 12.5 million comparisons — roughly 0.1 seconds."],"whenToUse":"When things need to be put in order — by height, by name, by size.","needs":["any two things can be compared: which comes first","things can swap places"],"guarantees":"At the end every item is no smaller than the one before it.","work":"For 5 bars, at most 10 comparisons; for n items, about n × n ÷ 2."}},"en":{"naive":{"how":"try the arrangements of the 5 bars and check each one","unit":"neighbour comparisons in the worst case","formula":"120 arrangements × 4 neighbour comparisons"},"method":{"unit":"neighbour comparisons","formula":"passes over 4, 3, 2 and 1 pairs of neighbours"},"gainText":"48 times fewer comparisons (480 / 10)","scale":{"n":"5,000 names, ~10⁸ comparisons per second","naive":"5000! arrangements — impossible to try","method":"swapping neighbours: up to 5000 × 5000 ÷ 2 ≈ 12.5 million comparisons — about 0.1 seconds","plot":{"nName":"how many items"}}}},"PalindromeCheck":{"id":"PalindromeCheck","problem":"Проверка «читается ли число одинаково с обеих сторон» через строку тратит лишние проходы и память.","problemExample":"Проверить, совпадает ли 232 с числом, записанным справа налево.","naive":{"how":"перевести 232 в строку, развернуть строку, сравнить","cost":"3","unit":"прохода по цифрам","formula":"перевод в текст + разворот + сравнение"},"method":{"cost":"1","unit":"проход по цифрам","formula":"цифры 2, 3, 2 по одной приписываются к новому числу, затем одно сравнение","how":"развернуть число арифметикой"},"gainText":"9 действий с цифрами против 4 (3 приписывания + 1 сравнение); строка в памяти не нужна","keyIdea":"Число разворачивается арифметикой: rev = rev · 10 + последняя цифра.","how":["Отщепить последнюю цифру — остаток от деления 232 на 10: 2.","Приписать её к rev (перевёрнутое число): rev = rev · 10 + 2.","Отбросить последнюю цифру числа (целая часть 232 ÷ 10): 23.","Когда цифры кончились, сравнить rev = 232 с исходным 232."],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["число целое и не меньше 0"],"input":"число","output":"да или нет","gives":"ответ «да/нет» за один проход по цифрам без строк","timePlain":"O(log n) — одно действие на каждую цифру числа","spacePlain":"O(1) — хранятся 2 числа: остаток и rev"},"scale":{"n":"все числа до 10⁶, ~10⁸ простых операций в секунду","naive":"10⁶ чисел × 3 прохода по ~6 цифрам ≈ 1,8·10⁷ действий и строка на каждое число","method":"10⁶ чисел × ~6 цифр = 6·10⁶ действий без строк — около 0,06 с","plot":{"n":6,"naive":7.25527,"method":6.77815,"nc":"n","mc":"n"}},"story":{"ru":{"trick":"разворотом числа","task":"Читается ли число 232 одинаково слева направо и справа налево?","headOn":"В лоб: переводим 232 в текст, разворачиваем текст и сравниваем с исходным — три прохода по цифрам.","notice":"Число можно развернуть без текста: последняя цифра — это остаток от деления на 10, а разделив на 10 нацело, мы эту цифру отбрасываем. Цифры по одной приписываем к новому числу.","steps":["Снимаем цифры справа: 2, потом 3, потом 2. Новое число растёт: 0 · 10 + 2 = 2, 2 · 10 + 3 = 23, 23 · 10 + 2 = 232.","Сравниваем: 232 = 232 — число читается одинаково с обеих сторон."],"gain":["Один проход по цифрам вместо трёх, и текст не нужен.","Проверить все числа до миллиона — около 6 миллионов действий, примерно 0,06 секунды."],"whenToUse":"Когда нужно проверить, читается ли число одинаково в обе стороны.","needs":["число целое и не отрицательное"],"guarantees":"Ответ «да» или «нет» точный.","work":"Одно действие на каждую цифру числа."},"en":{"trick":"reversing the number","task":"Does the number 232 read the same from left to right and from right to left?","headOn":"Head-on: turn 232 into text, reverse the text and compare it with the original — three passes over the digits.","notice":"A number can be reversed without text: its last digit is the remainder after dividing by 10, and whole-number division by 10 drops that digit. Attach the digits one by one to a new number.","steps":["Take the digits off from the right: 2, then 3, then 2. The new number grows: 0 · 10 + 2 = 2, 2 · 10 + 3 = 23, 23 · 10 + 2 = 232.","Compare: 232 = 232 — the number reads the same both ways."],"gain":["One pass over the digits instead of three, and no text needed.","Checking every number up to a million takes about 6 million operations, roughly 0.06 seconds."],"whenToUse":"When you need to check whether a number reads the same both ways.","needs":["the number is whole and not negative"],"guarantees":"The yes-or-no answer is exact.","work":"One operation per digit of the number."}},"en":{"naive":{"how":"turn 232 into text, reverse it and compare","unit":"passes over the digits","formula":"to text + reverse + compare"},"method":{"unit":"passes over the digits","formula":"the digits 2, 3, 2 are attached one by one to a new number, then one comparison"},"scale":{"n":"all numbers up to 10⁶, ~10⁸ simple operations per second","naive":"10⁶ numbers × 3 passes over ~6 digits ≈ 1.8·10⁷ operations and a text for every number","method":"10⁶ numbers × ~6 digits = 6·10⁶ operations with no text — about 0.06 s"},"gainText":"one pass over the digits instead of three; no text in memory"}},"HashGrouping":{"id":"HashGrouping","problem":"Сравнивать каждого кандидата с каждым — работа растёт как квадрат числа кандидатов.","problemExample":"Среди чисел 21, 12, 13, 31, 11 найти пары, составленные из одних и тех же цифр.","naive":{"how":"сравнить каждое число с каждым","cost":"10","unit":"сравнений пар","formula":"5 чисел: 5 × 4 ÷ 2 пар"},"method":{"cost":"7","unit":"действий (записи + сравнения)","formula":"5 записей + 2 сравнения внутри коробок","how":"разложить числа по корзинам по ключу"},"gainText":"в 1,4 раза меньше операций (10 / 7) уже на 5 числах; на 1061 числе — в 190 раз","keyIdea":"Ключ «цифры по порядку» одинаков у чисел из одних цифр; остальных не сравниваем.","how":["Выбрать ключ: цифры числа, упорядоченные по возрастанию (21 → 12).","Разложить 5 чисел по корзинам с одинаковым ключом: {21, 12}, {13, 31}, {11}.","Сравнивать числа только внутри одной корзины: 2 пары."],"props":{"time":"O(n)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["у двух кандидатов одной группы ключ всегда одинаков","есть хеш-таблица (словарь: ключ → корзина)"],"input":"список кандидатов","output":"группы с общим ключом","gives":"пары из разных корзин никогда не сравниваются, пары внутри одной — все","timePlain":"O(n) — одно вычисление ключа и одна вставка на кандидата","spacePlain":"O(n) — таблица корзин на n кандидатов"},"scale":{"n":"1061 четырёхзначное простое число","naive":"1061 × 1060 ÷ 2 = 562 330 сравнений пар","method":"1061 запись + 1842 сравнения внутри 336 коробок ≈ 2900 действий","plot":{"n":3.02572,"naive":5.74999,"method":3.4624,"nc":"n2","mc":"n","nName":"сколько чисел"}},"story":{"ru":{"trick":"раскладкой по коробкам","task":"Среди чисел 21, 12, 13, 31, 11 нужно найти пары, составленные из одних и тех же цифр, — как 21 и 12.","headOn":"В лоб: сравниваем каждое число с каждым — 5 × 4 ÷ 2 = 10 пар, а подходящих среди них только 2.","notice":"Если записать цифры каждого числа по возрастанию, у чисел из одних и тех же цифр получится одинаковая запись: 21 → 12 и 12 → 12. Сравнивать нужно только числа с одинаковой записью.","steps":["Для каждого числа записываем его цифры по возрастанию и кладём числа с одинаковой записью в одну коробку: «12», «13» и «11» — 5 записей.","Сравниваем числа только внутри коробок: 21 с 12 и 13 с 31 — 2 сравнения, а 11 сравнивать не с кем."],"gain":["5 записей и 2 сравнения — 7 действий вместо 10.","Среди 1061 четырёхзначного простого числа — около 2900 действий вместо 562 330 сравнений, в 190 раз меньше."],"whenToUse":"Когда среди многих предметов нужно найти похожие, а сравнивать каждый с каждым слишком долго.","needs":["у похожих предметов можно посчитать одинаковую запись (здесь — цифры по возрастанию)","у непохожих записи разные"],"guarantees":"Все подходящие пары найдены, а числа из разных коробок вообще не сравниваются.","work":"Одна запись на число плюс сравнения только внутри коробок."},"en":{"trick":"sorting into boxes","task":"Among the numbers 21, 12, 13, 31, 11, find the pairs made of the same digits — like 21 and 12.","headOn":"Head-on: compare every number with every other — 5 × 4 ÷ 2 = 10 pairs, and only 2 of them match.","notice":"Write each number's digits in increasing order, and numbers made of the same digits get the same label: 21 → 12 and 12 → 12. Only numbers with the same label need comparing.","steps":["For each number, write its digits in increasing order and put numbers with the same label into one box: \"12\", \"13\" and \"11\" — 5 labels.","Compare numbers only inside the boxes: 21 with 12 and 13 with 31 — 2 comparisons, and 11 has nothing to compare with."],"gain":["5 labels and 2 comparisons — 7 steps instead of 10.","Among the 1,061 four-digit prime numbers: about 2,900 steps instead of 562,330 comparisons, 190 times fewer."],"whenToUse":"When you need to find similar items among many and comparing every pair takes too long.","needs":["similar items get the same label (here: digits in increasing order)","different items get different labels"],"guarantees":"Every matching pair is found, and numbers in different boxes are never compared.","work":"One label per number plus comparisons only inside the boxes."}},"en":{"naive":{"how":"compare every number with every other","unit":"pair comparisons","formula":"5 numbers: 5 × 4 ÷ 2 pairs"},"method":{"unit":"steps (labels + comparisons)","formula":"5 labels + 2 comparisons inside the boxes"},"gainText":"1.4 times fewer steps (10 / 7) already with 5 numbers; 190 times fewer with 1,061","scale":{"n":"1,061 four-digit prime numbers","naive":"1061 × 1060 ÷ 2 = 562,330 pair comparisons","method":"1,061 labels + 1,842 comparisons inside 336 boxes ≈ 2,900 steps","plot":{"nName":"how many numbers"}}}},"EquivalenceClass":{"id":"EquivalenceClass","problem":"Проверка «в одной ли группе» для каждой пары кандидатов — работа растёт как квадрат их числа.","problemExample":"Разбить числа 1–9 на группы с одинаковым остатком от деления на 3.","naive":{"how":"для каждой пары чисел проверить, равны ли остатки","cost":"36","unit":"проверок пар","formula":"9 карточек: 9 × 8 ÷ 2 пар"},"method":{"cost":"9","unit":"делений","formula":"9 карточек × 1 деление на 3","how":"каждому числу вычислить метку — остаток от деления на 3"},"gainText":"в 4 раза меньше операций (36 / 9)","keyIdea":"Метка класса — остаток от деления на 3; пары проверять не нужно.","how":["Проверить, что «равный остаток» — эквивалентность (три свойства ниже).","Задать метку класса: остаток от деления на 3 (0, 1 или 2).","Вычислить метку каждого из 9 чисел.","Собрать классы по меткам: {3, 6, 9}, {1, 4, 7}, {2, 5, 8}."],"props":{"time":"O(n)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["каждое число в одной группе с самим собой (остаток 7 равен остатку 7)","порядок не важен: если у 1 и 4 остатки равны, то и у 4 и 1","цепочка замыкается: у 1 и 4 равны, у 4 и 7 равны → у 1 и 7 тоже"],"input":"кандидаты и отношение","output":"метки классов","gives":"классы не пересекаются и вместе содержат всех кандидатов","timePlain":"O(n) — одна метка на кандидата","spacePlain":"O(n) — хранятся n меток"},"scale":{"n":"10 тысяч карточек, ~10⁸ операций в секунду","naive":"10⁴ × (10⁴ − 1) ÷ 2 ≈ 5·10⁷ проверок пар — около 0,5 секунды","method":"10 тысяч делений — мгновенно","plot":{"n":4,"naive":7.69897,"method":4,"nc":"n2","mc":"n","nName":"сколько карточек"}},"story":{"ru":{"trick":"готовой меткой — остатком","task":"Карточки с числами от 1 до 9 нужно разложить по группам так, чтобы в одной группе были числа с одинаковым остатком от деления на 3.","headOn":"В лоб: для каждой пары карточек проверяем, одинаковые ли у них остатки, — 9 × 8 ÷ 2 = 36 проверок.","notice":"Остаток — это готовая метка группы: его можно посчитать у каждой карточки отдельно, ни с кем её не сравнивая.","steps":["Считаем остаток от деления на 3 у каждой карточки: у 1, 4, 7 он равен 1; у 2, 5, 8 — 2; у 3, 6, 9 — 0. Это 9 делений.","Раскладываем карточки по остатку: получаются 3 группы, и ни одну пару сравнивать не пришлось.","Каждую группу можно назвать по её наименьшему числу — 1, 2 и 3: по этому имени сразу находится вся группа."],"gain":["9 делений вместо 36 проверок пар — в 4 раза меньше.","Для 10 тысяч карточек — 10 тысяч делений вместо 50 миллионов проверок пар (около 0,5 секунды)."],"whenToUse":"Когда предметы нужно разложить по группам по одинаковому признаку, и этот признак можно узнать у каждого предмета отдельно.","needs":["признак считается у каждого предмета сам по себе","одинаковый признак — одна группа, разный признак — разные группы"],"guarantees":"Каждая карточка попадает ровно в одну группу, и группы не пересекаются.","work":"Одно деление на карточку."},"en":{"trick":"a ready-made label: the remainder","task":"Cards with the numbers 1 to 9 must be sorted into groups so that each group holds numbers with the same remainder when divided by 3.","headOn":"Head-on: for every pair of cards, check whether their remainders match — 9 × 8 ÷ 2 = 36 checks.","notice":"The remainder is a ready-made group label: it can be worked out for each card on its own, without comparing it with anything.","steps":["Work out the remainder after dividing by 3 for each card: 1, 4, 7 give 1; 2, 5, 8 give 2; 3, 6, 9 give 0. That is 9 divisions.","Sort the cards by remainder: that makes 3 groups, and not a single pair had to be compared.","Each group can be named after its smallest number — 1, 2 and 3: the name leads straight to the whole group."],"gain":["9 divisions instead of 36 pair checks — 4 times fewer.","For 10 thousand cards: 10 thousand divisions instead of 50 million pair checks (about 0.5 seconds)."],"whenToUse":"When items must be sorted into groups by a shared feature, and that feature can be found for each item on its own.","needs":["the feature is found for each item by itself","the same feature means the same group, a different feature means a different group"],"guarantees":"Every card lands in exactly one group, and the groups do not overlap.","work":"One division per card."}},"en":{"naive":{"how":"check every pair of cards for equal remainders","unit":"pair checks","formula":"9 cards: 9 × 8 ÷ 2 pairs"},"method":{"unit":"divisions","formula":"9 cards × 1 division by 3"},"gainText":"4 times fewer operations (36 / 9)","scale":{"n":"10 thousand cards, ~10⁸ operations per second","naive":"10⁴ × (10⁴ − 1) ÷ 2 ≈ 5·10⁷ pair checks — about 0.5 seconds","method":"10 thousand divisions — instant","plot":{"nName":"how many cards"}}}},"PandigitalCheck":{"id":"PandigitalCheck","problem":"Проверять «каждая цифра ровно один раз», пересчитывая каждую цифру по всему числу, медленно.","problemExample":"Проверить, что в числе 18365472 каждая цифра от 1 до 8 встречается ровно один раз.","naive":{"how":"для каждой цифры 1–8 пересчитать её вхождения по всему числу","cost":"64","unit":"сравнений цифр","formula":"8 искомых цифр × 8 мест в числе"},"method":{"cost":"8","unit":"отметок","formula":"8 цифр × 1 отметка в своей ячейке","how":"каждая цифра ставит отметку в ячейку со своим номером"},"gainText":"в 8 раз меньше операций (64 / 8)","keyIdea":"Цифра сама указывает номер своей ячейки; искать её не нужно.","how":["Завести 8 пустых ячеек с номерами 1–8.","Каждая цифра числа ставит отметку в ячейку со своим номером.","Ячейка уже отмечена или цифра 0/9 — ответ «нет».","Проверить, что длина числа ровно 8: все 8 ячеек отмечены."],"props":{"time":"O(k)","space":"O(k)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["k — сколько цифр (здесь 8); k ≤ 10 — цифр всего 10","длина числа равна k"],"input":"строка цифр и k","output":"да или нет","gives":"ответ «да» только если каждая цифра 1..k встретилась ровно один раз","timePlain":"O(k) — одна отметка на цифру","spacePlain":"O(k) — k ячеек, не больше 10"},"scale":{"n":"10⁶ девятизначных кандидатов, ~10⁸ простых операций в секунду","naive":"для 9-значных: 9 × 9 = 81 сравнение × 10⁶ = 8,1·10⁷ — около секунды","method":"9 цифр × 1 отметка = 9; × 10⁶ = 9·10⁶ — около 0,1 с","plot":{"n":6,"naive":7.90849,"method":6.95424,"nc":"n","mc":"n"}},"story":{"ru":{"trick":"отметками в ячейках","task":"В числе 18365472 каждая цифра от 1 до 8 встречается ровно один раз?","headOn":"В лоб: для каждой цифры от 1 до 8 просматриваем всё число — 8 цифр × 8 мест = 64 сравнения.","notice":"Цифра сама говорит, куда её положить: цифра 5 — в ячейку номер 5. Ничего искать не нужно — хватит одной отметки на цифру.","steps":["Готовим 8 пустых ячеек с номерами от 1 до 8.","Каждая цифра числа ставит отметку в свою ячейку: 1 — в ячейку 1, 8 — в ячейку 8, и так далее. Все 8 ячеек отмечены по одному разу — ответ «да».","Для числа 18365572 шестая цифра 5 попадает в уже занятую ячейку 5, а ячейка 4 остаётся пустой — ответ «нет»."],"gain":["8 отметок вместо 64 сравнений.","Проверить миллион девятизначных чисел — 9 миллионов отметок вместо 81 миллиона сравнений."],"whenToUse":"Когда нужно проверить, что каждая цифра (или каждая вещь из небольшого набора) встречается ровно один раз.","needs":["цифр немного — не больше 10, по ячейке на каждую","цифр в числе столько же, сколько ячеек"],"guarantees":"«Да» — только если каждая цифра встретилась ровно один раз.","work":"Одна отметка на каждую цифру."},"en":{"trick":"ticking boxes","task":"Does each digit from 1 to 8 appear exactly once in the number 18365472?","headOn":"Head-on: for each digit from 1 to 8 look through the whole number — 8 digits × 8 places = 64 comparisons.","notice":"A digit tells you where it goes: the digit 5 goes into box 5. Nothing needs to be searched — one tick per digit is enough.","steps":["Set out 8 empty boxes numbered 1 to 8.","Each digit of the number ticks its own box: 1 ticks box 1, 8 ticks box 8, and so on. All 8 boxes are ticked exactly once — the answer is yes.","For the number 18365572 the sixth digit, 5, lands in box 5, which is already ticked, and box 4 stays empty — the answer is no."],"gain":["8 ticks instead of 64 comparisons.","Checking a million nine-digit numbers takes 9 million ticks instead of 81 million comparisons."],"whenToUse":"When you need to check that each digit (or each item of a small set) appears exactly once.","needs":["there are few digits — at most 10, one box each","the number has as many digits as there are boxes"],"guarantees":"\"Yes\" only when every digit appears exactly once.","work":"One tick per digit."}},"en":{"naive":{"how":"for each digit 1–8, look it up in the whole number","unit":"digit comparisons","formula":"8 digits to find × 8 places in the number"},"method":{"unit":"ticks","formula":"8 digits × 1 tick in their own box"},"scale":{"n":"10⁶ nine-digit candidates, ~10⁸ simple operations per second","naive":"9 × 9 = 81 comparisons × 10⁶ = 8.1·10⁷ — about a second","method":"9 ticks × 10⁶ = 9·10⁶ — about 0.1 s"},"gainText":"8 times fewer operations (64 / 8)"}},"EuclidsFormula":{"id":"EuclidsFormula","problem":"Прямоугольные треугольники с целыми сторонами ищут перебором пар сторон, а пар очень много.","problemExample":"Найти прямоугольный треугольник с целыми сторонами и периметром 12 (ответ 3, 4, 5).","naive":{"how":"перебрать пары сторон a < b < c с a + b + c = 12","cost":"7","unit":"проверенных пар сторон","formula":"a = 1: 4 пары; a = 2: 2 пары; a = 3: 1 пара"},"method":{"cost":"1","unit":"проверенных пар (m, n)","formula":"только m = 2, n = 1 даёт периметр 2 × m × (m + n) не больше 12","how":"строить тройки из пар (m, n) формулой"},"gainText":"в 7 раз меньше проверок (7 / 1)","keyIdea":"Любая примитивная тройка строится из пары (m, n); стороны перебирать не нужно.","how":["Перебрать m > n > 0, пока периметр 2m(m + n) не больше предела.","Оставить пары взаимно простые и разной чётности: (2, 1).","Вычислить стороны: a = m² − n² = 3, b = 2mn = 4, c = m² + n² = 5.","Добавить кратные: × 2 даёт 6, 8, 10 с периметром 24."],"props":{"time":"O(√P)","space":"O(1)","timeRank":3,"spaceRank":1,"exact":"точный","needs":["m и n взаимно просты (общий делитель только 1)","одно из m, n чётное, другое нечётное"],"input":"пара (m, n)","output":"пифагорова тройка","gives":"каждая примитивная тройка (стороны без общего делителя) получается ровно один раз","timePlain":"O(√P) — m не больше √(P/2)","spacePlain":"O(1) — хранятся текущие m и n"},"scale":{"n":"все периметры до 1000, ~10⁸ операций в секунду","naive":"перебор пар сторон: 2,8·10⁷ пар — около 0,3 секунды","method":"155 пар (m, n); 70 из них подходят, остальные треугольники — их увеличенные копии","plot":{"n":3,"naive":7.44716,"method":2.19033,"nc":"n3","mc":"n","est":"both","nName":"наибольший периметр"}},"story":{"ru":{"trick":"построением из пары m и n","task":"Нужно найти прямоугольный треугольник с целыми сторонами и периметром 12.","headOn":"В лоб: перебираем две меньшие стороны a < b, третью считаем как 12 − a − b и проверяем, прямой ли угол (a² + b² = c²): 7 пар, подходит только 3, 4, 5.","notice":"Любой такой треугольник можно построить из двух чисел m и n: его стороны равны m² − n², 2 × m × n и m² + n², и угол между первыми двумя всегда прямой.","steps":["Периметр такого треугольника равен 2 × m × (m + n); чтобы получилось 12, подходит только m = 2, n = 1.","Стороны: 2² − 1² = 3, 2 × 2 × 1 = 4, 2² + 1² = 5. Проверка: 9 + 16 = 25, периметр 3 + 4 + 5 = 12.","Если умножить все стороны на 2, получится треугольник 6, 8, 10 с периметром 24 — так строятся и все остальные."],"gain":["1 пара чисел вместо 7 пар сторон.","Для всех периметров до 1000 — 155 пар (m, n) вместо 28 миллионов пар сторон."],"whenToUse":"Когда нужно найти или перебрать прямоугольные треугольники с целыми сторонами.","needs":["m больше n, и у m и n нет общих делителей","одно из чисел m, n чётное, а другое нечётное — иначе треугольники повторяются"],"guarantees":"Так получается каждый треугольник без общего множителя, ровно один раз; остальные — его увеличенные копии.","work":"Одна пара (m, n) — один треугольник, без перебора сторон."},"en":{"trick":"building from a pair m and n","task":"Find a right triangle with whole-number sides and a perimeter of 12.","headOn":"Head-on: try the two shorter sides a < b, take the third as 12 − a − b, and check for a right angle (a² + b² = c²): 7 pairs, and only 3, 4, 5 works.","notice":"Every such triangle can be built from two numbers m and n: its sides are m² − n², 2 × m × n and m² + n², and the angle between the first two is always a right angle.","steps":["The perimeter of such a triangle is 2 × m × (m + n); to get 12, only m = 2, n = 1 fits.","Sides: 2² − 1² = 3, 2 × 2 × 1 = 4, 2² + 1² = 5. Check: 9 + 16 = 25, and the perimeter is 3 + 4 + 5 = 12.","Doubling every side gives the triangle 6, 8, 10 with perimeter 24 — that is how all the others are built."],"gain":["1 pair of numbers instead of 7 pairs of sides.","For every perimeter up to 1000: 155 pairs (m, n) instead of 28 million pairs of sides."],"whenToUse":"When you need to find or list right triangles with whole-number sides.","needs":["m is bigger than n, and m and n have no common divisor","one of m, n is even and the other odd — otherwise triangles repeat"],"guarantees":"Every triangle without a common factor comes out exactly once; the rest are its enlarged copies.","work":"One pair (m, n) gives one triangle, with no trying of sides."}},"en":{"naive":{"how":"try the two shorter sides with a + b + c = 12","unit":"pairs of sides checked","formula":"a = 1: 4 pairs; a = 2: 2 pairs; a = 3: 1 pair"},"method":{"unit":"pairs (m, n) checked","formula":"only m = 2, n = 1 keeps the perimeter 2 × m × (m + n) within 12"},"gainText":"7 times fewer checks (7 / 1)","scale":{"n":"every perimeter up to 1000, ~10⁸ operations per second","naive":"trying pairs of sides: 2.8·10⁷ pairs — about 0.3 seconds","method":"155 pairs (m, n); 70 of them fit, the other triangles are their enlarged copies","plot":{"nName":"the largest perimeter"}}}},"ChampernowneConstant":{"id":"ChampernowneConstant","problem":"Чтобы узнать цифру на далёкой позиции строки 123456789101112…, выписывать строку до неё долго.","problemExample":"Узнать, какая цифра стоит на 12-й позиции строки 123456789101112… (ответ 1 из числа 11).","naive":{"how":"выписывать числа 1, 2, 3, … подряд до 12-й цифры","cost":"12","unit":"выписанных цифр","formula":"9 цифр (1–9) + 2 цифры числа 10 + 1 цифра числа 11"},"method":{"cost":"2","unit":"действия","formula":"вычитание 12 − 9 = 3 + деление (3 − 1) ÷ 2 = 1, остаток 0","how":"вычитать целые блоки чисел одной длины"},"gainText":"в 6 раз меньше операций (12 / 2)","keyIdea":"Однозначные числа занимают ровно 9 позиций; их вычитаем целым блоком.","how":["Вычесть блок однозначных чисел: 9 чисел × 1 цифра = 9, позиция 12 − 9 = 3.","Остаток 3 меньше блока двузначных (90 × 2 = 180) — дальше не вычитать.","Разделить (3 − 1) на длину 2: частное 1 — это число 10 + 1 = 11.","Остаток 0 — первая цифра числа 11: это 1."],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["позиции считаются с 1","числа идут подряд 1, 2, 3, … без пропусков"],"input":"позиция n","output":"цифра на позиции","gives":"цифра на любой позиции без построения строки","timePlain":"O(log n) — одно вычитание на каждую длину чисел: для позиции n длин около числа цифр в n","spacePlain":"O(1) — хранятся позиция и длина"},"scale":{"n":"позиция 10⁶ (Project Euler №40)","naive":"строка из 10⁶ выписанных цифр","method":"5 вычитаний блоков (9·1 = 9, 90·2 = 180, 900·3 = 2700, 9000·4 = 36 000, 90 000·5 = 450 000) — по одному на длину чисел, + 1 деление","plot":{"n":6,"naive":6,"method":0.77815,"nc":"n","mc":"log"}},"story":{"ru":{"trick":"перескоком целых блоков","task":"Выписываем числа подряд без пробелов: 123456789101112… Какая цифра стоит на 12-м месте?","headOn":"В лоб: выписываем и считаем — 9 цифр от 1 до 9, ещё 2 цифры числа 10, ещё 1 цифра числа 11: 12 выписанных цифр. Для миллионного места пришлось бы выписать миллион цифр.","notice":"Однозначные числа 1…9 занимают ровно 9 мест, двузначные 10…99 — 90 · 2 = 180 мест. Целый блок можно перескочить одним вычитанием.","steps":["12 − 9 = 3: перескакиваем однозначные числа — нужно 3-е место среди двузначных.","У двузначных чисел по 2 цифры: места 1–2 — число 10, места 3–4 — число 11. 3-е место — первая цифра числа 11, это 1."],"gain":["2 действия вместо 12 выписанных цифр.","Для миллионного места — 5 вычитаний блоков (9, 180, 2700, 36 000, 450 000) и одно деление вместо миллиона выписанных цифр."],"whenToUse":"Когда нужна цифра на далёком месте строки из выписанных подряд чисел.","needs":["места считаем с 1","числа идут подряд, без пропусков"],"guarantees":"Точная цифра на любом месте — без выписывания строки.","work":"Одно вычитание на каждую длину чисел и одно деление."},"en":{"trick":"skipping whole blocks","task":"Write the numbers in a row with no spaces: 123456789101112… Which digit is in 12th place?","headOn":"Head-on: write them out and count — 9 digits for 1 to 9, 2 more for the number 10, 1 more for 11: 12 digits written. For the millionth place you would have to write a million digits.","notice":"The one-digit numbers 1…9 take exactly 9 places, the two-digit numbers 10…99 take 90 · 2 = 180 places. A whole block can be skipped with one subtraction.","steps":["12 − 9 = 3: skip the one-digit numbers — we need the 3rd place among the two-digit ones.","Two-digit numbers have 2 digits each: places 1–2 are the number 10, places 3–4 are 11. The 3rd place is the first digit of 11, which is 1."],"gain":["2 operations instead of writing out 12 digits.","For the millionth place — 5 block subtractions (9, 180, 2700, 36,000, 450,000) and one division instead of writing a million digits."],"whenToUse":"When you need the digit at a distant place in a string of numbers written one after another.","needs":["places are counted from 1","the numbers follow one another with no gaps"],"guarantees":"The exact digit at any place, without writing the string out.","work":"One subtraction per length of number, plus one division."}},"en":{"naive":{"how":"write the numbers 1, 2, 3, … in a row up to the 12th digit","unit":"digits written","formula":"9 digits (1–9) + 2 digits of 10 + 1 digit of 11"},"method":{"unit":"operations","formula":"subtraction 12 − 9 = 3 + division (3 − 1) ÷ 2 = 1, remainder 0"},"scale":{"n":"place 10⁶","naive":"a string of 10⁶ digits written out","method":"5 block subtractions (9·1 = 9, 90·2 = 180, 900·3 = 2700, 9000·4 = 36,000, 90,000·5 = 450,000) — one per length of number, + 1 division"},"gainText":"6 times fewer operations (12 / 2)"}},"DigitSumDivisibilityRule":{"id":"DigitSumDivisibilityRule","problem":"Проверять на простоту все числа из цифр 1…n (каждая цифра по разу) всех длин n = 1–9 — почти полмиллиона перестановок.","problemExample":"Для длин n = 1–9 выяснить, может ли число из цифр 1..n, каждая по разу, быть простым.","naive":{"how":"проверить все перестановки цифр 1..n для каждой длины n = 1–9","cost":"409113","unit":"проверенных чисел","formula":"1 + 2 + 6 + 24 + … + 362 880 — все длины от 1 до 9"},"method":{"cost":"5064","unit":"проверенных чисел","formula":"только длины 4 и 7: 24 + 5040","how":"отбросить длины, где сумма цифр делится на 3"},"gainText":"в 81 раз меньше проверок (409 113 / 5064)","keyIdea":"Сумма цифр 1..n одна для всех перестановок; делится на 3 — отбрасываем всю длину.","how":["Для каждой длины посчитать сумму цифр: n(n + 1) / 2.","Взять остаток этой суммы от деления на 3.","Остаток 0 — все перестановки делятся на 3, длину отбросить: 2, 3, 5, 6, 8, 9.","Перебрать перестановки только оставшихся длин 4 и 7."],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["делитель 3 или 9","число записано в десятичной системе"],"input":"набор цифр","output":"делится ли число на 3","gives":"отброшенная длина гарантированно не содержит простых чисел","timePlain":"O(1) — одна формула на длину","spacePlain":"O(1) — хранится одна сумма"},"scale":{"n":"задача и так конечная: длины 1–9","naive":"409 113 перестановок на проверку простоты","method":"5064 перестановки длин 4 и 7","plot":{"n":0.95424,"naive":5.61184,"method":3.70449,"nc":"nf","mc":"nf"}},"story":{"ru":{"trick":"признаком делимости на 3","task":"Берём числа из цифр 1…n, где каждая цифра стоит ровно один раз, — например, 2143 для n = 4. Для каких n от 1 до 9 среди таких чисел могут быть простые (делящиеся только на 1 и на себя)?","headOn":"В лоб: проверяем на простоту каждое такое число. Чисел длины n — 1 · 2 · … · n, а всех длин вместе 1 + 2 + 6 + … + 362 880 = 409 113.","notice":"Число делится на 3, если сумма его цифр делится на 3. А у всех чисел одной длины сумма цифр одна и та же: 1 + 2 + … + n. Если она делится на 3 — вся длина отпадает сразу.","steps":["Сумма цифр для длин 1…9: 1, 3, 6, 10, 15, 21, 28, 36, 45.","На 3 делятся суммы для n = 2, 3, 5, 6, 8, 9 — эти длины отпадают. Длина 1 — это само число 1, оно не простое.","Остаются n = 4 и n = 7: чисел этих длин 24 и 5040 — всего 5064 проверки."],"gain":["5064 проверки вместо 409 113 — в 81 раз меньше.","Длин всего 9, так что задача и так конечная: это и есть весь выигрыш."],"whenToUse":"Когда нужно отсеять числа, которые делятся на 3 (или на 9), не деля их.","needs":["число записано обычными цифрами","делим именно на 3 или на 9"],"guarantees":"Среди отброшенных длин простых чисел точно нет.","work":"Одна сумма цифр на каждую длину."},"en":{"trick":"the divisible-by-3 test","task":"Take numbers made of the digits 1…n, each digit used exactly once — say 2143 for n = 4. For which n from 1 to 9 can such a number be prime (divisible only by 1 and itself)?","headOn":"Head-on: test every such number for being prime. There are 1 · 2 · … · n numbers of length n, and 1 + 2 + 6 + … + 362,880 = 409,113 of all lengths together.","notice":"A number divides by 3 when the sum of its digits divides by 3. And all numbers of one length share the same digit sum: 1 + 2 + … + n. If that sum divides by 3, the whole length drops out at once.","steps":["Digit sums for lengths 1…9: 1, 3, 6, 10, 15, 21, 28, 36, 45.","The sums for n = 2, 3, 5, 6, 8, 9 divide by 3 — those lengths drop out. Length 1 is just the number 1, which is not prime.","n = 4 and n = 7 remain: there are 24 and 5040 numbers of those lengths — 5064 tests in all."],"gain":["5064 tests instead of 409,113 — 81 times fewer.","There are only 9 lengths, so the task is finite anyway: this is the whole gain."],"whenToUse":"When you need to rule out numbers divisible by 3 (or 9) without dividing them.","needs":["the number is written in ordinary digits","the divisor is exactly 3 or 9"],"guarantees":"The dropped lengths certainly contain no primes.","work":"One digit sum per length."}},"en":{"naive":{"how":"test every number made of the digits 1…n for every length n = 1–9","unit":"numbers tested","formula":"1 + 2 + 6 + 24 + … + 362,880 — all lengths 1 to 9"},"method":{"unit":"numbers tested","formula":"only lengths 4 and 7: 24 + 5040"},"scale":{"n":"the task is finite: lengths 1–9","naive":"409,113 numbers to test","method":"5064 numbers of lengths 4 and 7"},"gainText":"81 times fewer tests (409,113 / 5064)"}},"QuadraticFormula":{"id":"QuadraticFormula","problem":"Найти n по треугольному числу n(n + 1)/2 перебором n = 1, 2, 3, … медленно для больших чисел.","problemExample":"Найти n, для которого треугольное число n(n + 1)/2 равно 21, то есть n² + n − 42 = 0.","naive":{"how":"перебирать n = 1, 2, 3, … и считать n(n + 1)/2","cost":"18","unit":"арифметических действий","formula":"6 значений n × 3 действия (прибавить 1, умножить, разделить на 2)"},"method":{"cost":"5","unit":"арифметических действий","formula":"4 × 42, потом + 1, корень, − 1, ÷ 2","how":"решить квадратное уравнение формулой"},"gainText":"в 3,6 раза меньше действий (18 / 5); при числе до 10¹⁸ — 5 действий вместо ~4·10⁹","keyIdea":"Корень берётся сразу из дискриминанта; перебирать n не нужно.","how":["Вычислить дискриминант (число под корнем в формуле): D = b² − 4ac = 1 + 168 = 169.","Проверить, что D — точный квадрат: 169 = 13².","Найти корни: n = (−1 ± 13) / 2, то есть 6 и −7.","Отбросить отрицательный корень −7: ответ n = 6."],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["D — точный квадрат целого числа (иначе целого n нет)","−b + √D делится на 2a без остатка"],"input":"коэффициенты a, b, c","output":"корни уравнения","gives":"целое n находится за одну формулу, либо доказано, что его нет","timePlain":"O(1) — одна формула при любом размере числа","spacePlain":"O(1) — хранятся D и корень"},"scale":{"n":"до 10¹⁸ точек в треугольнике (~10⁸ действий в секунду)","naive":"рядов около 1,4·10⁹, по 3 действия на проверку ≈ 4·10⁹ — около 40 секунд","method":"5 действий — мгновенно","plot":{"n":18,"naive":9.60206,"method":0.69897,"nc":"sqrt","mc":"1","nName":"сколько точек в треугольнике"}},"story":{"ru":{"trick":"готовой формулой для уравнения с n²","task":"Треугольник сложен из 21 точки: 1 точка в первом ряду, 2 во втором и так далее. Сколько в нём рядов?","headOn":"В лоб: считаем точки для 1, 2, 3… рядов по формуле n × (n + 1) ÷ 2 — прибавить 1, умножить, разделить на 2, 3 действия: 1, 3, 6, 10, 15, 21. Это 6 проверок, 18 действий.","notice":"Условие n × (n + 1) ÷ 2 = 21 — это уравнение n² + n − 42 = 0, а у таких уравнений ответ находится сразу по готовой формуле, без перебора.","steps":["По формуле: 4 × 42 = 168, 1 + 168 = 169, √169 = 13, −1 + 13 = 12, 12 ÷ 2 = 6 — 5 действий.","Формула даёт два ответа, 6 и −7; рядов меньше нуля не бывает, поэтому ответ — 6 рядов (6 × 7 ÷ 2 = 21)."],"gain":["5 действий вместо 18.","Если точек до 10¹⁸, перебор дойдёт примерно до 1,4 миллиарда рядов (около 40 секунд), а формула — всё те же 5 действий."],"whenToUse":"Когда нужное число задано уравнением, в котором неизвестное стоит в квадрате: n², n и просто число.","needs":["уравнение приводится к виду n² + b × n + c = 0","ответ должен быть целым — корень, здесь из 169, извлекается точно"],"guarantees":"Находятся все решения уравнения; лишние, например отрицательные, отбрасываются по смыслу задачи.","work":"Всегда 5 действий, каким бы большим ни было число."},"en":{"trick":"the ready-made formula for equations with n²","task":"A triangle is made of 21 dots: 1 dot in the first row, 2 in the second, and so on. How many rows does it have?","headOn":"Head-on: count the dots for 1, 2, 3… rows with n × (n + 1) ÷ 2 — add 1, multiply, halve, 3 steps each: 1, 3, 6, 10, 15, 21. That is 6 checks and 18 steps.","notice":"The condition n × (n + 1) ÷ 2 = 21 is the equation n² + n − 42 = 0, and equations like that are solved straight away by a ready-made formula, without trying values.","steps":["By the formula: 4 × 42 = 168, 1 + 168 = 169, √169 = 13, −1 + 13 = 12, 12 ÷ 2 = 6 — 5 steps.","The formula gives two answers, 6 and −7; a triangle cannot have fewer than zero rows, so the answer is 6 rows (6 × 7 ÷ 2 = 21)."],"gain":["5 steps instead of 18.","With up to 10¹⁸ dots, trying rows would go up to about 1.4 billion (about 40 seconds), while the formula still takes 5 steps."],"whenToUse":"When the number you want is given by an equation in which the unknown is squared: n², n and a plain number.","needs":["the equation can be written as n² + b × n + c = 0","the answer must be whole — the square root, here of 169, comes out exactly"],"guarantees":"Every solution of the equation is found; the unsuitable ones, such as negative ones, are dropped by common sense.","work":"Always 5 steps, however big the number."}},"en":{"naive":{"how":"try n = 1, 2, 3, … and compute n × (n + 1) ÷ 2","unit":"arithmetic steps","formula":"6 values of n × 3 steps each (add 1, multiply, halve)"},"method":{"unit":"arithmetic steps","formula":"4 × 42, then + 1, square root, − 1, ÷ 2"},"gainText":"3.6 times fewer steps (18 / 5); with up to 10¹⁸ dots, 5 steps instead of ~4·10⁹","scale":{"n":"up to 10¹⁸ dots in the triangle (~10⁸ steps per second)","naive":"about 1.4·10⁹ rows, 3 steps per check ≈ 4·10⁹ — about 40 seconds","method":"5 steps — instant","plot":{"nName":"how many dots are in the triangle"}}}},"MillerRabinPrimalityTest":{"id":"MillerRabinPrimalityTest","problem":"Проверка простоты делением на все числа до √n слишком долгая для чисел около 10¹⁸.","problemExample":"Проверить, простое ли 25, с помощью свидетеля a = 2.","naive":{"how":"делить 25 на 2, 3, 4, 5 до √25 = 5","cost":"4","unit":"пробных деления","formula":"25 на 2, 3, 4, 5; на 5 делится"},"method":{"cost":"4","unit":"умножений с остатком","formula":"2 в степени 3: 2 умножения; затем 2 возведения в квадрат: 8 → 14 → 21","how":"возводить свидетеля в степени и смотреть, придёт ли к 1 или 24"},"gainText":"на 25 работы поровну (4 деления против 4 умножений); выигрыш на больших числах: около 10¹⁸ — 10⁹ делений против ~1440 умножений","keyIdea":"Для простого n степени свидетеля обязаны прийти к 1 или n − 1.","how":["Записать n − 1 = 24 = 3 · 2³: нечётная часть d = 3, показатель двойки r = 3.","Вычислить 2 в степени d = 3 по модулю 25 (остаток от деления на 25): 8.","Возвести в квадрат r − 1 = 2 раза: 8 → 14 → 21.","Ни разу не получилось 1 или 24 — значит 25 составное."],"props":{"time":"O(k log³ n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"вероятностный","needs":["n нечётное и больше 3","свидетель a не делится на n"],"input":"число n","output":"простое или составное","gives":"вероятностный в общем случае; для n < 2⁶⁴ ≈ 1,8·10¹⁹ набор из 12 свидетелей даёт точный ответ","timePlain":"k — число свидетелей (для n < 2⁶⁴ хватает 12); на каждого ~120 умножений: ~60 бит числа 10¹⁸ × 2 (возведение в степень + квадраты); на шкале — логарифмическое деление: работа растёт как куб числа цифр","spacePlain":"хранятся n, свидетель и текущая степень"},"scale":{"n":"n ≈ 10¹⁸, ~10⁸ простых операций в секунду","naive":"√n = 10⁹ пробных делений — около 10 секунд","method":"12 свидетелей × ~120 умножений ≈ 1440 умножений — мгновенно","plot":{"n":18,"naive":9,"method":3.15836,"nc":"sqrt","mc":"log"}},"story":{"ru":{"trick":"проверкой степенями","task":"Нужно узнать, простое ли число 25 — делится ли оно только на 1 и на себя. Способ должен работать быстро и для чисел около 10¹⁸.","headOn":"В лоб: делим 25 на 2, 3, 4, 5 — до числа, которое в квадрате даёт 25. На 5 делится: 25 составное, 4 деления. Но для числа около 10¹⁸ таких делений будет миллиард.","notice":"У простого числа n есть свойство: если возвести 2 в степень, а потом возводить в квадрат ещё и ещё, каждый раз оставляя только остаток от деления на n, то цепочка остатков обязательно встретит 1 или n − 1. Не встретила — n точно составное.","steps":["Раскладываем 25 − 1 = 24 = 3 × 2 × 2 × 2: нечётная часть 3 и три двойки. Значит, начинаем со степени 3 и возводим в квадрат дважды.","2 в степени 3 — это 8. В квадрате 64, остаток от деления на 25 — 14. Ещё раз в квадрат: 196, остаток 21.","Цепочка 8, 14, 21 не встретила ни 1, ни 24 — значит, 25 составное. Хватило 4 умножений."],"gain":["Для 25 — 4 умножения против 4 делений, поровну.","Для числа около 10¹⁸ — около 1440 умножений против миллиарда делений."],"whenToUse":"Когда нужно быстро проверить, простое ли большое число — до 10¹⁸ и дальше.","needs":["число нечётное и больше 3"],"guarantees":"Если цепочка не встретила 1 или n − 1, число точно составное. Для чисел меньше 1,8 · 10¹⁹ проверка 12 разными числами вместо одной двойки даёт точный ответ.","work":"Около 120 умножений на одно проверочное число для чисел около 10¹⁸."},"en":{"trick":"a test by powers","task":"Is 25 a prime number — does it divide only by 1 and by itself? The way of checking should also be fast for numbers around 10¹⁸.","headOn":"Head-on: divide 25 by 2, 3, 4, 5 — up to the number whose square is 25. It divides by 5: 25 is not prime, 4 divisions. But for a number around 10¹⁸ that would be a billion divisions.","notice":"A prime n has a property: raise 2 to a power, then square it again and again, each time keeping only the remainder after dividing by n — the chain of remainders is sure to hit 1 or n − 1. If it does not, n is certainly not prime.","steps":["Split 25 − 1 = 24 = 3 × 2 × 2 × 2: the odd part 3 and three 2s. So we start with the power 3 and then square twice.","2 to the power 3 is 8. Squared, that is 64, remainder after dividing by 25: 14. Squared again: 196, remainder 21.","The chain 8, 14, 21 never hit 1 or 24 — so 25 is not prime. 4 multiplications were enough."],"gain":["For 25: 4 multiplications against 4 divisions, a draw.","For a number around 10¹⁸: about 1440 multiplications against a billion divisions."],"whenToUse":"When you need to check quickly whether a big number is prime — up to 10¹⁸ and beyond.","needs":["the number is odd and bigger than 3"],"guarantees":"If the chain never hits 1 or n − 1, the number is certainly not prime. For numbers below 1.8 · 10¹⁹, testing with 12 different numbers instead of just 2 gives an exact answer.","work":"About 120 multiplications per test number, for numbers around 10¹⁸."}},"en":{"naive":{"how":"divide 25 by 2, 3, 4, 5 — up to the number whose square is 25","unit":"trial divisions","formula":"25 by 2, 3, 4, 5; it divides by 5"},"method":{"unit":"multiplications with remainder","formula":"2 to the power 3: 2 multiplications; then 2 squarings: 8 → 14 → 21"},"scale":{"n":"a number around 10¹⁸ (at ~10⁸ simple operations per second)","naive":"10⁹ trial divisions — about 10 seconds","method":"12 test numbers × ~120 multiplications ≈ 1440 multiplications — instant"},"gainText":"for 25 the work is equal (4 divisions vs 4 multiplications); the gain is on big numbers: near 10¹⁸, 10⁹ divisions vs about 1440 multiplications"}},"BitmaskSubsetEnumeration":{"id":"BitmaskSubsetEnumeration","problem":"Перебирать подмножества вложенными циклами или рекурсией громоздко: циклов нужно столько, сколько позиций.","problemExample":"Перечислить все подмножества из 2 позиций среди 3 позиций p0, p1, p2.","naive":{"how":"строить каждое из 8 подмножеств отдельным списком","cost":"12","unit":"записанных игрушек","formula":"0 + 1 + 1 + 2 + 1 + 2 + 2 + 3"},"method":{"cost":"8","unit":"перебранных чисел","formula":"числа от 0 до 7","how":"перебирать числа-маски"},"gainText":"в 1,5 раза меньше работы (12 / 8)","keyIdea":"Подмножество — это число: бит i равен 1, если позиция i выбрана.","how":["Перебрать числа m от 0 до 2³ − 1 = 7.","Бит i числа m (маска) означает: позиция pi выбрана.","Посчитать единичные биты m — это размер подмножества.","Оставить маски с двумя единицами: 011, 101, 110."],"props":{"time":"O(2ᴺ)","space":"O(1)","timeRank":7,"spaceRank":1,"exact":"точный","needs":["N ≤ 25 (2²⁵ ≈ 3·10⁷ масок)","бит i соответствует позиции i"],"input":"N позиций","output":"все подмножества","gives":"каждое подмножество встречается ровно один раз","timePlain":"одна маска на каждое подмножество; N — число позиций","spacePlain":"хранится одно число-маска"},"scale":{"n":"20 игрушек","naive":"2²⁰ списков, около 10⁷ записанных игрушек","method":"2²⁰ ≈ 10⁶ чисел","plot":{"n":1.30103,"naive":7,"method":6.02119,"nc":"2n","mc":"2n","nName":"сколько игрушек"}},"story":{"ru":{"trick":"выбор как число из нулей и единиц","task":"Есть три игрушки: А, Б и В. Нужно перечислить все способы выбрать ровно две из них.","headOn":"В лоб: выписываем каждый возможный выбор отдельным списком — 8 списков, в которых 0 + 1 + 1 + 2 + 1 + 2 + 2 + 3 = 12 записанных игрушек.","notice":"Любой выбор можно записать тремя цифрами: 1 — игрушку взяли, 0 — нет. Например, 101 — взяли В и А. Все выборы — это просто числа от 0 до 7, записанные нулями и единицами.","steps":["Перебираем числа от 0 до 7: цифры каждого числа сразу показывают, какие игрушки взяты.","Оставляем числа ровно с двумя единицами: 011, 101, 110 — три способа. 8 чисел вместо 12 записей."],"gain":["8 чисел вместо 12 записанных игрушек.","Для 20 игрушек: около миллиона чисел вместо примерно 10 миллионов записей."],"whenToUse":"Когда нужно перебрать все способы выбрать часть из небольшого числа предметов.","needs":["предметов немного — до 20–25","каждому предмету отведена своя цифра"],"guarantees":"Каждый выбор встречается ровно один раз.","work":"Одно число на каждый возможный выбор."},"en":{"trick":"a choice as a number of 0s and 1s","task":"There are three toys: A, B and C. We need to list every way to choose exactly two of them.","headOn":"Head-on: write each possible choice out as a separate list — 8 lists holding 0 + 1 + 1 + 2 + 1 + 2 + 2 + 3 = 12 written toys.","notice":"Any choice can be written with three digits: 1 means the toy is taken, 0 means it is not. For example, 101 means C and A are taken. All the choices are just the numbers 0 to 7 written in 0s and 1s.","steps":["Go through the numbers 0 to 7: the digits of each number show at once which toys are taken.","Keep the numbers with exactly two 1s: 011, 101, 110 — three ways. 8 numbers instead of 12 writes."],"gain":["8 numbers instead of 12 written toys.","For 20 toys: about a million numbers instead of roughly 10 million writes."],"whenToUse":"When you need to go through every way to choose some of a small number of items.","needs":["there are few items — up to 20–25","each item has its own digit"],"guarantees":"Every choice appears exactly once.","work":"One number per possible choice."}},"en":{"naive":{"how":"write each of the 8 choices out as a separate list","unit":"written toys","formula":"0 + 1 + 1 + 2 + 1 + 2 + 2 + 3"},"method":{"unit":"numbers gone through","formula":"the numbers 0 to 7"},"scale":{"n":"20 toys","naive":"2²⁰ lists, about 10⁷ written toys","method":"2²⁰ ≈ 10⁶ numbers","plot":{"nName":"how many toys"}},"gainText":"1.5 times less work (12 / 8)"}}}};</script>
