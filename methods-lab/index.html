яется; повторный вызов с тем же аргументом читает готовое","how":["По аргументу проверить кэш (таблицу готовых ответов): есть ли ответ","Ответ есть — вернуть его без вычислений","Ответа нет — вычислить через рекурсивные вызовы","Сохранить вычисленный ответ в кэш по аргументу"],"props":{"time":"O(число состояний)","space":"O(число состояний)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["ответ зависит только от аргументов вызова","аргументы повторяются: в fib(4) fib(2) нужен дважды"],"input":"аргументы вызова","output":"значение функции","gives":"каждый аргумент вычисляется ровно один раз","timePlain":"вычислений столько, сколько разных аргументов: для fib(n) — n + 1","spacePlain":"по записи в кэше на каждый разный аргумент"},"gainText":"для fib(30): 59 вместо 2,7·10⁶","story":{"ru":{"trick":"записывать готовые ответы","task":"В ряду 0, 1, 1, 2, 3, 5… каждое число — сумма двух предыдущих. fib(n) — число на n-м месте, считая с нуля. Нужно найти fib(4).","headOn":"В лоб: fib(4) = fib(3) + fib(2), а fib(3) сам снова просит fib(2) — всего 9 расчётов, и fib(2) считается дважды.","notice":"Каждый найденный ответ можно записать в тетрадку. Когда тот же ответ понадобится снова, его не считают, а читают из тетрадки.","steps":["Первый раз fib(2) = 1 + 0 = 1 считаем и записываем в тетрадку.","Второй раз fib(2) читаем из тетрадки. Итог: 5 расчётов + 2 чтения = 7 вместо 9."],"gain":["7 вместо 9 для fib(4).","Для fib(30): 59 вместо 2,7 миллиона расчётов — без тетрадки их число растёт в 1,6 раза с каждым шагом."],"whenToUse":"Когда при расчёте одни и те же промежуточные ответы нужны много раз.","needs":["ответ зависит только от того, что спросили (от n)","одни и те же вопросы повторяются"],"guarantees":"Каждый ответ считается ровно один раз.","work":"Один расчёт на каждый разный вопрос плюс чтения из тетрадки."},"en":{"trick":"write the answers down","task":"In the row 0, 1, 1, 2, 3, 5… each number is the sum of the two before it. fib(n) is the number in place n, counting from zero. We need fib(4).","headOn":"Head-on: fib(4) = fib(3) + fib(2), and fib(3) asks for fib(2) all over again — 9 calculations in all, with fib(2) worked out twice.","notice":"Every answer we find can be written down in a notebook. When the same answer is needed again, we do not work it out — we read it from the notebook.","steps":["The first time, fib(2) = 1 + 0 = 1 is worked out and written in the notebook.","The second time, fib(2) is read from the notebook. Result: 5 calculations + 2 reads = 7 instead of 9."],"gain":["7 instead of 9 for fib(4).","For fib(30): 59 instead of 2.7 million calculations — without the notebook their number grows about 1.6 times with each step."],"whenToUse":"When the same intermediate answers are needed over and over during a calculation.","needs":["the answer depends only on what was asked (on n)","the same questions come up again"],"guarantees":"Every answer is worked out exactly once.","work":"One calculation per different question plus reads from the notebook."}},"en":{"naive":{"how":"work every answer out again each time it is needed","unit":"calculations","formula":"by levels: 1 + 2 + 4 + 2"},"method":{"unit":"calculations and notebook reads","formula":"5 calculations (fib(0) to fib(4)) + 2 reads"},"scale":{"n":"fib(30) (at ~10⁸ operations per second)","naive":"2,692,537 calculations — about 0.03 seconds, but growing about 1.6 times with each step","method":"31 calculations + 28 notebook reads = 59 — instant","plot":{"nName":"which number of the row"}},"gainText":"for fib(30): 59 instead of 2.7·10⁶","props":{"time":"O(number of different questions)","space":"O(number of different questions)"}}},"ExplicitStackRecursion":{"id":"ExplicitStackRecursion","problem":"Глубокая рекурсия упирается в предел стека вызовов: в Python около 1000 вложенных вызовов.","problemExample":"Цепочка D → C → B → A, у A ответ 0: найти длины D = 3, C = 2, B = 1.","naive":{"how":"вызывать функцию рекурсивно для каждого звена","cost":"4","unit":"вопросов, открытых одновременно","formula":"D ждёт C, C ждёт B, B ждёт A, A отвечает"},"method":{"cost":"1","unit":"вопрос, открытый одновременно","formula":"один вопрос; звенья лежат в своей стопке"},"scale":{"n":"цепочки длиной ~10³ и больше (при ~10⁸ операций в секунду)","naive":"~10³ вложенных вызовов — упор в предел Python (1000), ошибка","method":"1 вызов + список на 10³ звеньев — работает при любой длине","plot":{"n":3,"naive":3,"method":0,"nc":"n","mc":"1","y":"вложенных вызовов","budget":{"lg":3,"text":"предел Python = 1000 ждущих вопросов"}}},"keyIdea":"Свой список-стек хранит звенья вместо вложенных вызовов функции","how":["Спуск: класть звенья D, C, B в стек, пока не встретится A с известным ответом 0","Подъём: снять верхнее звено B и посчитать 0 + 1 = 1","Снять C: 1 + 1 = 2, затем D: 2 + 1 = 3","Записать ответы всех звеньев: D = 3, C = 2, B = 1"],"props":{"time":"O(n)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["цепочка без цикла, иначе спуск не закончится","в стек кладётся всё, что нужно подъёму (здесь само звено)"],"input":"начальное звено","output":"ответы всех звеньев","gives":"длина цепочки ограничена только памятью под список","timePlain":"n — длина цепочки; шагов 2n: n раз кладём в стек при спуске и n раз снимаем при подъёме","spacePlain":"по ячейке стека на каждое звено цепочки"},"gainText":"1 открытый вопрос вместо 4; шагов столько же, но длина цепочки не ограничена","story":{"ru":{"trick":"своей стопкой вместо вложенных вопросов","task":"Есть цепочка D → C → B → A: каждое звено указывает на следующее. Для каждого звена нужно узнать, сколько шагов от него до A.","headOn":"В лоб: D спрашивает у C, C — у B, B — у A, и каждый вопрос ждёт ответа внутри предыдущего. Сразу открыто 4 вопроса, а места для таких ждущих вопросов у компьютера мало — в языке Python около 1000.","notice":"Звенья можно не вкладывать друг в друга, а сложить в свою стопку: дойти по цепочке до A, складывая звенья, а потом снимать их по одному сверху.","steps":["Идём по цепочке от D к A и кладём D, C, B в стопку — открыт один вопрос.","Снимаем сверху B: у него 0 + 1 = 1 шаг до A. Затем C — 2, затем D — 3.","Все ответы готовы: D = 3, C = 2, B = 1. Открытым был всего один вопрос, а стопка может быть любой длины."],"gain":["Одновременно открыт 1 вопрос вместо 4.","Цепочка из миллиона звеньев в лоб не проходит — упирается в предел около 1000 ждущих вопросов, а со стопкой проходит."],"whenToUse":"Когда ответ звена зависит от следующего звена, а цепочка может быть очень длинной.","needs":["можно хранить список длиной с саму цепочку"],"guarantees":"Ответы те же, что в лоб, но длина цепочки не ограничена.","work":"Столько же шагов: каждое звено кладётся и снимается по одному разу."},"en":{"trick":"a stack of your own instead of nested questions","task":"There is a chain D → C → B → A: each link points to the next. For each link, find how many steps it is from A.","headOn":"Head-on: D asks C, C asks B, B asks A, and each question waits for its answer inside the one before. That is 4 questions open at once, and a computer has little room for waiting questions — about 1000 in the Python language.","notice":"The links do not have to be nested inside each other. Put them on a stack of your own instead: walk the chain down to A, piling up the links, then take them off the top one by one.","steps":["Walk the chain from D to A and put D, C, B on the stack — only one question is open.","Take B off the top: 0 + 1 = 1 step to A. Then C: 2, then D: 3.","All answers are ready: D = 3, C = 2, B = 1. Only one question was ever open, and the stack can be as long as needed."],"gain":["1 question open at a time instead of 4.","A chain of a million links fails head-on — it hits the limit of about 1000 waiting questions — but works with a stack."],"whenToUse":"When the answer for a link depends on the next link, and the chain may be very long.","needs":["a list as long as the chain itself can be stored"],"guarantees":"The same answers as head-on, with no limit on the chain length.","work":"The same number of steps: each link goes onto the stack and comes off once."}},"en":{"naive":{"how":"each link asks the next one and waits inside","unit":"questions open at once","formula":"D waits for C, C for B, B for A, A answers"},"method":{"unit":"questions open at once","formula":"one question; the links sit on our own stack"},"scale":{"n":"chains of about 10³ links and longer (at ~10⁸ operations per second)","naive":"~10³ nested questions — hits Python’s limit (1000), error","method":"1 question + a list of 10³ links — works for any length","plot":{"y":"questions open at once","budget":{"text":"Python’s limit: 1000 waiting questions"}}},"gainText":"1 open question instead of 4; the same number of steps, but no limit on the chain length"}},"SparseSet":{"id":"SparseSet","problem":"Очистка большого буфера обнуляет все его ячейки, даже если записано всего несколько.","problemExample":"Буфер из 12 ячеек, записаны 3 (ячейки 2, 6, 9): очистить его.","naive":{"how":"обнулить все ячейки буфера","cost":"12","unit":"обнулённых ячеек","formula":"все 12 ячеек ряда"},"method":{"cost":"6","unit":"действий вместе со списком","formula":"3 отметки в списке при записи + 3 обнуления по списку"},"scale":{"n":"буфер из 10⁵ ячеек, 10 записей между очистками (при ~10⁸ операций в секунду)","naive":"10⁵ обнулений на каждую очистку","method":"10 записей в реестр + 10 обнулений = 20 операций на очистку","plot":{"n":5,"naive":5,"method":1.30103,"nc":"n","mc":"1"}},"keyIdea":"Реестр записанных ячеек позволяет очищать только их, не обходя буфер","how":["Вести плотный список записанных ячеек (реестр): 2, 6, 9","Во втором массиве хранить позицию каждой ячейки в реестре: 0, 1, 2","При очистке пройти по реестру и обнулить 3 ячейки"],"props":{"time":"O(k)","space":"O(U)","timeRank":2,"spaceRank":4,"exact":"точный","needs":["верхняя граница U известна заранее (U — число ячеек буфера)","каждый ключ (номер ячейки) записан не больше одного раза"],"input":"ключи до границы U","output":"множество с быстрой очисткой","gives":"вставка, проверка и очистка без обхода всего буфера","timePlain":"очистка — по шагу на каждую записанную ячейку: O(k), k — число записанных; k много меньше U, поэтому на шкале отмечено ближайшее малое деление","spacePlain":"2 массива размером с буфер U"},"gainText":"в 2 раза меньше действий (12 / 6); чем больше ряд и меньше записей, тем больше разрыв","story":{"ru":{"trick":"списком записанных ячеек","task":"В ряду из 12 ячеек данные записаны только в трёх — с номерами 2, 6 и 9. Нужно очистить ряд — сделать все ячейки пустыми.","headOn":"В лоб: обнуляем все 12 ячеек, хотя 9 из них и так пустые.","notice":"Если при каждой записи отмечать номер ячейки в коротком списке, то для очистки хватит пройти только по этому списку.","steps":["При записи номера 2, 6 и 9 попадают в список — 3 действия.","Очищаем по списку: обнуляем ячейки 2, 6 и 9 — ещё 3 действия. Ряд чист за 6 действий, 9 пустых ячеек мы не трогали."],"gain":["6 действий вместо 12.","В ряду из 100 000 ячеек с 10 записями — 20 действий вместо 100 000 при каждой очистке."],"whenToUse":"Когда ряд ячеек большой, записей между очистками мало, а очищать приходится часто.","needs":["размер ряда известен заранее","каждая ячейка попадает в список один раз"],"guarantees":"После очистки все ячейки пусты; узнать, записана ли ячейка, тоже можно сразу.","work":"Очистка — одно действие на каждую записанную ячейку."},"en":{"trick":"a list of the cells in use","task":"In a row of 12 cells, only three hold data — cells 2, 6 and 9. The row has to be cleared: every cell made empty.","headOn":"Head-on: wipe all 12 cells, even though 9 of them are already empty.","notice":"If every time we write to a cell we note its number in a short list, then clearing only needs to go through that list.","steps":["While writing, the numbers 2, 6 and 9 go into the list — 3 operations.","Clear by the list: wipe cells 2, 6 and 9 — 3 more operations. The row is clean after 6, and the 9 empty cells were never touched."],"gain":["6 operations instead of 12.","In a row of 100,000 cells with 10 in use: 20 operations instead of 100,000 every time it is cleared."],"whenToUse":"When the row of cells is large, few cells are used between clears, and clearing happens often.","needs":["the size of the row is known in advance","each cell goes into the list only once"],"guarantees":"After clearing every cell is empty; you can also tell at once whether a cell is in use.","work":"Clearing takes one operation per cell in use."}},"en":{"naive":{"how":"wipe every cell of the row","unit":"cells wiped","formula":"all 12 cells of the row"},"method":{"unit":"operations, list included","formula":"3 notes in the list while writing + 3 wipes by the list"},"scale":{"n":"a row of 10⁵ cells, 10 in use between clears (at ~10⁸ operations per second)","naive":"10⁵ wipes per clear","method":"10 notes + 10 wipes = 20 operations per clear"},"gainText":"2 times fewer operations (12 / 6); the bigger the row and the fewer cells in use, the bigger the gap"}},"FastExponentiation":{"id":"FastExponentiation","problem":"Возвести число в степень 13 подряд — это 12 умножений; при показателе 10⁹ — миллиард умножений.","problemExample":"Вычислить 3¹³ = 1 594 323 меньшим числом умножений, чем 12.","naive":{"how":"умножать 3 на 3 двенадцать раз подряд","cost":"12","unit":"умножений","formula":"13 троек подряд — между ними 12 умножений"},"method":{"cost":"5","unit":"умножений","formula":"3 квадрата (9, 81, 6561) + 2 умножения результата (3 · 81, 243 · 6561)","how":"возводить в квадрат и перемножать нужные квадраты"},"gainText":"в 2,4 раза меньше умножений (12 / 5)","keyIdea":"Показатель 13 = 8 + 4 + 1: 3 квадрата (3², 3⁴, 3⁸) + 2 домножения — умножения результата на нужный квадрат.","how":["Разложить показатель 13 на степени двойки: 8 + 4 + 1 (двоичная запись 1101).","Возводить основание в квадрат: 3 → 3² → 3⁴ → 3⁸.","Перемножить квадраты, которые вошли в разложение: 3⁸ · 3⁴ · 3.","Итого 3 квадрата + 2 домножения = 5 умножений."],"props":{"time":"O(log n)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["операция ассоциативна: (a·b)·c = a·(b·c)","если нужен только остаток от деления — брать его после каждого умножения"],"input":"основание и показатель","output":"степень (по модулю)","gives":"не больше 2·⌊log₂ 13⌋ = 6 умножений, фактически вышло 5; для n = 10⁹ — не больше 60","timePlain":"O(log n), n — показатель: около двух умножений на каждую двоичную цифру показателя","spacePlain":"O(1) — хранятся 3 числа: результат, текущий квадрат, остаток показателя"},"scale":{"n":"показатель n = 10⁹, ~10⁸ простых операций в секунду","naive":"10⁹ умножений подряд — около 10 секунд на одно число","method":"до 60 умножений (30 квадратов + до 30 домножений — умножений результата на нужный квадрат) — мгновенно","plot":{"n":9,"naive":9,"method":1.77815,"nc":"n","mc":"log"}},"story":{"ru":{"trick":"возведением в квадрат","task":"Нужно вычислить 3¹³ — перемножить 13 троек.","headOn":"В лоб: умножаем на 3 раз за разом: 3 · 3 · 3 · … — между 13 тройками 12 умножений.","notice":"Квадрат уже сосчитанного числа даёт степень вдвое больше: 3² · 3² = 3⁴, 3⁴ · 3⁴ = 3⁸. А 13 = 8 + 4 + 1, поэтому 3¹³ = 3⁸ · 3⁴ · 3.","steps":["Делим 13 пополам с остатком: 13 → 6 → 3 → 1. На каждой строке число возводим в квадрат: 3, 9, 81, 6561 — это 3 умножения.","Где показатель нечётный — 13, 3 и 1, — берём число строки в результат: 3, потом 3 · 81 = 243, потом 243 · 6561 = 1 594 323. Ещё 2 умножения."],"gain":["5 умножений вместо 12.","Для степени миллиард — около 60 умножений вместо миллиарда."],"whenToUse":"Когда число нужно возвести в большую степень.","needs":["умножения можно группировать как угодно: (a · b) · c = a · (b · c)","если нужен только остаток от деления, его берут после каждого умножения"],"guarantees":"Не больше двух умножений на каждое деление показателя пополам.","work":"Около двух умножений на каждое деление показателя пополам — для 13 их 3, для миллиарда 30."},"en":{"trick":"repeated squaring","task":"Work out 3¹³ — thirteen 3s multiplied together.","headOn":"Head-on: multiply by 3 again and again: 3 · 3 · 3 · … — 13 threes need 12 multiplications.","notice":"Squaring a power you already have doubles it: 3² · 3² = 3⁴, 3⁴ · 3⁴ = 3⁸. And 13 = 8 + 4 + 1, so 3¹³ = 3⁸ · 3⁴ · 3.","steps":["Halve 13, dropping the remainder: 13 → 6 → 3 → 1. On each row square the number: 3, 9, 81, 6561 — that is 3 multiplications.","Where the exponent is odd — 13, 3 and 1 — take that row's number into the result: 3, then 3 · 81 = 243, then 243 · 6561 = 1,594,323. Two more multiplications."],"gain":["5 multiplications instead of 12.","For a power of a billion — about 60 multiplications instead of a billion."],"whenToUse":"When a number has to be raised to a large power.","needs":["multiplications can be grouped any way: (a · b) · c = a · (b · c)","if only the remainder of a division is needed, take it after every multiplication"],"guarantees":"At most two multiplications for each halving of the exponent.","work":"About two multiplications per halving of the exponent — 3 halvings for 13, 30 for a billion."}},"en":{"naive":{"how":"multiply by 3 twelve times in a row","unit":"multiplications","formula":"thirteen 3s in a row — 12 multiplications between them"},"method":{"unit":"multiplications","formula":"3 squarings (9, 81, 6561) + 2 multiplications of the result (3 · 81, 243 · 6561)"},"scale":{"n":"exponent n = 10⁹, ~10⁸ simple operations per second","naive":"10⁹ multiplications in a row — about 10 seconds per number","method":"up to 60 multiplications (30 squarings + up to 30 multiplications of the result) — instant"},"gainText":"2.4 times fewer multiplications (12 / 5)"}},"ModularArithmetic":{"id":"ModularArithmetic","problem":"Когда нужен только остаток, большое число считать целиком незачем: 34 × 5 = 170 или 1000¹⁰⁰⁰ из 3001 цифры.","problemExample":"Циферблат из 12 делений: где окажутся 34, 34 + 5 и 34 × 5?","naive":{"how":"отсчитывать деления по одному: 34, потом ещё 5, потом 34 × 5 = 170","cost":"209","unit":"шагов по циферблату","formula":"34 + 5 + 170 шагов по одному делению"},"method":{"cost":"5","unit":"действий","formula":"3 деления с остатком (34 → 10, 15 → 3, 50 → 2) + сложение 10 + 5 + умножение 10 × 5","how":"брать остаток от деления на 12 после каждого действия"},"gainText":"в 42 раза меньше операций (209 шагов / 5 операций)","keyIdea":"Полные обороты по 12 ничего не меняют; сразу берём остаток от деления.","how":["Взять остаток числа: 34 ÷ 12 = 2, остаток 10.","Сложить остатки: 10 + 5 = 15 → остаток 3.","Умножить остатки: 10 × 5 = 50 → остаток 2.","Проверка: 34 × 5 = 170 = 14 · 12 + 2 — тоже 2."],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["нужен только остаток от деления на m (m — число делений, здесь 12)","операции — сложение, вычитание, умножение (деление так не переносится)"],"input":"числа и модуль","output":"остаток результата","gives":"произведение двух остатков меньше 12 · 12 = 144 — числа не растут; ответ совпадает с остатком точного результата","timePlain":"O(1) — одно деление с остатком на каждую операцию","spacePlain":"O(1) — хранится одно число меньше модуля"},"scale":{"n":"последние 10 цифр суммы 1¹ + 2² + … + 1000¹⁰⁰⁰ (Project Euler №48)","naive":"число 1000¹⁰⁰⁰ из 3001 цифры — тысячи операций над длинными числами","method":"каждое промежуточное число не длиннее 20 цифр — доли секунды","plot":{"n":3,"naive":3.47727,"method":1.30103,"nc":"nlogn","mc":"1","y":"цифр в промежуточном числе","budget":null}},"story":{"ru":{"trick":"остатками","task":"На циферблате 12 делений: 0, 1, …, 11. Стрелка стоит на 0. Где она остановится, если пройти 34 деления? А если 34 + 5? А если 34 × 5?","headOn":"В лоб: отсчитываем по одному делению — 34 шага, ещё 5 шагов, потом 34 × 5 = 170 шагов. Всего 209 шагов.","notice":"Полный круг из 12 делений возвращает стрелку на место. Значит, полные круги можно выбросить и оставить только остаток: 34 = 2 · 12 + 10 — стрелка на 10.","steps":["34 ÷ 12 = 2, остаток 10: два полных круга, стрелка на 10.","34 + 5: берём остаток 10 + 5 = 15; 15 = 12 + 3 — стрелка на 3.","34 × 5: берём 10 × 5 = 50; 50 = 4 · 12 + 2 — стрелка на 2. Проверка: 170 = 14 · 12 + 2, тоже 2."],"gain":["5 действий вместо 209 шагов.","Последние 10 цифр суммы 1¹ + 2² + … + 1000¹⁰⁰⁰: в числе 1000¹⁰⁰⁰ 3001 цифра, а если держать только остатки, каждое число не длиннее 20 цифр."],"whenToUse":"Когда нужен только остаток от деления, а сами числа огромные.","needs":["нужен именно остаток — здесь от деления на 12","действия — сложение, вычитание, умножение; с делением так нельзя"],"guarantees":"Остаток получается тот же, что у точного ответа.","work":"Одно деление с остатком после каждого действия — числа не растут."},"en":{"trick":"working with remainders","task":"A dial has 12 marks: 0, 1, …, 11. The hand points at 0. Where does it stop after 34 marks? After 34 + 5? After 34 × 5?","headOn":"Head-on: count mark by mark — 34 steps, 5 more steps, then 34 × 5 = 170 steps. 209 steps in all.","notice":"A full turn of 12 marks brings the hand back to where it was. So full turns can be thrown away and only the remainder kept: 34 = 2 · 12 + 10 — the hand is at 10.","steps":["34 ÷ 12 = 2, remainder 10: two full turns, the hand is at 10.","34 + 5: take the remainder, 10 + 5 = 15; 15 = 12 + 3 — the hand is at 3.","34 × 5: take 10 × 5 = 50; 50 = 4 · 12 + 2 — the hand is at 2. Check: 170 = 14 · 12 + 2, also 2."],"gain":["5 operations instead of 209 steps.","The last 10 digits of 1¹ + 2² + … + 1000¹⁰⁰⁰: the number 1000¹⁰⁰⁰ has 3001 digits, but keeping only remainders, no number ever exceeds 20 digits."],"whenToUse":"When only the remainder of a division matters and the numbers themselves are huge.","needs":["it is the remainder you need — here, after dividing by 12","the operations are adding, subtracting and multiplying; division does not work this way"],"guarantees":"The remainder is the same as that of the exact answer.","work":"One division with remainder after each operation — the numbers never grow."}},"en":{"naive":{"how":"count the marks one by one: 34, then 5 more, then 34 × 5 = 170","unit":"steps around the dial","formula":"34 + 5 + 170 steps, one mark at a time"},"method":{"unit":"operations","formula":"3 divisions with remainder (34 → 10, 15 → 3, 50 → 2) + adding 10 + 5 + multiplying 10 × 5"},"scale":{"n":"the last 10 digits of 1¹ + 2² + … + 1000¹⁰⁰⁰","naive":"the number 1000¹⁰⁰⁰ has 3001 digits — thousands of operations on long numbers","method":"no intermediate number is longer than 20 digits — a fraction of a second","plot":{"y":"digits in an intermediate number"}},"gainText":"42 times fewer operations (209 steps / 5 operations)"}},"ModularInverseFermat":{"id":"ModularInverseFermat","problem":"Делить по модулю напрямую нельзя: деление на 3 по модулю 7 заменяют умножением на обратное к 3.","problemExample":"Найти x от 1 до 6, для которого 3 · x даёт остаток 1 при делении на 7.","naive":{"how":"пробовать x = 1, 2, 3, … и умножать 3 · x","cost":"5","unit":"пробных умножений","formula":"x = 1, 2, 3, 4, 5 — пока 3 · x не даст остаток 1"},"method":{"cost":"3","unit":"умножений","formula":"3⁵ квадратами: 3², 3⁴ = 3² · 3², 3⁵ = 3⁴ · 3","how":"возвести 3 в степень 5 быстрым способом"},"gainText":"в 1,7 раза меньше умножений (5 / 3); для модуля 10⁹ + 7 — 43 умножения вместо до 10⁹ проб","keyIdea":"Для простого p обратное к a равно a в степени p − 2 (здесь 3⁵); подбирать x не нужно.","how":["Проверить, что модуль 7 простой.","Взять показатель p − 2 = 5.","Возвести 3 в степень 5 быстрым возведением: остаток 5.","Вместо деления на 3 умножать на 5: 3 · 5 = 15 → остаток 1."],"props":{"time":"O(log p)","space":"O(1)","timeRank":2,"spaceRank":1,"exact":"точный","needs":["модуль p — простое число","a не делится на p"],"input":"a и простой p","output":"a⁻¹ по модулю p","gives":"найденное x даёт a · x ≡ 1 (mod p) для любого a, не кратного p","timePlain":"O(log p) — умножений около 2 × число двоичных цифр p","spacePlain":"O(1) — хранятся 3 числа, как в быстром возведении"},"scale":{"n":"модуль p = 10⁹ + 7 (типичный большой простой модуль в задачах), ~10⁸ простых операций в секунду","naive":"до 10⁹ пробных умножений — около 10 секунд на одно обратное","method":"10⁹ + 7 — 30 двоичных цифр → 29 возведений в квадрат + по умножению результата на каждую единицу (14) = 43 умножения — мгновенно","plot":{"n":9,"naive":9,"method":1.63347,"nc":"n","mc":"log"}},"story":{"ru":{"trick":"теоремой Ферма","task":"Остатки от деления на 7 — это числа 0…6. Нужно найти такое x, чтобы 3 · x давало остаток 1. Тогда вместо «разделить на 3» можно умножать на x.","headOn":"В лоб: пробуем x = 1, 2, 3, …: 3 · x даёт остатки 3, 6, 2, 5, 1. Нашли x = 5 за 5 проб, но для больших чисел проб будут миллиарды.","notice":"Теорема Ферма: раз 7 — простое число, 3⁶ даёт остаток 1 при делении на 7. А 3⁶ = 3 · 3⁵ — значит, x = 3⁵, и его можно просто вычислить.","steps":["Считаем 3⁵ квадратами и держим только остатки от деления на 7: 3² = 9 → 2; 3⁴ = 2 · 2 = 4; 3⁵ = 4 · 3 = 12 → 5. Три умножения.","Проверка: 3 · 5 = 15 = 2 · 7 + 1 — остаток 1. Ответ: x = 5."],"gain":["3 умножения вместо 5 проб.","Для простого числа 10⁹ + 7 (частый большой делитель в задачах) — 43 умножения вместо миллиарда проб."],"whenToUse":"Когда в вычислениях с остатками от деления на простое число нужно «делить».","needs":["делим с остатком на простое число — здесь 7","число, на которое «делим», не делится на это простое"],"guarantees":"Найденное x всегда подходит: 3 · x даёт остаток 1.","work":"Около двух умножений на каждое деление степени пополам — для 10⁹ + 7 всего 43."},"en":{"trick":"Fermat's little theorem","task":"The remainders after dividing by 7 are the numbers 0…6. Find x such that 3 · x leaves remainder 1. Then instead of \"dividing by 3\" we can multiply by x.","headOn":"Head-on: try x = 1, 2, 3, …: 3 · x leaves remainders 3, 6, 2, 5, 1. We find x = 5 after 5 tries, but with big numbers it would take billions of tries.","notice":"Fermat's theorem: since 7 is a prime, 3⁶ leaves remainder 1 when divided by 7. And 3⁶ = 3 · 3⁵ — so x = 3⁵, and we can simply compute it.","steps":["Compute 3⁵ by squaring, keeping only remainders after dividing by 7: 3² = 9 → 2; 3⁴ = 2 · 2 = 4; 3⁵ = 4 · 3 = 12 → 5. Three multiplications.","Check: 3 · 5 = 15 = 2 · 7 + 1 — remainder 1. The answer is x = 5."],"gain":["3 multiplications instead of 5 tries.","For the prime 10⁹ + 7 (a common large divisor in puzzles) — 43 multiplications instead of a billion tries."],"whenToUse":"When you work with remainders after dividing by a prime and need to \"divide\".","needs":["we divide with remainder by a prime — here, 7","the number we \"divide\" by is not a multiple of that prime"],"guarantees":"The x found always works: 3 · x leaves remainder 1.","work":"About two multiplications for each halving of the power — only 43 for 10⁹ + 7."}},"en":{"naive":{"how":"try x = 1, 2, 3, … and multiply 3 · x","unit":"trial multiplications","formula":"x = 1, 2, 3, 4, 5 — until 3 · x leaves remainder 1"},"method":{"unit":"multiplications","formula":"3⁵ by squaring: 3², 3⁴ = 3² · 3², 3⁵ = 3⁴ · 3"},"scale":{"n":"the prime 10⁹ + 7, ~10⁸ simple operations per second","naive":"up to 10⁹ trial multiplications — about 10 seconds per inverse","method":"10⁹ + 7 has 30 binary digits → 29 squarings + 14 multiplications of the result = 43 — instant"},"gainText":"1.7 times fewer multiplications (5 / 3); for 10⁹ + 7 — 43 multiplications instead of up to 10⁹ tries"}},"BatchInversion":{"id":"BatchInversion","problem":"Нужны обратные сразу к многим числам по модулю, а каждое обратное — отдельное дорогое возведение в степень.","problemExample":"Найти обратные к 1!, 2!, 3!, 4!, 5! по модулю 29 (остатки 1, 2, 6, 24, 4).","naive":{"how":"посчитать факториалы, затем для каждого из 5 отдельное возведение в степень 27","cost":"39","unit":"умножений","formula":"4 умножения на факториалы + 5 долгих поисков по 7 умножений"},"method":{"cost":"15","unit":"умножений","formula":"4 на факториалы + 7 на одно долгое вычисление + 4 на спуске","how":"обратить только 5!, остальные получить спуском"},"gainText":"в 2,6 раза меньше умножений (39 / 15): 1 возведение в степень вместо 5","keyIdea":"Обратное к k! равно обратному к (k+1)!, умноженному на k+1.","how":["Посчитать факториалы по модулю 29: 1, 2, 6, 24, 4.","Одним возведением найти обратное к 5!: 4²⁷ → 22.","Спускаться вниз: обратное к 4! = 22 · 5 → 23, к 3! = 23 · 4 → 5, и так далее.","Получить все 5 обратных: 1, 15, 5, 23, 22."],"props":{"time":"O(n + log p)","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["ни одно число не делится на модуль (иначе обратного нет)","весь список известен до начала счёта"],"input":"список чисел, модуль","output":"все обратные элементы","gives":"ровно одно возведение в степень на весь список, остальное — 1 умножение на факториал + 1 на спуске","timePlain":"O(n + log p), n — сколько чисел (здесь 5), p — модуль (здесь 29): по 2 умножения на число плюс одно возведение в степень","spacePlain":"O(n) — хранится список из n факториалов"},"scale":{"n":"10⁶ факториалов, модуль 10⁹ + 7, ~10⁸ простых операций в секунду","naive":"10⁶ возведений × ~45 умножений ≈ 4,5·10⁷ умножений — около полсекунды","method":"1 возведение + 2·10⁶ умножений — около 0,02 с","plot":{"n":6,"naive":7.65321,"method":6.30103,"nc":"n","mc":"n"}},"story":{"ru":{"trick":"одним обращением на весь список","task":"Нужно найти обратные к 1!, 2!, 3!, 4!, 5! при делении на 29. Здесь 5! = 1 · 2 · 3 · 4 · 5 = 120, а обратное к числу a — такое b, что a · b даёт остаток 1.","headOn":"В лоб: 4 умножения, чтобы получить факториалы, и для каждого из 5 чисел отдельный долгий поиск обратного по 7 умножений. Всего 4 + 5 · 7 = 39 умножений.","notice":"Обратное к 4! получается из обратного к 5! одним умножением на 5, ведь 5! = 4! · 5. Значит, долгим способом нужно искать только одно обратное — к 5!.","steps":["Считаем факториалы и оставляем только остатки от деления на 29: 1, 2, 6, 24, 120 → 4. Это 4 умножения.","Одно долгое вычисление — 4 в степени 27 (27 = 29 − 2, по теореме Ферма) — даёт обратное к 5!: это 22, ведь 4 · 22 = 88 = 3 · 29 + 1. Ещё 7 умножений.","Спускаемся: 22 · 5 → 23 (к 4!), 23 · 4 → 5 (к 3!), 5 · 3 → 15 (к 2!), 15 · 2 → 1 (к 1!). Ещё 4 умножения."],"gain":["15 умножений вместо 39.","Для миллиона факториалов — одно долгое вычисление и 2 миллиона умножений: около 0,02 секунды вместо полсекунды."],"whenToUse":"Когда нужны обратные сразу ко многим числам, особенно к факториалам.","needs":["делим с остатком на простое число — здесь 29","весь список чисел известен заранее"],"guarantees":"Все обратные точные — те же, что при поиске по одному.","work":"Одно долгое вычисление на весь список плюс по 2 умножения на каждое число."},"en":{"trick":"one inversion for the whole list","task":"Find the inverses of 1!, 2!, 3!, 4!, 5! when dividing by 29. Here 5! = 1 · 2 · 3 · 4 · 5 = 120, and the inverse of a number a is the b for which a · b leaves remainder 1.","headOn":"Head-on: 4 multiplications to get the factorials, then a separate long search for each of the 5 inverses, 7 multiplications each. 4 + 5 · 7 = 39 multiplications in all.","notice":"The inverse of 4! comes from the inverse of 5! with one multiplication by 5, because 5! = 4! · 5. So only one inverse — that of 5! — has to be found the long way.","steps":["Compute the factorials, keeping only remainders after dividing by 29: 1, 2, 6, 24, 120 → 4. That is 4 multiplications.","One long computation — 4 to the power 27 (27 = 29 − 2, by Fermat's theorem) — gives the inverse of 5!: it is 22, since 4 · 22 = 88 = 3 · 29 + 1. 7 more multiplications.","Go down: 22 · 5 → 23 (for 4!), 23 · 4 → 5 (for 3!), 5 · 3 → 15 (for 2!), 15 · 2 → 1 (for 1!). 4 more multiplications."],"gain":["15 multiplications instead of 39.","For a million factorials — one long computation and 2 million multiplications: about 0.02 seconds instead of half a second."],"whenToUse":"When you need the inverses of many numbers at once, especially of factorials.","needs":["we divide with remainder by a prime — here, 29","the whole list of numbers is known in advance"],"guarantees":"All inverses are exact — the same as found one by one.","work":"One long computation for the whole list plus 2 multiplications per number."}},"en":{"naive":{"how":"compute the factorials, then a separate power 27 for each of the 5","unit":"multiplications","formula":"4 multiplications for the factorials + 5 long searches of 7 multiplications"},"method":{"unit":"multiplications","formula":"4 for the factorials + 7 for one long computation + 4 going down"},"scale":{"n":"10⁶ factorials, divisor 10⁹ + 7, ~10⁸ simple operations per second","naive":"10⁶ long computations × ~45 multiplications ≈ 4.5·10⁷ — about half a second","method":"1 long computation + 2·10⁶ multiplications — about 0.02 s"},"gainText":"2.6 times fewer multiplications (39 / 15): one long computation instead of 5"}},"LatticePaths":{"id":"LatticePaths","problem":"Путей по сетке из клетки в клетку столько, что перечислить их все нельзя уже для сетки 20 × 20.","problemExample":"Сосчитать пути из левого верхнего угла сетки 2 × 2 в правый нижний, ходя только вправо и вниз.","naive":{"how":"перебрать все цепочки из 4 ходов и оставить те, где 2 вправо и 2 вниз","cost":"16","unit":"проверенных цепочек","formula":"2 варианта на каждом из 4 ходов: 2 × 2 × 2 × 2"},"method":{"cost":"4","unit":"действия","formula":"(4 × 3) ÷ (2 × 1): 2 умножения + 2 деления","how":"посчитать сочетания C(4, 2) по одному множителю"},"gainText":"в 4 раза меньше работы (16 / 4)","keyIdea":"Путь задаётся тем, какие 2 из 4 ходов идут вправо; перебирать пути не нужно.","how":["Посчитать ходы: 2 вправо и 2 вниз, всего 4.","Записать ответ как C(4, 2) — выбор 2 ходов вправо из 4.","Считать C(4, 2) по одному множителю: 3/1 · 4/2 = 6."],"props":{"time":"O(min(N, M))","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["ходить можно только вправо и вниз","в сетке нет запретных клеток"],"input":"размеры сетки N × M (здесь 2 × 2)","output":"число путей","gives":"точное число путей без перечисления самих путей","timePlain":"по одному умножению и делению на каждый ход вправо (N, M — размеры сетки)","spacePlain":"хранится одно текущее значение дроби"},"scale":{"n":"сетка 20 × 20 (при ~10⁸ действий в секунду)","naive":"2⁴⁰ ≈ 1,1·10¹² цепочек — около 3 часов","method":"20 умножений + 20 делений = 40 действий — мгновенно","plot":{"n":1.30103,"naive":12.04139,"method":1.60206,"nc":"2n","mc":"n","nName":"размер сетки"}},"story":{"ru":{"trick":"выбрать, какие ходы вправо","task":"Сетка 2 на 2 клетки. Идём из левого верхнего угла в правый нижний, только вправо (П) или вниз (Н). Сколько разных путей?","headOn":"В лоб: выписываем все цепочки из 4 ходов — на каждом ходе 2 варианта, 2 × 2 × 2 × 2 = 16 цепочек — и оставляем те, где ровно 2 П и 2 Н.","notice":"Любой путь — это 4 хода, и ровно 2 из них вправо. Значит, путей столько, сколькими способами можно выбрать 2 места из 4 под ходы вправо.","steps":["По сетке: в каждую точку приходят сверху или слева, поэтому число путей в точку = сверху + слева; в правом нижнем углу выходит 6.","То же одной формулой: выбрать 2 места из 4 = (4 × 3) ÷ (2 × 1) = 6; по шагам: × 3, ÷ 1, × 4, ÷ 2 — 4 действия вместо 16 проверок."],"gain":["4 действия вместо 16 проверенных цепочек.","Для сетки 20 на 20: 40 действий вместо примерно триллиона цепочек."],"whenToUse":"Когда нужно посчитать пути по сетке, где можно ходить только вправо и вниз.","needs":["ходить можно только вправо и вниз","в сетке нет закрытых клеток"],"guarantees":"Точное число путей, без выписывания самих путей.","work":"По умножению и делению на каждый ход вправо."},"en":{"trick":"choose which moves go right","task":"A grid of 2 by 2 squares. We walk from the top-left corner to the bottom-right, moving only right (R) or down (D). How many different paths are there?","headOn":"Head-on: write out every chain of 4 moves — 2 choices at each move, 2 × 2 × 2 × 2 = 16 chains — and keep those with exactly 2 R and 2 D.","notice":"Every path is 4 moves, and exactly 2 of them go right. So there are as many paths as there are ways to pick 2 of the 4 places for the right moves.","steps":["On the grid: every point is reached from above or from the left, so paths to a point = above + left; the bottom-right corner gets 6.","The same with one formula: pick 2 places out of 4 = (4 × 3) ÷ (2 × 1) = 6; step by step: × 3, ÷ 1, × 4, ÷ 2 — 4 steps instead of 16 checks."],"gain":["4 steps instead of 16 checked chains.","For a 20 by 20 grid: 40 steps instead of about a trillion chains."],"whenToUse":"When you need to count paths across a grid where you may only move right and down.","needs":["moves go only right and down","no squares of the grid are blocked"],"guarantees":"The exact number of paths, without writing the paths out.","work":"One multiplication and one division per move to the right."}},"en":{"naive":{"how":"write out every chain of 4 moves and keep those with 2 R and 2 D","unit":"checked chains","formula":"2 choices at each of 4 moves: 2 × 2 × 2 × 2"},"method":{"unit":"arithmetic steps","formula":"(4 × 3) ÷ (2 × 1): 2 multiplications + 2 divisions"},"scale":{"n":"a 20 × 20 grid (at ~10⁸ operations per second)","naive":"2⁴⁰ ≈ 1.1·10¹² chains — about 3 hours","method":"20 multiplications + 20 divisions = 40 steps — instant","plot":{"nName":"grid size"}},"gainText":"4 times less work (16 / 4)"}},"DynamicProgramming":{"id":"DynamicProgramming","problem":"Путей в треугольнике чисел становится вдвое больше с каждой строкой, но их концы общие.","problemExample":"Найти наибольшую сумму чисел на пути сверху вниз в треугольнике из 4 строк (ответ 23).","naive":{"how":"перебрать все 8 путей сверху вниз и сложить числа на каждом","cost":"24","unit":"сложений","formula":"8 путей × 3 сложения (по 4 числа)"},"method":{"cost":"6","unit":"сложений","formula":"по одному на каждое число выше нижней строки: 1 + 2 + 3","how":"сворачивать треугольник снизу вверх"},"gainText":"в 4 раза меньше сложений (24 / 6)","keyIdea":"Лучший путь из клетки уже посчитан для обеих нижних соседок; повторять не нужно.","how":["Начать с нижней строки: её числа — готовые ответы.","К каждой клетке строкой выше прибавить большее из двух нижних соседок.","Подниматься так строка за строкой.","Число в вершине — наибольшая сумма пути: 23."],"props":{"time":"O(n²)","space":"O(n)","timeRank":6,"spaceRank":4,"exact":"точный","needs":["лучший путь из клетки строится из лучших путей её соседок","одни и те же клетки встречаются во многих путях"],"input":"треугольник чисел","output":"максимальная сумма пути","gives":"каждая клетка обрабатывается ровно один раз, ответ точный","timePlain":"по одному сложению на каждую клетку треугольника","spacePlain":"хранится одна строка ответов"},"scale":{"n":"треугольник из 100 строк (при ~10⁸ действий в секунду)","naive":"2⁹⁹ ≈ 6·10²⁹ путей — дольше возраста Вселенной","method":"4950 сложений — мгновенно","plot":{"n":2,"naive":29.77815,"method":3.69461,"nc":"2n","mc":"n2","nName":"строк в треугольнике"}},"story":{"ru":{"trick":"снизу вверх","task":"Треугольник из чисел: 3 / 7 4 / 2 4 6 / 8 5 9 3. Идём сверху вниз, каждый раз на одно из двух соседних чисел ниже. Какая самая большая сумма чисел на пути?","headOn":"В лоб: перебираем все 8 путей и в каждом складываем 4 числа — 8 × 3 = 24 сложения.","notice":"Лучший путь от числа 2 вниз — это 2 плюс большее из двух чисел под ним, 8 и 5: 2 + 8 = 10. Так можно заменить каждое число лучшей суммой, идя снизу вверх.","steps":["Снизу вверх: каждое число прибавляет большее из двух соседей под ним — всего 6 сложений.","В вершине получается 23 — это самая большая сумма (путь 3 + 7 + 4 + 9)."],"gain":["6 сложений вместо 24.","Для треугольника из 100 строк: 4950 сложений вместо числа путей с 30 нулями."],"whenToUse":"Когда лучший путь от каждого места складывается из лучших путей от соседних мест.","needs":["лучший ответ для места собирается из лучших ответов соседей","одни и те же места встречаются во многих путях"],"guarantees":"Каждое число используется один раз, ответ точный.","work":"Одно сложение на каждое число треугольника."},"en":{"trick":"from the bottom up","task":"A triangle of numbers: 3 / 7 4 / 2 4 6 / 8 5 9 3. We go from top to bottom, each time to one of the two neighbouring numbers below. What is the largest sum along a path?","headOn":"Head-on: try all 8 paths and add up the 4 numbers on each — 8 × 3 = 24 additions.","notice":"The best path down from the number 2 is 2 plus the larger of the two numbers below it, 8 and 5: 2 + 8 = 10. So every number can be replaced by its best sum, working from the bottom up.","steps":["From the bottom up: each number adds the larger of its two neighbours below — 6 additions in all.","The top ends up as 23 — that is the largest sum (the path 3 + 7 + 4 + 9)."],"gain":["6 additions instead of 24.","For a triangle of 100 rows: 4950 additions instead of a number of paths with 30 digits."],"whenToUse":"When the best path from every place is built from the best paths from the neighbouring places.","needs":["the best answer for a place is made of the best answers of its neighbours","the same places appear in many paths"],"guarantees":"Every number is used once, and the answer is exact.","work":"One addition per number of the triangle."}},"en":{"naive":{"how":"try all 8 paths from top to bottom and add up each","unit":"additions","formula":"8 paths × 3 additions (4 numbers each)"},"method":{"unit":"additions","formula":"one per number above the bottom row: 1 + 2 + 3"},"scale":{"n":"a triangle of 100 rows (at ~10⁸ operations per second)","naive":"2⁹⁹ ≈ 6·10²⁹ paths — longer than the age of the universe","method":"4950 additions — instant","plot":{"nName":"rows in the triangle"}},"gainText":"4 times fewer additions (24 / 6)"}},"RestrictedPartitionCount":{"id":"RestrictedPartitionCount","problem":"Считая способы набрать сумму, легко посчитать 1+2 и 2+1 как разные способы, хотя нужен один.","problemExample":"Сосчитать, сколькими наборами плиток длины 1 и 2 можно заполнить полосу длины 4 (ответ 3).","naive":{"how":"перебрать число плиток 2 (0–2) и число плиток 1 (0–4), проверить сумму","cost":"15","unit":"проверенных вариантов","formula":"3 варианта двоек × 5 вариантов единиц"},"method":{"cost":"7","unit":"сложений в таблице","formula":"единицы: длины 1–4, 4 сложения; двойки: длины 2–4, 3 сложения","how":"заполнить таблицу способов, добавляя виды плиток по очереди"},"gainText":"в 2,1 раза меньше работы (15 / 7)","keyIdea":"Добавлять виды плиток по очереди (сначала только 1, потом 2) — каждый набор считается один раз; перебор по суммам снаружи считает порядки (5 вместо 3).","how":["Завести таблицу способов для длин 0…4; для длины 0 — 1 способ (пустой набор).","Сначала только плитки 1: для каждой длины 1…4 прибавить способы длины на 1 меньше (4 сложения).","Добавить плитки 2: для длин 2…4 прибавить способы длины на 2 меньше (3 сложения).","Прочитать ответ в клетке длины 4: 3 набора."],"props":{"time":"O(n·k) = O(n) при фиксированном k","space":"O(n)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["плиток каждого размера сколько угодно","виды плиток добавляются по очереди (все способы с плиткой 1 — до плитки 2), иначе считаются порядки"],"input":"сумма и размеры частей","output":"число разбиений","gives":"каждый набор плиток посчитан ровно один раз, независимо от порядка","timePlain":"n — длина полосы, k — число видов плиток (здесь 2, фиксировано): одно сложение на пару (длина, вид плитки)","spacePlain":"таблица из n + 1 числа"},"scale":{"n":"200 пенсов из 8 видов монет (монеты = плитки, сумма = длина полосы), при ~10⁸ действий в секунду","naive":"5,8·10⁹ проверок — около минуты","method":"1220 сложений — мгновенно","plot":{"n":2.30103,"naive":9.76343,"method":3.08636,"nc":"n3","mc":"n","est":"naive","nName":"какую сумму набираем"}},"story":{"ru":{"trick":"добавлять виды плиток по очереди","task":"Полосу длины 4 нужно выложить плитками длины 1 и 2. Сколько разных наборов плиток подходит, если порядок плиток не важен?","headOn":"В лоб: перебираем, сколько взять двоек (0, 1 или 2) и сколько единиц (от 0 до 4), — 3 × 5 = 15 вариантов, и проверяем длину; подходят только 3.","notice":"Будем добавлять виды плиток по очереди: сначала только единицы, потом двойки. Тогда каждый набор получается ровно один раз, в одном порядке, и повторов нет.","steps":["Подходят три набора: 2 + 2, 2 + 1 + 1 и 1 + 1 + 1 + 1.","Если порядок важен, раскладок пять: набор 2 + 1 + 1 можно выложить тремя способами. Поэтому виды плиток и добавляем по очереди.","Таблица способов для длин 0…4: с одними единицами — 4 сложения, с двойками — ещё 3. Всего 7 сложений, в клетке длины 4 — ответ 3."],"gain":["7 сложений вместо 15 проверок.","Для 200 пенсов из 8 видов монет: 1220 сложений вместо почти 6 миллиардов проверок."],"whenToUse":"Когда нужно посчитать, сколькими наборами предметов заданных размеров можно набрать нужную сумму.","needs":["предметов каждого размера сколько угодно","порядок предметов в наборе не важен"],"guarantees":"Каждый набор посчитан ровно один раз, независимо от порядка.","work":"Одно сложение на каждую пару «длина — вид плитки»."},"en":{"trick":"add the tile sizes one at a time","task":"A strip of length 4 has to be covered with tiles of length 1 and 2. How many different sets of tiles fit, if the order of the tiles does not matter?","headOn":"Head-on: try how many 2-tiles to take (0, 1 or 2) and how many 1-tiles (0 to 4) — 3 × 5 = 15 options — and check the length; only 3 fit.","notice":"Add the tile sizes one at a time: first only 1-tiles, then 2-tiles. Then each set comes out exactly once, in one order, with no repeats.","steps":["Three sets fit: 2 + 2, 2 + 1 + 1 and 1 + 1 + 1 + 1.","If order mattered there would be five layouts: the set 2 + 1 + 1 can be laid down in three ways. That is why we add the tile sizes one at a time.","A table of ways for lengths 0…4: with only 1-tiles, 4 additions; with 2-tiles, 3 more. 7 additions in all, and the cell for length 4 holds the answer 3."],"gain":["7 additions instead of 15 checks.","For 200 pence in 8 kinds of coin: 1220 additions instead of almost 6 billion checks."],"whenToUse":"When you need to count how many sets of items of given sizes add up to a required total.","needs":["there are as many items of each size as you like","the order of items in a set does not matter"],"guarantees":"Every set is counted exactly once, whatever its order.","work":"One addition per pair “length — tile size”."}},"en":{"naive":{"how":"try every number of 2-tiles (0–2) and of 1-tiles (0–4) and check the length","unit":"checked options","formula":"3 choices for 2-tiles × 5 choices for 1-tiles"},"method":{"unit":"additions in the table","formula":"1-tiles: lengths 1–4, 4 additions; 2-tiles: lengths 2–4, 3 additions"},"scale":{"n":"200 pence in 8 kinds of coin (coins = tiles, total = strip length), at ~10⁸ operations per second","naive":"5.8·10⁹ checks — about a minute","method":"1220 additions — instant","plot":{"nName":"total to make"}},"gainText":"2.1 times less work (15 / 7)","props":{"time":"O(n·k) = O(n) for a fixed k"}}},"InPlaceAlgorithm":{"id":"InPlaceAlgorithm","problem":"Хранить всю цепочку значений дорого, когда нужен только последний член.","problemExample":"Удвоить 7 четыре раза (7 → 14 → 28 → 56 → 112) и понять, сколько ячеек памяти для этого нужно.","naive":{"how":"записывать каждое значение в новую ячейку","cost":"5","unit":"занятых ячеек памяти","formula":"1 начальное число + 4 удвоения"},"method":{"cost":"1","unit":"занятых ячеек памяти","formula":"каждое удвоение пишется поверх предыдущего числа","how":"писать новое значение на место старого"},"gainText":"операций столько же (4 удвоения); выигрыш — память: 1 ячейка вместо 5","keyIdea":"Старое значение больше не читается, поэтому новое пишется на его место.","how":["Выделить одну ячейку и положить в неё 7.","Прочитать значение из ячейки.","Записать удвоенное значение в ту же ячейку.","Повторить 4 раза и прочитать 112."],"props":{"time":"O(n)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["новое значение зависит только от k последних (здесь k = 1 — только от предыдущего)","старое значение читается до того, как его перезапишут"],"input":"правило «следующее значение из предыдущего» (здесь: удвоить)","output":"последний член","gives":"память — k ячеек при любой длине цепочки","timePlain":"O(n) — n = число удвоений; шагов столько же, сколько удвоений","spacePlain":"O(1) — число ячеек не зависит от длины цепочки"},"scale":{"n":"цепочка из миллиона удвоений","naive":"миллион ячеек по 8 байт — около 8 МБ памяти","method":"1 ячейка памяти","plot":{"n":6,"naive":6,"method":0,"nc":"n","mc":"1","y":"ячеек памяти","budget":null,"nName":"сколько удвоений в цепочке"}},"story":{"ru":{"trick":"записью поверх старого","task":"Число 7 удваивают четыре раза подряд: 7, 14, 28, 56, 112. В конце нужно только последнее число. Сколько ячеек памяти для этого нужно?","headOn":"В лоб: каждое новое число записываем в новую ячейку — 1 начальное и 4 удвоения, 5 занятых ячеек, хотя четыре из них больше никогда не читаются.","notice":"Чтобы получить следующее число, нужно только предыдущее. Как только 14 записано, число 7 больше не нужно — его место можно занять.","steps":["Каждое удвоение читает число и записывает удвоенное — после этого старое число уже никому не нужно.","Пишем каждое новое число поверх старого: в одной ячейке по очереди лежат 7, 14, 28, 56 и 112."],"gain":["1 ячейка вместо 5, а удвоений столько же — 4.","Для цепочки из миллиона удвоений — 1 ячейка вместо миллиона ячеек (около 8 МБ памяти)."],"whenToUse":"Когда каждое следующее значение считается только из предыдущего, а в конце нужно лишь последнее.","needs":["следующее значение зависит только от предыдущего (или от нескольких последних)","старое значение прочитано до того, как на его место записано новое"],"guarantees":"Результат тот же, что при записи в новые ячейки: 112.","work":"Действий столько же, сколько удвоений, а память — одна ячейка при любой длине цепочки."},"en":{"trick":"writing over the old value","task":"The number 7 is doubled four times in a row: 7, 14, 28, 56, 112. Only the last number is needed. How many memory cells does that take?","headOn":"Head-on: write each new number into a new cell — 1 starting number and 4 doublings, 5 cells in use, although four of them are never read again.","notice":"To get the next number you only need the previous one. As soon as 14 is written, the 7 is no longer needed — its place can be reused.","steps":["Each doubling reads a number and writes twice that — after that nobody needs the old number any more.","Write each new number over the old one: one cell holds 7, 14, 28, 56 and 112 in turn."],"gain":["1 cell instead of 5, with the same 4 doublings.","For a chain of a million doublings: 1 cell instead of a million cells (about 8 MB of memory)."],"whenToUse":"When each new value is computed only from the previous one and only the last value is needed.","needs":["the next value depends only on the previous one (or on the last few)","the old value is read before the new one is written in its place"],"guarantees":"The same result as writing to new cells: 112.","work":"As many steps as doublings, and memory stays at one cell however long the chain is."}},"en":{"naive":{"how":"write every value into a new cell","unit":"memory cells in use","formula":"1 starting number + 4 doublings"},"method":{"unit":"memory cells in use","formula":"each doubling is written over the previous number"},"gainText":"the same 4 doublings; the gain is memory: 1 cell instead of 5","scale":{"n":"a chain of a million doublings","naive":"a million cells of 8 bytes — about 8 MB of memory","method":"1 memory cell","plot":{"nName":"how many doublings are in the chain","y":"memory cells"}}}},"DayOfWeekFormula":{"id":"DayOfWeekFormula","problem":"Чтобы узнать день недели далёкой даты отсчётом, нужно пройти десятки тысяч дней.","problemExample":"Узнать день недели 1 января 2000 года, зная, что 1 января 1900 — понедельник.","naive":{"how":"шагать по дням от 1 января 1900 до 1 января 2000","cost":"36524","unit":"шагов по дням","formula":"100 лет × 365 дней + 24 дня високосных лет"},"method":{"cost":"10","unit":"действий","formula":"1 вычитание (год − 1) + 3 деления (на 4, 100, 400) + 5 сложений и вычитаний + 1 остаток от деления на 7","how":"подставить дату в формулу"},"gainText":"10 операций вместо 36 524 шагов по дням","keyIdea":"Каждые 7 дней неделя повторяется; поправки годов и месяцев складываются по модулю 7.","how":["Январь и февраль отнести к прошлому году (чтобы високосный день 29 февраля оказался в конце года): y = 1999.","Сложить y + ⌊y/4⌋ − ⌊y/100⌋ + ⌊y/400⌋: 1999 + 499 − 19 + 4.","Добавить поправку месяца (январь — 0) и день (1): сумма 2484.","Взять остаток от деления на 7: 2484 = 354·7 + 6 → 6, это суббота."],"props":{"time":"O(1)","space":"O(1)","timeRank":1,"spaceRank":1,"exact":"точный","needs":["дата по григорианскому календарю (после 1582 года)","есть таблица поправок для 12 месяцев"],"input":"год, месяц, день","output":"день недели 0–6","gives":"день недели любой даты за 10 операций","timePlain":"O(1) — 10 операций для любой даты","spacePlain":"O(1) — таблица из 12 поправок месяцев"},"scale":{"n":"первые числа 1200 месяцев 1901–2000 (Project Euler №19)","naive":"~36 500 шагов по дням за один проход","method":"1200 дат × 10 операций = 12 000 операций","plot":{"n":3.07918,"naive":4.56229,"method":4.07918,"nc":"n","mc":"n"}},"story":{"ru":{"trick":"формулой дня недели","task":"Известно, что 1 января 1900 года был понедельник. Каким днём недели было 1 января 2000 года?","headOn":"В лоб: шагаем по календарю день за днём — 100 лет по 365 дней и ещё 24 лишних дня високосных лет, всего 36 524 шага.","notice":"Неделя повторяется каждые 7 дней. Год из 365 дней — это 52 недели и 1 день, поэтому обычный год сдвигает день недели на 1, а високосный — на 2. Дни можно не шагать, а сложить сдвиги.","steps":["Складываем: 1999 (номер года — январь считаем концом прошлого года) + 499 високосных (4 помещается в 1999 целых 499 раз) − 19 (годы, кратные 100, не високосные) + 4 (кратные 400 — всё-таки високосные) + 0 (январь) + 1 (число) = 2484.","Делим на 7: 2484 = 354 · 7 + 6. Остаток 6 — это суббота (воскресенье — 0, понедельник — 1, …, суббота — 6)."],"gain":["10 действий вместо 36 524 шагов по дням.","Дни недели первых чисел всех 1200 месяцев 1901–2000 годов — 12 000 действий."],"whenToUse":"Когда нужен день недели для любой даты.","needs":["дата по обычному (григорианскому) календарю — после 1582 года","таблица сдвигов для 12 месяцев (у января — 0)"],"guarantees":"Правильный день недели для любой такой даты.","work":"10 действий для любой даты, как бы далеко она ни была."},"en":{"trick":"a day-of-week formula","task":"We know that 1 January 1900 was a Monday. What day of the week was 1 January 2000?","headOn":"Head-on: walk through the calendar day by day — 100 years of 365 days plus 24 extra leap-year days, 36,524 steps in all.","notice":"The week repeats every 7 days. A 365-day year is 52 weeks and 1 day, so an ordinary year moves the weekday on by 1 and a leap year by 2. Instead of walking the days we can add up the shifts.","steps":["Add up: 1999 (the year — January counts as the end of the year before) + 499 leap years (4 goes into 1999 a whole 499 times) − 19 (years divisible by 100 are not leap years) + 4 (those divisible by 400 are after all) + 0 (January) + 1 (the day) = 2484.","Divide by 7: 2484 = 354 · 7 + 6. Remainder 6 means Saturday (Sunday is 0, Monday 1, …, Saturday 6)."],"gain":["10 operations instead of 36,524 steps through the days.","The weekday of the 1st of every one of the 1200 months of 1901–2000 — 12,000 operations."],"whenToUse":"When you need the day of the week for any date.","needs":["the date is in the ordinary (Gregorian) calendar — after 1582","a table of shifts for the 12 months (January is 0)"],"guarantees":"The right weekday for any such date.","work":"10 operations for any date, however far away."}},"en":{"naive":{"how":"walk day by day from 1 January 1900 to 1 January 2000","unit":"steps through the days","formula":"100 years × 365 days + 24 leap-year days"},"method":{"unit":"operations","formula":"1 subtraction (year − 1) + 3 divisions (by 4, 100, 400) + 5 additions and subtractions + 1 remainder after dividing by 7"},"scale":{"n":"the 1st of each of the 1200 months of 1901–2000","naive":"~36,500 steps through the days in one pass","method":"1200 dates × 10 operations = 12,000 operations"},"gainText":"10 operations instead of 36,524 steps through the days"}},"LehmerCode":{"id":"LehmerCode","problem":"Чтобы получить перестановку с нужным номером, не хочется строить все предыдущие.","problemExample":"Найти 15-ю по алфавиту перестановку букв a, b, c, d (ответ c b a d).","naive":{"how":"строить перестановки по алфавиту, начиная с abcd, до 15-й","cost":"15","unit":"выписанных порядков","formula":"abcd, abdc, … — до 15-го по счёту"},"method":{"cost":"3","unit":"деления","formula":"14 ÷ 6 = 2 ост. 2; 2 ÷ 2 = 1 ост. 0; 0 ÷ 1 = 0","how":"делить номер на факториалы"},"gainText":"в 5 раз меньше операций (15 перестановок / 3 деления)","keyIdea":"Каждые 3! = 6 перестановок начинаются одной буквой; частное сразу выбирает букву.","how":["Перевести номер 15 в счёт с нуля: 14.","Разделить 14 на 3! = 6: частное 2 выбирает букву c из a b c d.","Остаток 2 разделить на 2! = 2: частное 1 выбирает b из a b d.","Повторять до конца: a, затем d — получилось c b a d."],"props":{"time":"O(n²)","space":"O(n)","timeRank":6,"spaceRank":4,"exact":"точный","needs":["номер переведён в счёт с нуля","элементы стоят по возрастанию (по алфавиту)"],"input":"набор и номер","output":"перестановка с номером","gives":"перестановка с любым номером за n делений (n — число букв, здесь 4)","timePlain":"O(n²), n — число букв (здесь 4): n делений и n удалений из списка длины до n","spacePlain":"O(n) — список ещё не выбранных элементов"},"scale":{"n":"миллионная перестановка цифр 0–9 (Project Euler №24)","naive":"10⁶ перестановок × 10 цифр ≈ 10⁷ операций при ~10⁸ в секунду — около 0,1 с","method":"9 делений — десятая цифра остаётся сама; мгновенно","plot":{"n":1,"naive":7,"method":0.95424,"nc":"nf","mc":"n"}},"story":{"ru":{"trick":"делением номера","task":"Из букв a, b, c, d можно составить 24 разных порядка: abcd, abdc, acbd, … — по алфавиту. Какой порядок стоит 15-м?","headOn":"В лоб: выписываем порядки по алфавиту один за другим и считаем до 15-го — это 15 выписанных порядков.","notice":"Порядков, которые начинаются с a, ровно 6: остальные 3 буквы можно расставить 3 · 2 · 1 = 6 способами. С b — тоже 6. Перед 15-м стоят 14 порядков: 14 ÷ 6 = 2 полные группы (a… и b…), значит 15-й начинается с c.","steps":["14 ÷ 6 = 2, остаток 2: пропускаем 2 группы — первая буква c. Остались a, b, d.","Остаток 2 делим на 2 (две последние буквы можно расставить 2 способами): 2 ÷ 2 = 1, остаток 0 — пропускаем 1 группу, вторая буква b. Остались a, d.","Остаток 0: берём первую из оставшихся — a, последней остаётся d. Ответ: c b a d."],"gain":["3 деления вместо 15 выписанных порядков.","Миллионный по счёту порядок цифр 0–9 — 9 делений вместо миллиона выписанных порядков."],"whenToUse":"Когда нужен порядок с заданным номером — без выписывания всех предыдущих.","needs":["номер считаем с нуля: 15-й — это номер 14","буквы (или цифры) записаны по алфавиту"],"guarantees":"Получаем ровно тот порядок, что стоит на этом месте.","work":"Одно деление на каждую букву."},"en":{"trick":"dividing the rank","task":"The letters a, b, c, d can be put in 24 different orders: abcd, abdc, acbd, … — alphabetically. Which order comes 15th?","headOn":"Head-on: write the orders out alphabetically one after another and count to the 15th — 15 orders written out.","notice":"Exactly 6 orders start with a: the other 3 letters can be arranged in 3 · 2 · 1 = 6 ways. Another 6 start with b. Fourteen orders come before the 15th: 14 ÷ 6 = 2 full groups (a… and b…), so the 15th starts with c.","steps":["14 ÷ 6 = 2, remainder 2: skip 2 groups — the first letter is c. Left: a, b, d.","Divide the remainder 2 by 2 (the last two letters can be arranged 2 ways): 2 ÷ 2 = 1, remainder 0 — skip 1 group, the second letter is b. Left: a, d.","Remainder 0: take the first of what is left — a, and d comes last. The answer: c b a d."],"gain":["3 divisions instead of writing out 15 orders.","The millionth order of the digits 0–9 — 9 divisions instead of writing out a million orders."],"whenToUse":"When you need the order with a given number, without writing out all the ones before it.","needs":["count from zero: the 15th order has number 14","the letters (or digits) are in alphabetical order"],"guarantees":"You get exactly the order that sits in that place.","work":"One division per letter."}},"en":{"naive":{"how":"write the orders out alphabetically, starting with abcd, up to the 15th","unit":"orders written out","formula":"abcd, abdc, … up to the 15th"},"method":{"unit":"divisions","formula":"14 ÷ 6 = 2 rem. 2; 2 ÷ 2 = 1 rem. 0; 0 ÷ 1 = 0"},"scale":{"n":"the millionth order of the digits 0–9","naive":"10⁶ orders × 10 digits ≈ 10⁷ operations at ~10⁸ per second — about 0.1 s","method":"9 divisions — the tenth digit is what is left; instant"},"gainText":"5 times fewer operations (15 orders / 3 divisions)"}},"CycleDetectionViaRemainders":{"id":"CycleDetectionViaRemainders","problem":"По цифрам дроби не видно, где начинается повтор; нужен признак, который точно сработает.","problemExample":"Найти длину периода дроби 1/7 = 0,142857142857…","naive":{"how":"каждый новый остаток сравнивать со всеми прежними","cost":"21","unit":"сравнений остатков","formula":"каждый новый остаток — со всеми прежними: 1 + 2 + 3 + 4 + 5 + 6"},"method":{"cost":"7","unit":"взглядов в таблицу","formula":"7 остатков × 1 взгляд в таблицу «на каком шаге был этот остаток»","how":"хранить для каждого остатка номер шага"},"gainText":"в 3 раза меньше операций (21 / 7)","keyIdea":"Ненулевых остатков от деления на 7 всего 6 — повтор неизбежен за 7 шагов.","how":["Остаток умножить на 10 и разделить на 7: 1 → 10 → остаток 3.","Записать в таблицу номер шага для каждого остатка.","Остаток уже есть в таблице — остановиться: 1 встретился на шаге 0 и шаге 6.","Длина периода = 6 − 0 = 6."],"props":{"time":"O(d)","space":"O(d)","timeRank":4,"spaceRank":4,"exact":"точный","needs":["d — делитель (здесь 7); остатков конечное число: от 0 до d − 1","следующий остаток определяется только текущим"],"input":"делитель d","output":"длина периода","gives":"повтор найден не позже шага d, длина периода точная","timePlain":"O(d) — не больше d шагов деления","spacePlain":"O(d) — таблица на d остатков"},"scale":{"n":"все делители d < 1000 (Project Euler №26), ~10⁸ простых операций в секунду","naive":"до ≈ 1000²/2 = 5·10⁵ сравнений на одно d, всего ~10⁸ — около секунды","method":"до 1000 обращений на одно d, всего ~5·10⁵ — мгновенно","plot":{"n":3,"naive":8,"method":5.69897,"nc":"n3","mc":"n2"}},"story":{"ru":{"trick":"таблицей остатков","task":"1/7 = 0,142857142857… — цифры повторяются. Сколько цифр в повторяющемся блоке?","headOn":"В лоб: делим столбиком и каждый новый остаток сравниваем со всеми прежними, пока не встретится повтор. Остатки 1, 3, 2, 6, 4, 5, 1 — это 1 + 2 + 3 + 4 + 5 + 6 = 21 сравнение.","notice":"Следующая цифра зависит только от текущего остатка. Как только остаток повторился, повторятся и все цифры. А узнать, был ли такой остаток, можно одним взглядом в таблицу «на каком шаге был этот остаток».","steps":["Делим 1 на 7 столбиком: остатки 1, 3, 2, 6, 4, 5 записываем в таблицу с номером шага — каждый раз одного взгляда хватает, чтобы увидеть, что такого ещё не было.","На шаге 6 остаток снова 1 — он уже был на шаге 0. Повторяющийся блок — 6 − 0 = 6 цифр: 1/7 = 0,(142857)."],"gain":["7 взглядов в таблицу вместо 21 сравнения.","Для всех делителей до 1000 — около полумиллиона взглядов вместо примерно 100 миллионов сравнений."],"whenToUse":"Когда каждый следующий шаг зависит только от текущего и нужно найти, где начинается повтор.","needs":["вариантов конечное число — здесь остатки 0…6","следующий остаток определяется только текущим"],"guarantees":"Повтор найдётся не позже 7-го шага, и длина блока будет точной.","work":"Один взгляд в таблицу на каждый шаг деления."},"en":{"trick":"a table of remainders","task":"1/7 = 0.142857142857… — the digits repeat. How many digits are in the repeating block?","headOn":"Head-on: do long division and compare each new remainder with all the earlier ones until one repeats. The remainders are 1, 3, 2, 6, 4, 5, 1 — that is 1 + 2 + 3 + 4 + 5 + 6 = 21 comparisons.","notice":"The next digit depends only on the current remainder. Once a remainder repeats, all the digits repeat too. And whether a remainder has been seen can be told with one glance at a table \"at which step did this remainder appear\".","steps":["Divide 1 by 7 in long division: write the remainders 1, 3, 2, 6, 4, 5 into the table with their step numbers — each time one glance shows it has not appeared yet.","At step 6 the remainder is 1 again — it already appeared at step 0. The repeating block is 6 − 0 = 6 digits: 1/7 = 0.(142857)."],"gain":["7 glances at the table instead of 21 comparisons.","For all divisors up to 1000 — about half a million glances instead of roughly 100 million comparisons."],"whenToUse":"When each next step depends only on the current one and you need to find where the repetition starts.","needs":["there are finitely many possibilities — here, the remainders 0…6","the next remainder is decided by the current one alone"],"guarantees":"The repetition is found by step 7 at the latest, and the block length is exact.","work":"One glance at the table for each step of the division."}},"en":{"naive":{"how":"compare each new remainder with all the earlier ones","unit":"comparisons of remainders","formula":"each new remainder against all earlier ones: 1 + 2 + 3 + 4 + 5 + 6"},"method":{"unit":"glances at the table","formula":"7 remainders × 1 glance at the table \"at which step did this remainder appear\""},"scale":{"n":"all divisors d < 1000, ~10⁸ simple operations per second","naive":"up to ≈ 1000²/2 = 5·10⁵ comparisons per divisor, ~10⁸ in all — about a second","method":"up to 1000 glances per divisor, ~5·10⁵ in all — instant"},"gainText":"3 times fewer operations (21 / 7)"}},"NextPermutation":{"id":"NextPermutation","problem":"Идти по перестановкам по порядку, не строя их все заранее.","problemExample":"Найти перестановку, которая идёт сразу после 1 3 5 4 2 (ответ 1 4 2 3 5).","naive":{"how":"построить все 120 перестановок пяти чисел, упорядочить, найти следующую","cost":"120","unit":"расстановок","formula":"5 × 4 × 3 × 2 × 1, плюс сортировка"},"method":{"cost":"7","unit":"сравнений и обменов","formula":"5 сравнений + 2 обмена","how":"найти подъём, обменять, развернуть хвост"},"gainText":"примерно в 17 раз меньше работы (120 / 7), не считая сортировки","keyIdea":"Хвост 5 4 2 уже убывает — его перестановки исчерпаны; меняем число перед ним.","how":["Идти справа налево и найти первое место, где число меньше следующего: 3 перед 5.","В хвосте найти самое правое число больше 3: это 4.","Обменять 3 и 4: 1 4 5 3 2.","Развернуть хвост 5 3 2 в 2 3 5: ответ 1 4 2 3 5."],"props":{"time":"O(n)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["элементы можно сравнить между собой","на входе — перестановка, следующая по возрастанию ищется от неё"],"input":"текущая перестановка","output":"следующая по порядку","gives":"повторяя шаг, получаем все перестановки по возрастанию, без повторов и пропусков","timePlain":"не больше 3 проходов по n элементам","spacePlain":"перестановка меняется на месте"},"scale":{"n":"расстановки 10 цифр","naive":"10! ≈ 3,6·10⁶ расстановок на каждый шаг","method":"не больше 20 действий на шаг","plot":{"n":1,"naive":6.5563,"method":1.30103,"nc":"nf","mc":"n","nName":"сколько чисел"}},"story":{"ru":{"trick":"поменять и перевернуть конец","task":"Числа 1 3 5 4 2 стоят в ряд. Если выписать все расстановки этих пяти чисел по возрастанию, как слова в словаре, какая идёт сразу после 1 3 5 4 2?","headOn":"В лоб: выписываем все 5 × 4 × 3 × 2 × 1 = 120 расстановок, упорядочиваем и ищем следующую.","notice":"Конец ряда 5 4 2 уже стоит по убыванию — это самая большая расстановка этих трёх чисел, больше из них не сделать. Значит, менять нужно число перед ним — 3.","steps":["Меняем 3 на наименьшее из чисел конца, которое больше 3, — это 4: получаем 1 4 5 3 2.","Переворачиваем конец 5 3 2 в 2 3 5: ответ 1 4 2 3 5 — за 7 сравнений и обменов."],"gain":["7 сравнений и обменов вместо 120 расстановок.","Для 10 цифр: не больше 20 действий вместо 3,6 миллиона расстановок на каждый шаг."],"whenToUse":"Когда нужно перебрать все расстановки чисел по порядку, не выписывая их все сразу.","needs":["числа можно сравнивать между собой","известна текущая расстановка"],"guarantees":"Повторяя шаг, получаем все расстановки по возрастанию, без повторов и пропусков.","work":"Не больше трёх проходов по ряду."},"en":{"trick":"swap and flip the end","task":"The numbers 1 3 5 4 2 stand in a row. If every arrangement of these five numbers were listed in increasing order, like words in a dictionary, which one comes right after 1 3 5 4 2?","headOn":"Head-on: write out all 5 × 4 × 3 × 2 × 1 = 120 arrangements, sort them and look for the next one.","notice":"The end of the row, 5 4 2, is already in decreasing order — that is the largest arrangement of those three numbers, nothing bigger can be made from them. So the number to change is the one before it: 3.","steps":["Swap 3 with the smallest number in the end that is larger than 3 — that is 4: we get 1 4 5 3 2.","Flip the end 5 3 2 into 2 3 5: the answer is 1 4 2 3 5 — in 7 comparisons and swaps."],"gain":["7 comparisons and swaps instead of 120 arrangements.","For 10 digits: at most 20 steps instead of 3.6 million arrangements for each step."],"whenToUse":"When you need to go through every arrangement of some numbers in order without listing them all at once.","needs":["the numbers can be compared with each other","the current arrangement is known"],"guarantees":"Repeating the step gives every arrangement in increasing order, with no repeats and no gaps.","work":"At most three passes along the row."}},"en":{"naive":{"how":"list all 120 arrangements, sort them and find the next one","unit":"arrangements","formula":"5 × 4 × 3 × 2 × 1, plus sorting"},"method":{"unit":"comparisons and swaps","formula":"5 comparisons + 2 swaps"},"scale":{"n":"arrangements of 10 digits","naive":"10! ≈ 3.6·10⁶ arrangements for each step","method":"at most 20 steps each","plot":{"nName":"how many numbers"}},"gainText":"about 17 times less work (120 / 7), not counting the sorting"}},"BruteForceSearch":{"id":"BruteForceSearch","problem":"Перебор начинают, не зная, успеет ли он закончиться за разумное время.","problemExample":"Найти нужную клетку на поле 6 × 6, заранее убедившись, что проверка всех клеток уложится в бюджет 100 проверок.","naive":{"how":"проверять клетки подряд, не посчитав их заранее","cost":"36","unit":"открытых клеток в худшем случае","formula":"6 × 6 клеток, узнаём только по ходу"},"method":{"cost":"36","unit":"открытых клеток в худшем случае","formula":"6 × 6 клеток, до старта видно, что это не больше 100","how":"сначала посчитать кандидатов, потом перебирать"},"gainText":"проверок столько же (36 в худшем случае, 23 до ответа в примере); выигрыш — гарантия до старта: 36 ≤ 100, перебор успеет","keyIdea":"Число кандидатов считается умножением до старта; сразу видно, успеет ли перебор.","how":["Посчитать кандидатов: 6 строк × 6 столбцов = 36.","Сравнить с бюджетом: 36 ≤ 100 проверок — можно.","Проверять клетки по порядку.","Остановиться на найденной клетке: 23-я."],"props":{"time":"O(N)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["число кандидатов известно до старта и не больше бюджета (~10⁸ простых операций в секунду)","одна проверка кандидата — несколько операций"],"input":"множество кандидатов","output":"найденный ответ","gives":"если ответ есть среди кандидатов, он найден; время известно заранее","timePlain":"O(N) — одна проверка на каждого кандидата","spacePlain":"O(1) — хранится только текущий кандидат"},"scale":{"n":"700 тысяч вариантов, ~10⁸ проверок в секунду","naive":"без подсчёта про 700 тысяч проверок узнаём только по ходу работы","method":"700 тысяч ÷ 100 миллионов в секунду ≈ 0,007 секунды — известно до старта","plot":false},"story":{"ru":{"trick":"подсчётом клеток заранее","task":"На поле 6 × 6 в одной клетке лежит приз, снаружи все клетки одинаковые. Открыть можно не больше 100 клеток. Успеем ли найти приз?","headOn":"В лоб: открываем клетки подряд, не посчитав их заранее. Приз нашёлся на 23-й клетке, но пока мы открывали, мы не знали, хватит ли 100 попыток.","notice":"Клетки можно посчитать, ничего не открывая: 6 рядов по 6 клеток — это 36. А 36 меньше 100, значит, открыть все клетки мы успеем в любом случае.","steps":["До первой попытки считаем: 6 × 6 = 36 клеток — даже в худшем случае это меньше 100 попыток.","Теперь спокойно открываем по порядку: приз на 23-й клетке, и то, что попыток хватит, было известно заранее."],"gain":["Попыток столько же — 23, в худшем случае 36, но ответ на вопрос «успеем ли» известен до первой попытки.","Если вариантов 700 тысяч, а за секунду проверяется 100 миллионов, заранее видно: перебор займёт около 0,007 секунды."],"whenToUse":"Когда ответ можно найти только перебором и нужно заранее понять, успеет ли перебор закончиться.","needs":["вариантов конечное число, и их можно посчитать, не проверяя","одна проверка быстрая"],"guarantees":"Если приз есть, он найдётся, и заранее известно, что попыток хватит.","work":"Одно умножение до старта и не больше 36 попыток."},"en":{"trick":"counting the cells first","task":"A 6 × 6 board has a prize under one cell, and all cells look the same from outside. You may open at most 100 cells. Will you find the prize in time?","headOn":"Head-on: open cells one after another without counting them first. The prize turned up in the 23rd cell, but while opening we did not know whether 100 tries would be enough.","notice":"The cells can be counted without opening any: 6 rows of 6 cells make 36. And 36 is less than 100, so we can open every cell in any case.","steps":["Before the first try, count: 6 × 6 = 36 cells — even in the worst case that is fewer than 100 tries.","Now open them in order with no worry: the prize is in the 23rd cell, and we knew in advance there would be enough tries."],"gain":["The same number of tries — 23, at worst 36 — but the answer to \"will we make it?\" is known before the first try.","With 700 thousand options and 100 million checks per second, you can see in advance that the search takes about 0.007 seconds."],"whenToUse":"When the answer can only be found by trying the options, and you need to know in advance whether that will finish in time.","needs":["there are finitely many options, and they can be counted without checking them","one check is quick"],"guarantees":"If the prize exists it will be found, and you know in advance that the tries are enough.","work":"One multiplication before starting, then at most 36 tries."}},"en":{"naive":{"how":"open cells in order without counting them first","unit":"cells opened in the worst case","formula":"6 × 6 cells, found out only along the way"},"method":{"unit":"cells opened in the worst case","formula":"6 × 6 cells, known before the start to fit into 100"},"gainText":"the same number of tries (36 at worst, 23 here); the gain is knowing in advance that 36 fits into 100","scale":{"n":"700 thousand options, ~10⁸ checks per second","naive":"without counting, you learn about the 700 thousand checks only along the way","method":"700 thousand ÷ 100 million per second ≈ 0.007 seconds — known before the start"}}},"VariableElimination":{"id":"VariableElimination","problem":"Каждая лишняя перебираемая неизвестная умножает работу на размер её диапазона.","problemExample":"Найти все пары (a, b) от 1 до 6, у которых a + b = 7.","naive":{"how":"перебрать все пары a и b от 1 до 6","cost":"36","unit":"проверенных пар","formula":"6 значений a × 6 значений b"},"method":{"cost":"6","unit":"проверенных пар","formula":"6 значений a, b = 7 − a вычисляется","how":"перебирать только a, b вычислять"},"gainText":"в 6 раз меньше проверок (36 / 6)","keyIdea":"Уравнение само даёт b = 7 − a; перебирать b не нужно.","how":["Выразить b через a из уравнения: b = 7 − a.","Перебрать a от 1 до 6.","Вычислить b для каждого a.","Проверить, что b попало в диапазон 1–6."],"props":{"time":"O(N)","space":"O(1)","timeRank":4,"spaceRank":1,"exact":"точный","needs":["есть уравнение, связывающее неизвестные","из уравнения одна неизвестная выражается явно"],"input":"система с неизвестными","output":"решения системы","gives":"находятся все те же решения, перебор на одно измерение меньше","timePlain":"O(N) при двух неизвестных — перебираем только a; в общем O(Nᵏ⁻¹): N значений у каждой из k неизвестных, одна вычисляется","spacePlain":"O(1) — хранятся текущие значения неизвестных"},"scale":{"n":"три числа с суммой 1000, каждое от 1 до 1000 (~10⁸ операций в секунду)","naive":"все тройки: 1000³ = 10⁹ — около 10 секунд","method":"третье вычисляется: 1000² = 10⁶ пар — около 0,01 секунды","plot":{"n":3,"naive":9,"method":6,"nc":"n3","mc":"n2","nName":"до какого числа перебираем"}},"story":{"ru":{"trick":"вычислением b вместо перебора","task":"Два числа a и b, каждое от 1 до 6. Нужно найти все пары, у которых a + b = 7.","headOn":"В лоб: перебираем все пары подряд — 6 значений a на 6 значений b, это 36 пар, а сумма 7 получается только у шести.","notice":"Если a уже выбрано, b можно не искать: из a + b = 7 сразу следует b = 7 − a.","steps":["Для каждого a от 1 до 6 сразу считаем b = 7 − a: получаются пары (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1).","Каждое b попало в промежуток от 1 до 6 — все шесть пар подходят, а остальные 30 клеток проверять не нужно."],"gain":["6 проверок вместо 36 — в 6 раз меньше.","Если чисел три и их сумма 1000, в лоб — миллиард троек (около 10 секунд), а если третье вычислять — миллион пар (около 0,01 секунды)."],"whenToUse":"Когда неизвестные связаны равенством и одну из них можно сразу выразить через остальные.","needs":["есть равенство, которое связывает неизвестные","одну неизвестную можно из него выразить"],"guarantees":"Находятся все те же пары, что и при полном переборе, — ни одна не пропущена.","work":"Перебираем только a: 6 вариантов вместо 36."},"en":{"trick":"computing b instead of trying it","task":"Two numbers a and b, each from 1 to 6. Find every pair with a + b = 7.","headOn":"Head-on: try every pair — 6 values of a times 6 values of b, 36 pairs, and only six of them add up to 7.","notice":"Once a is chosen there is nothing to search for: a + b = 7 means b = 7 − a straight away.","steps":["For each a from 1 to 6, compute b = 7 − a at once: the pairs are (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1).","Every b lands between 1 and 6 — all six pairs fit, and the other 30 cells never need checking."],"gain":["6 checks instead of 36 — six times fewer.","With three numbers adding up to 1000, head-on means a billion triples (about 10 seconds); computing the third gives a million pairs (about 0.01 seconds)."],"whenToUse":"When the unknowns are tied by an equation and one of them can be written straight from the others.","needs":["an equation ties the unknowns together","one unknown can be expressed from it"],"guarantees":"Exactly the same pairs as a full search — none is missed.","work":"Only a is tried: 6 options instead of 36."}},"en":{"naive":{"how":"try every pair of a and b from 1 to 6","unit":"pairs checked","formula":"6 values of a × 6 values of b"},"method":{"unit":"pairs checked","formula":"6 values of a, with b = 7 − a computed"},"gainText":"6 times fewer checks (36 / 6)","scale":{"n":"three numbers adding up to 1000, eac
