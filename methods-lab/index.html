<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<title>Мастерская методов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#F3F5EF; --sheet:rgba(243,245,239,.9); --glass:rgba(243,245,239,.93);
  --ink:#16233B; --graphite:#5B6472; --mute:#8C95A1; --rule:#C3CEC9; --rule2:#9FB0AA;
  --red:#D2432F; --good:#1F7A4D; --ochre:#B7791F; --blue:#2F5FD0; --violet:#6E44B8; --sys:#2B6E7E;
  --k-brown:#8A5A2B; --k-olive:#6B7A2A;
  --gr1:rgba(52,128,120,.09); --gr5:rgba(52,128,120,.16); --gr10:rgba(52,128,120,.26);
  --g3d-minor:#D6E2DE; --g3d-major:#AFC6C0;
  --hatch:rgba(22,35,59,.22);
  --display:'Unbounded','IBM Plex Sans',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E2A47; --sheet:rgba(14,42,71,.9); --glass:rgba(14,42,71,.93);
    --ink:#E6F0FA; --graphite:#A3B8CF; --mute:#6F8AA8; --rule:#2C4D71; --rule2:#46698F;
    --red:#FF7A66; --good:#6FD59B; --ochre:#F2C46D; --blue:#8FB3FF; --violet:#C3A6FF; --sys:#7FD3DF;
    --k-brown:#E0A878; --k-olive:#C8D67A;
    --gr1:rgba(150,200,255,.06); --gr5:rgba(150,200,255,.11); --gr10:rgba(150,200,255,.19);
    --g3d-minor:#1A3B5E; --g3d-major:#2E5881;
    --hatch:rgba(230,240,250,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E2A47; --sheet:rgba(14,42,71,.9); --glass:rgba(14,42,71,.93);
  --ink:#E6F0FA; --graphite:#A3B8CF; --mute:#6F8AA8; --rule:#2C4D71; --rule2:#46698F;
  --red:#FF7A66; --good:#6FD59B; --ochre:#F2C46D; --blue:#8FB3FF; --violet:#C3A6FF; --sys:#7FD3DF;
  --k-brown:#E0A878; --k-olive:#C8D67A;
  --gr1:rgba(150,200,255,.06); --gr5:rgba(150,200,255,.11); --gr10:rgba(150,200,255,.19);
  --g3d-minor:#1A3B5E; --g3d-major:#2E5881;
  --hatch:rgba(230,240,250,.22);
}

*{box-sizing:border-box;border-radius:0}
body{margin:0;color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:linear-gradient(var(--gr10) 1px,transparent 1px),linear-gradient(90deg,var(--gr10) 1px,transparent 1px),
    linear-gradient(var(--gr5) 1px,transparent 1px),linear-gradient(90deg,var(--gr5) 1px,transparent 1px),
    linear-gradient(var(--gr1) 1px,transparent 1px),linear-gradient(90deg,var(--gr1) 1px,transparent 1px);
  background-size:40px 40px,40px 40px,20px 20px,20px 20px,4px 4px,4px 4px}
.wrap{max-width:1420px;margin:0 auto;padding:0 20px 32px;overflow-x:clip}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,.stage:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:13px;height:13px;vertical-align:-2px}
.ic.lg{width:28px;height:28px;stroke-width:1.3}
.lab{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--graphite)}
.mono{font-family:var(--mono)}
.c-g{color:var(--good)}.c-r{color:var(--red)}.c-b{color:var(--blue)}.c-v{color:var(--violet)}.c-w{color:var(--ochre)}.c-m{color:var(--graphite)}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;padding:20px 0 12px}
.top h1{font:600 28px/1.05 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.02em}
.prog{margin-left:auto;min-width:230px}
.prog .k{font:600 22px/1 var(--mono);margin:3px 0 5px}
.prog .k span{font-size:13px;color:var(--graphite)}
.bar{display:flex;height:10px;border:1px solid var(--rule2);background:var(--paper)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--c,var(--good)) 0 1.3px,transparent 1.3px 3.6px);box-shadow:inset 0 0 0 1px var(--c,var(--good))}

.sheet{position:relative;border:1px solid var(--ink);padding:14px;background:var(--sheet)}
.frame{position:relative;border:2px solid var(--ink);padding:14px 16px 12px}
.zn{position:absolute;display:flex;font:500 8.5px var(--mono);color:var(--graphite);pointer-events:none}
.zn span{flex:1;display:flex;align-items:center;justify-content:center}
.zt{top:0;left:14px;right:14px;height:14px}.zb{bottom:0;left:14px;right:14px;height:14px}
.zl{left:0;top:14px;bottom:14px;width:14px;flex-direction:column}.zr{right:0;top:14px;bottom:14px;width:14px;flex-direction:column}
.zt span+span,.zb span+span{border-left:1px solid var(--ink)}
.zl span+span,.zr span+span{border-top:1px solid var(--ink)}
.stamp{display:grid;grid-template-columns:52px minmax(0,1fr) 64px minmax(0,1fr);margin:14px 0 0 auto;max-width:430px;border:1.5px solid var(--ink)}
.stamp div{padding:3px 6px;border-left:1px solid var(--ink)}
.stamp div:first-child{border-left:0}
.stamp span{display:block;font:500 8px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--graphite)}
.stamp b{display:block;font:600 11px var(--mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:6px;margin:12px 0 7px;padding-bottom:4px;border-bottom:1px dashed var(--rule2);font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.sub:first-child{margin-top:0}

.lg3{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.lg3>aside:first-child{grid-row:span 3}
.lg3>.card,.lg3>.pass,.lg3>.mt{grid-column:2}
.card .bd{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-items:start}
@media (max-width:1180px){.lg3{grid-template-columns:240px minmax(0,1fr)}}
@media (max-width:820px){.lg3{grid-template-columns:minmax(0,1fr)}.lg3>aside:first-child{grid-row:auto}.lg3>.card,.lg3>.pass,.lg3>.mt{grid-column:auto}}
/* method tabs */
.mt{border:1.5px solid var(--ink);background:var(--paper);min-width:0}
.mtbar{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow-x:auto;scrollbar-width:thin}
.mtl{display:flex;flex:none}
.tab{display:inline-flex;align-items:center;gap:6px;flex:none;font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink);background:transparent;border:0;border-right:1px solid var(--ink);padding:8px 12px 8px 10px;cursor:pointer;white-space:nowrap}
.tab .tn{font:500 9px var(--mono);color:var(--graphite);letter-spacing:.04em}
.tab .ic{color:var(--tc,var(--ink))}
.tab:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .tn,.tab[aria-selected="true"] .ic{color:var(--paper)}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.tab[hidden]{display:none}
.mtbody{display:grid;overflow:hidden}
.mtbody.anim{transition:height .18s ease}
@media (prefers-reduced-motion:reduce){.mtbody.anim{transition:none}}
.tp{grid-area:1/1;min-width:0;padding:10px 12px}
.tp[data-off]{display:none}
.tp .pb{padding:0;border:0}
.tp .pb>h4{display:none}
.stl2{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.sti{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;text-align:left;font:500 13px/1.35 var(--body);color:var(--ink);background:transparent;border:1px solid var(--rule2);border-left:3px solid var(--rule2);padding:5px 8px;cursor:pointer}
.sti b{font:600 10px var(--mono);color:var(--cc)}
.sti:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.sti[aria-current="step"]{border-color:var(--cc);border-left-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.sti:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.psum{border-top:1px dashed var(--rule2);padding-top:10px}
.psum.top{border-top:0;border-bottom:1px dashed var(--rule2);padding:0 0 10px;margin-bottom:10px}
.sum-h{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--graphite);margin:0 0 6px}
.psec{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;margin:0 0 10px}
.psec>.ic{color:var(--blue);margin-top:2px}
.psec h5{margin:0;font:600 12.5px var(--body);color:var(--ink)}
.psec>div{grid-column:2;font:500 12.5px/1.4 var(--body)}
.psec ul{margin:2px 0 0;padding-left:16px}
.ox{font:500 10px var(--mono);color:var(--graphite);margin-left:6px}
.stb{display:grid;gap:6px}
.stb h5{margin:0;font:600 12px var(--body);color:var(--cc)}
.stb ul{margin:2px 0 0;padding-left:16px}
.tp .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 16px;align-items:start}
@media (max-width:520px){.tab{padding:7px 9px}.tp{padding:10px}}

.btn{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:5px 9px;cursor:pointer}
.btn:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lng{display:inline-flex}.lng .btn+.btn{border-left:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.xs{padding:3px 6px;font-size:9.5px}
.btn.sq{padding:5px}
.btn .fic{color:var(--fc)}
.btn[aria-pressed="true"] .fic{color:inherit}
.flt{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.inp{font:500 12px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:5px 8px;width:100%}
.mlist{max-height:620px;overflow-y:auto;border-top:1px solid var(--ink);margin-top:6px}
@media (max-width:820px){.mlist{max-height:250px}}
.mrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:0 7px;align-items:center;width:100%;padding:5px 4px;border:0;border-bottom:1px solid var(--rule);background:none;cursor:pointer;text-align:left}
.mrow b{display:block;font:500 12.5px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow small{display:block;font:10px/1.3 var(--mono);color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .st{font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:0 4px;border:1px solid currentColor}
.mrow .st.ok{color:var(--good)} .mrow .st.no{color:var(--mute)}
.mrow:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.mrow[aria-pressed="true"]{color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.lvl{display:inline-flex;align-items:flex-end;gap:1px;height:11px;vertical-align:-1px}
.lvl i{display:block;width:4px;border:1px solid currentColor}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:8px}.lvl i:nth-child(3){height:11px}
.lvl i.on{background:currentColor}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:0 5px;border:1px solid currentColor;white-space:nowrap}

.mh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--ink)}
.mh .no{font:600 10px var(--mono);color:var(--red);letter-spacing:.1em}
.mh h2{margin:0;font:600 19px/1.15 var(--display)}
.mh .en{font:11px var(--mono);color:var(--graphite)}
.mh .nav{margin-left:auto;display:flex;gap:4px}
.vt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.vt .lab{margin-left:auto}
.stagewrap{position:relative}
.theater:fullscreen,.theater.fs{position:fixed;inset:0;z-index:300;background:var(--paper);padding:12px 16px;display:flex;flex-direction:column;gap:0;overflow:auto}
.theater:fullscreen .stagewrap,.theater.fs .stagewrap{flex:1;min-height:0;display:flex;flex-direction:column}
.theater:fullscreen .stage,.theater.fs .stage{height:auto;flex:1;min-height:240px}
.stage{position:relative;z-index:0;isolation:isolate;height:660px;border:1px solid var(--ink);overflow:hidden;background:var(--paper);outline:none}
@media (max-width:820px){.stage{height:330px}}
.stage canvas.gl{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.stage canvas.gl:active{cursor:grabbing}
.stage .sui{position:absolute;right:6px;top:6px;z-index:5;display:flex;gap:4px}
.stage .sui .btn{background:var(--glass)}
.stage .sui .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.stage .hint{position:absolute;left:8px;bottom:6px;z-index:4;pointer-events:none}
.stage .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 8px)}
.lbls{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;width:0;height:0;color:var(--ink);will-change:transform}
.lb .ld{position:absolute;left:0;top:-18px;width:18px;height:18px;overflow:visible;stroke:currentColor;stroke-width:1;fill:none}
.lb .an{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:currentColor}
.lb .lt{position:absolute;left:18px;bottom:17px;white-space:nowrap;font:500 12px/1.2 var(--mono);text-transform:none;letter-spacing:0;padding:1px 4px 2px;border-bottom:1px solid currentColor;background:var(--glass)}
.lb.l .ld{left:-18px;transform:scaleX(-1)}
.lb.l .lt{left:auto;right:18px}
.lb.lbs .lt{border-bottom:0;border-top:1px solid currentColor}
.lb.ftx .lt{border-bottom:0;border-top:0;padding:1px 4px;text-transform:none}
.lb.c-ink{color:var(--ink)}
.lb.c-blue{color:var(--blue)}.lb.c-red{color:var(--red)}.lb.c-violet{color:var(--violet)}.lb.c-green{color:var(--good)}.lb.c-amber{color:var(--ochre)}.lb.c-teal{color:var(--sys)}.lb.c-plain,.lb.c-dim{color:var(--graphite)}
.ph{border:1px solid var(--ink);border-bottom:0;padding:10px 12px;background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 8px);display:grid;gap:6px}
.ph b{font:600 13px var(--display)}
.ph ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.ph li{font:500 11px var(--mono);border:1px solid var(--ink);padding:2px 6px;background:var(--paper)}
.ph li span{color:var(--red);margin-right:5px}
[hidden]{display:none!important}

.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:8px}
.player .pb{display:flex;gap:4px}
.player .pb .btn{padding:6px 8px}
.tl{display:flex;gap:6px;min-width:0;align-items:flex-end}
.chap{display:flex;flex-direction:column;min-width:0}
.ch-problem{--cc:var(--red)}.ch-idea{--cc:var(--violet)}.ch-solve{--cc:var(--good)}.ch-compare{--cc:var(--ochre)}.ch-props{--cc:var(--blue)}
.chh{font:600 9px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.1em;border:0;border-top:3px solid var(--cc);background:none;color:var(--cc);text-align:left;padding:3px 2px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap.on .chh{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.segs{display:flex;min-width:0}
.seg{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:5px 7px;border:1px solid var(--ink);margin-right:-1px;background:var(--paper);cursor:pointer;font:600 10px var(--mono)}
.seg span{color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.seg[aria-current="step"]{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink));color:var(--paper)}
.seg[aria-current="step"] span{color:var(--paper)}
.cap{grid-column:1/-1;font:500 14px/1.35 var(--body);padding:6px 10px;border:1px solid var(--ink);border-left:4px solid var(--red);background:var(--paper);min-height:34px}
.cap b{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--red);margin-right:10px}
.cap.cap-idea{border-left-color:var(--violet)}.cap.cap-idea b{color:var(--violet)}
.cap.cap-solve{border-left-color:var(--good)}.cap.cap-solve b{color:var(--good)}
.cap.cap-compare{border-left-color:var(--ochre)}.cap.cap-compare b{color:var(--ochre)}
.cap.cap-props{border-left-color:var(--blue)}.cap.cap-props b{color:var(--blue)}
@media (max-width:520px){.tl{flex-wrap:wrap}}
/* time-rank pictogram */
.trk{display:inline-flex;align-items:flex-end;gap:1px;height:12px;margin-right:4px}
.trk i{display:block;width:3px;border:1px solid var(--rule2)}
.trk i.on{background:var(--tc);border-color:var(--tc)}
/* passport */
.pass{border:1.5px solid var(--ink);background:var(--paper)}
.pass .hd{padding:7px 10px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:6px}
.pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.pg{grid-template-columns:minmax(0,1fr)}}
.pb{padding:10px 12px;border-bottom:1px solid var(--rule2);min-width:0}
.pg>.pb:nth-child(odd):not(.full){border-right:1px solid var(--rule2)}
.pb.full{grid-column:1/-1}
@media (max-width:980px){.pg>.pb:nth-child(odd):not(.full){border-right:0}}
.pb h4{margin:0 0 7px;display:flex;align-items:center;gap:6px;font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.pp{font:600 14px/1.3 var(--body);margin-bottom:4px}
.pe{font:500 12px/1.35 var(--mono);color:var(--graphite)}
.dimrow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center;margin-top:6px}
.dimrow .dl{position:relative;height:18px;border:1px solid var(--c);background:repeating-linear-gradient(135deg,var(--c) 0 1.2px,transparent 1.2px 4px)}
.dimrow .dcap{grid-column:2;min-width:0;font:500 12px/1.35 var(--body);color:var(--c);text-align:left;white-space:normal;overflow-wrap:anywhere;margin-top:-4px}
.dimrow .dcap b{font:600 12px var(--mono)}
.nh{font:12px/1.35 var(--body);color:var(--graphite);margin-top:5px}
.idea{position:relative;border:2px solid var(--violet);padding:12px 14px;font:600 17px/1.3 var(--display);color:var(--ink);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 9px)}
.howc{display:flex;flex-wrap:wrap;gap:6px 0;align-items:stretch}
.hw{border:1px solid var(--ink);padding:5px 9px;min-width:110px;max-width:240px;font-size:12.5px;line-height:1.3;background:var(--sheet)}
.hw .n{display:block;font:600 9.5px var(--mono);color:var(--good)}
.arw{align-self:center;width:18px;height:0;border-top:1px solid var(--ink);position:relative;flex:none}
.arw:after{content:"";position:absolute;right:0;top:-4px;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;border-left:6px solid var(--ink)}
.gain{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.gain b{font:600 18px/1.2 var(--mono);color:var(--good)}
.gain span{font:500 12.5px var(--body)}
.gain{flex-wrap:wrap}
.scl{margin-top:8px;padding-top:6px;border-top:1px dashed var(--rule2);font:500 11.5px var(--mono);color:var(--graphite)}
.scl b{color:var(--ink)}
.cx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:18px 0 18px;border:1px solid var(--ink)}
.cx span{position:relative;font:500 9px/1.2 var(--mono);text-align:center;padding:5px 1px;border-left:1px solid var(--rule2);white-space:nowrap;overflow:visible}
.cx span:first-child{border-left:0}
.cx span.t{box-shadow:inset 0 4px 0 var(--blue);color:var(--blue);font-weight:600}
.cx span.t.s{box-shadow:inset 0 4px 0 var(--blue),inset 0 -4px 0 var(--sys)}
.cx span.s{box-shadow:inset 0 -4px 0 var(--sys)}
.cx span .mk{position:absolute;left:50%;transform:translateX(-50%);font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cx span .mk.tm{top:-15px;color:var(--blue)}
.cx span .mk.sp{bottom:-15px;color:var(--sys)}
.cxl{display:grid;gap:4px;font:500 11.5px/1.35 var(--body)}
.cxl .pill{justify-self:start}
.cxl b{font-weight:600}
.needs{display:grid;gap:3px;margin-top:6px}
.needs div{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;font-size:12.5px}
.needs .ic{color:var(--good)}
.io{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-top:8px}
.io .b{border:1px solid var(--ink);padding:4px 8px;font-size:12px;background:var(--paper);max-width:260px}
.io .m{border:2px solid var(--good);color:var(--good);font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 8px}
.gives{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;margin-top:8px;padding:6px 8px;border-left:3px solid var(--good);font-size:12.5px}
.gives .ic{color:var(--good)}
.card .kv>div{font-size:12.5px}
.card .bd{gap:8px}
@media (max-width:520px){.player{grid-template-columns:minmax(0,1fr)}}

.card{border:1.5px solid var(--ink);background:var(--paper)}
.card .hd{padding:7px 10px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:6px}
.card .bd{padding:10px;display:grid;gap:10px}
.kv{display:grid;gap:3px}
.stl{justify-self:start;font:600 8.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink);padding:1px 5px}
.kv>div{font-size:13px}
.lim{display:grid;gap:3px}
.lim div{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;font-size:12.5px}
.lim .ic{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chipb{font:500 10.5px var(--mono);border:1px solid var(--ink);background:none;padding:2px 6px;cursor:pointer;color:var(--ink);display:inline-flex;gap:4px;align-items:center}
.chipb:hover{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.chip{font:500 10.5px var(--mono);border:1px solid var(--rule2);padding:2px 6px;color:var(--graphite)}
@media (max-width:600px){.wrap{padding:0 16px 28px}.top h1{font-size:21px}.sheet{padding:10px}.frame{padding:10px 9px}
  .zt,.zb{left:10px;right:10px;height:10px}.zl,.zr{top:10px;bottom:10px;width:10px}.zn{font-size:7px}.prog{margin-left:0;width:100%}}

<script>window.LAB_DATA={"methods":[["SkipCounting","skip-counting","Счёт прыжками","Skip counting",0,1,"Прыжки равной длины по числовой прямой отмечают кратные длине прыжка.","Нужно увидеть, какие числа кратны, ещё до вычислений.",["Прямая без отметок","Прыжки по 2","Прыжки по 3","Цвета: 2 / 3 / оба"],"Прыжки длины k метят кратные k; совпавшие приземления — кратные обоим.","Числа до 20: кратные 2 и 3, общие — кратные 6.",[],[1],["Большие числа считают формулой, без рисования","Три условия — слишком много цветов"],{"name":"Skip counting","essence":"Move along the numbers in equal hops — wherever you land is a multiple of the hop length.","recognize":"You need to see or show which numbers have the multiple-of property BEFORE any computation.","general":"Hops of length k mark exactly the multiples of k.","example":"Numbers up to 20: multiples of 2 and of 3; the shared ones are multiples of 6.","limits":["Not as a literal by-hand counting method for large numbers (thousands and up)"],"steps":["Numbers on the line with no marks; which ones have the property is unknown","Hops of 2 mark the multiples of 2","Hops of 3 mark the multiples of 3","The combined line, each number colored by what it belongs to (2 / 3 / both)"]}],["InclusionExclusion","bar-model","Включение-исключение","Inclusion–exclusion principle",2,1,"Посчитай каждую часть отдельно, затем вычти посчитанное дважды.","Условие с «или» между свойствами, нужен точный счёт или сумма.",["Суммы сложены напрямую","Двойной счёт подсвечен","Три честных куска"],"Для k условий — знакопеременная сумма по всем пересечениям.","Кратные 2 или 3: только 2, оба, только 3.",[],[1],["Полоска не покажет три условия","Число слагаемых растёт как 2^k"],{"name":"Inclusion–exclusion principle","essence":"Count each part separately, then subtract whatever got counted twice.","recognize":"The statement has an \"or\" between two or more properties of a number/object, and the exact count or sum matters (\"a multiple of A OR a multiple of B\").","general":"For k conditions — an alternating sum over all intersections (pairwise, triple, …); \"A+B−AB\" is only the k=2 case.","example":"Multiples of 2 or 3: only 2, both, only 3.","limits":[],"steps":["The two per-condition sums are added directly; the total is struck through (the shared part is double-counted)","The same two numbers shown overlapping; the twice-counted part is highlighted","The bar split into three honest pieces (only 2, both, only 3); their sum is the right answer"]}],["VennDiagram","venn","Диаграмма Венна","Venn diagram",2,1,"Круги показывают, как условия пересекаются, ещё до чисел.","Важно, пересекаются ли условия вообще и как соотносятся области.",["Два отдельных круга","Круги сдвинуты, общая область","Все области с числами"],"Каждая область — своя комбинация условий; смысл есть и без чисел.","",[1],[1],["Четыре круга не покажут все пересечения"],{"name":"Venn diagram","essence":"Show how two (or three) conditions relate using circles — the shape of the overlap is visible before any numbers are.","recognize":"What matters is whether the conditions overlap AT ALL and how the regions relate; the exact count in each is secondary.","general":"Each non-overlapping region corresponds to its own combination of conditions.","example":"90 play football, 63 play chess, 36 do both: 117 different students.","limits":["Not for four or more conditions with plain circles"],"steps":["Two separate circles; how the conditions relate is unclear","The circles move together, a shared region appears with no number in it","All three regions labeled with numbers"]}],["ArithmeticProgressionSum","gauss-pairing","Сумма прогрессии","Sum of an arithmetic progression",5,1,"Ряд чисел с равным шагом суммируется одним умножением.","Нужна сумма чисел с постоянным шагом.",["Ряд через «+»","Пары с концов","Пары × сумма пары"],"Сумма m членов с шагом k равна k·m(m+1)/2.","4+8+12+16+20: пары дают по 24, итог 60.",[],[1,6,12,28],["Шаг меняется — формула неприменима","Числа примера должны различаться"],{"name":"Sum of an arithmetic progression","essence":"A run of evenly spaced numbers can be added with one multiplication instead of one term at a time.","recognize":"You need the sum (not the count) of numbers spaced at a constant step — multiples of something over a range, any evenly spaced run.","general":"The sum of the first m terms of a progression with step k is k · m·(m+1)/2, where m is how many such numbers fall in the range; any k, m, N.","example":"4+8+12+16+20: the pairs give 24 each, total 60.","limits":["Not when the step between numbers varies"],"steps":["The run stands in order joined by \"+\", the sum not computed","The numbers are linked into pairs from both ends by arcs; each arc is labeled with the pair's sum","The total (number of pairs × pair sum, plus the middle term when the count is odd)"]}],["LookupTable","lookup-table","Таблица поиска","Lookup table",3,1,"Ответы раскладываются в таблицу по ключу; вопрос — одно чтение ячейки.","Малый закрытый набор случаев с заданными ответами или часто спрашиваемые ключи.",["Цепочка проверок для 11","Ряд из 20 ячеек","Чтение ячейки 11"],"Ключ сам служит индексом; всё ограничено размером диапазона ключей.","Английские названия чисел до 19 по индексу.",[5],[17,19,22,24,30,34],["Диапазон ключа не помещается — нужен хеш","Код по индексу — другой приём"],{"name":"Lookup table","essence":"Lay the answers out in a table addressed by the very thing you would otherwise have had to decide on, so a chain of cases or a search collapses into reading one cell.","recognize":"The statement fixes a small, closed set of cases whose answers are simply GIVEN rather than derivable.","general":"Choose a key that determines the answer and can address a cell directly, fill every cell of the key's range once, and every later question becomes a single indexed read.","example":"English names of the numbers up to 19, looked up by position.","limits":["Not with a key whose full RANGE cannot be allocated, even if only a few keys are ever asked about","Not to be confused with selecting CODE by index (a branch or dispatch table)"],"steps":["The number 11 has to be spelled in English; the names below twenty are irregular, so deciding it means walking a chain of tests, one per case","One row of twenty cells, indexed 0 to 19, each holding the name that belongs to its own index; the irregular cases and the regular ones now look identical","11 reads cell 11 and 17 reads cell 17, each in one step with no test taken; the chain of twenty tests is gone, and the row's length is exactly the range of the key, which is the whole cost"]}],["Precomputation","precomputation","Предрасчёт","Precomputation",3,1,"Всё, что не зависит от запроса, строится один раз заранее.","Одна структура нужна многим запросам и от них не зависит.",["Три запроса, ничего нет","Квадраты ≤30 заранее","Каждый запрос — готовый ответ"],"Постройка выносится из цикла запросов: платим один раз вместо T.","Квадраты {1,4,9,16,25}: 16 и 25 найдены, 30 нет.",[],[2,4,7,10,15,16,20,23,25,31,39,41,46,47],["Структура зависит от запроса — бесполезно","Один запрос — выигрыша нет"],{"name":"Precomputation","essence":"Build everything that does not depend on the individual query once, up front — each query then only reads the ready result instead of recomputing it.","recognize":"The same structure (list, table, running sum) is used many times over with different queries and does not itself depend on the query.","general":"Lift the construction of the shared structure out of the query loop.","example":"Squares {1,4,9,16,25}: 16 and 25 are found, 30 is not.","limits":["Not when the structure depends on the query"],"steps":["Three queries: is 16 / 25 / 30 a perfect square? Nothing is built yet","Before answering any query, the squares ≤ 30 are computed once, in"]}],["OfflineAlgorithm","offline-algorithm","Офлайн-обработка","Offline algorithm",3,2,"Все вопросы даны заранее — можно прочитать пакет и отвечать выгодно.","Сначала число запросов, затем они сами; ответ сразу не требуется.",["Ответ сразу, максимум неизвестен","Прочитаны все: 12, 30, 7","Одна структура до 30"],"Прочитай пакет, возьми его общие факты, построй, ответь в исходном порядке.","Границы 12, 30, 7: строим до 30 один раз.",[5],[7,10,12,25],["Запрос зависит от прошлого ответа","Ответы — в исходном порядке","Само чтение пакета не экономит"],{"name":"Offline algorithm","essence":"When every question is handed over before any answer is due, the answers may be produced in whatever order is cheapest, and the whole batch may be read first to decide what to build.","recognize":"The input format lists every query up front.","general":"Read the whole batch first, then take from the batch as a whole whatever no single query can tell you.","example":"Limits 12, 30, 7: build up to 30 once.","limits":["Not when a later query's value depends on an earlier answer, or when the statement demands an immediate response","Not to be counted as a saving by itself"],"steps":["Answers are due one at a time: the first query, bound 12, is answered on the spot, while the two still to come are unread, so the largest bound in the batch is unknown at the moment it would be useful","All three queries are read before any answer leaves (bounds 12, 30, 7), the answers are held, and the largest bound, 30, becomes visible","One structure reaching 30 serves all three: each query is answered at its own position inside it (7, 12, 30), and the answers still leave in the order they arrived"]}],["LazyInitialization","lazy-initialization","Ленивая постройка","Lazy initialization",3,2,"Дорогая таблица строится при первом нужном вопросе или никогда.","Некоторые входы вообще не используют дорогую структуру.",["Таблица строится всегда","Флаг перед таблицей","Строится лишь по запросу"],"Флаг перед структурой: не готово — построй и отметь, готово — читай.","",[5,27],[4],["Постройка может попасть в тесный момент","Нужна всегда — флаг бесполезен","Строить строго один раз"],{"name":"Lazy initialization","essence":"The expensive table is built on the first question that actually needs it, and if no such question ever arrives it is never built at all.","recognize":"The constraints admit inputs for which the expensive structure is worthless.","general":"Put the structure behind a gate holding one flag: on every request, if the flag is set, return what is stored; otherwise build it, set the flag, and return it.","example":"The table is built on the first request, and never again.","limits":["Not when the deferred build would land inside the most tightly timed part of the run","Not where every possible input needs the structure"],"steps":["The table is built before the first query in both runs: in the run whose queries do ask for it the cost is earned, and in the run whose queries never touch it the very same cost is wasted","One flag stands in front of the table: an asking query finds the flag unset and builds, every later one finds it set and only reads","The asking run builds the table once, at the query that first needed it; the run that never asks builds nothing at all"]}],["BinarySearch","binary-search","Бинарный поиск","Binary search",4,1,"В отсортированном списке каждый шаг отбрасывает ненужную половину.","Ищем элемент или позицию в уже упорядоченном списке.",["Список и цель","Середина, минус половина","Повтор на остатке","Остался ответ"],"Сравни с серединой, отбрось половину: O(log m) сравнений вместо m.","",[],[2,4,41,42,44,45,50],["Список не отсортирован — не работает"],{"name":"Binary search","essence":"Find where a value sits in an already sorted list by repeatedly discarding the half that cannot contain it.","recognize":"You need to find an element or a position in a list that is already sorted (or grows in order by construction).","general":"Compare the target against the middle of the remaining stretch and drop the half where the answer cannot be — O(log m) comparisons instead of scanning all m elements.","example":"Finding 52 among 4, 9, 15, 23, 31, 40, 52 takes 3 comparisons.","limits":["Not on an unsorted list"],"steps":["A list of numbers and a target; where it sits is unknown","The middle is compared with the target, the half that cannot contain it is discarded","The same repeats on what is left","One element remains"]}],["TrialDivision","ladder-method","Пробное деление","Trial division",0,1,"Пробуем делители от 2 по порядку и снимаем простые множители.","Разложить число на простые или найти его наибольший простой делитель.",["Число 30","Делим на 2 → 15","Делим на 3 → 5","5 проверено — простое"],"Делители d, пока d·d ≤ остатка; остаток больше 1 — простой.","30 = 2 · 3 · 5, наибольший множитель 5.",[],[3,27,41],["Большие числа без малых делителей — медленно","Делить с малых простых по порядку"],{"name":"Trial division","essence":"Try the small numbers in turn, starting at 2 — see what divides — and peel off the prime factors that way.","recognize":"You need to factor a number into primes or to find one particular (say, the largest) prime factor.","general":"Try divisors d from 2 while d·d ≤ what REMAINS of the number.","example":"30 = 2 · 3 · 5, the largest factor is 5.","limits":["Not on large numbers with no small factors"],"steps":["The number 30, not yet broken down","Divide by 2, quotient 15 written below","Divide 15 by 3, quotient 5 written below","The leftover 5 is put through the loop's own condition rather than declared prime: 2 × 2 = 4 is still within 5 and 2 does not divide it, then 3 × 3 = 9 passes 5 and the loop ends"]}],["SumOfSquares","sum-of-squares","Сумма квадратов","Sum of squares formula",5,2,"Сумма первых n квадратов считается кубической формулой сразу.","Нужна сумма 1² + 2² + … + n².",["Квадрат 4×4","Две лесенки: 10 и 6","Все слои: 20+10=30"],"1² + … + n² = n(n+1)(2n+1)/6 для любого n.","1²+2²+3²+4² = 30.",[3],[6,28],["Не путать с суммой 1+2+…+n"],{"name":"Sum of squares formula","essence":"The sum of the first n squares has a closed-form cubic formula, computed directly instead of adding n terms one at a time.","recognize":"You need 1² + 2² + ...","general":"Sum of the first n squares = n(n+1)(2n+1) / 6, for any positive integer n.","example":"1²+2²+3²+4² = 30.","limits":["Not to be confused with the LINEAR sum 1+2+...+n"],"steps":["A 4×4 square of unit cells, unlabeled; split it along the diagonal into two staircases?","The growing staircase (T(4)=10 cells) and the rest (T(3)=6 cells): every k² splits into T(k) + T(k−1), the triangular numbers on either side of k","Each of the four layers (k=1..4) split the same way; summing every blue staircase (1+3+6+10=20) and every red one (0+1+3+6=10) gives 30 = 1²+2²+3²+4²"]}],["EuclideanAlgorithm","euclidean-algorithm","Алгоритм Евклида","Euclidean algorithm",0,1,"Заменяй большее число остатком от деления на меньшее до нуля.","Нужен НОД, сокращение дроби или проверка взаимной простоты.",["Прямоугольник 35×15","Два квадрата 15, полоса 5","Три квадрата 5: НОД"],"gcd(a,0)=a; gcd(a,b)=gcd(b, a mod b); всегда завершается.","НОД(35, 15) = 5.",[],[5],["Отрицательные числа — сначала модуль"],{"name":"Euclidean algorithm","essence":"To find the greatest common divisor of two numbers, keep replacing the larger one by the remainder of dividing it by the smaller.","recognize":"You need the greatest common divisor of two numbers, or need to reduce a fraction/ratio to lowest terms, or need to check whether two numbers share no common factor at all.","general":"Gcd(a, 0) = a; gcd(a, b) = gcd(b, a mod b) for b > 0.","example":"gcd(35, 15) = 5.","limits":["Not to be applied to negative numbers without first taking absolute values"],"steps":["A 35×15 rectangle; what size of square tiles it exactly is unknown","Two 15×15 squares tile part of the rectangle, leaving a 5×15 strip over","That strip is exactly covered by three 5×5 squares with nothing left over; 5 is the greatest common divisor"]}],["LCMViaGCD","lcm-via-gcd","НОК через НОД","Least common multiple via GCD",0,2,"НОК набора строится по одному числу, добавляя лишь новую часть.","Нужно наименьшее число, делящееся на все числа набора.",["35 и 15 плитками по 5","Счёт плиток меняется местами","3×35 = 7×15 = 105"],"lcm(a,b)=a·b/gcd(a,b); для списка — сворачивать попарно.","НОК(35, 15) = 105.",[11],[5],["Простое произведение всех завышает ответ"],{"name":"Least common multiple via GCD","essence":"Build the smallest number divisible by a whole list of numbers, one at a time.","recognize":"You need the smallest number that every number in a set or range divides into evenly (\"smallest number divisible by all of 1..N\").","general":"Lcm(a, b) = a·b / gcd(a, b); for a list or range of more than two numbers, fold this pairwise across every element in turn — lcm(a, b, c, ...) = lcm(lcm(a, b), c, ...).","example":"lcm(35, 15) = 105.","limits":["Not to be computed by just multiplying every number together"],"steps":["35 shown tiled by 7 units of 5 (their gcd), 15 shown tiled by 3 units of 5","Swap the counts: the 7 tiles counted inside 35 become how many times 15 repeats, and the 3 tiles counted inside 15 become how many times 35 repeats","3 × 35 = 7 × 15 = 105 = lcm(35, 15); both rows reach the exact same length, because that is precisely what the swap guarantees"]}],["SievingOverMultiples","","Решето по кратным","Sieving over multiples",0,2,"Обход кратных каждого делителя заполняет факт обо всех числах до N.","Один и тот же факт нужен про каждое число до границы.",[],"Меняется лишь запись; стоимость: все d — N ln N, простые — N ln ln N","",[14,15,9],[12,21,23,39,47],["Делители целиком — на логарифм дороже","Для одного числа — излишне"],{"name":"Sieving over multiples","essence":"Walk the multiples of every divisor in turn and leave something behind in each cell you land on, so that one sweep fills in a fact about every number up to the limit at once.","recognize":"The statement wants the SAME per-number fact.","general":"The sweep itself never changes — take a divisor d, step d, 2d, 3d, ...","example":"Every d writes into its multiples: the divisors of all numbers up to 20 at once.","limits":["Don't assume the cheaper prime-only cost for a cell whose value needs every divisor of its number","Not to be reached for the same fact about ONE given number"],"steps":[]}],["SieveOfEratosthenes","sieve-of-eratosthenes","Решето Эратосфена","Sieve of Eratosthenes",0,1,"Вычёркивай кратные каждого нового простого; уцелевшие — простые.","Нужны все простые до границы N сразу.",["Числа 2–19","Вычеркнуть кратные 2","Вычеркнуть кратные 3","8 простых уцелели"],"Вычёркивать с p² и только для p ≤ √N; время O(N log log N).","Простые до 20: 2, 3, 5, 7, 11, 13, 17, 19.",[13,9],[7,10,21,35,37,46,49,50,51],["Для одного большого числа — излишне","Вычёркивать только до √N"],{"name":"Sieve of Eratosthenes","essence":"To list every prime up to a limit, start with all numbers unmarked, then repeatedly take the next unmarked number as a prime and cross out all of its multiples.","recognize":"You need ALL the primes up to some bound N at once, not a yes/no test or a factorization of one single given number (TrialDivision is for that, one-number case).","general":"For a limit N, it suffices to cross multiples of each prime p starting at p² and only for p ≤ sqrt(N).","example":"Primes up to 20: 2, 3, 5, 7, 11, 13, 17, 19.","limits":["Not to test or factor one single large number in isolation"],"steps":["Numbers 2 to 19, none checked yet","2 is the first unmarked number, a prime; cross out every multiple of it (4, 6, 8, 10, 12, 14, 16, 18)","3 is the next unmarked number, a prime; cross out its multiples (6, 9, 12, 15, 18)","Nothing past 3 needs checking (the next candidate, 5, has 5²=25 > 19); the 8 numbers never crossed out are exactly the primes below 20"]}],["LinearSieve","linear-sieve","Линейное решето","Linear sieve",0,3,"Каждое составное записывается один раз своим наименьшим простым.","Нужны разложения многих чисел до одной границы.",["19 пустых ячеек","11 записей i×p","Ряд наименьших делителей","20 = 2·2·5"],"Массив наименьших делителей за O(N); разложение — повторным делением.","20 → 10 → 5 → 1 за три деления.",[13,14,9],[],["Нужен обрыв по хранимому делителю","Памяти больше, чем у решета","Правило остановки не нарисовано"],{"name":"Linear sieve","essence":"Reach each composite number exactly once, through the smallest prime that divides it, and keep that prime in its cell instead of a cross.","recognize":"You need the prime factorization of MANY numbers drawn from one bound, or the same number factored over and over….","general":"Hold an array of smallest prime factors, empty to start, and a list of the primes found so far.","example":"20 → 10 → 5 → 1 in three divisions.","limits":["Not to be preferred over the marking sieve for the asymptotics alone"],"steps":["The cells for 2 to 20, nineteen of them, each holding nothing yet","The eleven writes, one line each (2·2→4, 3·2→6, 3·3→9, 4·2→8, 5·2→10, 5·3→15, 6·2→12, 7·2→14, 8·2→16, 9·2→18, 10·2→20), with the prime being written coloured; the right-hand side of the eleven lines names each of the eleven composites below 21 exactly once, and no number twice","The same row now full: each composite holds the prime that was written into it (2 in nine of them, 3 in just 9 and 15), and each prime holds itself","20 taken apart by reading its own cell and nothing else: 20 holds 2, divide to get 10; 10 holds 2, divide to get 5; 5 holds 5, divide to get 1"]}],["WheelFactorization","wheel-factorization","Колесо делителей","Wheel factorization",0,2,"После малых простых кандидаты стоят на фиксированных местах цикла.","Перебор делителей идёт подряд, а кратные малых простых заведомо лишние.",["Колесо 6, числа 1–30","Убраны чётные: 15","Убраны кратные 3: 10","Убраны кратные 5: 8"],"Базис малых простых, колесо остатков; доля: 1/2, 1/3, 8/30, 48/210.","Спицы 1 и 5 по модулю 6.",[9,14],[3,27],["Тень не значит «составное»","Выигрыш падает с ростом колеса"],{"name":"Wheel factorization","essence":"Once the first few primes have been divided out separately, every number that could still be a divisor sits at one of a handful of fixed positions in a repeating cycle….","recognize":"A scan over candidate divisors (or candidate primes) that would otherwise step through every integer in a range….","general":"Choose a basis of the first few primes; their product is the wheel's circumference, and the wheel is the set of remainders below that product that share no factor with any basis prime.","example":"Spokes 1 and 5 modulo 6.","limits":["Not to be read as \"shaded means composite\"","Not to be enlarged indefinitely"],"steps":["A wheel of circumference 6: six spokes, five turns, the numbers 1 to 30 in their places, no class ruled out yet; one turn further out along a spoke adds 6","The three even spokes are shaded out; 15 of the 30 are left, one half of them","The spoke of the remaining multiples of 3 goes as well; the two spokes still standing are the remainders 1 and 5, holding 10 of the 30, one third of them","One prime further out: the multiples of 5 that sit on those two spokes (5 and 25) are shaded too, leaving 8 of the 30"]}],["NthPrimeBound","nth-prime-bound","Граница n-го простого","Upper bound on the nth prime",0,3,"Доказанное неравенство даёт потолок n-го простого до поиска.","Известен только номер простого, нужна граница решета.",["6-е простое: «?»","Шаги растут как ln x","6 шагов по ln 6: мало","Шаг заново: потолок 15","Поиск 0..15"],"При n ≥ 6: p_n < n(ln n + ln ln n).","6-е простое 13, потолок 15.",[19,47,46,14],[7],["Только для n ≥ 6","Границу брать с запасом","Картинка — эвристика; доказательство у Россера"],{"name":"Upper bound on the nth prime","essence":"Before searching for the Nth prime, get an explicit numeric ceiling on how large it can possibly be from a proven inequality, instead of guessing a limit or growing the search open-endedly.","recognize":"You are told only the INDEX N of a prime (not any bound on the prime's own size) and need to know in advance how far a search or a sieve must reach to be certain of finding it.","general":"For n ≥ 6, the nth prime pn satisfies n(ln n + ln ln n − 1) < pn < n(ln n + ln ln n) — the upper half alone is enough to size a sieve safely.","example":"The 6th prime is 13; the bound is 15.","limits":["Not for n < 6"],"steps":["Find the 6th prime; the number line has no marked end, only a \"?\"","The real primes up to 20 on a number line, numbered 1st..8th (the 6th is 13, the target the next frames measure against); under it, on the same x-scale, the curve ln x with two bars reaching up to it","6 numbered hops of the ruler measured at 6 (ln 6 ≈ 1.792), walked out from 0: the 6th hop lands at 10.75, and a red dashed gap with a x runs from it to the 13 mark","The hop was measured in the wrong place: at 6, where primes are still dense, not near where the walk ends. Re-measure the ruler at the landing point, 10.75, and walk the same 6 hops again: the 6th now lands at 14.25, past 13, and ⌈14.25⌉ = 15 is the ceiling. The new ruler is drawn as the old one (1.8) plus a short extra piece (0.6), total 2.4 = ln 10.75","A search range 0..15 with the primes it contains dotted in: the 6th dot, 13, sits safely inside the ceiling"]}],["DigitalInvariantBound","digital-invariant-bound","Граница цифровых сумм","Finiteness bound for perfect digital invariants",1,3,"Сумма степеней цифр растёт медленнее самого числа — длина ограничена.","Ищем числа, равные сумме от своих цифр, без верхней границы.",["Число и поиск без конца","Потолок: k·9³","Минимум длины: 10^(k−1)","Не больше четырёх цифр"],"Потолок растёт линейно по длине, число — в 10 раз за цифру.","Для кубов цифр поиск до 10 000.",[17],[30],["Вклад цифры без максимума — неприменимо","Длины ниже границы проверять","Свободная степень — границы нет"],{"name":"Finiteness bound for perfect digital invariants","essence":"Before searching for numbers that equal a fixed total built from their own digits….","recognize":"The statement asks for every number equal to some total assembled from its own digits, and gives no upper limit on the numbers themselves.","general":"One digit contributes at most a fixed amount, so the largest total reachable with a given number of digits grows only in proportion to that count….","example":"For cubes of digits, search up to 10,000.","limits":["Not to be applied when the per-digit contribution has no maximum","Not to be expected to produce a bound when the power is left free alongside the digit count"],"steps":["One number that really does equal the total of the cubes of its digits, and a search range with no end marked, only a question mark","The ceiling side: a single digit contributes at most nine cubed, so a length of k digits can reach at most k times that; the column of ceilings grows by a fixed step per row","The floor side laid alongside it: the smallest number of each length, growing by a factor of ten per row instead of a fixed step. Four rows have room for a candidate; on the fifth the floor has overtaken the ceiling, and the step rules in the two column headings are why it never comes back","The bound the crossing gives: four digits at most, so the whole search fits below ten thousand"]}],["PrimeNumberTheorem","prime-number-theorem","Закон простых","Prime number theorem",0,3,"Доля простых убывает; их число около x делённого на ln x.","Нужна оценка числа простых или шага между ними.",["Сколько простых до 100?","Счёт против x/ln x","Ошибка: 15%, 13%, 8%"],"π(x)/(x/ln x) → 1; около x простое примерно каждое ln x.","До 100: 25 простых, формула даёт 21.7.",[17],[7],["Формула асимптотическая: точна лишь в пределе"],{"name":"Prime number theorem","essence":"As numbers grow, the fraction of them that are prime keeps shrinking, in a way one explicit formula.","recognize":"You need to estimate how many primes lie below some bound, or how far apart primes typically run near a given size, without counting them one by one….","general":"Pi(x), the count of primes up to x, satisfies pi(x) / (x ÷ ln x) → 1 as x → infinity.","example":"Up to 100: 25 primes; the formula gives 21.7.","limits":["Not to be read as an exact formula, or as increasingly accurate at every individual scale without exception"],"steps":["How many primes lie at or below 100? Below 10,000? Below 1,000,000? Unknown","The real, counted totals (25, 1229, 78498) next to the formula's guess (21.7, 1086, 72382) at each of the three scales","The guess undershoots by 15.1%, then 13.2%, then 8.4%"]}],["PrefixSum","prefix-sum","Префиксные суммы","Prefix sum",3,1,"Массив накопленных сумм даёт сумму отрезка одним вычитанием.","Много запросов суммы по отрезкам одного массива.",["Ряд, отрезок неизвестен","Накопленные суммы","24 − 4 = 20"],"prefix[i]=prefix[i−1]⊕a[i] для любой ассоциативной операции; отрезок: prefix[R]−prefix[L−1].","Ряд 3,1,4,5,9,2,6,8: позиции 3–6 дают 20.",[],[2,10,14,21,26,39,50],["Массив меняется — нужно дерево","Брать prefix[L−1]","Операция обязана быть ассоциативной"],{"name":"Prefix sum","essence":"Build a running-total array once — each cell holding everything added up to that point — so the sum of ANY range afterward is a single subtraction, not a re-added loop.","recognize":"Many queries each ask for the sum (or count) over a range of a fixed array, and re-adding the range from scratch every time would repeat the same work across overlapping queries.","general":"Prefix[i] = prefix[i-1] + value[i] (prefix[0] = 0); the sum of positions L..R is prefix[R] - prefix[L-1], for any L ≤ R.","example":"Row 3,1,4,5,9,2,6,8: positions 3–6 give 20.","limits":["Not when the underlying array changes between queries","Not with a combining rule that is not associative"],"steps":["8 numbers in a row (3,1,4,5,9,2,6,8); the sum of the highlighted range (positions 3-6) is unknown","A second row underneath, each cell the running total up to that position (3,4,8,13,22,24,30,38)","The range sum is just two of those cells subtracted: 24 − 4 = 20"]}],["DivisorCountFormula","divisor-count-formula","Число делителей","Divisor function τ(n)",0,2,"Число делителей определяется только показателями простых множителей.","Нужно, сколько делителей у числа, без их перечисления.",["Число 20","20=2²·5: 3×2 выбора","Сетка 3×2: 6 делителей"],"Если n = p₁^e₁·…·p_k^e_k, то τ(n) = (e₁+1)…(e_k+1).","τ(20) = 6: 1, 2, 4, 5, 10, 20.",[22],[12],["Нужна единственность разложения","Больше двух простых — сетку не нарисовать"],{"name":"Divisor function τ(n)","essence":"The number of divisors of n depends only on the EXPONENTS in its prime factorization.","recognize":"You need HOW MANY divisors a number has (not the divisors themselves, and not their sum).","general":"If n = p1^e1 × p2^e2 × ...","example":"τ(20) = 6: 1, 2, 4, 5, 10, 20.","limits":["Not to be applied by picking exponents that are NOT independent"],"steps":["The number 20; how many divisors it has is unknown","20 = 2² × 5&sup1;; the exponent of 2 gives 3 independent choices (2⁰, 2&sup1;, 2²), the exponent of 5 gives 2 (5⁰, 5&sup1;)","A 3×2 grid of every combination, each cell an actual divisor (1, 2, 4, 5, 10, 20)"]}],["MultiplicativeFunction","multiplicative-function","Мультипликативность","Multiplicative function",0,3,"Для взаимно простых частей счёт целого равен произведению счётов частей.","Счёт о числе, записанном как произведение взаимно простых множителей.",["20 = 4 × 5","Простые множители не пересекаются","Сетка делителей: 6 разных","3 × 2 = 6"],"f(m·n)=f(m)·f(n) при gcd(m,n)=1; соседние числа всегда взаимно просты.","τ(20) = τ(4)·τ(5) = 3·2 = 6.",[11,21],[12],["Общий множитель — ошибка без сигнала","Проверять пару после деления на 2"],{"name":"Multiplicative function","essence":"Some counts about a whole number are settled by its parts independently, so when the number splits into two pieces sharing no common factor….","recognize":"The statement asks for an arithmetic count about a number.","general":"A function of a positive integer is multiplicative when it gives 1 at 1 and, for any two coprime m and n, satisfies f(m·n) = f(m)·f(n).","example":"τ(20) = τ(4)·τ(5) = 3·2 = 6.","limits":["Not to be applied to two factors that share a factor","Not to be assumed to hold for ANY pair of factors just because it holds for coprime ones"],"steps":["20, arriving already written as 4 times 5; how many divisors it has is unknown","The two factors are broken into primes, 4 into two 2s and 5 into itself; the two prime sets do not meet, which is the whole precondition","The divisors of 4 down the side and the divisors of 5 across the top, every cell their product: 1, 5, 2, 10, 4, 20","Three down the side times two across the top is six, each number countable off the previous frame's own headings. Below it the guard: 2 paired with 2, which DO share a prime, gives four cells holding only three different values, so the count of cells stops being the count of divisors"]}],["PositionalNotation","positional-notation","Позиционная запись","Positional notation",1,1,"При выбранном основании число целиком задаётся последовательностью цифр.","Вопрос о цифрах числа или названо другое основание.",["29 фишек","Основание 10: 2 9","Основание 2: 11101","Смешанное: 1021"],"Каждое число имеет единственную запись; младшая цифра — остаток от деления.","29 = 2 9 = 11101 = 1021 (факториальная).",[24,39],[4,13,16,20,25,30,33,34,35,36,37,43],["Операции над текстом цифр — отдельно","Сначала назвать основание"],{"name":"Positional notation","essence":"Once a base is chosen, a whole number is completely described by the sequence of its digits….","recognize":"The statement asks about a number's DIGITS rather than its magnitude.","general":"Fix a base of two or more; every non-negative integer then has exactly one digit sequence in that base with every digit below the base and no leading zero….","example":"29 = 2 9 = 11101 = 1021 (factorial base).","limits":["Not as the record for an operation on the WRITTEN FORM that ignores place value entirely"],"steps":["Twenty-nine loose counters in a row; what \"the digits\" of this quantity are is not yet a question with an answer, because no base has been chosen","The same counters gathered into two full groups of ten with nine left over, giving the digit strip 2 9","The same counters regrouped, nothing added or removed: one sixteen, one eight, one four, no two, one single, giving the digit strip 1 1 1 0 1","The dial's third setting, where the places no longer come from one repeated base: their weights are 24, 6, 2 and 1, and the counters group as one block of twenty-four, an empty six, two twos and a single, giving the digit strip 1 0 2 1. Below, the three strips of the one quantity side by side"]}],["BigIntegerArithmetic","big-integer-arithmetic","Длинная арифметика","Arbitrary-precision arithmetic",1,2,"Число длиннее машинного типа хранится массивом цифр, считаем столбиком.","Число не помещается в 64-битный тип.",["187 + 259","Столбцы с переносом","Ответ 446"],"Цифры с младшей, фиксированное основание; перенос как в столбике.","187 + 259 = 446.",[23],[13,16,20,25],["Помещается в 64 бита — не нужно","Перенос при умножении бывает многозначным"],{"name":"Arbitrary-precision arithmetic","essence":"When a number has more digits than a native integer type can hold, store it as an array of digits and operate on it the same way a person does on paper.","recognize":"A number in the problem is too large for any fixed-width integer type (dozens or hundreds of digits, or growing without any given bound)….","general":"Represent the number least-significant-digit-first in a fixed base (usually 10, or a larger power of 10 for speed).","example":"187 + 259 = 446, digit by digit.","limits":["Not to be reached for a number that already fits in a native 64-bit (or 128-bit) integer"],"steps":["187 + 259 stacked, too many digits to add as one native number (illustrative only","Right to left: 7+9=16, write 6 carry 1; 8+5+1=14, write 4 carry 1; 1+2+1=4","446, read off column by column, no native integer ever held the full sum until the very last digit was written"]}],["IntegerOverflowAvoidance","integer-overflow-avoidance","Защита от переполнения","Integer overflow avoidance",7,2,"Оцени максимум промежуточного значения и перестрой выражение под тип.","Промежуточное значение намного больше ответа.",["5400 не влезает: 400","Сначала 120 ÷ 15 = 8","8 × 45 = 360"],"Делить до умножения, сравнение через деление, расширить тип, брать остатки.","120 × 45 ÷ 15 = 360 без переполнения.",[31,5],[5,7,10,15,25,28],["Делитель не делит нацело — ошибка","Знаковое переполнение не проверить после","Расширять тип самой операции"],{"name":"Integer overflow avoidance","essence":"Work out ahead of time how large the biggest intermediate value can get, check that against what the chosen type can hold, and rearrange the expression so no step ever reaches past it.","recognize":"An intermediate step — a product, a running total, the left side of a comparison — can be far larger than the final answer, while the answer itself fits the type comfortably.","general":"Bound the largest value each step can reach from the constraints, and compare it against the type's range.","example":"120 × 45 ÷ 15 = 360 with no overflow.","limits":["Don't divide before multiplying when the divisor divides NEITHER factor exactly","Don't rely on inspecting a signed result to discover that it overflowed"],"steps":["120 × 45 ÷ 15 is asked; taken in the written order it forms 5400, which needs a fourth digit slot that the three-slot container does not have, so the stored value wraps to 400","15 divides 120 exactly, so divide first: 120 ÷ 15 = 8, one digit, far inside the same three slots","8 × 45 = 360 fills exactly three slots, and 360 is 5400 ÷ 15"]}],["CrossMultiplication","cross-multiplication","Перекрёстное умножение","Cross-multiplication",1,2,"Точные сравнения и делимость — в целых числах, без деления.","Нужно точное сравнение, а деление даёт лишь приближение.",["Две дроби, связь неизвестна","Деление: бесконечные хвосты","Крест: два целых","Произведения решают"],"a/b против c/d: сравнить a·d и c·b; делимость — остаток равен нулю.","",[],[9,33],["Знаменатели сначала положительные","Округлённый вход точнее не станет","Произведения могут переполнить тип"],{"name":"Cross-multiplication","essence":"Settle an exact question by staying inside the whole numbers — multiply across instead of dividing, and read a remainder instead of rounding.","recognize":"The answer turns on an exact comparison or an exact whole-number test, and the obvious route to it runs through a division whose result could only ever be approximate.","general":"Two instances of one move — replace the operation that leaves the whole numbers with one that stays inside them.","example":"3/7 vs 5/12: 3·12 = 36 > 35 = 5·7, so 3/7 is larger.","limits":["Not to be expected to make an approximate input exact"],"steps":["Two fractions with the relation between them unknown; by eye they are indistinguishable","The direct route, dividing each one out: both quotients run on without terminating, so whatever gets compared is a rounded value and not the number; marked as rejected","The crossing instead: each numerator meets the other's denominator, giving two whole numbers and no division anywhere","The two products decide it, and the verdict carries back to the two fractions"]}],["Memoization","memoization","Мемоизация","Memoization",3,2,"Ответ рекурсивного вызова запоминается; повторный вызов читает готовое.","Рекурсия вызывается с одними аргументами в разных ветках.",["fib(2) нужен дважды","Второй fib(2) из кэша","fib(4)=2+1=3"],"Кэш по аргументам: есть — вернуть, нет — вычислить и сохранить.","fib(4) = 3, fib(2) считается один раз.",[],[14],["Результат зависит от внешнего состояния","Ключ — ровно нужные аргументы"],{"name":"Memoization","essence":"The first time a recursive call is answered, write the answer down; every later call asking the exact same question reads the answer back instead of doing the work again.","recognize":"A recursive definition is called on the SAME input more than once across different branches of the recursion (overlapping subproblems)….","general":"Wrap the recursive function with a cache (array or hash map) keyed by its argument(s).","example":"fib(4) = 3; fib(2) is computed only once.","limits":["Not when a call's result depends on more than just its own arguments (e.g. it also reads or mutates outside state)"],"steps":["Computing fib(4) needs fib(3) and fib(2); fib(3) itself ALSO needs fib(2)","The first fib(2) is computed fully (fib(1)+fib(0)=1+0=1) and stored; the second fib(2), needed directly by fib(4), just reads that stored 1 back instead of expanding again","Fib(4) = fib(3) + fib(2) = 2 + 1 = 3, with fib(2)'s work paid for only once"]}],["ExplicitStackRecursion","explicit-stack","Рекурсия через стек","Recursion with an explicit stack",7,2,"Спуск записывает шаги в свой стек, подъём заполняет ответы.","Цепочка вызовов слишком глубокая, ответ нужен каждому шагу.",["Цепочка из 4 состояний","Спуск: запись в стек","Подъём: ответ +1","Все ответы заполнены"],"Спуск до известного ответа, затем снятие со стека с подсчётом.","",[],[14],["Это не хвостовая рекурсия","Класть всё нужное подъёму","Цикл в цепочке — не работает"],{"name":"Recursion with an explicit stack","essence":"Walk down the chain by hand, recording each step into a stack you own, then walk that stack back up and fill in an answer at every step recorded on the way down.","recognize":"The definition is naturally recursive, the chain of calls can run far deeper than a call stack will tolerate….","general":"Descend from the starting state, pushing each state visited, until reaching a state whose answer is already known.","example":"A chain of 1,000 links walked with a list instead of nested calls.","limits":["Not to be presented as the same thing as tail-call elimination","Not when the descent can arrive back at a state already on the stack"],"steps":["A chain of four states, each pointing at the one it depends on; only the last has a known answer, the other three are question marks","The descent runs along the chain and drops each state it leaves into a stack, so the stack ends up holding the path in reverse; the descent stops at the state whose answer was already known","The unwind: each state comes off the top, and its answer is one more than the answer directly below it","The chain again with every state's answer filled in, the one originally asked for highlighted"]}],["SparseSet","sparse-set","Разреженное множество","Sparse set",7,3,"Список реально записанных ячеек делает очистку дешёвой.","Большой буфер многократно заполняется в немногих ячейках.",["Буфер 12, записано 3","Реестр записанных ячеек","Очистка по реестру","3 против 12"],"Плотный и разреженный массивы плюс счётчик; очистка — одно присваивание.","",[],[29],["Нужна известная верхняя граница","Читать только подтверждённые ячейки","Без повторных элементов"],{"name":"Sparse set","essence":"Keep an explicit roster of the slots that were actually written, so emptying the container costs what was used rather than what was reserved.","recognize":"One wide scratch area is filled and emptied over and over, and each round writes only a handful of its slots.","general":"Two arrays over a universe of known maximum size, plus a count.","example":"Clearing 10 used cells instead of the whole buffer.","limits":["Not when the universe has no known upper bound","Don't hold the same member twice"],"steps":["A reused buffer of 12 slots with 3 of them written; how many slots the next emptying has to visit is unknown","A second, packed array appears underneath holding exactly the three written slot numbers, each linked up to the slot it names; each written slot holds, in return, its own position in that roster, so the link can be followed either way","The emptying walks the roster instead of the buffer: three links, three slots reset, the remaining nine never looked at (drawn dashed and untouched)","The two costs as tick rows to count by eye: 3 against 12"]}],["FastExponentiation","fast-exponentiation","Быстрое возведение","Exponentiation by squaring",6,2,"Показатель делится пополам, основание возводится в квадрат: log₂ n шагов.","Нужна степень с большим показателем, часто по модулю.",["3^13: 12 умножений","13→6→3→1→0","Ответ за 4 строки"],"Нечётный показатель — домножить; основание в квадрат; показатель пополам.","3^13 = 1 594 323.",[],[15,28,48],["Нужна ассоциативная операция","Брать остаток после каждого умножения"],{"name":"Exponentiation by squaring","essence":"To raise a number to the power n, halve n and square the base at every step instead of multiplying by the base n times.","recognize":"You need base^exponent for a LARGE exponent (thousands, millions, or a variable up to some big bound), especially under a modulus, and multiplying one factor in at a time is too slow.","general":"While exponent > 0 — if the exponent is odd, multiply the running result by the current base.","example":"3^13 = 1,594,323.","limits":["Not to be applied to a non-associative operation"],"steps":["3^13; multiplying by 3 thirteen times is 12 multiplications","4 rows, the exponent halving each time (13→6→3→1→0); the base squares every row, and the running result only picks up the base on the rows where the exponent is odd","3^13 = 1594323, reached in 4 rows instead of 12 multiplications"]}],["ModularArithmetic","modular-arithmetic","Модульная арифметика","Modular arithmetic",6,2,"Когда важен остаток, каждое число заменяют остатком с самого начала.","Ответ нужен как остаток: день недели, цикл, последняя цифра.",["34 над циферблатом 12","34 → ячейка 10","10 + 5 → 3","10 × 5 → 2","Один циферблат"],"Сложение, вычитание, умножение совместимы с остатками; период — по НОК.","34 mod 12 = 10; 10·5 mod 12 = 2.",[12,32,40,30],[19,48],["Сравнение и деление не переносятся","Период нужно доказать","Остаток привести к неотрицательному"],{"name":"Modular arithmetic","essence":"When only the remainder after division by a fixed number matters, every quantity can be replaced by its own remainder from the very start and the arithmetic still comes out right.","recognize":"The answer is asked for as a remainder, or a quantity is only ever used through its remainder.","general":"Congruence modulo m is compatible with addition, subtraction and multiplication.","example":"34 mod 12 = 10; 10·5 mod 12 = 2.","limits":["Not to be applied to a comparison of size, or to a division, as though reduction were free","Don't reduce an argument by a period that has not been PROVEN to be one"],"steps":["The number 34 above a twelve-cell dial (the clock face, with 12 read as 0); which cell it belongs to is unmarked","Two whole turns of the dial and a short leftover piece (12 + 12 + 10 = 34) place 34 in cell 10; that cell lights up. The REPRESENTATIVE feature: any number, however large, is one of these twelve","The same dial, unchanged; 10 + 5 = 15 = 12 + 3 lands in cell 3, which lights up alongside cell 10. Addition never leaves the twelve cells","The same dial again; the same two numbers, 10 × 5 = 50 = 4 × 12 + 2, land in cell 2 instead. Multiplication also never leaves the twelve cells, and lands somewhere else than the sum did","One dial, three cells lit (10 from the reduction, 3 from the sum, 2 from the product) and the count of cells itself: four features of ONE finite set of twelve, which is what separates the specializations from each other"]}],["ModularInverseFermat","modular-inverse-fermat","Обратный по Ферма","Modular inverse via Fermat's little theorem",6,3,"По простому модулю деление на a — умножение на a^(p−2).","Нужно делить по простому модулю, часто на факториалы.",["1 ÷ 3 (mod 7)","3⁵ mod 7 = 5","3 × 5 ≡ 1"],"a^(p−1) ≡ 1 (mod p), значит a⁻¹ ≡ a^(p−2) (mod p).","Обратный к 3 по модулю 7 равен 5.",[31,30],[15,28],["Модуль обязан быть простым","a кратно p — обратного нет"],{"name":"Modular inverse via Fermat's little theorem","essence":"There is no division in modular arithmetic, but under a PRIME modulus, dividing by a is the same as multiplying by a fixed power of a.","recognize":"You need to divide by a number modulo a prime (most often as part of a formula with a factorial or a binomial coefficient in the denominator, mod 10^9+7 or similar).","general":"For prime p and a not a multiple of p, a^p−1 ≡ 1 (mod p) (Fermat's little theorem).","example":"The inverse of 3 modulo 7 is 5.","limits":["Not when the modulus is not prime","Not when a is a multiple of p"],"steps":["1 ÷ 3 (mod 7): no direct division exists","X = 3^7−2 mod 7 = 3^5 mod 7 = 5, by the proven theorem, not trial and error","Verify: 3 × 5 = 15 = 7 + 7 + 1 ≡ 1 (mod 7); the division really does check out"]}],["BatchInversion","batch-inversion","Пакетное обращение","Batch inversion (Montgomery's trick)",6,3,"Весь список обращается ценой одного обращения произведения.","Нужны обратные ко всем факториалам до границы по простому модулю.",["5 обратных по модулю 29","Факториалы: 1, 2, 6, 24, 4","Одно возведение: 22","Вниз: 22, 23, 5, 15, 1"],"Обратить наибольший факториал, затем идти вниз умножениями на индекс.","Пять обратных за одно возведение.",[6,32,30],[15],["Один необратимый элемент ломает всё","Нужен весь список заранее","Идти вниз, от большего"],{"name":"Batch inversion (Montgomery's trick)","essence":"A whole list of numbers can be inverted under a prime modulus for the price of one inversion: invert their product once….","recognize":"The answer is a formula with factorials or products in the denominator, taken modulo a prime, and it is needed for many different arguments.","general":"Inversion distributes over a product, so the inverse of any element of a list equals the product of everything before it, times the product of everything after it….","example":"Five inverses with a single exponentiation.","limits":["Not when any element of the list fails to be invertible","Not to be started before the whole list is known"],"steps":["The inverses of all five factorials are wanted modulo 29; done one at a time that is five separate exponentiations","The factorials themselves come from one running product: 1, 2, 6, 24, and then 120, which is 4 modulo 29","ONE exponentiation inverts the largest of them: 4 raised to the 27th power is 22 modulo 29","Walking back down, each smaller inverse factorial is the previous one times the index left behind (22, 23, 5, 15, 1)"]}],["LatticePaths","lattice-paths","Пути по сетке","Lattice path counting",2,2,"Число кратчайших путей по сетке — биномиальный коэффициент.","Считаем маршруты, идущие только вправо и вниз.",["Сетка 2×2","Сумма сверху и слева","C(4, 2) = 6"],"Для сетки N×M число путей C(N+M, N).","Сетка 2×2: 6 путей.",[],[15],["Запретные клетки — формула не годится","Большую сетку не нарисовать"],{"name":"Lattice path counting","essence":"The number of shortest routes across a grid, moving only right or down, is a binomial coefficient.","recognize":"You need to count routes/paths through a grid that only move in two fixed directions (right and down, or equivalently any two perpendicular directions), from one corner to another.","general":"Across an N×M grid of squares (an (N+1)×(M+1) grid of points), the number of shortest routes from one corner to the opposite one is C(N+M, N).","example":"A 2×2 grid: 6 paths.","limits":["Not when some cells are blocked/forbidden"],"steps":["A 2×2 grid of points to fill in; how many routes from top-left to bottom-right?","Each point's route count is the point above it plus the point to its left (the only two ways to arrive there); filling the grid this way reaches 6 in the bottom-right corner","C(2+2, 2) = 6 routes, matching the filled-in grid exactly"]}],["DynamicProgramming","dynamic-programming","Динамическое программирование","Dynamic programming",3,2,"Ответ целого собирается из готовых ответов меньших частей.","Оптимальная подструктура и повторяющиеся подзадачи.",["Треугольник чисел","Снизу вверх: + max","Вершина 23"],"Подзадачи от малых к большим, каждая из готовых через min/max/сумму.","2 + max(8, 5) = 10, итог 23.",[],[18,31],["Выбор зависит не только от подзадач","Правило свёртки как в задаче"],{"name":"Dynamic programming","essence":"Build the optimal answer to the whole problem from the already-solved optimal answers to its smaller pieces, smallest first, instead of exploring every whole path from scratch.","recognize":"The best choice at any point can be expressed using only the best answers to the smaller subproblems it leads to (optimal substructure)….","general":"Order the subproblems from smallest/base case to largest.","example":"2 + max(8, 5) = 10, total 23.","limits":["Not when the optimal choice at a point depends on more than just the optimal values of its subproblems (e.g. the actual path taken matters, not…"],"steps":["A number triangle; moving only to an adjacent number below, which top-to-bottom path scores highest is unclear","The bottom row is already optimal (nowhere left to go); every row above adds itself to the BETTER of the two cells directly below it, e.g. 2 + max(8,5) = 10, all the way up","The top cell, 23, IS the best total"]}],["RestrictedPartitionCount","restricted-partitions","Разбиения и композиции","Partitions and compositions with restricted parts",2,3,"Порядок двух циклов решает, считаем разбиения или композиции.","Сколько способов собрать сумму из заданных размеров без ограничения запаса.",["Полоса 4, плитки 1 и 2","Размеры снаружи: 3","Суммы снаружи: 5","3 против 5"],"Размеры снаружи — разбиения; суммы снаружи — композиции.","Сумма 4 плитками 1 и 2: 3 разбиения, 5 композиций.",[],[31],["Один алгоритм, два порядка циклов","Пустая сумма — один способ","Запас ограничен — другая рекуррента"],{"name":"Partitions and compositions with restricted parts","essence":"Counting the ways to reach a total from a fixed set of allowed sizes has two different answers, and which one a table holds is decided by the order the two loops filling it are nested.","recognize":"The question asks how many ways some total can be made from an unlimited supply of a few fixed sizes….","general":"Both counts come from the same table, seeded with one way to make the empty total, and the same single line of body.","example":"A length of 4 from tiles of 1 and 2: 3 partitions, 5 compositions.","limits":["Not to be read as two different algorithms","Not when the supply of some size is limited"],"steps":["A bar of 4 cells to be filled from tiles of width 1 and width 2; how many ways is unknown","One pass per tile size: the three collections that reach the total, each drawn as a Young (Ferrers) diagram of 4 cells with its rows in decreasing length; count 3","One pass per total: the same tiles laid along the bar in order, so the middle collection now appears three times, once per arrangement, each row carrying that one collection's own label; count 5","The two counts side by side on the one total: 3 unordered against 5 ordered"]}],["InPlaceAlgorithm","in-place-algorithm","Работа на месте","In-place algorithm",7,1,"Использованное значение перезаписывается следующим без новой памяти.","Нужен только последний член или краткая сводка.",["Пять ячеек удвоений 7","Старые зачёркнуты","Одна ячейка: 112"],"Хранить k последних значений; читать ячейку до её перезаписи.","7 → 14 → 28 → 56 → 112 в одной ячейке.",[20,35,24],[2,16,18,20,25],["Повторное чтение перезаписанного — ошибка","Экономит только память","Направление заполнения важно"],{"name":"In-place algorithm","essence":"Once a value has produced the next one, nothing will ever ask for it again — so the next one is written straight over it instead of into fresh memory.","recognize":"The statement asks only for the LAST member of a sequence, or for a small digest of it (its digit sum, its final row, its remainder), never for the history.","general":"If every step's output depends only on the last k values, keep exactly k slots and rotate through them (one slot for a value repeatedly transformed in place….","example":"7 → 14 → 28 → 56 → 112 in one cell.","limits":["Not to be applied when an earlier value is read again
